48000,"cache_miss_tokens":143,"completion_tokens":2841,"prompt_tokens":48143,"reasoning_tokens":2836}}],"SQL-L0":[{"assumption":"状态按截至该年末最近一次线上销售购买年份划分：当年有购买为“活跃”，仅上一年有购买为“有流失风险”，上一年以前有购买为“已流失”，客户范围取截至2008-12-31在线上销售表中有购买记录的客户。","columns":[{"name":"期初状态","type":"String"},{"name":"期末状态","type":"String"},{"name":"客户数","type":"UInt64"}],"content_correct":0,"delivery_correct":0,"execution_status":"ok","query":"WITH\n    statuses AS (\n        SELECT '活跃' AS status, 1 AS ord\n        UNION ALL SELECT '有流失风险', 2\n        UNION ALL SELECT '已流失', 3\n    ),\n    cust AS (\n        SELECT\n            csk,\n            maxIf(dk, dk \u003c= toDate('2008-12-31')) AS last_2008,\n            maxIf(dk, dk \u003c= toDate('2009-12-31')) AS last_2009\n        FROM l0.fct_ol_sls\n        GROUP BY csk\n        HAVING countIf(dk \u003c= toDate('2008-12-31')) \u003e 0\n    ),\n    migr AS (\n        SELECT\n            multiIf(last_2008 \u003e= toDate('2008-01-01'), '活跃',\n                    last_2008 \u003e= toDate('2007-01-01'), '有流失风险',\n                    '已流失') AS start_status,\n            multiIf(last_2009 \u003e= toDate('2009-01-01'), '活跃',\n                    last_2009 \u003e= toDate('2008-01-01'), '有流失风险',\n                    '已流失') AS end_status,\n            count() AS cnt\n        FROM cust\n        GROUP BY start_status, end_status\n    )\nSELECT\n    s1.status AS `期初状态`,\n    s2.status AS `期末状态`,\n    coalesce(m.cnt, 0) AS `客户数`\nFROM statuses s1\nCROSS JOIN statuses s2\nLEFT JOIN migr m\n    ON m.start_status = s1.status\n   AND m.end_status = s2.status\nORDER BY s1.ord, s2.ord","refused":false,"rep":1,"rows":[["活跃","活跃",17671],["活跃","有流失风险",1052],["活跃","已流失",0],["有流失风险","活跃",138],["有流失风险","有流失风险",0],["有流失风险","已流失",7],["已流失","活跃",0],["已流失","有流失风险",0],["已流失","已流失",0]],"rules":[],"source_run":"20261018-T13-sql-direct-01","total_rows":9,"usage":{"cache_hit_tokens":5888,"cache_miss_tokens":134,"completion_tokens":5135,"prompt_tokens":6022,"reasoning_tokens":4701}},{"assumption":"以 l0.fct_ol_sls 的销售记录作为购买记录，并按客户截至各期末的最后购买日划分状态——距期末 90 天内为“活跃”、91–365 天为“有流失风险”、超过 365 天为“已流失”；期初客户范围为截至 2008-12-31 有过购买记录的客户。","columns":[{"name":"期初状态","type":"String"},{"name":"期末状态","type":"String"},{"name":"人数","type":"UInt64"}],"content_correct":0,"delivery_correct":0,"execution_status":"ok","query":"WITH\n    statuses AS (\n        SELECT 1 AS ord, '活跃' AS status\n        UNION ALL SELECT 2, '有流失风险'\n        UNION ALL SELECT 3, '已流失'\n    ),\n    cust_2008 AS (\n        SELECT csk, max(dk) AS last_dt_2008\n        FROM l0.fct_ol_sls\n        WHERE dk \u003c= toDate('2008-12-31')\n        GROUP BY csk\n    ),\n    last_2009 AS (\n        SELECT csk, max(dk) AS last_dt_2009\n        FROM l0.fct_ol_sls\n        WHERE dk \u003c= toDate('2009-12-31')\n        GROUP BY csk\n    ),\n    cust_status AS (\n        SELECT\n            c.csk,\n            multiIf(\n                dateDiff('day', c.last_dt_2008, toDate('2008-12-31')) \u003c= 90, '活跃',\n                dateDiff('day', c.last_dt_2008, toDate('2008-12-31')) \u003c= 365, '有流失风险',\n                '已流失'\n            ) AS from_status,\n            multiIf(\n                dateDiff('day', l.last_dt_2009, toDate('2009-12-31')) \u003c= 90, '活跃',\n                dateDiff('day', l.last_dt_2009, toDate('2009-12-31')) \u003c= 365, '有流失风险',\n                '已流失'\n            ) AS to_status\n        FROM cust_2008 c\n        INNER JOIN last_2009 l ON c.csk = l.csk\n    ),\n    agg AS (\n        SELECT from_status, to_status, count() AS cnt\n        FROM cust_status\n        GROUP BY from_status, to_status\n    ),\n    status_pairs AS (\n        SELECT\n            s1.status AS from_status,\n            s2.status AS to_status,\n            s1.ord AS from_ord,\n            s2.ord AS to_ord\n        FROM statuses s1\n        CROSS JOIN statuses s2\n    )\nSELECT\n    p.from_status AS `期初状态`,\n    p.to_status AS `期末状态`,\n    ifNull(a.cnt, 0) AS `人数`\nFROM status_pairs p\nLEFT JOIN agg a\n    ON p.from_status = a.from_status\n   AND p.to_status = a.to_status\nORDER BY p.from_ord, p.to_ord","refused":false,"rep":2,"rows":[["活跃","活跃",16741],["活跃","有流失风险",931],["活跃","已流失",951],["有流失风险","活跃",0],["有流失风险","有流失风险",0],["有流失风险","已流失",100],["已流失","活跃",73],["已流失","有流失风险",65],["已流失","已流失",7]],"rules":[],"source_run":"20261018-T13-sql-direct-01","total_rows":9,"usage":{"cache_hit_tokens":5888,"cache_miss_tokens":134,"completion_tokens":6197,"prompt_tokens":6022,"reasoning_tokens":5579}},{"assumption":"2008年末指2008-12-31、2009年末指2009-12-31；以 l0.fct_ol_sls 中 csk\u003e0 且 qty1\u003e0 的记录作为购买，状态按距最近一次购买天数划分：≤90天为“活跃”、91–180天为“有流失风险”、\u003e180天为“已流失”。","columns":[{"name":"期初状态","type":"String"},{"name":"期末状态","type":"String"},{"name":"人数","type":"UInt64"}],"content_correct":0,"delivery_correct":0,"execution_status":"ok","query":"WITH\ncohort AS (\n    SELECT csk, max(dk) AS last_dt_2008\n    FROM l0.fct_ol_sls\n    WHERE dk \u003c= toDate('2008-12-31')\n      AND csk \u003e 0\n      AND qty1 \u003e 0\n    GROUP BY csk\n),\nlast_2009 AS (\n    SELECT csk, max(dk) AS last_dt_2009\n    FROM l0.fct_ol_sls\n    WHERE dk \u003c= toDate('2009-12-31')\n      AND csk \u003e 0\n      AND qty1 \u003e 0\n    GROUP BY csk\n),\nbase AS (\n    SELECT c.csk, c.last_dt_2008, l.last_dt_2009\n    FROM cohort c\n    INNER JOIN last_2009 l ON c.csk = l.csk\n),\nstatus_pairs AS (\n    SELECT\n        csk,\n        multiIf(\n            dateDiff('day', last_dt_2008, toDate('2008-12-31')) \u003c= 90, '活跃',\n            dateDiff('day', last_dt_2008, toDate('2008-12-31')) \u003c= 180, '有流失风险',\n            '已流失'\n        ) AS status_2008,\n        multiIf(\n            dateDiff('day', last_dt_2009, toDate('2009-12-31')) \u003c= 90, '活跃',\n            dateDiff('day', last_dt_2009, toDate('2009-12-31')) \u003c= 180, '有流失风险',\n            '已流失'\n        ) AS status_2009\n    FROM base\n),\ntrans AS (\n    SELECT status_2008, status_2009, count() AS cnt\n    FROM status_pairs\n    GROUP BY status_2008, status_2009\n),\nstatuses AS (\n    SELECT '活跃' AS status\n    UNION ALL SELECT '有流失风险'\n    UNION ALL SELECT '已流失'\n)\nSELECT\n    s1.status AS `期初状态`,\n    s2.status AS `期末状态`,\n    coalesce(t.cnt, 0) AS `人数`\nFROM statuses s1\nCROSS JOIN statuses s2\nLEFT JOIN trans t\n    ON t.status_2008 = s1.status\n   AND t.status_2009 = s2.status\nORDER BY\n    multiIf(s1.status = '活跃', 1, s1.status = '有流失风险', 2, 3),\n    multiIf(s2.status = '活跃', 1, s2.status = '有流失风险', 2, 3)","refused":false,"rep":3,"rows":[["活跃","活跃",16738],["活跃","有流失风险",3],["活跃","已流失",1882],["有流失风险","活跃",0],["有流失风险","有流失风险",0],["有流失风险","已流失",41],["已流失","活跃",73],["已流失","有流失风险",57],["已流失","已流失",74]],"rules":[],"source_run":"20261018-T13-sql-direct-01","total_rows":9,"usage":{"cache_hit_tokens":5888,"cache_miss_tokens":134,"completion_tokens":6750,"prompt_tokens":6022,"reasoning_tokens":6083}}],"SQL-L0-E":[{"assumption":"状态按距离该期期末日（2008-12-31、2009-12-31）最近一次购买的天数划分——≤90 天为活跃、91–180 天为有流失风险、超过 180 天为已流失；期初群体为截至 2008-12-31 有过购买记录的客户，2009 年内未再购买的客户期末状态沿用其到期末日期的间隔判定。","columns":[{"name":"期初状态","type":"String"},{"name":"期末状态","type":"String"},{"name":"客户数","type":"UInt64"}],"content_correct":0,"delivery_correct":0,"execution_status":"ok","query":"WITH c AS (\n    SELECT\n        csk,\n        maxIf(dk, dk \u003c= toDate('2008-12-31')) AS lp0,\n        maxIf(dk, dk \u003c= toDate('2009-12-31')) AS lp1\n    FROM l0.fct_ol_sls\n    WHERE dk \u003c= toDate('2009-12-31')\n    GROUP BY csk\n    HAVING lp0 IS NOT NULL AND lp0 \u003e toDate('1900-01-01')\n)\nSELECT\n    multiIf(dateDiff('day', lp0, toDate('2008-12-31')) \u003c= 90, '活跃',\n            dateDiff('day', lp0, toDate('2008-12-31')) \u003c= 180, '有流失风险',\n            '已流失') AS `期初状态`,\n    multiIf(dateDiff('day', lp1, toDate('2009-12-31')) \u003c= 90, '活跃',\n            dateDiff('day', lp1, toDate('2009-12-31')) \u003c= 180, '有流失风险',\n            '已流失') AS `期末状态`,\n    count() AS `客户数`\nFROM c\nGROUP BY `期初状态`, `期末状态`\nORDER BY `期初状态`, `期末状态`","refused":false,"rep":1,"rows":[[" -01","total_rows":9,"usage":{"cache_hit_tokens":42880,"cache_miss_tokens":3534,"completion_tokens":7256,"prompt_tokens":46414,"reasoning_tokens":5021}}],"SQL-L1":[{"assumption":"状态按截至各年末的最后一次线上购买日计算，且迁移矩阵包含期初与期末相同的未变化客户以及人数为 0 的状态组合。","columns":[{"name":"期初状态","type":"String"},{"name":"期末状态","type":"String"},{"name":"客户数","type":"UInt64"}],"content_correct":1,"delivery_correct":1,"execution_status":"ok","query":"WITH\n    toDate('2008-12-31') AS cutoff_2008,\n    toDate('2009-12-31') AS cutoff_2009,\n    states AS (\n        SELECT '活跃' AS state, 1 AS ord\n        UNION ALL SELECT '有流失风险', 2\n        UNION ALL SELECT '已流失', 3\n    ),\n    cust AS (\n        SELECT\n            CustomerKey,\n            maxIf(DateKey, DateKey \u003c= cutoff_2008) AS last_2008,\n            max(DateKey) AS last_2009,\n            countIf(DateKey \u003c= cutoff_2008) AS cnt_2008\n        FROM retail.FactOnlineSales\n        GROUP BY CustomerKey\n    ),\n    st AS (\n        SELECT\n            CustomerKey,\n            multiIf(\n                dateDiff('month', last_2008, cutoff_2008) \u003c= 6, '活跃',\n                dateDiff('month', last_2008, cutoff_2008) \u003c= 12, '有流失风险',\n                '已流失'\n            ) AS start_state,\n            multiIf(\n                dateDiff('month', last_2009, cutoff_2009) \u003c= 6, '活跃',\n                dateDiff('month', last_2009, cutoff_2009) \u003c= 12, '有流失风险',\n                '已流失'\n            ) AS end_state\n        FROM cust\n        WHERE cnt_2008 \u003e 0\n    ),\n    moves AS (\n        SELECT\n            start_state,\n            end_state,\n            count() AS customer_count\n        FROM st\n        GROUP BY start_state, end_state\n    )\nSELECT\n    s.state AS `期初状态`,\n    e.state AS `期末状态`,\n    coalesce(m.customer_count, 0) AS `客户数`\nFROM states s\nCROSS JOIN states e\nLEFT JOIN moves m\n    ON m.start_state = s.state\n   AND m.end_state = e.state\nORDER BY s.ord, e.ord","refused":false,"rep":1,"rows":[["活跃","活跃",16751],
