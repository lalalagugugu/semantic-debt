":"Float64"},{"name":"variance_amount","type":"Float64"},{"name":"variance_pct","type":"Nullable(Float64)"}],"content_correct":0,"delivery_correct":0,"execution_status":"ok","query":"WITH actual AS (\n    SELECT\n        c.pck AS pck,\n        c.pc_nm AS category,\n        sum(s.amt1) AS actual_amt\n    FROM l0.fct_sls AS s\n    INNER JOIN l0.d_dt AS d ON s.dk = d.dk\n    INNER JOIN l0.d_prd AS p ON s.prk = p.prk\n    INNER JOIN l0.d_prd_sub AS ps ON p.psck = ps.psck\n    INNER JOIN l0.d_prd_cat AS c ON ps.pck = c.pck\n    WHERE d.c_yr = 2009\n    GROUP BY c.pck, c.pc_nm\n),\nbudget AS (\n    SELECT\n        c.pck AS pck,\n        c.pc_nm AS category,\n        sum(b.amt1) AS budget_amt\n    FROM l0.fct_stg_pln AS b\n    INNER JOIN l0.d_dt AS d ON b.dk = d.dk\n    INNER JOIN l0.d_scn AS sc ON b.scnk = sc.scnk\n    INNER JOIN l0.d_acct AS a ON b.acct_k = a.acct_k\n    INNER JOIN l0.d_prd_cat AS c ON b.pck = c.pck\n    WHERE d.c_yr = 2009\n      AND lower(sc.scn_nm) = 'budget'\n      AND lower(a.acct_tp) = 'revenue'\n    GROUP BY c.pck, c.pc_nm\n)\nSELECT\n    coalesce(a.pck, b.pck) AS pck,\n    coalesce(a.category, b.category) AS category,\n    coalesce(a.actual_amt, 0) AS actual_revenue,\n    coalesce(b.budget_amt, 0) AS budget_revenue,\n    coalesce(a.actual_amt, 0) - coalesce(b.budget_amt, 0) AS variance_amount,\n    (coalesce(a.actual_amt, 0) - coalesce(b.budget_amt, 0)) / nullIf(coalesce(b.budget_amt, 0), 0) * 100 AS variance_pct\nFROM actual AS a\nFULL OUTER JOIN budget AS b ON a.pck = b.pck\nORDER BY category\nSETTINGS join_use_nulls = 1;","refused":false,"rep":1,"rows":[[1,"Audio",68947296.35169987,0,68947296.35169987,null],[4,"Cameras and camcorders",636574743.3996006,0,636574743.3996006,null],[5,"Cell phones",268104778.23470104,0,268104778.23470104,null],[3,"Computers",938926781.7260013,0,938926781.7260013,null],[7,"Games and Toys",8873229.886900004,0,8873229.886900004,null],[8,"Home Appliances",1120727501.9229636,0,1120727501.9229636,null],[6,"Music, Movies
