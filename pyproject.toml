[project]
name = "semantic-debt"
version = "0.1.0"
description = "语义层质量对智能问数准确率的影响：可复现实验"
requires-python = ">=3.11"
dependencies = [
    "chdb>=3.0",
    "psycopg[binary]>=3.3.6",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
