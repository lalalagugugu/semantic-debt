version: 2
cell: SQL-L1
packet: sql-l1

# ---------------------------------------------------------------------------
# 一、取数口径补充（source.yaml 没写或写得不够的地方）。
# ---------------------------------------------------------------------------
semantics:
  - id: S1
    topic: "缺失产品的品类归属（产品维度缺 284 个键）"
    rule: >-
      按品类 / 子类 / 品牌分析时，事实表 LEFT JOIN 产品 → 子类 → 品类，并在整条查询末尾加
      `SETTINGS join_use_nulls = 1`，让缺失产品的品类取 NULL，作为单独一组**保留在结果里**。
      不要用内连接丢掉它，也不要把它改名为「未知产品」「Unknown」或空串。
    why: "按品类拆分的核实结果都有一行品类为 NULL（显示为 \\N）；内连接会少一行，改名会让这一行的取值对不上。"
    note: "不加 join_use_nulls 时 ClickHouse 的左连接未命中会填空串 ''，不是 NULL。"
  - id: S2
    topic: "门店范围"
    rule: >-
      「各门店 / 每家门店 / 门店经理手下的门店」默认包含 DimStore 全部 306 家（含 3 家线上店、
      3 家经销店、1 家目录店），不要按 StoreType = 'Store' 排除虚拟门店，除非问题明确说
      实体店 / 自营门店。
    why: "排除 7 家虚拟门店后，门店行数和门店经理人数都与核实结果对不上。"
  - id: S3
    topic: "不要自行剔除离群值"
    rule: >-
      问题没要求时，不排除离群或疑似哨兵值（如 DimCustomer.YearlyIncome = 10,000,000 的 385 人）。
      可以在假设说明里点出离群值，但结果按全量计算。
    why: "「客户的平均年收入」的核实结果 260,174.89 是全量平均；剔除 10,000,000 一档后的 57,305.78 判错。"
  - id: S4
    topic: "字段词照字面落到字段，不因信息量低而换字段"
    rule: >-
      「促销类别」→ DimPromotion.PromotionCategory，「促销类型」→ DimPromotion.PromotionType，
      「促销 / 促销活动」才是 PromotionName。即使该字段只有 Store / No Discount 两个取值也照用。
    why: "把「促销类别」换成 PromotionName 的作答全部判错。"
  - id: S5
    topic: "平均折扣比例"
    rule: >-
      平均折扣比例 = 折扣金额合计 ÷ 折前原价合计 × 100，折前原价 = SalesAmount + DiscountAmount
      （按金额加权，不是对 DiscountPercent 求平均）；按约定 10 排除 PromotionKey = 1。
  - id: S6
    topic: "日均销售额的分母（约定 4 的落地）"
    rule: >-
      先按「组 × 天」汇总销售额，再在每个组内对这些天求平均（avg）；分母是该组有销售的天数，
      不是日历天数，也不是全表有销售的天数。比较周末与工作日用 DimDate.IsWorkDay。
      相对差 = (周末日均 − 工作日日均) ÷ 工作日日均 × 100。
    why: "用日历天数做分母时 Games and Toys 的工作日日均是 5,522.44，核实值 5,529.50 是按该品类自己有销售的天数平均。"
  - id: S7
    topic: "「占多少比例」不是日均比较"
    rule: >-
      「周末和工作日的销售分别占多少比例」这类占比问题直接用销售额合计 ÷ 总额 × 100；
      约定 4 的日均只用于「比较 / 高多少 / 哪类日子卖得好」。
  - id: S8
    topic: "默认时间范围"
    rule: >-
      问题没给时间 → 用数据全区间 2007-01-01 ~ 2009-12-31（不限定年份）。
      说了「全年 / 年度」却没给年份 → 取今年 2009，并在假设里写明。
      「按季度累计」= 从区间第一季开始一路累加到最后一季的累计值，不按年重置。
  - id: S9
    topic: "「一笔」销售"
    rule: "「最大的一笔线上销售」指 FactOnlineSales 的一行（订单行），即 max(SalesAmount)，不是一个订单号的合计。"
    why: "核实值 3,199.99 是单行最大值；按订单号合计得到的 476,068.10 判错。"
  - id: S10
    topic: "购买事件 = 线上销售表的全部行"
    rule: >-
      首购、复购、回头客、终身消费价值、购物篮（同单共现）里的「购买 / 出现在订单里」都取
      FactOnlineSales 的全部行，包括只有退货的行；不要加 SalesQuantity > 0。
      约定 13、14 的注释已经这样写，这里推广到所有客户与订单行为类问题。
    why: "购物篮问题加了 SalesQuantity > 0 后提升度偏离核实值（896.05 vs 900.92）。"
  - id: S12
    topic: "客户首购分群"
    rule: >-
      首购日 = 客户在 FactOnlineSales 全部行里的 min(DateKey)。「首购次日起 7 个自然日」=
      DateKey 在 (首购日, 首购日 + 7] 之间；「排除观察期不足 7 天」= 只留 首购日 + 7 <= 2009-12-31
      的客户。终身消费价值 = 该客户全部 SalesAmount 之和。
  - id: S13
    topic: "客户增长筛选"
    rule: >-
      「2009 年比 2008 年增长 50% 以上的客户」：只留 2008 年消费额 > 0 的客户，
      条件 (2009 − 2008) ÷ 2008 > 0.5。
  - id: S15
    topic: "组织层级汇总（DimEntity 树）"
    rule: >-
      「按组织层级 / 按实体汇总收入」= 战略计划 Actual 场景、Sale Revenue 科目的金额，沿
      DimEntity 父链上卷到每一个祖先实体，按 EntityKey 汇总。
      这棵树**深度不齐、顶端有自环**（已用数据查实）：299 家实体店是 门店 → 州 → 国家 → 集团
      四级，7 家线上 / 目录 / 经销虚拟店直接挂在国家下（少一级）；三个集团实体（EntityKey 1、2、3）
      的 ParentEntityKey 都指回自己；父链没有空值、没有孤儿。
      所以固定四次自连接再 UNION ALL 会把虚拟店在集团层多算一遍（多算 5,470,804,413.74，
      恰好是三个非门店渠道的销售额）。正确做法：为每个门店实体取出 [自身, 父, 祖父, 曾祖父]
      四个键，arrayDistinct 去重后 ARRAY JOIN，再按祖先键汇总（见示例 E04）。
    why: "固定深度上卷得到的北美集团合计 9,999,916,765 比核实值 7,309,491,105 多出北美虚拟店收入；按实体名称分组会因 2 个重名多出或合并一行。"
  - id: S16
    topic: "门店经理挑战线 / 目标缺口"
    rule: >-
      目标按门店汇总 FactSalesQuota（ScenarioKey = 2），实际按门店汇总 FactSales，同一年份；
      缺口 = greatest(系数 × 目标 − 实际, 0)，未达标门店数 = 缺口 > 0 的门店数；
      按 DimStore.EmployeeKey 分组，没有未达标门店的经理也要列出（0 / 0）。
  - id: S17
    topic: "平均停机时长"
    rule: "「平均停机时长」= avg(FactITSLA.DownTime)，即按故障事件平均（停机总分钟 ÷ 故障次数），不是按设备台数平均。"
    why: "按出过故障的设备台数做分母的作答判错。"
  - id: S18
    topic: "变异系数"
    rule: >-
      月度销售额的变异系数 = stddevPop(月销售额) ÷ avg(月销售额)（总体标准差，除以 12；
      样本标准差 stddevSamp 也可接受，但要声明）。品类含 NULL 组。
  - id: S19
    topic: "同店降幅与拖累品类"
    rule: >-
      同店 = 2008、2009 两年 FactSales 都有销售的门店（约定 15）；门店降幅 =
      (2008 − 2009) ÷ 2008 × 100，只看下降的门店，取降幅最大的 N 家：恰好 N 家，
      第 N 名并列时任取凑足（用 row_number() 选行，rank() 给名次）。
      拖累最多的品类 = 该门店内 (2008 − 2009) 最大的品类，每家门店恰好 1 个，并列任取
      （品类经左连接，NULL 也参与排名）。品类自身降幅 = 品类减少额 ÷ 该品类 2008 年销售额 × 100；
      占比 = 品类减少额 ÷ 门店减少额 × 100。

