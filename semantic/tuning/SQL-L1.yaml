rewrites:
  - supersedes: "source.yaml › data_quality › missing-products › workaround（「需要保住总额时用左连接；缺行的产品归到一个「未知产品」组」）"
    new_text: >-
      需要保住总额时用左连接并加 SETTINGS join_use_nulls = 1；缺行产品的品类 / 子类 / 名称保留为 NULL，
      作为单独一组输出，不改名为「未知产品」。见 S1。
  - supersedes: "source.yaml › datasets › FactSales › columns › StoreKey 的最后一句（「问「门店」时按需要决定是否排除这 7 家」）"
