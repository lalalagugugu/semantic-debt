# ---------------------------------------------------------------------------
# 三、问题 → 查询示例（14 条，全部来自本调优包）。
# 初版写作时未执行；执行与评分比对由 A 角在 chDB 上完成，结果与本版改动见 SQL-L1.notes.md。
# ---------------------------------------------------------------------------
examples:
  - id: E01
    question: "各产品品类的退货率是多少？"
    shows: "品类分析保留 NULL 组（S1）；退货率按数量计算"
    sql: |
      SELECT
          pc.ProductCategoryName                                  AS ProductCategoryName,
          sum(f.ReturnQuantity)                                   AS total_returns,
          sum(f.SalesQuantity)                                    AS total_sales,
          sum(f.ReturnQuantity) / sum(f.SalesQuantity) * 100      AS return_rate_pct
      FROM retail.FactOnlineSales AS f
      LEFT JOIN retail.DimProduct AS p ON f.ProductKey = p.ProductKey
      LEFT JOIN retail.DimProductSubcategory AS ps ON p.ProductSubcategoryKey = ps.ProductSubcategoryKey
      LEFT JOIN retail.DimProductCategory AS pc ON ps.ProductCategoryKey = pc.ProductCategoryKey
      GROUP BY ProductCategoryName
      ORDER BY ProductCategoryName
      SETTINGS join_use_nulls = 1

  - id: E02
    question: "按利润率排名，前 10 款产品是哪些？"
    shows: "产品利润率用产品表标价与成本（约定 9）；前 10 名恰好 10 行：row_number() 选行，rank() 给名次（并列同名次）"
    sql: |
      SELECT ProductKey, ProductName, UnitPrice, UnitCost, margin_pct, margin_rank
      FROM
      (
          SELECT
              ProductKey,
              ProductName,
              UnitPrice,
              UnitCost,
              (UnitPrice - UnitCost) / UnitPrice * 100                                   AS margin_pct,
              rank() OVER (ORDER BY (UnitPrice - UnitCost) / UnitPrice DESC)              AS margin_rank,
              row_number() OVER (ORDER BY (UnitPrice - UnitCost) / UnitPrice DESC, ProductKey) AS rn
          FROM retail.DimProduct
      )
      WHERE rn <= 10
      ORDER BY rn

  - id: E03
    question: "2009 年第四季度，销售预测与实际相比有多准确？"
    shows: "销售预测走战略计划表（S14）；准确率 = 100 − 绝对百分比误差"
    sql: |
      WITH plan AS (
          SELECT
              pc.ProductCategoryName                          AS ProductCategoryName,
              sumIf(f.Amount, s.ScenarioName = 'Actual')      AS actual,
              sumIf(f.Amount, s.ScenarioName = 'Forecast')    AS forecast
          FROM retail.FactStrategyPlan AS f
          INNER JOIN retail.DimScenario AS s ON f.ScenarioKey = s.ScenarioKey
          INNER JOIN retail.DimAccount AS a ON f.AccountKey = a.AccountKey
          INNER JOIN retail.DimProductCategory AS pc ON f.ProductCategoryKey = pc.ProductCategoryKey
          WHERE a.AccountName = 'Sale Revenue'
            AND f.DateKey >= toDate('2009-10-01')
            AND f.DateKey < toDate('2010-01-01')
          GROUP BY ProductCategoryName
      )
      SELECT
          ProductCategoryName,
          actual,
          forecast,
          forecast - actual                                   AS forecast_minus_actual,
          100 - abs(forecast - actual) / actual * 100         AS accuracy_pct
      FROM plan
      ORDER BY ProductCategoryName
    note: "总体口径（不分品类）把 GROUP BY 去掉即可：实际 979,737,005.16、预测 986,142,631.21、准确率 99.35%，两种都可接受。"

  - id: E04
    question: "按组织层级汇总销售收入。"
    shows: "DimEntity 上卷：祖先键去重后 ARRAY JOIN，按键分组（S15）"
    sql: |
      WITH
          store_rev AS (
              SELECT f.EntityKey AS EntityKey, sum(f.Amount) AS revenue
              FROM retail.FactStrategyPlan AS f
              INNER JOIN retail.DimScenario AS s ON f.ScenarioKey = s.ScenarioKey
              INNER JOIN retail.DimAccount AS a ON f.AccountKey = a.AccountKey
              WHERE s.ScenarioName = 'Actual'
                AND a.AccountName = 'Sale Revenue'
              GROUP BY f.EntityKey
          ),
          chain AS (
              SELECT
                  e0.EntityKey AS StoreEntityKey,
                  arrayDistinct([e0.EntityKey, e1.EntityKey, e2.EntityKey, e3.EntityKey]) AS ancestors
              FROM retail.DimEntity AS e0
              INNER JOIN retail.DimEntity AS e1 ON toInt32(e0.ParentEntityKey) = e1.EntityKey
              INNER JOIN retail.DimEntity AS e2 ON toInt32(e1.ParentEntityKey) = e2.EntityKey
              INNER JOIN retail.DimEntity AS e3 ON toInt32(e2.ParentEntityKey) = e3.EntityKey
              WHERE e0.EntityType = 'Store'
          ),
          store_ancestor AS (
              SELECT StoreEntityKey, ancestor_key
              FROM chain
              ARRAY JOIN ancestors AS ancestor_key
          )
      SELECT
          e.EntityKey        AS EntityKey,
          e.EntityName       AS EntityName,
          e.EntityType       AS EntityType,
          sum(r.revenue)     AS total_amount
      FROM store_ancestor AS sa
      INNER JOIN store_rev AS r ON sa.StoreEntityKey = r.EntityKey
      INNER JOIN retail.DimEntity AS e ON sa.ancestor_key = e.EntityKey
      GROUP BY EntityKey, EntityName, EntityType
      ORDER BY EntityKey
    note: "父链上每一级都存在（ParentEntityKey 无孤儿、无空值），所以内连接不会丢门店；顶端自环靠 arrayDistinct 去重。集团合计：北美 7,309,491,105.09、欧洲 2,403,962,517.64。"

  - id: E05
    question: "哪个促销类别带来的线上促销营收最高？其平均折扣比例是多少？"
    shows: "「促销类别」= PromotionCategory（S4）；金额加权折扣比例（S5）"
    sql: |
      SELECT
          p.PromotionCategory                                                       AS PromotionCategory,
          sum(f.SalesAmount)                                                        AS revenue,
          sum(f.DiscountAmount)                                                     AS total_discount,
          sum(f.SalesAmount) + sum(f.DiscountAmount)                                AS original_sales_amount,
          sum(f.DiscountAmount) / (sum(f.SalesAmount) + sum(f.DiscountAmount)) * 100 AS avg_discount_pct
      FROM retail.FactOnlineSales AS f
      INNER JOIN retail.DimPromotion AS p ON f.PromotionKey = p.PromotionKey
      WHERE f.PromotionKey != 1
      GROUP BY PromotionCategory
      ORDER BY revenue DESC
      LIMIT 1

  - id: E06
    question: "展示 2007—2009 年按季度累计的线上销售额。"
    shows: "累计跨年不重置（S8）；年与季度取 DimDate 原值"
    sql: |
      SELECT
          year,
          quarter,
          quarterly_sales,
          sum(quarterly_sales) OVER (ORDER BY year, quarter ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS cumulative_sales
      FROM
      (
          SELECT
              d.CalendarYear          AS year,
              d.CalendarQuarterLabel  AS quarter,
              sum(f.SalesAmount)      AS quarterly_sales
          FROM retail.FactOnlineSales AS f
          INNER JOIN retail.DimDate AS d ON f.DateKey = d.DateKey
          WHERE d.CalendarYear BETWEEN 2007 AND 2009
          GROUP BY year, quarter
      )
      ORDER BY year, quarter

  - id: E07
    question: "按门店列出 2009 年销售额排名前 3 的产品，以及各产品占该门店销售总额的比例。"
    shows: "全部 306 家门店（S2）；每店恰好 3 个产品：组内 row_number() 选行，rank() 给名次；分母是门店全部销售（含缺名产品）"
    sql: |
      WITH
          prod_sales AS (
              SELECT StoreKey, ProductKey, sum(SalesAmount) AS product_sales
              FROM retail.FactSales
              WHERE DateKey >= toDate('2009-01-01') AND DateKey < toDate('2010-01-01')
              GROUP BY StoreKey, ProductKey
          ),
          ranked AS (
              SELECT
                  StoreKey,
                  ProductKey,
                  product_sales,
                  sum(product_sales) OVER (PARTITION BY StoreKey)                                   AS store_total_sales,
                  rank() OVER (PARTITION BY StoreKey ORDER BY product_sales DESC)                   AS sales_rank,
                  row_number() OVER (PARTITION BY StoreKey ORDER BY product_sales DESC, ProductKey) AS rn
              FROM prod_sales
          )
      SELECT
          r.StoreKey                                    AS StoreKey,
          s.StoreName                                   AS StoreName,
          r.ProductKey                                  AS ProductKey,
          p.ProductName                                 AS ProductName,
          r.product_sales                               AS product_sales,
          r.product_sales / r.store_total_sales * 100   AS pct_of_store,
          r.store_total_sales                           AS store_total_sales,
          r.sales_rank                                  AS sales_rank
      FROM ranked AS r
      INNER JOIN retail.DimStore AS s ON r.StoreKey = s.StoreKey
      LEFT JOIN retail.DimProduct AS p ON r.ProductKey = p.ProductKey
      WHERE r.rn <= 3
      ORDER BY StoreName, r.rn
      SETTINGS join_use_nulls = 1

  - id: E08
    question: "按全年销售对单个季度的依赖程度从高到低列出各产品品类。"
    shows: "「全年」未给年份取 2009（S8）；品类含 NULL 组（S1）；每个品类恰好 1 个峰值季度（argMax）"
    sql: |
      WITH
          q AS (
              SELECT
                  pc.ProductCategoryName  AS ProductCategoryName,
                  d.CalendarQuarterLabel  AS quarter,
                  sum(f.SalesAmount)      AS quarter_sales
              FROM retail.FactOnlineSales AS f
              INNER JOIN retail.DimDate AS d ON f.DateKey = d.DateKey
              LEFT JOIN retail.DimProduct AS p ON f.ProductKey = p.ProductKey
              LEFT JOIN retail.DimProductSubcategory AS ps ON p.ProductSubcategoryKey = ps.ProductSubcategoryKey
              LEFT JOIN retail.DimProductCategory AS pc ON ps.ProductCategoryKey = pc.ProductCategoryKey
              WHERE d.CalendarYear = 2009
              GROUP BY ProductCategoryName, quarter
          ),
          c AS (
              SELECT
                  ProductCategoryName,
                  sum(quarter_sales)                AS annual_sales_amount,
                  max(quarter_sales)                AS peak_quarter_sales,
                  argMax(quarter, quarter_sales)    AS peak_quarter
              FROM q
              GROUP BY ProductCategoryName
          )
      SELECT
          ProductCategoryName,
          peak_quarter_sales / annual_sales_amount * 100                          AS peak_quarter_share_pct,
          peak_quarter,
          peak_quarter_sales,
          annual_sales_amount,
          rank() OVER (ORDER BY peak_quarter_sales / annual_sales_amount DESC)    AS dependency_rank
      FROM c
      ORDER BY dependency_rank
      SETTINGS join_use_nulls = 1
    note: "也可接受按 2007、2008、2009 各年分别计算（多一列 year），但要声明。"

  - id: E09
    question: "按产品品类比较，平均一个周末日的销售额比平均一个工作日高多少？"
    shows: "组 × 天汇总后组内平均，分母是该组有销售的天数（S6）；品类含 NULL（S1）"
    sql: |
      WITH daily AS (
          SELECT
              pc.ProductCategoryName  AS ProductCategoryName,
              f.DateKey               AS DateKey,
              any(d.IsWorkDay)        AS day_type,
              sum(f.SalesAmount)      AS day_sales
          FROM retail.FactOnlineSales AS f
          INNER JOIN retail.DimDate AS d ON f.DateKey = d.DateKey
          LEFT JOIN retail.DimProduct AS p ON f.ProductKey = p.ProductKey
          LEFT JOIN retail.DimProductSubcategory AS ps ON p.ProductSubcategoryKey = ps.ProductSubcategoryKey
          LEFT JOIN retail.DimProductCategory AS pc ON ps.ProductCategoryKey = pc.ProductCategoryKey
          GROUP BY ProductCategoryName, DateKey
      )
      SELECT
          ProductCategoryName,
          avgIf(day_sales, day_type = 'WeekEnd')                                AS avg_weekend_day_sales,
          avgIf(day_sales, day_type = 'WorkDay')                                AS avg_weekday_sales,
          avg_weekend_day_sales - avg_weekday_sales                             AS weekend_difference_amount,
          (avg_weekend_day_sales - avg_weekday_sales) / avg_weekday_sales * 100 AS weekend_lift_pct
      FROM daily
      GROUP BY ProductCategoryName
      ORDER BY ProductCategoryName
      SETTINGS join_use_nulls = 1

  - id: E10
    question: "今年各季度的日均销售额，各比去年同期增长了百分之多少？"
    shows: "今年 2009 / 去年 2008（约定 3）；先按天汇总再平均（约定 4）"
    sql: |
      WITH
          daily AS (
              SELECT
                  d.CalendarYear          AS year,
                  d.CalendarQuarterLabel  AS quarter,
                  f.DateKey               AS DateKey,
                  sum(f.SalesAmount)      AS day_sales
              FROM retail.FactOnlineSales AS f
              INNER JOIN retail.DimDate AS d ON f.DateKey = d.DateKey
              WHERE d.CalendarYear IN (2008, 2009)
              GROUP BY year, quarter, DateKey
          ),
          qa AS (
              SELECT
                  quarter,
                  avgIf(day_sales, year = 2009) AS avg_daily_sales_2009,
                  avgIf(day_sales, year = 2008) AS avg_daily_sales_2008
              FROM daily
              GROUP BY quarter
          )
      SELECT
          quarter,
          (avg_daily_sales_2009 - avg_daily_sales_2008) / avg_daily_sales_2008 * 100 AS daily_sales_growth_pct,
          avg_daily_sales_2009 - avg_daily_sales_2008                                AS daily_sales_change_amount,
          avg_daily_sales_2009,
          avg_daily_sales_2008
      FROM qa
      ORDER BY quarter

  - id: E11
    question: "2009年，以正式销售目标的120%为挑战线，每位门店经理手下有多少家门店未达到这条线？这些门店距离挑战线的销售额缺口合计是多少？"
    shows: "正式目标 = Budget（约定 12）；全部 306 家门店（S2）；没有未达标门店的经理也列出（S16）"
    sql: |
      WITH
          actual AS (
              SELECT StoreKey, sum(SalesAmount) AS actual_sales
              FROM retail.FactSales
              WHERE DateKey >= toDate('2009-01-01') AND DateKey < toDate('2010-01-01')
              GROUP BY StoreKey
          ),
          target AS (
              SELECT StoreKey, sum(SalesAmountQuota) AS target_sales
              FROM retail.FactSalesQuota
              WHERE ScenarioKey = 2
                AND DateKey >= toDate('2009-01-01') AND DateKey < toDate('2010-01-01')
              GROUP BY StoreKey
          ),
          store_gap AS (
              SELECT
                  s.StoreKey                                          AS StoreKey,
                  toInt32(s.EmployeeKey)                              AS EmployeeKey,
                  a.actual_sales                                      AS actual_sales,
                  t.target_sales                                      AS target_sales,
                  greatest(1.2 * t.target_sales - a.actual_sales, 0)  AS shortfall
              FROM retail.DimStore AS s
              LEFT JOIN actual AS a ON s.StoreKey = a.StoreKey
              LEFT JOIN target AS t ON s.StoreKey = t.StoreKey
          )
      SELECT
          g.EmployeeKey                           AS EmployeeKey,
          concat(e.FirstName, ' ', e.LastName)    AS manager,
          countIf(g.shortfall > 0)                AS under_target_stores,
          sum(g.shortfall)                        AS shortfall_amount
      FROM store_gap AS g
      LEFT JOIN retail.DimEmployee AS e ON g.EmployeeKey = e.EmployeeKey
      GROUP BY EmployeeKey, manager
      ORDER BY EmployeeKey

  - id: E12
    question: "以2009年12月31日为观察截止日，按客户的真实首购月份分群，首购次日起7个自然日内的复购率分别是多少？排除观察期不足7天的客户。"
    shows: "首购 / 复购取全部行（S10、S12）；7 天窗口与观察期排除（S12）"
    sql: |
      WITH
          first_purchase AS (
              SELECT CustomerKey, min(DateKey) AS first_date
              FROM retail.FactOnlineSales
              GROUP BY CustomerKey
          ),
          eligible AS (
              SELECT CustomerKey, first_date
              FROM first_purchase
              WHERE addDays(first_date, 7) <= toDate('2009-12-31')
          ),
          repurchased AS (
              SELECT DISTINCT e.CustomerKey AS CustomerKey
              FROM eligible AS e
              INNER JOIN retail.FactOnlineSales AS f ON f.CustomerKey = e.CustomerKey
              WHERE f.DateKey > e.first_date
                AND f.DateKey <= addDays(e.first_date, 7)
          )
      SELECT
          toYear(first_date)                                                  AS cohort_year,
          toMonth(first_date)                                                 AS cohort_month,
          count()                                                             AS cohort_customers,
          countIf(CustomerKey IN (SELECT CustomerKey FROM repurchased))       AS repurchase_customers,
          repurchase_customers / cohort_customers * 100                       AS repurchase_pct
      FROM eligible
      GROUP BY cohort_year, cohort_month
      ORDER BY cohort_year, cohort_month

  - id: E13
    question: "在2009年同店销售下降的门店中，降幅最大的3家门店各自由哪个产品品类拖累最多？列出门店降幅、该品类销售减少额及其占门店总减少额的百分比。"
    shows: "同店口径（约定 15）；恰好 3 家门店、每店恰好 1 个品类：row_number() 选行，rank() 给名次（S19）；用 IN 过滤代替 JOIN 嵌套 CTE"
    sql: |
      WITH
          store_year AS (
              SELECT
                  StoreKey,
                  sumIf(SalesAmount, toYear(DateKey) = 2008) AS sales_2008,
                  sumIf(SalesAmount, toYear(DateKey) = 2009) AS sales_2009
              FROM retail.FactSales
              WHERE toYear(DateKey) IN (2008, 2009)
              GROUP BY StoreKey
              HAVING sales_2008 > 0 AND sales_2009 > 0
          ),
          ranked_stores AS (
              SELECT
                  StoreKey,
                  sales_2008 - sales_2009                                                      AS store_decline_amount,
                  (sales_2008 - sales_2009) / sales_2008 * 100                                 AS decline_pct,
                  rank() OVER (ORDER BY (sales_2008 - sales_2009) / sales_2008 DESC)           AS store_rank,
                  row_number() OVER (ORDER BY (sales_2008 - sales_2009) / sales_2008 DESC, StoreKey) AS store_rn
              FROM store_year
              WHERE sales_2009 < sales_2008
          ),
          cat_year AS (
              SELECT
                  f.StoreKey                                        AS StoreKey,
                  pc.ProductCategoryName                            AS category,
                  sumIf(f.SalesAmount, toYear(f.DateKey) = 2008)    AS cat_sales_2008,
                  sumIf(f.SalesAmount, toYear(f.DateKey) = 2009)    AS cat_sales_2009
              FROM retail.FactSales AS f
              LEFT JOIN retail.DimProduct AS p ON f.ProductKey = p.ProductKey
              LEFT JOIN retail.DimProductSubcategory AS ps ON p.ProductSubcategoryKey = ps.ProductSubcategoryKey
              LEFT JOIN retail.DimProductCategory AS pc ON ps.ProductCategoryKey = pc.ProductCategoryKey
              WHERE toYear(f.DateKey) IN (2008, 2009)
                AND f.StoreKey IN (SELECT StoreKey FROM ranked_stores WHERE store_rn <= 3)
              GROUP BY StoreKey, category
          ),
          cat_rank AS (
              SELECT
                  StoreKey,
                  category,
                  cat_sales_2008 - cat_sales_2009                                                   AS decline_amount,
                  (cat_sales_2008 - cat_sales_2009) / cat_sales_2008 * 100                          AS category_decline_pct,
                  rank() OVER (PARTITION BY StoreKey ORDER BY cat_sales_2008 - cat_sales_2009 DESC) AS category_rank,
                  row_number() OVER (PARTITION BY StoreKey ORDER BY cat_sales_2008 - cat_sales_2009 DESC, category) AS category_rn
              FROM cat_year
          )
      SELECT
          t.StoreKey                                          AS StoreKey,
          s.StoreName                                         AS StoreName,
          t.decline_pct                                       AS decline_pct,
          c.category                                          AS category,
          c.decline_amount                                    AS decline_amount,
          c.decline_amount / t.store_decline_amount * 100     AS contribution_pct,
          t.store_decline_amount                              AS store_decline_amount,
          c.category_decline_pct                              AS category_decline_pct,
          t.store_rank                                        AS store_rank,
          c.category_rank                                     AS category_rank
      FROM ranked_stores AS t
      INNER JOIN cat_rank AS c ON t.StoreKey = c.StoreKey
      INNER JOIN retail.DimStore AS s ON t.StoreKey = s.StoreKey
      WHERE t.store_rn <= 3
        AND c.category_rn = 1
      ORDER BY t.store_rn
      SETTINGS join_use_nulls = 1

  - id: E14
    question: "2009 年哪 10 对 Contoso 产品最常出现在同一个订单里？给出它们的共同订单数和提升度。"
    shows: "购买事件取全部行（S10）；提升度分母是 2009 全部线上订单；前 10 对恰好 10 行：row_number() 选行，rank() 给名次"
    sql: |
      WITH
          order_product AS (
              SELECT DISTINCT f.SalesOrderNumber AS order_no, f.ProductKey AS product_key
              FROM retail.FactOnlineSales AS f
              INNER JOIN retail.DimProduct AS p ON f.ProductKey = p.ProductKey
              WHERE f.DateKey >= toDate('2009-01-01') AND f.DateKey < toDate('2010-01-01')
                AND p.BrandName = 'Contoso'
          ),
          product_orders AS (
              SELECT product_key, count() AS n_orders
              FROM order_product
              GROUP BY product_key
          ),
          total AS (
              SELECT uniqExact(SalesOrderNumber) AS n_total_orders
              FROM retail.FactOnlineSales
              WHERE DateKey >= toDate('2009-01-01') AND DateKey < toDate('2010-01-01')
          ),
          pairs AS (
              SELECT a.product_key AS key1, b.product_key AS key2, count() AS common_orders
              FROM order_product AS a
              INNER JOIN order_product AS b
                  ON a.order_no = b.order_no AND a.product_key < b.product_key
              GROUP BY key1, key2
          ),
          ranked AS (
              SELECT
                  key1,
                  key2,
                  common_orders,
                  rank() OVER (ORDER BY common_orders DESC)                    AS pair_rank,
                  row_number() OVER (ORDER BY common_orders DESC, key1, key2)  AS rn
              FROM pairs
          )
      SELECT
          r.key1                                                          AS product1_key,
          p1.ProductName                                                  AS product1_name,
          r.key2                                                          AS product2_key,
          p2.ProductName                                                  AS product2_name,
          r.common_orders                                                 AS common_orders,
          r.common_orders * t.n_total_orders / (o1.n_orders * o2.n_orders) AS lift_ratio,
          r.pair_rank                                                     AS pair_rank
      FROM ranked AS r
      INNER JOIN product_orders AS o1 ON r.key1 = o1.product_key
      INNER JOIN product_orders AS o2 ON r.key2 = o2.product_key
      INNER JOIN retail.DimProduct AS p1 ON r.key1 = p1.ProductKey
      INNER JOIN retail.DimProduct AS p2 ON r.key2 = p2.ProductKey
      CROSS JOIN total AS t
      WHERE r.rn <= 10
      ORDER BY r.rn
