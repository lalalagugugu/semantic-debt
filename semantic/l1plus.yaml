      - { terms: ["税", "税费", "所得税"], value: "Taxation", key: 19 }
      - { terms: ["广播电视投放"], value: "Radio & TV", key: 20 }
      - { terms: ["平面投放", "印刷广告"], value: "Print", key: 21 }
      - { terms: ["互联网投放", "网络广告"], value: "Internet", key: 22 }
      - { terms: ["其他投放"], value: "Other", key: 23 }
