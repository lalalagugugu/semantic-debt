      - { terms: ["显示器"], value: "Monitors", level: "子类" }
      - { terms: ["打印、扫描与传真", "打印扫描传真设备"], value: "Printers, Scanners & Fax", level: "子类" }
      - { terms: ["数码相机"], value: "Digital Cameras", level: "子类" }
      - { terms: ["数码单反", "单反"], value: "Digital SLR Cameras", level: "子类" }
      - { terms: ["胶片相机"], value: "Film Cameras", level: "子类" }
      - { terms: ["摄像机"], value: "Camcorders", level: "子类" }
      - { terms: ["触屏手机"], value: "Touch Screen Phones", level: "子类" }
      - { terms: ["智能手机与 PDA", "智能手机和 PDA"], value: "Smart phones & PDAs", level: "子类" }
      - { terms: ["家用与办公电话", "座机"], value: "Home & Office Phones", level: "子类" }
      - { terms: ["影片 DVD", "电影 DVD"], value: "Movie DVD", level: "子类" }
      - { terms: ["音乐 CD"], value: "Music CD", level: "子类" }
      - { terms: ["下载版游戏"], value: "Download Games", level: "子类" }
      - { terms: ["冰箱"], value: "Refrigerators", level: "子类" }
      - { terms: ["洗衣机与干衣机", "洗衣干衣机"], value: "Washers & Dryers", level: "子类" }
      - { terms: ["微波炉"], value: "Microwaves", level: "子类" }
      - { terms: ["咖啡机"], value: "Coffee Machines", level: "子类" }
      - { terms: ["空调"], value: "Air Conditioners", level: "子类" }
      - { terms: ["热水器"], value: "Water Heaters", level: "子类" }
      - { terms: ["风扇"], value: "Fans", level: "子类" }
      - { terms: ["灯具"], value: "Lamps", level: "子类" }
    no_exact_mapping:
      - { terms: ["投影仪", "幕布"], within: "Projectors & Screens" }
      - { terms: ["打印机", "扫描仪", "传真机"], within: "Printers, Scanners & Fax" }
      - { terms: ["洗衣机", "干衣机"], within: "Washers & Dryers" }
      - { terms: ["DVD 播放机", "VCD 播放机"], within: "VCD & DVD" }
      - { terms: ["MP3", "MP4"], within: "MP4&MP3" }
      - { terms: ["智能手机", "PDA"], within: "Smart phones & PDAs" }
      - { terms: ["玩具"], within: "Games and Toys" }
    no_exact_mapping_rule: >-
      能力边界：问题只用了上表的单项词时，本库只能区分到组合子类（within 列出的那一个），分不出该单项。
      这时按系统提示的输出协议处理（答不了就只输出 CANNOT_ANSWER），不自行把范围扩大成组合子类或上位集合。
      只有问题明确接受扩大范围（「按整个投影与幕布子类算也行」「就用 MP4&MP3 的数」）时，才按组合子类计算。

  - id: E06
    entity: "品牌"
    column: "DimProduct.BrandName"
    map:
      - { terms: ["自有品牌", "Contoso"], value: "Contoso" }
    note: "其余品牌用英文原名，不翻译。"

  - id: E07
    entity: "颜色"
    rev: "R3"
    column: "DimProduct.ColorName"
    note: >-
      筛选不区分大小写：「蓝」= lower(ColorName) = 'blue'，选中 Blue 与 blue 两种写法。
      分组按原值：Blue 与 blue 是两个组，不合并（A36）。「银灰」只映 Silver Grey，不含 Silver、Grey。
    map:
      - { terms: ["黑", "黑色"], value: "Black" }
      - { terms: ["白", "白色"], value: "White" }
      - { terms: ["银", "银色"], value: "Silver" }
      - { terms: ["灰", "灰色"], value: "Grey" }
      - { terms: ["蓝", "蓝色"], value: "Blue", filter: "lower(ColorName) = 'blue'" }
      - { terms: ["红", "红色"], value: "Red" }
      - { terms: ["绿", "绿色"], value: "Green" }
      - { terms: ["棕", "棕色", "咖啡色"], value: "Brown" }
      - { terms: ["粉", "粉色", "粉红"], value: "Pink" }
      - { terms: ["橙", "橙色"], value: "Orange" }
      - { terms: ["金", "金色"], value: "Gold" }
      - { terms: ["黄", "黄色"], value: "Yellow" }
      - { terms: ["天蓝", "天蓝色"], value: "Azure" }
      - { terms: ["银灰", "银灰色"], value: "Silver Grey" }
      - { terms: ["紫", "紫色"], value: "Purple" }
      - { terms: ["透明"], value: "Transparent" }

  - id: E08
    entity: "产品档位、备货档位"
    column: "DimProduct.ClassName；DimProduct.StockTypeName"
    map:
      - { terms: ["经济档", "经济型", "低端"], value: "Economy", column: "ClassName" }
      - { terms: ["标准档", "标准型", "中端"], value: "Regular", column: "ClassName" }
      - { terms: ["高档", "豪华型", "高端"], value: "Deluxe", column: "ClassName" }
