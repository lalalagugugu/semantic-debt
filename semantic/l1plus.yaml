# ---------------------------------------------------------------------------
# 四、类层次：把 L1 散在各处的层级与划分集中写清楚。
# classes 只写 is-a（子类 ⊂ 父类），parent = 父类；membership 是成员判定（SQL 条件）。
# relations 写归属关系（属于、位于、隶属于、汇报给、上级科目），它们不是 is-a：
#   from 的一个实例经 via 指向 to 的一个实例。identity 写实例怎样唯一标识。
# disjoint = 子类互斥；covering = 子类覆盖父类。
# ---------------------------------------------------------------------------
hierarchies:

  - id: H01
    name: "销售记录"
    rev: "复核"
    classes:
      - { class: "线上订单行", parent: null, membership: "FactOnlineSales 的一行" }
      - { class: "线上销售行", parent: "线上订单行", membership: "SalesQuantity > 0" }
      - { class: "线上退货行", parent: "线上订单行", membership: "SalesQuantity = 0（退货单独成行）" }
      - { class: "全渠道汇总行", parent: null, membership: "FactSales 的一行（天 × 门店 × 产品 × 促销 × 渠道）" }
      - { class: "全渠道线上汇总行", parent: "全渠道汇总行", membership: "channelKey = 2" }
    constraints:
      - "线上销售行与线上退货行互斥且覆盖线上订单行。"
      - "线上订单行与全渠道线上汇总行是同一块业务的两份记录（金额差 1.5%），不是两块业务：两张表的线上部分不能相加，也不能一张补另一张（A02）。"
      - "一个结果里的线上数字只来自一张表，选哪张按 A02、A03。"

  - id: H02
    name: "门店"
    rev: "R1"
    classes:
      - { class: "门店", parent: null, membership: "DimStore 的一行（306 家）" }
      - { class: "实体店", parent: "门店", membership: "StoreType = 'Store'（299 家）" }
      - { class: "虚拟门店", parent: "门店", membership: "StoreType != 'Store'（7 家）" }
      - { class: "线上店", parent: "虚拟门店", membership: "StoreType = 'Online'（3 家：199、306、307）" }
      - { class: "经销店", parent: "虚拟门店", membership: "StoreType = 'Reseller'（3 家：308、309、310）" }
      - { class: "目录店", parent: "虚拟门店", membership: "StoreType = 'Catalog'（1 家：200）" }
      - { class: "营业中门店", parent: "门店", membership: "Status = 'On'（294 家）" }
      - { class: "已关店门店", parent: "门店", membership: "Status = 'Off'（12 家，全是实体店）" }
    relations:
      - { relation: "位于", from: "门店", to: "城市（H04）", via: "DimStore.GeographyKey" }
      - { relation: "由谁管理", from: "门店", to: "员工（H06）", via: "DimStore.EmployeeKey" }
      - { relation: "对应计划实体", from: "门店", to: "门店实体（H05）", via: "DimStore.EntityKey" }
    constraints:
      - "实体店与虚拟门店互斥且覆盖门店；营业中与已关店互斥且覆盖门店；两种划分正交。"
      - "门店类型 ↔ 渠道一一对应：Store ↔ 1、Online ↔ 2、Catalog ↔ 3、Reseller ↔ 4。"
      - "「门店」默认指全部 306 家，含虚拟门店；说「实体店」才只指 299 家（A01）。"

  - id: H03
    name: "产品"
    rev: "复核"
    classes:
      - { class: "产品键", parent: null, membership: "销售、库存事实里出现过的 ProductKey" }
      - { class: "已登记产品", parent: "产品键", membership: "在 DimProduct 有登记行的 ProductKey（2,233 个）" }
      - { class: "未登记产品", parent: "产品键", membership: "事实表引用、DimProduct 里没有登记行的 ProductKey（284 个）" }
      - { class: "在售产品", parent: "已登记产品", membership: "Status = 'On'（1,938 个）" }
      - { class: "停售产品", parent: "已登记产品", membership: "Status = 'Off'（295 个）" }
      - { class: "品类", parent: null, membership: "DimProductCategory 的一行，8 个" }
      - { class: "子类", parent: null, membership: "DimProductSubcategory 的一行，44 个，其中 30 个有产品" }
    relations:
      - { relation: "属于子类", from: "已登记产品", to: "子类", via: "DimProduct.ProductSubcategoryKey" }
      - { relation: "属于品类", from: "子类", to: "品类", via: "DimProductSubcategory.ProductCategoryKey（以数据为准，A40）" }
    constraints:
      - "已登记与未登记互斥且覆盖产品键；在售与停售互斥且覆盖已登记产品。"
      - "产品属于子类、子类属于品类是归属关系，不是 is-a：产品不是一种子类，子类也不是一种品类。"
      - "DimProduct 的行是产品的登记记录；未登记产品是真实卖出过的产品，只是没有登记记录，所以没有品类、子类、品牌等属性，按属性分组时归未知组保留（A20）。"

  - id: H04
    name: "地理"
    rev: "复核"
    classes:
      - { class: "大洲", parent: null, membership: "ContinentName，3 个", identity: "ContinentName" }
      - { class: "国家 / 地区", parent: null, membership: "RegionCountryName 非空的取值，34 个", identity: "RegionCountryName" }
      - { class: "省 / 州", parent: null, membership: "StateProvinceName 非空的取值", identity: "(RegionCountryName, StateProvinceName)" }
      - { class: "城市", parent: null, membership: "GeographyType = 'City' 的行，517 个", identity: "GeographyKey；等价于 (RegionCountryName, StateProvinceName, CityName)" }
    relations:
      - { relation: "位于省州", from: "城市", to: "省 / 州", via: "同一行的 (RegionCountryName, StateProvinceName)" }
      - { relation: "位于国家", from: "省 / 州", to: "国家 / 地区", via: "RegionCountryName" }
      - { relation: "位于大洲", from: "国家 / 地区", to: "大洲", via: "ContinentName" }
      - { relation: "客户所在地", from: "客户（H08）", to: "城市", via: "DimCustomer.GeographyKey" }
      - { relation: "门店所在地", from: "门店（H02）", to: "城市", via: "DimStore.GeographyKey" }
    constraints:
      - "地理树按键或复合身份建，不按名字：同名城市可以在不同省州甚至不同国家（实测 5 个：Burbank、Columbus、Birmingham、Saint Ouen、Frankfurt），城市按 GeographyKey 或 (国家, 省州, 城市) 区分；省州按 (国家, 省州) 区分。"
      - "DimGeography 里三个大洲级的行（GeographyType = 'Continent'）国家为空串，分属三个大洲：它们不是一个叫空串的国家，不进国家层。"
      - "客户和门店都连到城市级的行；「位于」选客户所在地还是门店所在地按 A04。"

  - id: H05
    name: "计划实体（组织树）"
    rev: "复核"
    classes:
      - { class: "计划实体", parent: null, membership: "DimEntity 的一行（421 个）" }
      - { class: "集团级实体", parent: "计划实体", membership: "EntityType = 'Group'，3 个" }
      - { class: "国家 / 地区级实体", parent: "计划实体", membership: "EntityType = 'Country/Region'，33 个" }
      - { class: "州级实体", parent: "计划实体", membership: "EntityType = 'State'，79 个" }
      - { class: "门店实体", parent: "计划实体", membership: "EntityType = 'Store'，306 个，与 DimStore.EntityKey 一一对应" }
    relations:
      - { relation: "隶属于", from: "计划实体", to: "计划实体", via: "DimEntity.ParentEntityKey" }
    constraints:
      - "四种实体是实体类型（is-a 计划实体），彼此互斥；「门店实体隶属于州级实体」是归属关系，不是 is-a。"
      - "一般路径：门店实体 → 州级实体 → 国家 / 地区级实体 → 集团级实体。7 家虚拟门店（线上店、经销店、目录店）的门店实体直接隶属于国家 / 地区级实体，不经过州；299 家实体店的门店实体都隶属于州级实体（实测）。"
      - "集团级实体的 ParentEntityKey 等于它自己（1、2、3 自指）：向上递归遇到 ParentEntityKey = EntityKey 即停，它就是根。"
      - "只有门店实体有战略计划行。按地理看计划默认不走组织树，走门店所在地（A32）。"

  - id: H06
    name: "员工"
    rev: "R10、复核"
    classes:
      - { class: "员工", parent: null, membership: "DimEmployee 的一行（293 人）" }
      - { class: "销售总监", parent: "员工", membership: "Title = 'Sales Group Manager'（1 人：EmployeeKey 18）" }
      - { class: "大区经理", parent: "员工", membership: "Title = 'Sales Region Manager'（5 人：1–5）" }
      - { class: "州经理", parent: "员工", membership: "Title = 'Sales State Manager'（23 人）" }
      - { class: "门店经理", parent: "员工", membership: "Title = 'Sales Store Manager'（264 人）" }
    relations:
      - { relation: "汇报给", from: "员工", to: "员工", via: "DimEmployee.ParentEmployeeKey" }
      - { relation: "管理门店", from: "员工", to: "门店（H02）", via: "DimStore.EmployeeKey" }
    constraints:
      - "四个职级是员工的子类（is-a），互斥且覆盖；「门店经理汇报给州经理」是归属关系，不是 is-a。"
      - "断环：数据里 18（销售总监）的 ParentEmployeeKey 是 1（大区经理），1 的是 18，互为上级。以 18 为根，忽略 18 的 ParentEmployeeKey。理由：18 是唯一的 Sales Group Manager；其余 292 条上级关系全都是低一级职级汇报给高一级职级（门店经理 → 州经理 → 大区经理 → 销售总监），唯独 18 → 1 是高汇报给低；1 和另外 4 个大区经理一样汇报给 18。"
      - "递归（向上找上级或向下找下属）遇到已经访问过的员工即停，每人只计一次。"
      - "门店经理管的门店 = DimStore.EmployeeKey（A38）。"

  - id: H07
    name: "科目树"
    rev: "R9"
    note: "这里的上下级是「上级科目」归属关系，不是 is-a。"
    nodes:
      - { account: "Profit and Loss after tax（1）", parent_account: null, kind: "利润", note: "根；数据里它的 ParentAccountKey 写成 24，是环，断环时忽略（A41）" }
      - { account: "Profit and Loss before tax（24）", parent_account: 1, kind: "利润" }
      - { account: "Taxation（19）", parent_account: 1, kind: "税", leaf: true }
      - { account: "Income（2）", parent_account: 24, kind: "收入" }
      - { account: "Expense（3）", parent_account: 24, kind: "费用" }
      - { account: "Sale Revenue（4）", parent_account: 2, kind: "收入", leaf: true }
      - { account: "Cost of Goods Sold（5）", parent_account: 3, kind: "费用", leaf: true }
      - { account: "Selling, General & Administrative Expenses（6）", parent_account: 3, kind: "费用" }
      - { account: "Administration Expense（7）", parent_account: 6, kind: "费用", leaf: true }
      - { account: "IT Cost（8）", parent_account: 6, kind: "费用", leaf: true }
      - { account: "Human Capital（9）", parent_account: 6, kind: "费用", leaf: true }
      - { account: "Light, Heat, Communication Cost（10）", parent_account: 6, kind: "费用", leaf: true }
      - { account: "Property Costs（11）", parent_account: 6, kind: "费用", leaf: true }
      - { account: "Other Expenses（12）", parent_account: 6, kind: "费用", leaf: true }
      - { account: "Marketing Cost（13）", parent_account: 6, kind: "费用" }
      - { account: "Holiday Ad Cost（14）", parent_account: 13, kind: "费用" }
      - { account: "Spring Ad Cost（15）", parent_account: 13, kind: "费用", leaf: true }
      - { account: "Back-to-School Ad Cost（16）", parent_account: 13, kind: "费用", leaf: true }
      - { account: "Business Ad Cost（17）", parent_account: 13, kind: "费用", leaf: true }
      - { account: "Tax Time / Summer Ad Cost（18）", parent_account: 13, kind: "费用", leaf: true }
      - { account: "Radio & TV（20）", parent_account: 14, kind: "费用", leaf: true }
      - { account: "Print（21）", parent_account: 14, kind: "费用", leaf: true }
      - { account: "Internet（22）", parent_account: 14, kind: "费用", leaf: true }
      - { account: "Other（23）", parent_account: 14, kind: "费用", leaf: true }
    constraints:
      - "战略计划表只有 17 个叶子科目的行，Amount 全为正数。"
      - "符号：收入类、费用类父科目 = 其下全部叶子正向相加；利润类（24、1）是显式减法：24 = 收入（2）− 费用（3），1 = 24 − 税（19）（D32）。"
      - "子树的叶子：Income = {4}；Expense = {5, 7, 8, 9, 10, 11, 12, 15, 16, 17, 18, 20, 21, 22, 23}；SG&A = {7, 8, 9, 10, 11, 12, 15, 16, 17, 18, 20, 21, 22, 23}；Marketing Cost = {15, 16, 17, 18, 20, 21, 22, 23}；Holiday Ad Cost = {20, 21, 22, 23}。"
      - "停止：向上递归到 1 停止；向下展开遇到已访问的科目即停。去重：每个叶子在一次合计里只计一次（A33）。"

  - id: H08
    name: "客户"
    rev: "复核"
    classes:
      - { class: "客户", parent: null, membership: "DimCustomer，18,869 人，全部有线上购买" }
      - { class: "分层客户集合", parent: "客户", membership: "满足客户属性、且参照日及以前至少有一行满足交易筛选的客户（A27）" }
      - { class: "活跃客户", parent: "分层客户集合", membership: "末购日距参照日 ≤ 6 个月（约定 13）" }
      - { class: "有流失风险客户", parent: "分层客户集合", membership: "7–12 个月" }
      - { class: "已流失客户", parent: "分层客户集合", membership: "> 12 个月" }
      - { class: "未购买客户", parent: "客户", membership: "满足客户属性、参照日及以前没有匹配行的客户；只在问题明确问「没买过」时用（A27）" }
      - { class: "新客", parent: "客户", membership: "按全局首购日（D01）判定，约定 14、A28" }
      - { class: "复购客户", parent: "客户", membership: "D05" }
    constraints:
      - "活跃、有流失风险、已流失三者互斥且覆盖分层客户集合（不是覆盖全部客户）；分层客户集合与未购买客户互斥。"
      - "新客、复购客户是另外两个子集：彼此可以交叉，也与三层交叉；一个客户可以同时是新客和复购客户。"

  - id: H09
    name: "交易的促销状态"
    rev: "R5"
    classes:
      - { class: "交易", parent: null }
      - { class: "无折扣交易", parent: "交易", membership: "PromotionKey = 1" }
      - { class: "打折交易", parent: "交易", membership: "PromotionKey != 1（27 个季节性促销键）" }
    relations:
      - { relation: "参加活动实例", from: "交易", to: "促销键（活动实例）", via: "PromotionKey" }
      - { relation: "属于活动家族", from: "促销键（活动实例）", to: "促销名（活动家族）", via: "DimPromotion.PromotionName" }
    constraints:
      - "无折扣与打折两者互斥且覆盖交易。判定按促销键，不按折扣金额（约定 10）。"
      - "27 个打折促销键是 9 个促销名各 3 期。分组默认按促销键（活动实例）；问题明确说「同名活动」时才按促销名合并成家族；分年份按交易日期（A19）。"

  - id: H10
    name: "场景"
    rev: "复核"
    classes:
      - { class: "Actual", parent: null, membership: "ScenarioKey = 1" }
      - { class: "Budget", parent: null, membership: "ScenarioKey = 2；正式目标与正式预算" }
      - { class: "Forecast", parent: null, membership: "ScenarioKey = 3" }
    constraints:
      - "场景是对计划、目标记录的分类：每一行属于且只属于一个场景。"
      - "任何一个合计数都只能在一个场景内求和，不能跨场景相加。"
      - "这不禁止在同一个结果里比较多个场景（实际 vs 预算、预测偏差 D31）：各场景分别合计，再并列或相除。"

  - id: H11
    name: "日子类型"
    classes:
      - { class: "工作日", parent: null, membership: "IsWorkDay = 'WorkDay'（周一至周五）" }
      - { class: "周末", parent: null, membership: "IsWorkDay = 'WeekEnd'；本库与 IsHoliday = 'Yes' 是同一批日子" }
    constraints:
      - "工作日与周末互斥且覆盖。季节按大洲各一套（A10、E10）。"

  - id: H12
    name: "库存状态"
    rev: "复核"
    classes:
      - { class: "门店产品组合", parent: null, membership: "每个门店 × 产品取最近一次快照（A22）" }
      - { class: "低于安全库存组合", parent: "门店产品组合", membership: "OnHandQuantity < SafetyStockQuantity" }
      - { class: "零库存组合", parent: "门店产品组合", membership: "OnHandQuantity = 0" }
    constraints:
      - "当前数据下成立（不是无条件的规则）：零库存组合 ⊂ 低于安全库存组合，因为当前数据里安全库存的最小值是 3，在手为 0 一定低于安全库存。计算时仍按各自的定义判定，不靠这条推。"

  - id: H13
    name: "IT 设备与成本"
    classes:
      - { class: "IT 设备", parent: null, membership: "DimMachine" }
      - { class: "POS", parent: "IT 设备", membership: "MachineType IN ('POS01','POS02','POS03','POS04')" }
      - { class: "服务器", parent: "IT 设备", membership: "MachineType IN ('WSR01','WSR02','MSR01')" }
      - { class: "集线器", parent: "IT 设备", membership: "MachineType = 'HUB01'" }
      - { class: "路由器", parent: "IT 设备", membership: "MachineType = 'RUT01'" }
      - { class: "IT 成本", parent: null, membership: "FactITMachine" }
      - { class: "设备购置费", parent: "IT 成本", membership: "CostType = 'Equipment Costs'" }
      - { class: "年度维护费", parent: "IT 成本", membership: "CostType = 'Annual Maintenance Cost'" }
    constraints:
      - "设备的四个子类互斥且覆盖；成本的两个子类互斥且覆盖（A34）。"
