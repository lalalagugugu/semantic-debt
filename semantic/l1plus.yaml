# membership 是成员判定（SQL 条件）；disjoint = 子类互斥；covering = 子类覆盖父类。
# ---------------------------------------------------------------------------
hierarchies:

  - id: H01
    name: "销售记录"
    classes:
      - { class: "销售记录", parent: null }
      - { class: "线上订单行", parent: "销售记录", membership: "FactOnlineSales 的一行" }
      - { class: "线上销售行", parent: "线上订单行", membership: "SalesQuantity > 0" }
      - { class: "线上退货行", parent: "线上订单行", membership: "SalesQuantity = 0（退货单独成行）" }
      - { class: "全渠道汇总行", parent: "销售记录", membership: "FactSales 的一行（天 × 门店 × 产品 × 促销）" }
    constraints:
      - "线上订单行与全渠道汇总行互斥；两者的线上部分口径不同（差 1.5%），不得相加（A02）。"
      - "线上销售行与线上退货行互斥且覆盖线上订单行。"

  - id: H02
    name: "门店"
    classes:
      - { class: "门店（DimStore 的一行）", parent: null }
      - { class: "实体店", parent: "门店（DimStore 的一行）", membership: "StoreType = 'Store'（299 家）" }
      - { class: "虚拟门店", parent: "门店（DimStore 的一行）", membership: "StoreType != 'Store'（7 家）" }
      - { class: "线上店", parent: "虚拟门店", membership: "StoreType = 'Online'（3 家：199、306、307）" }
      - { class: "经销店", parent: "虚拟门店", membership: "StoreType = 'Reseller'（3 家）" }
      - { class: "目录店", parent: "虚拟门店", membership: "StoreType = 'Catalog'（1 家）" }
      - { class: "营业中门店", parent: "门店（DimStore 的一行）", membership: "Status = 'On'（294 家）" }
      - { class: "已关店门店", parent: "门店（DimStore 的一行）", membership: "Status = 'Off'（12 家，全是实体店）" }
    constraints:
      - "实体店与虚拟门店互斥且覆盖；营业中与已关店互斥且覆盖；两种划分正交。"
      - "门店类型 ↔ 渠道一一对应：Store ↔ 1、Online ↔ 2、Catalog ↔ 3、Reseller ↔ 4。"
      - "「门店」默认指实体店（A01）。"

  - id: H03
    name: "产品"
    classes:
      - { class: "品类", parent: null, membership: "DimProductCategory，8 个" }
      - { class: "子类", parent: "品类", membership: "DimProductSubcategory，44 个，其中 30 个有产品；按 ProductCategoryKey 归属（A40）" }
      - { class: "产品", parent: "子类", membership: "DimProduct，2,233 个；按 ProductSubcategoryKey 归属" }
      - { class: "在售产品", parent: "产品", membership: "Status = 'On'（1,938 个）" }
      - { class: "停售产品", parent: "产品", membership: "Status = 'Off'（295 个）" }
      - { class: "未登记产品", parent: null, membership: "事实表引用、DimProduct 里没有的 ProductKey（284 个）；不属于任何品类（A20）" }
    constraints:
      - "在售与停售互斥且覆盖产品。"
      - "未登记产品不是产品的子类：没有品类、子类、品牌等属性。"

  - id: H04
    name: "地理"
    classes:
      - { class: "大洲", parent: null, membership: "ContinentName，3 个" }
      - { class: "国家 / 地区", parent: "大洲", membership: "RegionCountryName，34 个" }
      - { class: "省 / 州", parent: "国家 / 地区", membership: "StateProvinceName" }
      - { class: "城市", parent: "省 / 州", membership: "CityName" }
    constraints:
      - "「位于」有两种：客户所在地（DimCustomer.GeographyKey）与门店所在地（DimStore.GeographyKey），选哪种按 A04。"

  - id: H05
    name: "计划实体（组织树）"
    classes:
      - { class: "集团级实体", parent: null, membership: "DimEntity 顶层，3 个" }
      - { class: "国家 / 地区级实体", parent: "集团级实体", membership: "33 个" }
      - { class: "州级实体", parent: "国家 / 地区级实体", membership: "79 个" }
      - { class: "门店实体", parent: "州级实体", membership: "EntityType = 'Store'，306 个，与 DimStore.EntityKey 一一对应" }
    constraints:
      - "只有门店实体有战略计划行。"
      - "线上店、目录店的门店实体直接挂在国家 / 地区级实体下，不经过州。"
      - "按地理看计划默认不走组织树，走门店所在地（A32）。"

  - id: H06
    name: "员工"
    classes:
      - { class: "销售总监", parent: null, membership: "Title = 'Sales Group Manager'（1 人）" }
      - { class: "大区经理", parent: "销售总监", membership: "Title = 'Sales Region Manager'（5 人）" }
      - { class: "州经理", parent: "大区经理", membership: "Title = 'Sales State Manager'（23 人）" }
      - { class: "门店经理", parent: "州经理", membership: "Title = 'Sales Store Manager'（264 人）" }
    constraints:
      - "上下级沿 DimEmployee.ParentEmployeeKey；门店经理管的门店 = DimStore.EmployeeKey（A38）。"

  - id: H07
    name: "科目树"
    classes:
      - { class: "Profit and Loss after tax（1）", parent: null, note: "根；数据里它的父科目写成 24，是环（A41）" }
      - { class: "Profit and Loss before tax（24）", parent: "Profit and Loss after tax（1）" }
      - { class: "Taxation（19）", parent: "Profit and Loss after tax（1）", leaf: true }
      - { class: "Income（2）", parent: "Profit and Loss before tax（24）" }
      - { class: "Expense（3）", parent: "Profit and Loss before tax（24）" }
      - { class: "Sale Revenue（4）", parent: "Income（2）", leaf: true }
      - { class: "Cost of Goods Sold（5）", parent: "Expense（3）", leaf: true }
      - { class: "Selling, General & Administrative Expenses（6）", parent: "Expense（3）" }
      - { class: "Administration Expense（7）", parent: "Selling, General & Administrative Expenses（6）", leaf: true }
      - { class: "IT Cost（8）", parent: "Selling, General & Administrative Expenses（6）", leaf: true }
      - { class: "Human Capital（9）", parent: "Selling, General & Administrative Expenses（6）", leaf: true }
      - { class: "Light, Heat, Communication Cost（10）", parent: "Selling, General & Administrative Expenses（6）", leaf: true }
      - { class: "Property Costs（11）", parent: "Selling, General & Administrative Expenses（6）", leaf: true }
      - { class: "Other Expenses（12）", parent: "Selling, General & Administrative Expenses（6）", leaf: true }
      - { class: "Marketing Cost（13）", parent: "Selling, General & Administrative Expenses（6）" }
      - { class: "Holiday Ad Cost（14）", parent: "Marketing Cost（13）" }
      - { class: "Spring Ad Cost（15）", parent: "Marketing Cost（13）", leaf: true }
      - { class: "Back-to-School Ad Cost（16）", parent: "Marketing Cost（13）", leaf: true }
      - { class: "Business Ad Cost（17）", parent: "Marketing Cost（13）", leaf: true }
      - { class: "Tax Time / Summer Ad Cost（18）", parent: "Marketing Cost（13）", leaf: true }
      - { class: "Radio & TV（20）", parent: "Holiday Ad Cost（14）", leaf: true }
      - { class: "Print（21）", parent: "Holiday Ad Cost（14）", leaf: true }
      - { class: "Internet（22）", parent: "Holiday Ad Cost（14）", leaf: true }
      - { class: "Other（23）", parent: "Holiday Ad Cost（14）", leaf: true }
    constraints:
      - "战略计划表只有 17 个叶子科目的行；父科目 = 其下全部叶子之和（A33）。"
      - "子树的叶子：Income = {4}；Expense = {5, 7, 8, 9, 10, 11, 12, 15, 16, 17, 18, 20, 21, 22, 23}；SG&A = {7, 8, 9, 10, 11, 12, 15, 16, 17, 18, 20, 21, 22, 23}；Marketing Cost = {15, 16, 17, 18, 20, 21, 22, 23}；Holiday Ad Cost = {20, 21, 22, 23}。"

  - id: H08
    name: "客户"
    classes:
      - { class: "客户", parent: null, membership: "DimCustomer，18,869 人，全部有线上购买" }
      - { class: "活跃客户", parent: "客户", membership: "最近购买距参照日 ≤ 6 个月（约定 13）" }
      - { class: "有流失风险客户", parent: "客户", membership: "7–12 个月" }
      - { class: "已流失客户", parent: "客户", membership: "> 12 个月" }
      - { class: "新客", parent: "客户", membership: "约定 14、A28" }
      - { class: "复购客户", parent: "客户", membership: "D05" }
    constraints:
      - "活跃、有流失风险、已流失三者互斥且覆盖客户。"
      - "新客、复购客户是另外两个子集，与分层正交。"

  - id: H09
    name: "交易的促销状态"
    classes:
      - { class: "交易", parent: null }
      - { class: "无折扣交易", parent: "交易", membership: "PromotionKey = 1" }
      - { class: "打折交易", parent: "交易", membership: "PromotionKey != 1（27 个季节性促销键）" }
    constraints:
      - "两者互斥且覆盖。判定按促销键，不按折扣金额（约定 10）。"
      - "27 个促销键是 9 个促销名各 3 期；按促销名分组，分年份按交易日期（A19）。"

  - id: H10
    name: "场景"
    classes:
      - { class: "Actual", parent: null, membership: "ScenarioKey = 1" }
      - { class: "Budget", parent: null, membership: "ScenarioKey = 2；正式目标与正式预算" }
      - { class: "Forecast", parent: null, membership: "ScenarioKey = 3" }
    constraints:
      - "三个场景互斥；任何计划、目标的合计都必须先选定一个场景。"

  - id: H11
    name: "日子类型"
    classes:
      - { class: "工作日", parent: null, membership: "IsWorkDay = 'WorkDay'（周一至周五）" }
      - { class: "周末", parent: null, membership: "IsWorkDay = 'WeekEnd'；本库与 IsHoliday = 'Yes' 是同一批日子" }
    constraints:
      - "工作日与周末互斥且覆盖。季节按大洲各一套（A10、E10）。"

  - id: H12
    name: "库存状态"
    classes:
      - { class: "门店产品组合", parent: null, membership: "每个门店 × 产品取最近一次快照（A22）" }
      - { class: "低于安全库存组合", parent: "门店产品组合", membership: "OnHandQuantity < SafetyStockQuantity" }
      - { class: "零库存组合", parent: "低于安全库存组合", membership: "OnHandQuantity = 0" }
    constraints:
      - "零库存组合 ⊂ 低于安全库存组合：安全库存的最小值是 3，所以在手为 0 一定低于安全库存。"

  - id: H13
    name: "IT 设备与成本"
    classes:
      - { class: "IT 设备", parent: null, membership: "DimMachine" }
      - { class: "POS", parent: "IT 设备", membership: "MachineType IN ('POS01','POS02','POS03','POS04')" }
      - { class: "服务器", parent: "IT 设备", membership: "MachineType IN ('WSR01','WSR02','MSR01')" }
      - { class: "集线器", parent: "IT 设备", membership: "MachineType = 'HUB01'" }
      - { class: "路由器", parent: "IT 设备", membership: "MachineType = 'RUT01'" }
      - { class: "IT 成本", parent: null, membership: "FactITMachine" }
      - { class: "设备购置费", parent: "IT 成本", membership: "CostType = 'Equipment Costs'" }
      - { class: "年度维护费", parent: "IT 成本", membership: "CostType = 'Annual Maintenance Cost'" }
    constraints:
      - "设备的四个子类互斥且覆盖；成本的两个子类互斥且覆盖（A34）。"
