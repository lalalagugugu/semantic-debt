      - { terms: ["中备货"], value: "Mid", column: "StockTypeName" }
      - { terms: ["低备货"], value: "Low", column: "StockTypeName" }

  - id: E09
    entity: "促销"
    rev: "R5"
    column: "DimPromotion.PromotionKey / PromotionName"
    note: >-
      下面的说法是筛选条件：一个促销名对应三期活动实例（三个促销键），按名筛选即选中这三个键。
      分组默认按促销键（活动实例），只有问题明确说「同名活动」时才按促销名合并（A19）。
      不带大洲的「春促」「假日促」= 各大洲同名季节的促销名合在一起作为筛选条件；分组仍按 A19。分年份按交易日期（A19）。
    map:
      - { terms: ["无折扣", "无促销", "原价", "不打折"], value: "PromotionKey = 1" }
      - { terms: ["有促销", "打折", "促销交易"], value: "PromotionKey != 1" }
      - { terms: ["北美春促"], value: "North America Spring Promotion" }
      - { terms: ["北美返校促"], value: "North America Back-to-School Promotion" }
      - { terms: ["北美假日促"], value: "North America Holiday Promotion" }
      - { terms: ["欧洲春促"], value: "European Spring Promotion" }
      - { terms: ["欧洲返校促"], value: "European Back-to-Scholl Promotion" }
      - { terms: ["欧洲假日促"], value: "European Holiday Promotion" }
      - { terms: ["亚洲春促"], value: "Asian Spring Promotion" }
      - { terms: ["亚洲夏促"], value: "Asian Summer Promotion" }
      - { terms: ["亚洲假日促"], value: "Asian Holiday Promotion" }
      - { terms: ["春促", "春季促销"], value: ["North America Spring Promotion", "European Spring Promotion", "Asian Spring Promotion"] }
      - { terms: ["返校促", "返校季促销"], value: ["North America Back-to-School Promotion", "European Back-to-Scholl Promotion"] }
      - { terms: ["假日促", "假日季促销"], value: ["North America Holiday Promotion", "European Holiday Promotion", "Asian Holiday Promotion"] }

  - id: E10
    entity: "季节"
    rev: "复核"
    column: "DimDate.NorthAmericaSeason / EuropeSeason / AsiaSeason（选字段按 A10）"
    note: >-
      季节是库内按大洲各一套的经营季标签，不等于公历季节（春夏秋冬）；用标签筛选，不换算成月份。
      问题说的是公历月份（「6–8 月」「第三季度」）时按日期筛选（E14），不用季节标签。
      某大洲没有某个标签（北美、欧洲没有报税季 / 夏季）只说明那套标签里没有这个枚举，不等于那个大洲在相应时段没有销售：
      结果为空时要在回答里说明「该大洲没有这个季节标签」，不报成销量为 0。
      亚洲的春季与返校季是同一个取值。
    map:
      - { terms: ["假日季", "节日季"], value: { NorthAmericaSeason: "Holiday", EuropeSeason: "Holiday", AsiaSeason: "Holiday" } }
      - { terms: ["返校季"], value: { NorthAmericaSeason: "Back to School", EuropeSeason: "Back to School", AsiaSeason: "Spring/Back to School" } }
      - { terms: ["春季", "商务季", "返工季"], value: { NorthAmericaSeason: "Spring/Back to Business", EuropeSeason: "Spring/Business", AsiaSeason: "Spring/Back to School" } }
      - { terms: ["报税季", "夏季"], value: { AsiaSeason: "Tax Time/Summer" } }
      - { terms: ["平季", "淡季", "非季节"], value: { NorthAmericaSeason: "No Season", EuropeSeason: "No Season", AsiaSeason: "No Season" } }

  - id: E11
    entity: "场景"
    rev: "复核"
    column: "DimScenario.ScenarioName"
    note: >-
      「计划」一词只指向计划类的表（A14、A15），不定场景：问题说「计划」而没有说预算、预测、实际时，
      不把金额自动改成 Budget——战略计划表按 D32 的默认取 Actual；销售目标表的目标按约定 12 取 Budget。
    map:
      - { terms: ["实际", "实际值", "实绩"], value: "Actual" }
      - { terms: ["预算", "预算值", "正式目标"], value: "Budget" }
      - { terms: ["预测", "预测值"], value: "Forecast" }

