# L1+ 叠加内容（T22 第 3 步；2026-10-24 按 Codex 复核、第二轮复查与用户裁决 R1–R12 修订）
#
# 叠加在 semantic/source.yaml（semantic-v1.4，L1）之上，生成 SQL-L1plus 的上下文；
# 同一份内容生成 Turtle（OWL + SHACL），放进 SQL-L3a（第 4 步）。本文件不改 L1 的任何条文。
#
# 写法约定（给后面读这个文件的人和脚本）：
#   - 四节：clarifications（歧义澄清，A..）、concepts（派生概念，D..）、aliases（实例别名，E..）、
#     hierarchies（类层次，H..）。编号与 semantic/l1plus-audit.md、semantic/l1plus-concepts.md 一致，
#     Codex 复核与之后的修改都按编号。
#   - 每条只有一种读法；不写「视情况」「按需要」。适用条件写在 applies_when，例外写在 exceptions。
#   - clarifications 的 refs 指 source.yaml 的节与条目（不写行号，行号会随文件变化）。
#   - concepts 的 sql 是 ClickHouse SQL 的写法示例，表名、列名与 L1 相同；
#     示例里的日期、N 是占位，按问题替换。示例只演示口径，不是唯一允许的写法。
#   - rev 字段记这一条在 2026-10-24 修订的依据：R1–R12 = 用户裁决；「复核」= Codex 复核与第二轮复查意见。
#     rev 是给人和脚本看的，渲染进上下文时去掉。
#   - 标「新增约定」的是 L1 没有、由 L1+ 新定的经营约定，不是从 L1 条文推出来的。
#   - 本文件里引用的数据事实（取值、行数、金额）都由盲写会话对 $SEMDEBT_DATA_DIR/parquet
#     实测过；写这份文件的会话是盲模式，没有看过题库、参考答案、运行结果。
#   - 冲突时的优先级：本文件 > source.yaml 的同一主题。本文件没有提到的，照 source.yaml。
#   - 通用规则写在 general_rules 字段里（会渲染进上下文），各条目另写的与它一致。

version: 3
base: "semantic/source.yaml（semantic-v1.4）"
title: "L1+：歧义澄清与常用业务概念"
as_of_date: "2009-12-31"
general_rules:
  - id: G01
    rev: "复核"
    rule: "比率的分母为 0、为 NULL 或分母集合为空时，结果为 NULL（不报错、不当作 0 或无穷大）。适用于本文件与 L1 的全部比率指标。"

# ---------------------------------------------------------------------------
# 一、歧义澄清：L1 条文里条件没写全、允许两种以上读法的地方，各定一种读法。
# ---------------------------------------------------------------------------
clarifications:

  # ========== 渠道、门店与选表 ==========
  - id: A01
    topic: "「门店」的范围：默认全部 306 家，含虚拟门店"
    rev: "R1"
    refs: ["conventions[2]", "datasets.FactSales.columns.StoreKey", "datasets.DimStore.description", "metrics.门店数", "metrics.同店销售额"]
    rule: >-
      「门店」默认指 DimStore 的全部 306 家：299 家实体店（StoreType = 'Store'）加 7 家虚拟门店
      （3 家线上店、3 家经销店、1 家目录店）。门店列表与排名、门店数、店均、坪效、门店人均销售额、
      同店、新开门店、门店经理、按门店所在地做的地理分析都按这 306 家，不排除虚拟门店。
    applies_when: "问题的对象是门店，且没有说「实体店」、没有点名某类虚拟门店。"
    exceptions:
      - "问题说「实体店」：只算 StoreType = 'Store' 的 299 家。"
      - "问题点名「线上店」「经销店」「目录店」或某一家门店：按点名的范围。"

  - id: A02
    topic: "明说「线上」时用哪张表"
    rev: "复核"
    refs: ["conventions[1]", "data_quality.online-sales-mismatch", "datasets.FactSales.columns.channelKey"]
    rule: >-
      按下列顺序取第一条满足的：
      (1) 指标需要订单号或客户（订单数、客单价、连带率、客户数及一切客户类指标）→ 只能用 FactOnlineSales，
      任何情况下都不切到 FactSales（FactSales 没有订单号和客户键）。
      能力边界：只有线上交易有订单号和客户，其他渠道的订单 / 客户数据不存在；线上表只是线上子集。
      问题要的是全渠道、全部门店或非线上渠道的订单 / 客户类指标时，本库答不完整，按系统提示的输出协议处理
      （答不了就只输出 CANNOT_ANSWER），不用线上子集代替完整答案。
      (2) 明说「线上」且点名了门店：点名的是线上店（199、306、307，E02）→ FactOnlineSales 按 StoreKey 筛；
      点名的是实体店、经销店、目录店 → 这些门店没有线上销售（两张表的线上行都只落在 199、306、307），结果为空，
      并在回答中说明。
      (3) 线上与其他渠道放在同一个结果里（渠道对比、各渠道拆分、线上占全渠道的比例）→ FactSales，线上 = channelKey = 2。
      (4) 线上的目标达成率 → 分子用 FactSales 的 channelKey = 2（约定 12 规定分子是全渠道销售表）。
      (5) 其余明说「线上」的销售、退货、折扣、成本、毛利 → FactOnlineSales（与没说渠道时相同）。
      本条与 A01、A03 的关系：先按 A03 定哪些表能算这个指标，再按本条在能算的表里选；门店范围按 A01。

  - id: A03
    topic: "选表：先定指标能用哪些表，再定优先级"
    rev: "复核"
    refs: ["conventions[1]", "conventions[2]", "metrics.销售额同比增长率", "metrics.销售额环比增长率", "metrics.销售额占比", "metrics.有销售天数", "metrics.日均销售额", "metrics.日均销售数量", "metrics.产品数"]
    rule: >-
      第一步，指标能用哪些表：
      订单类与客户类（订单数、客单价、连带率 D16、客户数、复购 D05–D07、新客、客户分层、客户所在地）→ 只有 FactOnlineSales；
      金额与数量类（销售额、销售数量、成本、毛利、退货、折扣、同比、环比、占比、日均、有销售天数、产品数）→
      FactOnlineSales 与 FactSales 都能算；
      库存周转率、目标达成率、目标差异的分子 → 只用 FactSales（L1 的指标定义如此）；D21 与库存对照的销售量 → 只用 FactSales；
      D29 的渠道范围默认 FactOnlineSales（R11），点名全渠道才用 FactSales（日分母另行判断，见 D29）。
      第二步，在能用的表里选：只有一张能用 → 用它；两张都能用时，没触发约定 2 → FactOnlineSales，
      触发约定 2（以门店为对象、门店经理、同店、渠道对比、全渠道）→ FactSales。
      指标上写的 dataset: FactSales 是触发约定 2 时的落点，不是默认。
    exceptions:
      - "订单类、客户类指标遇到以门店为对象或全渠道的问题，仍只用 FactOnlineSales；需要的门店或渠道不在线上的，这些门店的订单 / 客户数据不存在，按 A02 (1) 的能力边界处理（系统提示的输出协议，只输出 CANNOT_ANSWER），不改用 FactSales 的其他指标代替（D16 的选表限制同此）。"
      - "全渠道 / 全部门店的订单类、客户类请求：FactOnlineSales 只是线上子集，不是完整答案；能力边界与处理同 A02 (1)，按系统提示的输出协议（只输出 CANNOT_ANSWER）。"

  - id: A04
    topic: "约定 2 与约定 5 同时触发时的地理口径：随实际选用的事实表"
    rev: "复核"
    refs: ["conventions[5]", "multi_path_defaults"]
    rule: >-
      地理路径跟着按 A03 实际选用的事实表走：
      (1) 问题触发约定 2 → 门店所在地：选用的事实表.StoreKey → DimStore.GeographyKey → DimGeography。
      选的是 FactSales 就从 FactSales 走；订单类、客户类指标按 A03 只能用 FactOnlineSales 时，从 FactOnlineSales.StoreKey 走。
      不需要问题明说「门店所在地」。
      (2) 没触发约定 2、选用的是 FactOnlineSales → 客户所在地（FactOnlineSales → DimCustomer.GeographyKey → DimGeography，约定 5）。
      (3) 没触发约定 2、选用的表没有客户键（FactSales、FactInventory、FactSalesQuota、FactITSLA）→ 门店所在地，路径同 (1)。

  - id: A05
    topic: "线上业务按大洲分：客户所在大洲"
    refs: ["relationships: FactOnlineSales.StoreKey → DimStore.StoreKey", "conventions[5]"]
    rule: "线上销售按大洲（或国家）分时，按客户所在地（约定 5）。"
    exceptions:
      - "问题点名「线上店」或某一家线上店（北美 / 欧洲 / 亚洲线上店）：按 FactOnlineSales.StoreKey（199 / 306 / 307，见 E02）。"

  # ========== 时间 ==========
  - id: A06
    topic: "没说时间时的默认范围"
    rev: "复核"
    refs: ["conventions[3]"]
    rule: >-
      问题没有任何时间条件时，事实分析用该事实表的全部数据，不默认缩到 2009 年。各表实际范围：
      FactOnlineSales、FactSales、FactITSLA 2007-01-01 ~ 2009-12-31；FactInventory 快照 2007-01-06 ~ 2009-12-26（156 个周六）；
      FactSalesQuota、FactStrategyPlan 2007-01 ~ 2009-12（月粒度，DateKey 是每月 1 日）；FactITMachine 2007-01-01 ~ 2009-01-01。
      这条截断只管事实表。日历、员工、门店、产品、客户等主数据的计数与列表（多少天、多少员工、多少门店）
      不按事实区间截断，按维度表本身计（A31 同）。
    exceptions:
      - "「当前库存」及其衍生（缺货、零库存、可售天数）：按 A22 取 2009-12-31 及以前的最近一次快照。"
      - "客户分层（活跃 / 流失）：参照日 2009-12-31（约定 13、A27）。"
      - "新客：截止日 2009-12-31（约定 14、A28）。"
      - "同比、环比没说本期：按 A08。"

  - id: A07
    topic: "相对时间词的范围（新增约定）"
    rev: "复核"
    refs: ["conventions[3]"]
    rule: >-
      约定 3 只定义了它列出的词。下面其余的词是 L1+ 新增的经营约定（与约定 3 的写法同一方向：以 2009-12-31 为今天，
      今天所在的月、季、年都算已完成的最近一期），不是从约定 3 推出来的。逐词：
      本月、上月、最近一个月 = 2009-12；
      本季度、上季度 = 2009 年第四季度（上季度是约定 3 原文）；
      今年、本年、近一年、过去 12 个月 = 2009-01-01 ~ 2009-12-31；
      去年 = 2008 年；前年 = 2007 年；
      近 N 天 = [2009-12-31 − (N−1) 天, 2009-12-31]，含 12-31；
      近 N 个月 = 截至 2009-12 的 N 个自然月（近 3 个月 = 2009-10 ~ 2009-12）；
      本周、上周、最近一周 = 近 7 天（2009-12-25 ~ 2009-12-31）；
      截至目前、累计 = 截至 2009-12-31。
    sql: "近 90 天：WHERE DateKey BETWEEN toDate('2009-12-31') - 89 AND toDate('2009-12-31')"

  - id: A08
    topic: "同比、环比的本期与对比期"
    rev: "复核"
    refs: ["metrics.销售额同比增长率", "metrics.销售额环比增长率"]
    rule: >-
      同比：本期 = 问题指定的期；没指定 = 2009 全年，对比期 = 2008 全年。本期是某月 / 某季 →
      对比期是上一年的同月 / 同季。问题要「逐月 / 逐季同比」时，每个月 / 季各算一个。
      环比：对比期 = 紧挨着本期之前、长度相同的一期（2009-01 的上一期是 2008-12；
      2009 Q1 的上一期是 2008 Q4）。年粒度的环比就是上一年。
      增长率 = (本期 − 对比期) ÷ 对比期；分组时每组各自算本期与对比期，再算比率。
      对比期为 0 或该组在对比期没有数据 → 增长率为 NULL。

  - id: A09
    topic: "日均的分母：有交易日"
    rev: "复核、R6"
    refs: ["conventions[4]", "metrics.日均销售额", "metrics.有销售天数", "data_quality.date-dim-wider-than-facts"]
    rule: >-
      「有销售天数」= 范围内有交易行的天数：该子集在事实表里有任何一行的日子都算，含销售数量为 0 的行和退货行。
      日均（本文件称「交易日日均」）= 先按天汇总，再对得到的天求平均 = 合计 ÷ 有销售天数
      （筛选后的子集——某产品、某门店、某促销——就是该子集有交易行的天数）。
      日期范围限定在事实表的区间内，不用日期维度补出没有交易的天。选表按 A03。
    exceptions:
      - "D29 库存可售天数默认就用本条的交易日日均（线上，R11）；它的渠道范围与日分母分别判断（点名全渠道才换表，点名日历日均才换分母），与本条一致，见 D29。"
      - "问题明确要求按日历天数（「每个日历日平均」「含无销售日」）：分母按字面取日历天数，即 D29 的日历日均口径。"
    sql: "SELECT sum(SalesAmount) / uniqExact(DateKey) FROM FactOnlineSales WHERE ..."

  - id: A10
    topic: "「季节」用哪一套字段"
    rev: "复核"
    refs: ["conventions[4]", "datasets.DimDate.cautions"]
    rule: >-
      季节是日期维度上按大洲各一套的标签（E10）。一行所属的大洲按 A04，随实际选用的事实表定：
      用 FactOnlineSales 且没触发约定 2 → 客户所在大洲；其余（用 FactSales 等无客户键的表，或触发约定 2）→ 门店所在大洲。
      问题点名大洲 → 先按该大洲筛选（DimGeography.ContinentName = 该大洲），再用该大洲的季节字段
      （北美 NorthAmericaSeason、欧洲 EuropeSeason、亚洲 AsiaSeason）分组。
      不点名 → 每一行用它所属大洲的季节字段，分组键是「大洲 × 季节」两列（ContinentName 一定在 GROUP BY 里），
      不把三套季节名合成一列。
      所属大洲取不到的行（地理连接为空）→ 季节为 NULL，作为未知组保留（R2）；当前数据下客户和门店都能连到城市级地理，没有这种行。
    sql: >-
      SELECT g.ContinentName, multiIf(g.ContinentName = 'North America', d.NorthAmericaSeason,
             g.ContinentName = 'Europe', d.EuropeSeason, g.ContinentName = 'Asia', d.AsiaSeason, NULL) AS Season,
             sum(f.SalesAmount) ... GROUP BY g.ContinentName, Season

  # ========== 口径 ==========
  - id: A11
    topic: "总成本（因而毛利）含线上退货行的成本"
    refs: ["metrics.总成本", "metrics.毛利", "datasets.FactOnlineSales.columns.TotalCost"]
    rule: >-
      总成本 = 筛选范围内全部行的 sum(TotalCost)，含线上的退货行（SalesQuantity = 0、TotalCost > 0）。
      毛利、毛利率照此计算。metrics.总成本 定义里的「销售行」指销售事实表的行。

  - id: A12
    topic: "订单数、客单价、客户数计入只有退货行的订单 / 客户"
    rev: "R4"
    refs: ["conventions[8]", "metrics.订单数", "metrics.客单价", "metrics.客户数"]
    rule: >-
      订单数 = 筛选范围内全部交易行的 uniqExact(SalesOrderNumber)；客户数 = 全部交易行的 uniqExact(CustomerKey)；
      都不排除只有退货行的订单或客户。客单价的分母同订单数。复购（D05、D06）、购买频次（D07）也按全部交易订单。
      只算含销售行（SalesQuantity > 0）订单的版本另有名字（D05b、D06c、D07b），不是默认。

  - id: A13
    topic: "「利润率」：毛利率还是产品利润率；产品利润率怎么上卷"
    rev: "复核"
    refs: ["synonyms: 毛利率 / 利润率", "conventions[9]", "metrics.产品利润率"]
    rule: >-
      先看显式请求：问题说「毛利率」→ 毛利率；说「产品利润率」「标价利润率」→ 产品利润率。显式请求优先于下面的默认。
      没有显式请求时：对象是产品本身（单个产品、产品清单、「利润率最高的产品」）且没有销售范围（时间、渠道、销售额）
      → 产品利润率（DimProduct 的标价与成本）；其余「利润率」→ 毛利率。
      产品利润率上卷到组（子类、品类、品牌）——这是 L1+ 新增约定——= Σ(UnitPrice − UnitCost) ÷ Σ UnitPrice，
      对组内 DimProduct 的每个产品计一次，不按销量加权，不限有没有销售、是否在售（问题限定时按限定）。
      分母为 0（销售额为 0 的毛利率、标价合计为 0 的产品利润率）→ NULL。
    sql: "SELECT ProductCategoryName, sum(p.UnitPrice - p.UnitCost) / nullIf(sum(p.UnitPrice), 0) FROM DimProduct p JOIN DimProductSubcategory s ON ... JOIN DimProductCategory c ON ... GROUP BY 1"

  - id: A14
    topic: "「收入」「成本」「利润」：销售事实还是战略计划科目"
    rev: "复核"
    refs: ["synonyms: 销售额 / 收入", "synonyms: 成本", "synonyms: 毛利 / 利润", "conventions[12]", "datasets.FactStrategyPlan.when_to_use"]
    rule: >-
      计划类的表（战略计划表、销售目标表）与销售事实之间只用一套业务对象优先规则，就是 A15 的顺序；本条、A15、D31 共用它，
      不另设优先级。
      (1) 问题含下列任一类词 → 按 A15 的顺序 (1)–(5) 定表：计划、预算、预测、目标、配额、达成率、完成率、执行率、
      科目名（E12）、损益、费用、税、税前 / 税后利润。落到战略计划表时：收入 = Sale Revenue，成本 = Cost of Goods Sold，
      利润按 D32 计算。
      (2) 没有这些词（对象是订单、产品、门店、客户的交易）→ 同义词表的落点（销售额、总成本、毛利）。
      「产品成本」「单位成本」→ DimProduct.UnitCost，不受本条影响。

  - id: A15
    topic: "「预算」：销售目标表还是战略计划表"
    rev: "复核"
    refs: ["synonyms: 计划 / 预算金额", "metrics.目标差异", "datasets.FactSalesQuota.when_to_use", "datasets.FactStrategyPlan.when_to_use"]
    rule: >-
      这是计划类问题唯一的选表顺序（A14 把含计划类词的问题都交到这里，D31 也用它）。按顺序取第一条满足的：
      (1) 有科目名（E12）或 费用、成本、税、损益、利润、执行率 → 战略计划表（FactStrategyPlan）。
      (2) 有 销售目标、目标、配额、达成率、完成率、目标差异、预算差异、目标销量、目标销售额，或「预算销售额」「销售额预算」
      → 销售目标表（FactSalesQuota）。
      (3) 有「收入」→ 战略计划表，科目 = Sale Revenue。
      (4) 只说「预算」，以上都没有 → 战略计划表，科目 = Sale Revenue。
      (5) 只说「计划」或「预测」（含「计划金额」「预测值」「预测销售额」），以上都没有 → 战略计划表，科目 = Sale Revenue。
      场景：说「预算」→ Budget；说「预测」→ Forecast；只说「计划」不定场景（E11：战略计划表取 Actual，销售目标表取 Budget）。
      例：「收入预算达成率」→ (2) 销售目标表；「营销费用预算」→ (1) 战略计划表；「预算收入」→ (3)；
      「预测销售额」→ (5) 战略计划表 Forecast；「目标销售额的预测误差」→ (2) 销售目标表。

  - id: A16
    topic: "「均价 / 单价」：成交均价还是产品标价"
    refs: ["synonyms: 平均单价", "synonyms: 标价", "conventions[9]"]
    rule: >-
      「标价、吊牌价、零售价、产品单价、最贵 / 最便宜的产品」→ DimProduct.UnitPrice；对一组产品求平均 =
      组内产品 UnitPrice 的简单平均（每个产品计一次）。
      其余「均价、单价、平均价格、成交价、平均售价」→ 成交均价 = 销售额 ÷ 销售数量。

  - id: A17
    topic: "折扣率的分母也只算打折交易"
    rev: "复核"
    refs: ["metrics.折扣率", "conventions[10]"]
    rule: >-
      折扣率 = 打折交易的折扣金额 ÷ 打折交易的折扣前原价，分子分母都只算 PromotionKey != 1 的行。
      范围内没有打折交易、或打折交易的折扣前原价合计为 0 → 折扣率为 NULL（G01），不当作 0。
    exceptions:
      - "问题明确问「折扣金额占全部销售（或全部原价）的比例」：分母按字面取全部交易。"

  - id: A18
    topic: "「促销效果」的默认汇总"
    rev: "复核、R5"
    refs: ["conventions[10]"]
    rule: >-
      问题只说「促销效果 / 各促销表现」、没有指定指标或分析方法时，默认给描述性汇总：按促销（A19，默认按促销键）分组的
      销售额、销售数量、折扣金额、折扣率（A17），排除 PromotionKey = 1。
      这四个指标只是描述性汇总的默认，不覆盖问题明确要的指标或分析：问题要求相关分析、增量（与无促销对比）、
      促销前后对比、单个指标排名等，按问题的要求算。
    exceptions:
      - "问题要与无折扣 / 无促销交易对比：PromotionKey = 1 作为对照组保留，单独成一组。"

  - id: A19
    topic: "按促销分组：默认按促销键（活动实例）"
    rev: "R5"
    refs: ["datasets.DimPromotion.description"]
    rule: >-
      「各促销活动」默认按 DimPromotion.PromotionKey 分组（28 个键，每个键是一期活动实例），结果同时列出 PromotionName。
      只有问题明确说「同名活动」「按活动名合并」「同一活动各年合计」时，才按 PromotionName 合并成活动家族（10 个名字，含 No Discount）。
      要分年份时，年份取交易的日期（DateKey 所在的年），不按促销键推年份——同一个促销键的交易可以跨两个日历年
      （实测：键 2–10 的交易落在 2007、2008 年，键 11–19 落在 2008、2009 年，键 20–28 落在 2009 年）。

  - id: A20
    topic: "按产品属性分组时未登记产品保留为未知组"
    rev: "R2"
    refs: ["data_quality.missing-products", "relationships: 事实表 → DimProduct"]
    rule: >-
      事实表一律左连接 DimProduct，不删除连不上的行。按产品属性（品类、子类、品牌、颜色、档位……）分组时，
      未登记产品（事实表有、DimProduct 没有的 ProductKey）合成一个属性值为 NULL 的「未知」组，保留在结果里，
      与其他组一样参加排序、排名和前 N。以产品为对象列出或排名时，未登记产品各自以 ProductKey 标识（名称为 NULL），同样保留。
      不按产品属性分组的合计（总销售额、各门店、各月……）含全部行。
      按产品属性筛选（「Contoso 品牌的销售额」）时，未登记产品不满足条件，自然不在结果里。

  - id: A21
    topic: "占比的分母范围"
    rev: "R2、复核"
    refs: ["metrics.销售额占比"]
    rule: >-
      先看显式总体：问题明确指定了分母的总体（「占全部销售额的比例」「占全渠道的比例」「占全公司的比例」）→
      分母就是那个总体，按它自己的字面范围计算；问题里的候选集筛选（「在售产品中」「Contoso 品牌中」）只作用于分子
      和候选对象，不自动施加到用户指定的总体分母上。显式总体优先于下面的默认。
      没有显式总体时：
      占比的分母 = 与分子相同的筛选条件下、去掉正在拆分的那个维度之后的合计，含未登记产品的行（A20）。
      所以按产品属性拆的各组（含未知组）占比之和是 100%。
      会改变分母的：问题里的维度筛选（时间、渠道、地区、品牌……）和候选集筛选（「在售产品中」「Contoso 品牌中」）——
      它们同时作用于分子和分母。
      不改变分母的：只展示前 N 名（「占比最高的前 5 个品类」），分母仍是全部组的合计，不是前 N 组之和。
      问题说「占某品类 / 某渠道的比例」时，分母就是那个品类 / 渠道。
    sql: "SELECT c.ProductCategoryName, sum(f.SalesAmount) / (SELECT sum(SalesAmount) FROM FactOnlineSales WHERE <同样的筛选>) ..."

  - id: A22
    topic: "某日、某期间的库存与期末库存、平均库存"
    rev: "复核"
    refs: ["conventions[11]", "metrics.快照日在手库存数量", "metrics.平均在手库存金额"]
    rule: >-
      期末库存（某日、某期间末）= 每个门店 × 产品取 DateKey ≤ 期末日的最近一次快照，再求和；
      期末日之前没有任何快照的组合不进结果，不补 0（D25）。「当前库存」是期末日 = 2009-12-31 的特例。
      「某期间的库存」没说「平均」→ 期末库存。
      「平均库存」= 期间内，组内实际出现过的快照日上，先按快照日汇总，再对这些快照日求平均；
      某个快照日上没有快照行的门店 × 产品组合不补 0。
      指定日不是快照日（快照都在周六）→ 按第一句取该日之前最近的快照。
    sql: >-
      SELECT sum(OnHandQuantity) FROM (SELECT StoreKey, ProductKey,
        argMax(OnHandQuantity, DateKey) AS OnHandQuantity FROM FactInventory
        WHERE DateKey <= toDate('2008-12-31') GROUP BY StoreKey, ProductKey)

  - id: A23
    topic: "库存周转率的时间窗口与范围"
    rev: "复核"
    refs: ["metrics.库存周转率"]
    rule: >-
      窗口 = 问题的时间窗口；没说时按 A06（全部数据）。
      分子 = 窗口内 FactSales 的 sum(TotalCost)；分母 = 平均库存金额（A22 的平均库存口径，金额 = sum(OnHandQuantity * UnitCost)），
      即组内在窗口里实际出现过的快照日上的库存金额，对这些快照日求平均。
      按门店、产品、品类拆时，分子分母都在同一组内各自汇总再相除；组内有库存、窗口内没有销售的 → 分子按 0 计，周转率为 0。
      分母为 0 或该组在窗口内没有快照 → 周转率为 NULL。

  - id: A24
    topic: "「缺货」与「零库存」；按产品问时先跨店汇总"
    rev: "复核"
    refs: ["synonyms: 缺货 / 低于安全库存 / 补货预警"]
    rule: >-
      「缺货、低于安全库存、补货预警」= 在手数量 < 安全库存；「断货、零库存、无库存」= 在手数量 = 0。
      都按当前库存（A22）判断，问题指定日期时按该日的期末库存。
      判定的对象跟着问题：
      按产品问（「哪些产品缺货」「零库存的产品」）→ 先把每个产品在各门店的最近快照跨店求和
      （在手合计、安全库存合计），再用合计比较；不先判门店 × 产品再归并到产品。
      按门店整体问（「哪些门店缺货」「零库存的门店」）→ 整店汇总：先把每个门店内各产品的最近快照求和
      （在手合计、安全库存合计），再用合计比较，与按产品的做法对称。
      问门店内的组合计数（「各门店有多少个产品缺货」「缺货的门店产品组合」「缺货率」）→ 在门店 × 产品组合上逐个判定再计数
      （D26、D27）。整店汇总的判定与组合计数分开算。两者的关系：整店在手合计低于安全库存合计
      ⇒ 店内至少有一个组合低于安全库存；反向不成立（整店不缺货时，店内仍可以有缺货组合）。按产品跨店汇总同理。

  - id: A25
    topic: "L1 / L1+ 不使用宽表视图"
    refs: ["datasets.FactInventory.when_to_use", "data_quality.inventory-weekly"]
    rule: >-
      当前库存直接从 FactInventory 按约定 11 / A22 计算。不引用 dwd 库的任何视图
      （FactInventory 的 when_to_use 提到的 wide_current_inventory 不在本单元的上下文里）。

  - id: A26
    topic: "目标达成率按渠道 / 门店 / 产品 / 时间拆"
    rev: "R2、复核"
    refs: ["conventions[12]", "metrics.目标达成率"]
    rule: >-
      分子永远是 FactSales.SalesAmount，分母是 FactSalesQuota 的 Budget 场景 SalesAmountQuota。
      两边各自按问题的展示粒度（渠道、门店、产品或产品属性、月 / 季 / 年）汇总，再按展示粒度的键做全外连接对齐；
      不先按月把明细连起来再汇总（那样会丢掉没有销售的目标）。
      按渠道拆：分子按 FactSales.channelKey、分母按 FactSalesQuota.ChannelKey。
      按产品属性拆：两边都左连接 DimProduct，未登记产品合成未知组保留（A20）。
      未知组的连接：属性值为 NULL 时普通等值连接对不上，双方的未知组会变成两行。两边先把连接键里的 NULL 统一成同一个值
      （ifNull(属性, '<未知>')），或用 NULL 安全的比较（isNotDistinctFrom），再全外连接；展示的键取两边键的 coalesce，
      未知组在结果里只有一行，展示时属性仍为 NULL（或标为未知）。
      时间：两边都按月归入展示的期（销售用 toStartOfMonth(DateKey)，目标的 DateKey 本身是月初）；窗口按问题，没说按 A06。
      某组有目标没销售 → 分子按 0；有销售没目标或目标为 0 → 达成率 NULL。不是各月达成率求平均。

  # ========== 客户 ==========
  - id: A27
    topic: "客户分层的参照日、客户集合与分母"
    rev: "复核"
    refs: ["conventions[13]", "metrics.客户最近购买月数"]
    rule: >-
      参照日：问题指定了截止日（「2008 年底的活跃客户」）→ 用那一天替换 2009-12-31，只看该日及以前的行；没指定 → 2009-12-31。
      筛选：客户属性（性别、学历、职业、客户所在地……）筛客户；交易属性（产品、品类、促销、线上店）筛计算末购日所用的行。
      客户集合 = 满足客户属性、且在参照日及以前至少有一行满足交易筛选的客户（含只有退货的行）。
      交易筛选后没有末购日的客户（从没买过该品类等）不进客户集合：不算活跃、不算流失，也不进任何分母。
      活跃、有流失风险、已流失按 D02 的末购日分层，三层互斥且覆盖客户集合；活跃率等比率的分母就是客户集合（D09）。
      历史参照日的客户集合同样只含当时已有匹配购买的客户，参照日之后才首购的客户不在其中。
      问题明确问「没买过」的客户时，单独算：满足客户属性的 DimCustomer 客户中、参照日及以前没有匹配行的客户，状态叫「未购买」，不并入三层。
      月数 = dateDiff('month', 末购日, 参照日)。

  - id: A28
    topic: "新客：年窗口的读法、只用全局首购"
    rev: "复核"
    refs: ["conventions[14]", "metrics.新客数", "metrics.新客销售额"]
    rule: >-
      截止日 = 问题时间窗口的最后一天（「2009 年的新客」截止日 = 2009-12-31）；新客 = 全局首购日（D01）落在
      [截止日 − 89 天, 截止日] 的客户。按约定 14 原文，不改成「首购在该年内」。
      新客只用全局首购：问题里的普通筛选（品类、促销、线上店、客户属性）不重新定义首购——客户属性筛客户，
      交易筛选只作用于新客销售额的行。
      新客销售额 = 这些客户在问题时间窗口内、满足交易筛选的销售额；问题没说窗口时，截止日取 2009-12-31，
      销售额取这些客户截至 2009-12-31 的全部销售额。

  - id: A29
    topic: "同店：对比年份、有销售的含义、门店范围"
    rev: "R8、R1"
    refs: ["conventions[15]", "metrics.同店销售额"]
    rule: >-
      同店 = 两个对比年份都有销售的门店（约定 15 原文，按年份判定，不改成按对比期）。
      对比年份 = 本期与对比期（A08）各自所在的日历年；按季、按月比较时也看这两个整年（2009 Q4 对 2008 Q4 → 看 2009 年与 2008 年）。
      「有销售」= 该门店在那一年的 FactSales 里至少有一行（任何产品、任何渠道行，含销售数量为 0 的行），
      按门店的全部产品判定，不随问题的商品筛选变化；判定出同店之后，再按问题的商品筛选计算这些门店的销售额。
      门店范围按 A01：默认全部 306 家，说「实体店」才只算 299 家。实测 2008、2009 两年都有销售的门店 301 家。

  # ========== 门店属性类比率 ==========
  - id: A30
    topic: "坪效、门店人均销售额"
    rev: "R1、复核"
    refs: ["metrics.坪效", "metrics.门店人均销售额", "datasets.DimStore.description"]
    rule: >-
      门店范围按 A01（默认 306 家，说「实体店」只算 299 家）；数据里 7 家虚拟门店也有营业面积和员工数，照常计入。
      进入分子和分母的门店 = 范围内、窗口内在 FactSales 有至少一行的门店；窗口内没有销售行的门店既不进分子，
      它的面积、员工数也不进分母。
      面积（SellingAreaSize）、员工数（EmployeeCount）每家门店计一次，不在连接事实表之后求和。
      一组门店的坪效 = 组内销售额合计 ÷ 组内面积合计（不是各店坪效的平均）；门店人均销售额同理。
      面积合计或员工数合计为 0 或 NULL → 结果 NULL（当前数据没有 0 或 NULL 的面积、员工数）。不剔除离群值（A36）。
    sql: >-
      SELECT sum(s.amt) / nullIf(sum(st.SellingAreaSize), 0) FROM (SELECT StoreKey, sum(SalesAmount) AS amt
        FROM FactSales WHERE <窗口> GROUP BY StoreKey) s JOIN DimStore st ON s.StoreKey = st.StoreKey

  - id: A31
    topic: "门店数、产品数、在售产品"
    rev: "R1、复核"
    refs: ["metrics.门店数", "metrics.产品数", "datasets.DimProduct.columns.Status", "datasets.DimStore.columns.Status"]
    rule: >-
      「在售产品」= DimProduct.Status = 'On'（1,938 个）；「停售产品」= Status = 'Off'。
      「有销售的 / 卖出的产品数」= 范围内销售事实的 uniqExact(ProductKey)。
      「有多少家门店」没有销售范围 → DimStore 的行数，门店范围按 A01（306 家；说「实体店」299 家），不分营业状态；
      说「营业中」再加 Status = 'On'。这类主数据计数不按事实区间截断（A06）。
      有销售范围（「2009 年有销售的门店」）→ 销售事实的 uniqExact(StoreKey)，门店范围仍按 A01。

  # ========== 计划、科目与运维 ==========
  - id: A32
    topic: "战略计划按地理上卷"
    refs: ["relationships: FactStrategyPlan.EntityKey → DimEntity.EntityKey", "datasets.DimEntity"]
    rule: >-
      按州、国家、大洲看战略计划 → FactStrategyPlan.EntityKey → DimStore.EntityKey，再经
      DimStore.GeographyKey → DimGeography（门店所在地，与 A04 的全渠道销售同一套地理名字）。
    exceptions:
      - "问题说「实体」「组织」「组织树」：沿 DimEntity 的 ParentEntityKey 上卷（H05）。"

  - id: A33
    topic: "科目树与科目合计"
    rev: "R9"
    refs: ["datasets.DimAccount", "datasets.FactStrategyPlan.cautions"]
    rule: >-
      科目树见 H07。战略计划表只有 17 个叶子科目的行（4、5、7–12、15–23），父科目（1、2、3、6、13、14、24）没有任何行；
      全部行的 Amount 都是正数（收入、费用、税都以正数记）。
      收入类、费用类的父科目（2 Income、3 Expense、6 SG&A、13 Marketing Cost、14 Holiday Ad Cost）= 该科目在 H07 中
      全部叶子的 Amount 正向相加；问的是叶子科目就取它本身。
      利润类科目（24 税前利润、1 税后利润）是显式减法，不是子树正向相加，按 D32 计算。
      去重：每个叶子在一次合计里只计一次；不把父科目和它的叶子一起加（计划表也没有父科目的行）。
      不按 AccountType 求和（AccountType = 'Income' 的 4 个科目 1、2、4、24 里含两个利润科目）。
    sql: "营销费用：WHERE AccountKey IN (15, 16, 17, 18, 20, 21, 22, 23)"

  - id: A34
    topic: "「IT 成本」「设备购置费」「维护费」"
    refs: ["synonyms: IT 成本 / 设备成本 / 运维成本", "datasets.FactITMachine.columns.CostType", "datasets.DimAccount"]
    rule: >-
      「IT 成本、设备成本、运维成本」= FactITMachine 全部成本类型的 sum(CostAmount)。
      「设备购置费、购置成本」= CostType = 'Equipment Costs'；「年度维护费、维护费」= CostType = 'Annual Maintenance Cost'。
    exceptions:
      - "带计划类语境（A14）的「IT 成本」→ 战略计划表的科目 IT Cost（AccountKey = 8）。"

  - id: A35
    topic: "故障归属门店"
    refs: ["datasets.FactITSLA.columns.StoreKey", "relationships: FactITSLA → DimStore / DimMachine", "datasets.DimMachine.columns.StoreKey"]
    rule: "故障按门店分时用 FactITSLA.StoreKey，不经 DimMachine.StoreKey。"

  # ========== 数据处理 ==========
  - id: A36
    topic: "离群值与脏枚举"
    rev: "R3"
    refs: ["data_quality.outlier-values", "data_quality.dirty-enum-values", "datasets.DimProduct.columns.ColorName"]
    rule: >-
      平均值一律是全部行的算术平均，不剔除离群值、不改用中位数；问题要中位数时才用中位数。
      颜色等文本属性：分组按原值，大小写不同的取值是不同的组（Blue 与 blue 各成一组）；
      筛选不区分大小写（「蓝色」= lower(ColorName) = 'blue'，Blue 与 blue 都选中，E07）。
      Silver Grey 是独立的取值，不并入 Silver 或 Grey。其余脏取值（部门名、促销名的拼写）原样保留，不合并。

  - id: A37
    topic: "「每周」的划分"
    refs: ["datasets.DimDate.columns.CalendarWeekLabel"]
    rule: "按周分组用 DimDate.CalendarYear + DimDate.CalendarWeekLabel，不用数据库的周函数。"

  - id: A38
    topic: "门店经理以上员工的业绩"
    rev: "R10"
    refs: ["datasets.DimEmployee.description"]
    rule: >-
      门店经理的业绩 = DimStore.EmployeeKey 等于他的那些门店的全渠道销售额。
      州经理、大区经理、销售总监 = 沿 ParentEmployeeKey 向下找到的全部门店经理所管门店的合计（员工树见 H06）。
      向下展开时以 18 为根、不走 18 的 ParentEmployeeKey（数据里 18 与 1 互为上级，H06）；遇到已经访问过的员工即停，
      每家门店只计一次。

  - id: A39
    topic: "「区域 / 大区」作地理词时指大洲"
    rev: "复核"
    refs: ["synonyms: 国家 / 地区"]
    rule: >-
      「区域、大区」作地理词用时（「各区域销售额」「亚洲区域」「按大区分」）= 大洲（DimGeography.ContinentName）；
      「地区」按同义词表 = 国家 / 地区（RegionCountryName）。
      不适用于：职级（「大区经理」「区域经理」按 E17 先解析成 Title，不是地理筛选）；组织（「实体」「组织」里的大区按
      DimEntity 的集团级实体，A32、H05）。本条只定地理词的落点，不覆盖这两种用法。

  # ========== 第 3 步核数据时发现的 L1 事实错误 ==========
  - id: A40
    topic: "子类 Projectors & Screens 属于 Computers（L1 事实错误）"
    rev: "复核"
    refs: ["datasets.DimProductSubcategory.columns.ProductSubcategoryName"]
    rule: >-
      L1 把 Projectors & Screens 的释义写成「投影与幕布（TV and Video）」，数据里它挂在 Computers 品类下
      （ProductSubcategoryKey = 19，103 个产品）。这是 L1 的事实错误；L1 已冻结、不改，L1+ 按数据写：
      按品类分组时它属于 Computers，即照 DimProductSubcategory.ProductCategoryKey 连接，不按 L1 释义里的括注。

  - id: A41
    topic: "科目树顶层的父子环：以 1 为根断环"
    rev: "R9"
    refs: ["datasets.DimAccount"]
    rule: >-
      DimAccount 里 Profit and Loss after tax（1）的 ParentAccountKey 是 24，Profit and Loss before tax（24）的是 1，构成环。
      断环：以 1 为根，忽略 1 的 ParentAccountKey；其余科目的父子照数据。于是 1 下挂 24 与 19（税），24 下挂 2（收入）与 3（费用）。
      沿 ParentAccountKey 向上递归时到 1 停止；向下展开时遇到已经访问过的科目即停。合计规则见 A33、D32。

# ---------------------------------------------------------------------------
# 二、派生概念：L1 没有定义、常规经营分析会用到的概念（用户 2026-10-23 审定清单）。
# 「购买」与约定 13、14 一致：客户在 FactOnlineSales 里的任何一行，含只有退货的行，除非条目另写。
# 「正销量」版本只算含销售行（SalesQuantity > 0）的订单，另起名字，不是默认（R4）。
# ---------------------------------------------------------------------------
concepts:

  # ========== 客户 ==========
  - id: D01
    name: "首购日（全局首购）"
    rev: "复核"
    aliases: ["首次购买日", "首单日期", "全局首购日"]
    definition: >-
      全局首购日 = 客户在 FactOnlineSales 里全部行（不加任何筛选）的最小 DateKey（与约定 14 相同）。
      新客（A28）、首购队列（D03）只用全局首购日。
    sql: "SELECT CustomerKey, min(DateKey) AS FirstPurchaseDate FROM FactOnlineSales GROUP BY CustomerKey"
    applies_when: "任何用到「首次购买」「首购」而没有点名购买对象的问题。"
    exceptions:
      - "范围首购日：问题明确问「首次购买某品类 / 某产品 / 某促销」的日期时，只在该范围的行里取最小日期。它只回答这一类问题，不用来判定新客、不用来建队列；普通筛选（「某品类的新客」）不触发范围首购。"

  - id: D02
    name: "末购日"
    rev: "复核"
    aliases: ["最近一次购买日", "最后购买日"]
    definition: >-
      客户在参照日及以前、满足问题交易筛选（A27：产品、品类、促销、线上店等）的 FactOnlineSales 行的最大 DateKey；
      问题没有交易筛选时就是全部行。参照日按 A27，默认 2009-12-31。
    sql: "SELECT CustomerKey, max(DateKey) AS LastPurchaseDate FROM FactOnlineSales WHERE DateKey <= toDate('2009-12-31') AND <交易筛选> GROUP BY CustomerKey"

  - id: D03
    name: "首购队列"
    rev: "复核"
    aliases: ["客户队列", "cohort", "同期群"]
    definition: >-
      客户按全局首购日（D01）所在的期归入一个队列；期的粒度按问题（月、季、年），没说按月。
      队列规模 = 该队列的客户数。问题的交易筛选不改变客户的队列归属。
    sql: "SELECT toStartOfMonth(FirstPurchaseDate) AS Cohort, count() AS CohortSize FROM (<D01>) GROUP BY Cohort"

  - id: D04
    name: "队列留存（三个口径）"
    rev: "复核"
    aliases: ["留存率", "cohort 留存"]
    definition: >-
      期的长度与队列粒度相同；第 0 期是首购期本身。「有购买」= 该客户在那一期内有任何一行。三个口径分别命名：
      第 k 期留存率（「留存率」默认指它）= 第 k 期有购买的队列客户数 ÷ 队列规模；
      连续留存率 = 第 1 至第 k 期每一期都有购买的队列客户数 ÷ 队列规模；
      任意后续期回购率 = 第 1 期至观察截止（2009-12-31 所在期）之间任一期有购买的队列客户数 ÷ 队列规模。
      观察截止日 = 问题明确给出的截止日，没给 → 2009-12-31；只用截止日及以前的行。
      先排除首购期在截止日所在期之后的队列（截止日之后才首购的客户不进任何队列），再构造期骨架，避免出现负的期差。
      期骨架：每个队列列出第 0 期到截止日所在期的每一个 k，再左连接各期的购买客户数——
      已观察到、但没有队列客户购买的期，留存率是 0（不是缺行，也不是 NULL）；
      观察期不足：第 k 期的结束日晚于截止日（该期不完整或还没到）→ 该队列的第 k 期留存率、连续留存率为 NULL，不按 0 计。
      任意后续期回购率只看截止日及以前已观察到的期。
    sql: >-
      WITH cust AS (SELECT CustomerKey, toStartOfMonth(min(DateKey)) AS Cohort FROM FactOnlineSales GROUP BY CustomerKey),
           sz AS (SELECT Cohort, count() AS CohortSize FROM cust WHERE Cohort <= toStartOfMonth(toDate('2009-12-31')) GROUP BY Cohort),
           skel AS (SELECT Cohort, CohortSize,
                    toInt64(arrayJoin(range(0, toUInt32(dateDiff('month', Cohort, toDate('2009-12-31'))) + 1))) AS k FROM sz),
           act AS (SELECT c.Cohort AS Cohort, toInt64(dateDiff('month', c.Cohort, toStartOfMonth(f.DateKey))) AS k,
                   uniqExact(f.CustomerKey) AS n
                   FROM FactOnlineSales f JOIN cust c ON f.CustomerKey = c.CustomerKey
                   WHERE f.DateKey <= toDate('2009-12-31') GROUP BY Cohort, k)
      SELECT s.Cohort, s.k,
             if(addMonths(s.Cohort, s.k + 1) - 1 > toDate('2009-12-31'), NULL, coalesce(a.n, 0) / s.CohortSize) AS RetentionRate
      FROM skel s LEFT JOIN act a ON s.Cohort = a.Cohort AND s.k = a.k
    exceptions: ["本库 18,869 个客户中 18,868 个的首购在 2007 年、1 个在 2009 年，按月以外的粒度做队列几乎只有一个队列；仍按定义计算。"]

  - id: D05
    name: "复购客户"
    rev: "R4"
    aliases: ["回头客", "重复购买客户"]
    definition: >-
      窗口内有 ≥ 2 个不同订单号的客户，按全部交易行计（含只有退货行的订单，与 A12 一致）。窗口按问题，没说按 A06。
    sql: >-
      SELECT CustomerKey FROM FactOnlineSales WHERE <窗口>
      GROUP BY CustomerKey HAVING uniqExact(SalesOrderNumber) >= 2

  - id: D05b
    name: "正销量复购客户"
    rev: "R4"
    aliases: ["正销量回头客"]
    definition: >-
      窗口内有 ≥ 2 个含销售行（SalesQuantity > 0）的不同订单号的客户。问题明确说只算有实际购买（不算退货单）时才用。
    sql: >-
      SELECT CustomerKey FROM FactOnlineSales WHERE SalesQuantity > 0 AND <窗口>
      GROUP BY CustomerKey HAVING uniqExact(SalesOrderNumber) >= 2

  - id: D06
    name: "复购率（窗口内两单率）"
    rev: "R4"
    aliases: ["复购率", "重复购买率", "两单率"]
    definition: >-
      窗口内复购客户数（D05）÷ 窗口内至少有 1 个订单的客户数，都按全部交易行。窗口按问题，没说按 A06。
    sql: >-
      SELECT countIf(n >= 2) / count() FROM (SELECT CustomerKey, uniqExact(SalesOrderNumber) AS n
        FROM FactOnlineSales WHERE <窗口> GROUP BY CustomerKey)

  - id: D06b
    name: "首购后 N 天回购率"
    rev: "R4、复核"
    aliases: ["回购率", "N 天回购率"]
    definition: >-
      观察截止日 = 问题明确给出的截止日，没给 → 2009-12-31。
      分母 = 全局首购日（D01）F 落在问题窗口内、且 F + N ≤ 观察截止日（观察期足够）的客户。
      分子 = 其中有一行同时满足：DateKey 在 (F, F + N] 内，且 SalesOrderNumber 不是该客户首购日的任何一个订单号。
      首购日当天的其他订单不算回购。当前数据下每个订单号只有一个日期（实测 1,674,320 个订单号无一跨日），
      所以首购日之后的行必然是不同的订单号；条件仍按订单号写明，不依赖这一点。
      N 按问题；问题说「回购率」没给 N → N = 90。按全部交易行（含只有退货的订单）。
      筛选的作用范围：F 永远是全局首购日，不受交易筛选影响（D01）；问题的交易筛选（品类、产品、促销、线上店）
      只作用于分子里的回购行（「回购了某品类」）；客户属性筛选（性别、所在地……）作用于分母的客户。
      与 D06 是两个不同的指标：D06 不看首购，只看窗口内是否有两单。
    sql: >-
      WITH c AS (SELECT CustomerKey, min(DateKey) AS F FROM FactOnlineSales GROUP BY CustomerKey
                 HAVING F BETWEEN <窗口起> AND <窗口止> AND F + 90 <= toDate('2009-12-31')),
           fo AS (SELECT f.CustomerKey AS CustomerKey, groupUniqArray(f.SalesOrderNumber) AS FirstOrders
                  FROM FactOnlineSales f JOIN c ON f.CustomerKey = c.CustomerKey AND f.DateKey = c.F GROUP BY f.CustomerKey),
           r AS (SELECT DISTINCT f.CustomerKey AS CustomerKey FROM FactOnlineSales f
                 JOIN c ON f.CustomerKey = c.CustomerKey JOIN fo ON f.CustomerKey = fo.CustomerKey
                 WHERE f.DateKey > c.F AND f.DateKey <= c.F + 90 AND NOT has(fo.FirstOrders, f.SalesOrderNumber) AND <交易筛选>)
      SELECT countIf(CustomerKey IN (SELECT CustomerKey FROM r)) / nullIf(count(), 0) FROM c

  - id: D06c
    name: "正销量复购率"
    rev: "R4"
    definition: "D05b 的客户数 ÷ 窗口内至少有 1 个含销售行订单的客户数，只看 SalesQuantity > 0 的行。只在问题明确要求时用。"

  - id: D07
    name: "购买频次"
    rev: "R4"
    aliases: ["购买次数", "下单次数"]
    definition: "每个客户窗口内的订单数（uniqExact(SalesOrderNumber)，全部交易行，A12）。对客户求平均即 L1 的「客均订单数」。"

  - id: D07b
    name: "正销量购买次数"
    rev: "R4"
    definition: "每个客户窗口内含销售行（SalesQuantity > 0）的订单数。只在问题明确要求时用。"

  - id: D08
    name: "客户累计消费（终身累计、期间累计）"
    rev: "复核"
    aliases: ["客户终身价值", "累计消费额", "LTV"]
    definition: >-
      两个口径分别命名：
      终身累计消费 = 客户截至截止日（默认 2009-12-31）的全部销售额 sum(SalesAmount)，只受截止日限制，不受起始日限制；
      「终身价值」「LTV」「累计消费」不带起始时间时指它。
      期间累计消费 = 客户在问题给出的 [起始日, 截止日] 内的销售额合计；问题给了起止（「2008 年的累计消费」）时指它。
      排名按 D18。

  - id: D09
    name: "客户活跃率 / 流失率 / 流失风险率"
    rev: "复核"
    aliases: ["活跃率", "流失率"]
    definition: >-
      活跃（或有流失风险、已流失）客户数 ÷ 客户集合的客户数。客户集合、参照日、筛选与「交易筛选后无末购日」的客户的处理
      全部按 A27：分母只含参照日及以前有匹配购买的客户，三层互斥且覆盖客户集合，三个率之和为 100%。
      客户集合为空（没有任何客户满足筛选）→ 三个率都为 NULL（G01），不当作 0。

  - id: D10
    name: "客户年龄与年龄段"
    rev: "复核"
    aliases: ["年龄", "年龄段", "年龄层"]
    definition: >-
      年龄 = 2009 − 出生年（toYear(toDate(BirthDate))），以 2009-12-31 为今天，任何生日都已过。
      默认年龄段（用户 2026-10-23 审定）：30 岁以下、30–39、40–49、50–59、60 岁及以上。
      问题自己给了分段（「按 25 岁一档」「35 岁以上和以下」）时按问题的分段，默认分段不覆盖它。
    sql: >-
      multiIf(2009 - toYear(toDate(BirthDate)) < 30, '30 岁以下',
              2009 - toYear(toDate(BirthDate)) < 40, '30–39',
              2009 - toYear(toDate(BirthDate)) < 50, '40–49',
              2009 - toYear(toDate(BirthDate)) < 60, '50–59', '60 岁及以上') AS AgeBand

  - id: D11
    name: "收入档"
    rev: "复核"
    aliases: ["收入水平", "收入段"]
    definition: >-
      按 DimCustomer.YearlyIncome 分四档（用户 2026-10-23 审定），每档左闭右开：
      [0, 40000)、[40000, 80000)、[80000, 130000)、[130000, +∞)。10,000,000 那一档（385 人）落在最高档。
      问题自己给了分档时按问题的分档。
    sql: "multiIf(YearlyIncome < 40000, '[0, 40000)', YearlyIncome < 80000, '[40000, 80000)', YearlyIncome < 130000, '[80000, 130000)', '[130000, +∞)')"

  # ========== 销售与时间 ==========
  - id: D12
    name: "月均销售额"
    rev: "复核"
    aliases: ["每月平均销售额"]
    definition: >-
      默认：先按月汇总销售额，再对范围内有交易的月数求平均（约定 4、A09 的月版本）。选表按 A03。
      问题明确要求按日历月（「含无销售的月份」「按日历月补零」）时，没有交易的月按 0 计，分母 = 范围内的日历月数，不套用有交易月的默认。
    sql: "SELECT avg(m) FROM (SELECT toStartOfMonth(DateKey) AS mon, sum(SalesAmount) AS m FROM FactOnlineSales WHERE ... GROUP BY mon)"

  - id: D13
    name: "年初至今累计"
    aliases: ["YTD", "本年累计", "截至某月累计"]
    definition: "期末日所在年的 1 月 1 日到期末日的合计。没说期末日 → 2009-12-31，即 2009 全年。"

  - id: D14
    name: "增长额与减少额"
    rev: "复核"
    aliases: ["同比增加多少", "环比增加多少", "同比减少多少"]
    definition: >-
      增长额（同比 / 环比增长额）= 本期 − 对比期，带符号：下降时是负数。本期与对比期按 A08。
      问题问「减少了多少」「下降了多少」时报减少额 = 对比期 − 本期，以正数表示下降；若实际是上升，减少额为负数，照实报出。

  - id: D15
    name: "年复合增长率"
    rev: "复核"
    aliases: ["CAGR", "复合增长率"]
    definition: >-
      CAGR = (末年指标值 ÷ 首年指标值)^(1 ÷ (末年 − 首年)) − 1，指标值是该指标在首年、末年各自的日历年全年值
      （两端年份的指标值之比，不用中间年份）。没说首尾年 → 2007 到 2009，指数 1/2。
      边界：首年值或末年值 ≤ 0、首年与末年相同、任一端年份没有数据 → NULL。
    sql: "if(v_first > 0 AND v_last > 0 AND y_last > y_first, pow(v_last / v_first, 1 / (y_last - y_first)) - 1, NULL)"

  - id: D16
    name: "连带率"
    aliases: ["每单件数", "UPT", "客单件数"]
    definition: "销售数量 ÷ 订单数，只在 FactOnlineSales 上算（只有线上有订单，A03）；订单数按 A12。"
    sql: "SELECT sum(SalesQuantity) / uniqExact(SalesOrderNumber) FROM FactOnlineSales WHERE ..."

  - id: D17
    name: "退货金额率"
    rev: "复核"
    aliases: ["金额退货率", "退款率"]
    definition: "退货金额 ÷ 销售额，同表同范围；销售额为 0 → NULL。「退货率」不是这个，仍按约定 7 = 退货数量 ÷ 销售数量。"

  - id: D18
    name: "排名与前 N 名"
    rev: "复核"
    aliases: ["排行", "TOP N", "前几名", "最高", "最低"]
    definition: >-
      前 N 指前 N 个对象，不是前 N 行明细：先把指标汇总到对象（每个对象一行），再排序取前 N。
      对象用唯一键标识（门店 StoreKey、产品 ProductKey、客户 CustomerKey……），同名的不同对象是不同的对象，不按名称合并；
      结果里同时列出键和名称。未登记产品等未知对象按 A20 保留。
      排序：按指标降序（「最低」「后 N 名」升序），用不经四舍五入的原值比较。
      第 N 名有并列时，可接受的策略之一是：依次按名称升序、键升序打破并列，结果恰好 N 个对象（下面的 sql 即此写法）；
      把与第 N 名原值相同的对象一并列出、并说明并列，也是可接受的。本条不把任何一种定为唯一的并列处理方式。
      「最高的」不带 N 时 N = 1。
      分组内前 N（「每个品类销量前 3 的产品」）：在每组内各自排序取前 N（row_number() OVER (PARTITION BY 组 ORDER BY ...)）。
      嵌套对象（「前 3 个品类里各自前 5 的产品」）：先按外层对象排名定出前 N 个外层对象，再在每个外层对象内对内层对象排名。
      排名的对象范围按 A01、A20。
    sql: "ORDER BY metric DESC, name ASC, key ASC LIMIT N"

  - id: D19
    name: "ABC 分类"
    rev: "R2、复核"
    aliases: ["帕累托分析", "ABC 分析", "二八分析"]
    definition: >-
      对象域：默认产品（问题可指定子类、品牌等），= 筛选范围内在销售事实里出现过的全部对象，每个对象按唯一键计一次；
      未登记产品各以 ProductKey 作为一个对象保留（R2，A20），按子类、品牌等属性做对象时未知组是一个对象。
      对象按销售额降序排列；累计占比 = 销售额 ≥ 本对象销售额的全部对象（含与它同额的对象）的销售额合计 ÷ 分母，
      所以同额的对象累计占比相同、同属一类。分母 = 对象域的销售额合计（= A21 的同筛选全部销售额）。
      A 类 = 累计占比 ≤ 80%；B 类 = 80% < 累计占比 ≤ 95%；C 类 = 其余（用户 2026-10-23 审定）。
      跨阈值：使累计占比第一次超过 80% 的那个对象（或同额组）归 B，不归 A；95% 同理归 C。选表按 A03。
      精度：销售额用原值汇总，不先四舍五入；「同额」= 汇总后的原值完全相等；累计占比用原值相除，
      直接与 0.8、0.95 比较，不先换算成四舍五入的百分数再比。
    sql: >-
      SELECT ProductKey, amt, sum(amt) OVER (ORDER BY amt DESC
        RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) / <分母> AS cum,
        multiIf(cum <= 0.8, 'A', cum <= 0.95, 'B', 'C') AS Class FROM (...)

  - id: D20
    name: "动销产品与动销率"
    rev: "复核"
    aliases: ["动销", "动销率", "有动销的产品"]
    definition: >-
      动销产品 = 在售产品（A31）中、窗口内销售数量 > 0 的产品；动销率 = 动销产品数 ÷ 在售产品数，在售产品数为 0 → NULL。
      分母 = 满足问题属性筛选（品类、子类、品牌……）的全部在售产品，含窗口内没有任何交易的产品：从 DimProduct 起表，
      左连接窗口内的销售，不从销售事实起表（那样会漏掉没有交易的在售产品）。窗口按问题，没说按 A06；选表按 A03。
    sql: >-
      SELECT countIf(q > 0) / nullIf(count(), 0) FROM (SELECT p.ProductKey, coalesce(s.q, 0) AS q FROM DimProduct p
        LEFT JOIN (SELECT ProductKey, sum(SalesQuantity) AS q FROM FactOnlineSales WHERE <窗口> GROUP BY ProductKey) s
        ON p.ProductKey = s.ProductKey WHERE p.Status = 'On' AND <属性筛选>)

  - id: D21
    name: "滞销产品"
    rev: "复核"
    aliases: ["滞销", "不动销", "积压产品"]
    definition: >-
      在售（A31）、当前在手数量合计 > 0（A22，全部门店求和），且窗口内 FactSales 销售数量合计为 0 的产品；
      窗口内在 FactSales 没有任何交易行的产品按销售数量 0 处理，同样算滞销（左连接后 coalesce 为 0）。
      窗口没说 → 近 90 天 = [2009-10-03, 2009-12-31]（用户 2026-10-23 审定）。
      销售量用 FactSales（全渠道），因为库存在各类门店都有，与库存对照要用同一组门店（A03）。

  # ========== 门店 ==========
  - id: D22
    name: "新开门店"
    rev: "R1"
    aliases: ["新店", "新开店"]
    definition: >-
      门店（A01，默认 306 家）中 toDate(OpenDate) 落在问题期间内的门店；问题说「新开实体店」只看实体店。
      没说期间 → 2009 年（「今年」）。
    exceptions: ["新开门店不等于同店的反面；同店按 A29 判定。"]

  - id: D23
    name: "关店门店"
    aliases: ["已关店", "关闭的门店"]
    definition: >-
      DimStore.Status = 'Off' 的门店（12 家，全是实体店）。按关店时间筛选用 toDate(CloseDate)，
      并排除哨兵值 2090-12-31。

  - id: D24
    name: "单店日均销售额"
    rev: "R1"
    aliases: ["门店日均销售"]
    definition: "某门店（A01，含虚拟门店）窗口内 FactSales 销售额 ÷ 该店窗口内有交易行的天数（A09 的交易日日均）。"

  # ========== 库存 ==========
  - id: D25
    name: "期末库存"
    rev: "复核"
    aliases: ["月末库存", "年末库存", "期末在手"]
    definition: >-
      按 A22：每个门店 × 产品取期末日及以前最近一次快照，再求和；期末日按问题（「2008 年末」= 2008-12-31）。
      期末日之前没有任何快照的组合不进结果，不补 0。

  - id: D26
    name: "缺货率"
    rev: "复核"
    aliases: ["缺货占比", "低于安全库存比例"]
    definition: >-
      门店 × 产品组合口径：当前（或指定日）低于安全库存的组合数 ÷ 同一时点的组合数。
      分母只含该时点及以前实际有过快照的组合（A22 的「每个组合取最近一次快照」结果），不含从没有快照的组合；
      分母为空集 → NULL。按产品判定缺货见 A24，与本条分开。
    sql: >-
      SELECT countIf(oh < ss) / nullIf(count(), 0) FROM (SELECT StoreKey, ProductKey,
        argMax(OnHandQuantity, DateKey) AS oh, argMax(SafetyStockQuantity, DateKey) AS ss
        FROM FactInventory WHERE DateKey <= toDate('2009-12-31') GROUP BY StoreKey, ProductKey)

  - id: D27
    name: "零库存组合"
    rev: "复核"
    aliases: ["零库存的门店产品"]
    definition: >-
      当前（或指定日）在手数量 = 0 的门店 × 产品组合（A22、A24）。只用于以门店 × 产品组合为对象的问题；
      按产品问零库存时按 A24 先跨店汇总，本条不覆盖那个结果。

  - id: D28
    name: "库存周转天数"
    rev: "复核"
    aliases: ["周转天数", "DIO"]
    definition: >-
      窗口的日历天数 ÷ 库存周转率（A23，口径全部继承 A23）。窗口没说 → A06 的全部数据，日历天数 = 1,096。
      窗口天数含首尾两天。周转率为 0 或 NULL（不可算）→ 周转天数为 NULL。

  - id: D29
    name: "库存可售天数（渠道范围与日分母分别判断）"
    rev: "R6、R11、复核"
    aliases: ["可售天数", "库存覆盖天数"]
    definition: >-
      可售天数 = 某门店 × 产品（或其合计）的当前在手数量（A22）÷ 日均销量。
      日均销量 = 窗口内、同一组门店 × 产品的销售数量合计 ÷ 日分母；窗口 = 近 90 天 [2009-10-03, 2009-12-31]。
      渠道范围与日分母是两个独立的判断，各自只看问题里针对它的词，一个不带动另一个：
      渠道范围：默认线上 = FactOnlineSales（R11）；问题点名全渠道（「全渠道销量」「按全部门店的销量」）→ FactSales；
      问题明说线上 → FactOnlineSales。
      日分母：默认 = 该子集在窗口内有交易行的天数（A09 的交易日日均，R11）；问题点名日历天数
      （「按日历日均」「含无销售日」）→ 90（窗口的日历天数）。
      所以只点名「日历日均」时只换日分母、渠道仍是线上；问题明说线上时，不论日分母怎么取都不切到全渠道。
      命名：默认组合叫「交易日日均可售天数」；全渠道 + 日历天数叫「全渠道日历日均可售天数」；其余组合按两个判断的结果描述。
      日均销量为 0 或窗口内没有交易行 → 结果为 NULL（G01），不当作无穷大。
      当前数据下线上行只落在 199、306、307 三家门店（A02），所以渠道范围为线上时，其他门店 × 产品没有线上销量，结果为 NULL；
      照此报出，不自动改用全渠道。
    sql: >-
      默认（线上、交易日）：SELECT inv.oh / nullIf(s.q / nullIf(s.d, 0), 0) FROM (<A22 当前在手>) inv LEFT JOIN
        (SELECT StoreKey, ProductKey, sum(SalesQuantity) AS q, uniqExact(DateKey) AS d FROM FactOnlineSales
         WHERE DateKey BETWEEN toDate('2009-10-03') AND toDate('2009-12-31') GROUP BY StoreKey, ProductKey) s
        ON inv.StoreKey = s.StoreKey AND inv.ProductKey = s.ProductKey；
      点名全渠道时把 FactOnlineSales 换成 FactSales；点名日历天数时把 s.d 换成 90。

  # ========== 目标与计划 ==========
  - id: D30
    name: "预算执行率"
    rev: "复核"
    aliases: ["预算执行情况", "执行率"]
    definition: >-
      战略计划表同一科目、同一范围的 Actual 金额 ÷ Budget 金额，Budget 为 0 → NULL。没说科目 → Sale Revenue。
      利润类科目先按 D32 分别算出 Actual 与 Budget 的利润，再相除。「达成率、完成率」不是这个，按 A15 落在销售目标表。

  - id: D31
    name: "预测偏差、预测误差、预测准确度"
    rev: "R7、复核"
    aliases: ["预测偏差", "预测误差", "预测准确度"]
    definition: >-
      三个名字、三个口径（F = Forecast 金额，A = Actual 金额，同一表、同一范围，先在组内各自合计再代入）：
      预测偏差（带符号）= (F − A) ÷ |A|，正数表示预测偏高；
      预测误差（绝对值）= |F − A| ÷ |A|；
      预测准确度 = 1 − |F − A| ÷ |A|（可以为负）。
      分母用实际值的绝对值 |A|：计划表与销售目标表的金额全为正数，此时 |A| = A；利润类科目（D32）的实际值可能为负，
      用 |A| 保证偏差的符号仍表示偏高 / 偏低。A 为 0 → 三者都为 NULL。
      表：按 A15 的顺序定（与 A14 同一套规则，本条不另设优先级）；落到销售目标表用 SalesAmountQuota，
      落到战略计划表用 Amount，没说科目 → Sale Revenue，利润类科目先按 D32 分别算出 F 与 A。

  - id: D32
    name: "收入、费用、税、税前利润、税后利润（损益）"
    rev: "R9"
    aliases: ["损益", "利润总额", "净利润", "费用合计", "总费用"]
    definition: >-
      都在战略计划表上、同一场景（没说场景 → Actual）、同一范围内计算。计划表的 Amount 全是正数。
      收入 = Sale Revenue（4）的 Amount 之和；
      费用 = Expense（3）下的全部叶子的 Amount 正向相加：5、7、8、9、10、11、12、15、16、17、18、20、21、22、23；
      税 = Taxation（19）；
      税前利润（24）= 收入 − 费用；税后利润（1，净利润）= 税前利润 − 税。
      利润是显式减法的例外：不是把 24 或 1 子树下的叶子统一正向累加（那样会把费用和税加进利润）。
      每个叶子只计一次；战略计划表里没有父科目（1、2、3、24）的行，利润只能这样算出来，不能直接按科目名筛。
    sql: >-
      sumIf(Amount, AccountKey = 4)
        - sumIf(Amount, AccountKey IN (5,7,8,9,10,11,12,15,16,17,18,20,21,22,23)) AS ProfitBeforeTax

  - id: D33
    name: "费用率"
    rev: "复核"
    aliases: ["费用占收入比"]
    definition: "某费用科目（或其子树，A33）金额 ÷ Sale Revenue 金额，同一场景、同一范围；Sale Revenue 为 0 → NULL。"

# ---------------------------------------------------------------------------
# 三、实例别名：中文说法 → 数据里的取值。L1 在 values 的 meaning 里写了中文释义的，
# 这里反过来写成映射，并补上常用说法。每个说法只映到一个落点；
# 没有精确落点的说法写在 no_exact_mapping 里，不映到更大的对象。
# ---------------------------------------------------------------------------
aliases:

  - id: E01
    entity: "渠道"
    rev: "复核"
    column: "DimChannel.ChannelName（FactSales.channelKey）"
    note: >-
      只在渠道语境里用：说法带「渠道」二字，或问题在做渠道对比 / 各渠道拆分。
      以门店为对象的说法（「各门店」「某门店」「实体店」）不是渠道筛选：门店范围按 A01，不转成 channelKey 条件。
    map:
      - { terms: ["门店渠道", "实体店渠道", "线下渠道", "线下"], value: "Store", key: 1 }
