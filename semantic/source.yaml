          月份的英文名（`January` ~ `December`），不带年份，而且按字母排序不等于按月排序。
          要按月排序用 MonthNumber。
        values:
          - { value: "January", meaning: "1 月" }
          - { value: "February", meaning: "2 月" }
          - { value: "March", meaning: "3 月" }
          - { value: "April", meaning: "4 月" }
          - { value: "May", meaning: "5 月" }
          - { value: "June", meaning: "6 月" }
          - { value: "July", meaning: "7 月" }
          - { value: "August", meaning: "8 月" }
          - { value: "September", meaning: "9 月" }
          - { value: "October", meaning: "10 月" }
          - { value: "November", meaning: "11 月" }
          - { value: "December", meaning: "12 月" }
      - name: CalendarWeekLabel
        description: "周标签，形如 `Week 4`，53 个取值，不带年份。"
      - name: CalendarDayOfWeekLabel
        description: "星期几的英文名。"
        values:
          - { value: "Monday", meaning: "周一" }
          - { value: "Tuesday", meaning: "周二" }
          - { value: "Wednesday", meaning: "周三" }
          - { value: "Thursday", meaning: "周四" }
          - { value: "Friday", meaning: "周五" }
          - { value: "Saturday", meaning: "周六（库存快照全部落在这一天）" }
          - { value: "Sunday", meaning: "周日" }
      - name: FiscalYear
        description: "财年。与 CalendarYear 完全相同，本库没有财年差异。"
      - name: FiscalYearLabel
        description: "财年文字标签。财年与日历年完全相同，所以这一列只是 CalendarYearLabel 的另一种写法。"
        values:
          - { value: "FiscalYear 2005", meaning: "财年 2005，365 天" }
          - { value: "FiscalYear 2006", meaning: "财年 2006，365 天" }
          - { value: "FiscalYear 2007", meaning: "财年 2007，365 天" }
          - { value: "FiscalYear 2008", meaning: "财年 2008，366 天" }
          - { value: "FiscalYear 2009", meaning: "财年 2009，365 天" }
          - { value: "FiscalYear 2010", meaning: "财年 2010，365 天" }
          - { value: "FiscalYear 2011", meaning: "财年 2011，365 天" }
      - name: FiscalHalfYearLabel
        description: "财年半年标签。与 CalendarHalfYearLabel 逐行相同（财年等于日历年）。"
        values:
          - { value: "H1", meaning: "财年上半年，1,268 天" }
          - { value: "H2", meaning: "财年下半年，1,288 天" }
      - name: FiscalQuarterLabel
        description: "财年季度标签。与 CalendarQuarterLabel 逐行相同。不带年份，跨年分析要同时带上年。"
