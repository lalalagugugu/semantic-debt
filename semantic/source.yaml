  - name: DimStore
    title: "门店"
    kind: dimension
    rows: 306
    grain: "一行 = 一家门店（StoreKey 唯一）。"
    description: >-
      门店主数据。306 家里 299 家是实体店，另外 7 家是渠道用的虚拟门店：
      3 家线上店（StoreKey 199 / 306 / 307）、3 家经销店、1 家目录店。
      门店与渠道一一对应：StoreType 决定了它在 FactSales 里的 channelKey。
      只有实体店有营业面积和员工数这类属性。
    when_to_use: "按门店、门店类型、门店经理、门店所在地分析时（约定 2、约定 5 的门店分支）。"
    columns:
      - name: StoreKey
        description: "门店键。1 ~ 310，306 行（缺 4 个键）。"
        role: key
      - name: GeographyKey
        description: "门店所在城市。306 家门店落在 263 个城市，指向的 DimGeography 行全部是 City 级。只有问题明确说「门店所在地」时才走这条（约定 5）。"
      - name: StoreManager
        description: >-
          列名叫「门店经理」，**实际存的是员工号的字符串形式**（306 行全部等于
          EmployeeKey 的字符串），不是姓名。要门店经理的姓名，走
          EmployeeKey → DimEmployee 取 FirstName / LastName。
      - name: StoreType
        description: "门店类型。决定了这家店在 FactSales 里属于哪个渠道。"
        values:
          - { value: "Store", meaning: "实体自营门店，299 家（对应渠道 Store）" }
          - { value: "Online", meaning: "线上店，3 家（StoreKey 199 北美、306 欧洲、307 亚洲；对应渠道 Online，也是 FactOnlineSales 里唯一出现的三家）" }
          - { value: "Reseller", meaning: "经销店，3 家（对应渠道 Reseller）" }
          - { value: "Catalog", meaning: "目录店，1 家（对应渠道 Catalog）" }
      - name: StoreName
        description: "门店名，形如 `Contoso Seattle No.1 Store`，全表唯一。"
      - name: Status
        description: "门店状态。与 CloseDate 配合：Off 的 12 家都有真实关店日期，On 的 294 家关店日期都是哨兵值 2090-12-31。"
        values:
          - { value: "On", meaning: "营业中，294 家" }
          - { value: "Off", meaning: "已关店，12 家" }
      - name: OpenDate
        description: "开店日，字符串日期，165 个取值。"
      - name: CloseDate
        description: >-
          关店日，字符串日期，只有 8 个取值。294 家在营门店用的是**哨兵值** `2090-12-31`
          （表示未关店），不是真实日期；按关店日排序或取最大值会得到它。
          12 家已关店的是 2008 ~ 2009 年的真实日期。按关店日筛选时要先排掉哨兵值
          （或按 Status = Off 筛）。
        values:
          - { value: "2090-12-31", meaning: "哨兵值：**未关店**，294 家（不是真实日期）" }
          - { value: "2008-09-22", meaning: "真实关店日，1 家" }
          - { value: "2008-12-12", meaning: "真实关店日，1 家" }
          - { value: "2009-02-12", meaning: "真实关店日，1 家" }
          - { value: "2009-04-12", meaning: "真实关店日，1 家" }
          - { value: "2009-05-12", meaning: "真实关店日，2 家" }
          - { value: "2009-07-02", meaning: "真实关店日，1 家" }
          - { value: "2009-07-12", meaning: "真实关店日，5 家" }
      - name: EntityKey
        description: "对应的计划实体，与 DimEntity 一一对应（306 对 306）。战略计划表挂在这个键上，所以门店能和战略计划对起来。"
      - name: StorePhone
        description: "门店电话。"
      - name: StoreFax
        description: "门店传真。"
      - name: CloseReason
        description: "关店原因。"
        values:
          - { value: "Not Yet Closed", meaning: "未关店，294 家" }
          - { value: "Relocation", meaning: "搬迁，10 家" }
          - { value: "Store", meaning: "取值本身是脏数据（只写了 `Store`，看不出原因），2 家" }
      - name: EmployeeCount
        description: "门店员工数，7 ~ 325（325 是离群值，只有 1 家）。算人均销售额用这一列。"
        unit: "人"
      - name: SellingAreaSize
