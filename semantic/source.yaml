# 语义层源文件（L1）
#
# 这是本实验唯一的语义内容源：L1、L1.5W、L1.5S、L2、L0 全部由它派生（见 render/）。
# 结构参考 Open Semantic Interchange 的组织方式（datasets / columns / relationships /
# metrics），但不绑定任何查询语言。
#
# 写法约定（给后面读这个文件的人和脚本）：
#   - 一切描述用中文；物理名（表名、列名）原样照抄数据库，不翻译、不改大小写。
#     `FactSales.channelKey` 的首字母确实是小写，数据里就是这样。
#   - `technical: true` 的列是技术字段（代理键、行号、内部时间戳）。按档位定义，
#     L1 及以上的上下文不呈现它们；它们留在这里是因为 L0 要暴露技术字段，而且
#     关系的两端必须指得出来。渲染器负责过滤。
#   - `values` 只在「不同取值少于 50 个」的字符串列和码值列上出现，取值原文来自
#     semantic/profiling/out/columns.md，不是凭印象写的。
#   - 本文件里的每一条事实陈述（粒度、基数、取值、孤儿行、金额对账）都能在
#     semantic/profiling/out/ 的四份报告里找到对应的查询和输出。
#
# 冻结：G1 打 tag `semantic-v1` 之后本文件不得再改（AGENTS.md 硬规则 2）。

version: 1
name: retail
title: "零售经营分析语义层"
description: >-
  一家虚拟零售公司（Contoso）的经营数据仓库。卖消费电子与家电，自营门店加线上、
  目录和经销三个渠道，覆盖北美、欧洲、亚洲三个大洲。库里有销售、退货、折扣、库存、
  销售目标、战略计划和门店 IT 运维七类事实，外加一组共用维度。
  数据区间 2007-01-01 ~ 2009-12-31，金额一律美元。
database: retail
as_of_date: "2009-12-31"
currency: USD
grain_note: >-
  这个库里有两张口径不同的销售事实表（线上明细和全渠道汇总），选错表是最常见的错误。
  先看 conventions 的前两条，再看两张表各自的 when_to_use。

# ---------------------------------------------------------------------------
# 企业约定：把 semantic/conventions.md 的 15 条逐条结构化，并标注涉及的表和字段。
# 原文不得修改；这里只做结构化和落地到物理字段。
# ---------------------------------------------------------------------------
conventions:
  - id: 1
    group: "渠道与事实表"
    rule: "未说明渠道的「销售、订单、退货、折扣、营收」指线上渠道。"
    applies_to_datasets: [FactOnlineSales]
    applies_to_columns: [FactOnlineSales.SalesAmount, FactOnlineSales.SalesQuantity, FactOnlineSales.ReturnAmount, FactOnlineSales.DiscountAmount, FactOnlineSales.SalesOrderNumber]
    note: >-
      默认用 FactOnlineSales。它是订单行级明细，带客户和订单号，这两样全渠道表都没有。

  - id: 2
    group: "渠道与事实表"
    rule: >-
      以门店为对象的问题（各门店、门店经理、同店、渠道对比、全渠道）用全渠道销售。
      全渠道销售按天、门店、产品、促销汇总，没有订单号。
    applies_to_datasets: [FactSales]
    applies_to_columns: [FactSales.StoreKey, FactSales.channelKey, FactSales.DateKey, FactSales.ProductKey, FactSales.PromotionKey]
    note: >-
      实测粒度就是这四列（天 × 门店 × 产品 × 促销）唯一，渠道列是冗余的：每家门店只
      属于一个渠道。FactSales 确实没有订单号列，也没有客户列。

  - id: 3
    group: "时间"
    rule: "数据截至 2009-12-31，以这一天为「今天」：今年 = 2009 年，去年 = 2008 年，上季度 = 2009 年第四季度。"
    applies_to_datasets: [DimDate, FactSales, FactOnlineSales]
    applies_to_columns: [DimDate.DateKey, DimDate.CalendarYear, DimDate.CalendarQuarterLabel]
    note: >-
      两张销售表的 DateKey 上限都正好是 2009-12-31。其余事实表的上限更早：
      库存 2009-12-26、销售目标与战略计划 2009-12-01、汇率 2009-07-01、IT 成本 2009-01-01。
      日期维度本身覆盖 2005-01-01 ~ 2011-12-31，比事实宽，按日期维度取范围会带出没有销售的天。

  - id: 4
    group: "时间"
    rule: "比较不同类型的日子（节假日与平日、周末与工作日、季节）时用日均销售：先按天汇总，再对天数求平均。"
    applies_to_datasets: [DimDate]
    applies_to_columns: [DimDate.IsHoliday, DimDate.IsWorkDay, DimDate.EuropeSeason, DimDate.NorthAmericaSeason, DimDate.AsiaSeason]
    metrics: ["日均销售额"]
    note: >-
      数据里「节假日」和「周末」是同一个划分：IsHoliday = Yes 的 731 天恰好就是全部周六
      和周日，IsWorkDay = WeekEnd 也是同一批。所以这两种比较会得到同一个结果。
      另外「季节」有三套，按大洲分（EuropeSeason / NorthAmericaSeason / AsiaSeason），
      没有一套全局的季节字段。

  - id: 5
    group: "地理与币种"
    rule: "按国家、地区、大洲分析销售时，默认按客户所在地；只有明确说「门店所在地」才按门店。"
    applies_to_datasets: [DimGeography, DimCustomer, DimStore]
    applies_to_columns: [DimCustomer.GeographyKey, DimStore.GeographyKey, DimGeography.RegionCountryName, DimGeography.ContinentName, DimGeography.StateProvinceName, DimGeography.CityName]
    note: >-
      客户所在地只能从线上销售走（FactOnlineSales → DimCustomer → DimGeography），因为
      全渠道销售表没有客户列。所以「按国家看销售」这类问题落在线上销售上，这和约定 1
      的默认是一致的；一旦问题点明了门店（约定 2），就改走门店所在地。
      两条路都走到同一张 DimGeography，但从不同的 GeographyKey 进去，结果不同。

  - id: 6
    group: "地理与币种"
    rule: "金额一律为美元；线上销售已是美元，无需换算。"
    applies_to_datasets: [FactOnlineSales, FactSales, FactInventory, FactSalesQuota, FactStrategyPlan, DimCurrency]
    applies_to_columns: [FactOnlineSales.CurrencyKey, FactSales.CurrencyKey]
    note: >-
      五张带币种的事实表里 CurrencyKey 都只有一个取值 1 = USD，所以任何金额都不需要换算，
      汇率表（FactExchangeRate）在本库里用不上。

  - id: 7
    group: "口径与业务词"
    rule: >-
      销售额、营收、GMV = 销售金额（已扣折扣、未扣退货）；净销售额 = 销售金额 − 退货金额；
      毛利 = 销售金额 − 总成本；毛利率 = 毛利 ÷ 销售金额；退货率 = 退货数量 ÷ 销售数量。
    applies_to_columns: [FactOnlineSales.SalesAmount, FactOnlineSales.ReturnAmount, FactOnlineSales.TotalCost, FactOnlineSales.SalesQuantity, FactOnlineSales.ReturnQuantity, FactSales.SalesAmount, FactSales.ReturnAmount, FactSales.TotalCost, FactSales.SalesQuantity, FactSales.ReturnQuantity]
    metrics: ["销售额", "净销售额", "毛利", "毛利率", "退货率"]
    note: >-
      「已扣折扣」在数据上成立：全渠道销售的 3,406,089 行全部满足
      SalesAmount = UnitPrice × SalesQuantity − DiscountAmount。

  - id: 8
    group: "口径与业务词"
    rule: "订单 = 线上订单号；客单价（平均订单金额）= 销售额 ÷ 去重订单数。"
    applies_to_datasets: [FactOnlineSales]
    applies_to_columns: [FactOnlineSales.SalesOrderNumber]
    metrics: ["订单数", "客单价"]
    note: >-
      1,674,320 个订单号、12,627,608 个订单行，平均每单 7.5 行。一个订单号不跨天，
      但有 2,034 个订单号挂在多个客户上，所以订单数和客户数不能互相推算。

  - id: 9
    group: "口径与业务词"
    rule: "产品利润率、「最贵的产品」这类问题用产品表的标价和成本，不用成交价推算。"
    applies_to_datasets: [DimProduct]
    applies_to_columns: [DimProduct.UnitPrice, DimProduct.UnitCost]
    metrics: ["产品标价", "产品单位成本", "产品利润率"]
    note: >-
      DimProduct 的 UnitPrice / UnitCost 全部非空且为正，没有标价低于成本的行。
      事实表里也有同名的 UnitPrice / UnitCost 列，那是成交价，按本条不用于这类问题。

  - id: 10
    group: "口径与业务词"
    rule: "促销键 1 表示「无折扣」；问折扣金额或促销效果时不计无折扣交易。"
    applies_to_datasets: [DimPromotion]
    applies_to_columns: [DimPromotion.PromotionKey, FactOnlineSales.PromotionKey, FactSales.PromotionKey]
    metrics: ["折扣金额", "折扣率", "打折销售额占比"]
    note: >-
      PromotionKey = 1 的那行是 PromotionName = No Discount、DiscountPercent = 0。
      按本条筛选的依据是促销键，不是折扣金额：在线上销售里两者等价（没有一行不一致），
      但在全渠道销售里有 446,677 行挂了季节性促销而 DiscountAmount = 0。以促销键为准。

  - id: 11
    group: "库存、计划与销售目标"
    rule: "库存是每日快照，不能跨日期求和；「当前库存」取每个门店 × 产品最近一次快照。"
    applies_to_datasets: [FactInventory]
    applies_to_columns: [FactInventory.DateKey, FactInventory.StoreKey, FactInventory.ProductKey, FactInventory.OnHandQuantity]
    metrics: ["当前在手库存数量", "当前在手库存金额"]
    note: >-
      快照实际是**每周一次**，全部落在周六，156 个日期、相邻间隔都是 7 天，不是每日。
      「不能跨日期求和」仍然成立，而且「取每个门店 × 产品最近一次快照」这句是必须的：
      各门店 × 产品的最后一次快照并不在同一天（最多的一天 2009-12-26 只占 27,425 组，
      合计 600,241 组），每个快照日覆盖的门店 × 产品组合数从 18,969 到 98,552 不等。

  - id: 12
    group: "库存、计划与销售目标"
    rule: >-
      战略计划表按实体 × 品类 × 科目记金额，分实际、预算、预测三个场景；「收入」对应科目
      Sale Revenue。销售目标表（数据里叫 quota，也常译作「配额」）记录分配给每家门店 ×
      产品 × 日期的目标销售额和目标销量，同样分三个场景，正式目标看预算场景。
      目标达成率 = 全渠道实际销售额 ÷ 预算场景的目标销售额。
    applies_to_datasets: [FactStrategyPlan, FactSalesQuota, DimScenario, DimAccount]
    applies_to_columns: [FactStrategyPlan.EntityKey, FactStrategyPlan.ProductCategoryKey, FactStrategyPlan.AccountKey, FactStrategyPlan.ScenarioKey, FactSalesQuota.SalesAmountQuota, FactSalesQuota.SalesQuantityQuota, DimScenario.ScenarioName, DimAccount.AccountName]
    metrics: ["目标销售额", "目标销量", "目标达成率", "计划金额"]
    note: >-
      核实结果：AccountName = Sale Revenue 确实存在（AccountKey = 4，AccountType = Income）；
      三个场景就是 Actual / Budget / Forecast。战略计划表的实体全部是门店级
      （EntityType = Store，306 个），与 DimStore.EntityKey 一一对应，没有一行挂在非门店实体上，
      所以「实体」在这个库里等于门店。销售目标表的日期全是每月 1 号（月粒度，36 个月），
      粒度里除了门店 × 产品 × 日期 × 场景还有渠道列。
      三张表的「实际」口径互相对得上，都是 12,413,657,608.89：全渠道销售额合计 =
      战略计划 Actual / Sale Revenue = 销售目标表 Actual 场景的目标销售额。

  - id: 13
    group: "客户"
    rule: "按最近一次购买距 2009-12-31 的月数分层：6 个月内为活跃，7–12 个月为有流失风险，超过 12 个月为已流失。"
    applies_to_datasets: [DimCustomer, FactOnlineSales]
    applies_to_columns: [FactOnlineSales.CustomerKey, FactOnlineSales.DateKey]
    metrics: ["客户最近购买月数", "活跃客户数", "有流失风险客户数", "已流失客户数"]
    note: >-
      只能用线上销售算，全渠道表没有客户列。18,869 个客户全都有线上购买记录，没有
      「从未购买」的客户。按这个分层实测：活跃 16,890、有流失风险 1,841、已流失 138。

  - id: 14
    group: "客户"
    rule: >-
      新客：首次购买日落在截止日前 90 天内的客户；首次购买指该客户有史以来第一次购买；
      截止日由问题的时间窗口决定（按月看就是每个月的最后一天）。
    applies_to_datasets: [DimCustomer, FactOnlineSales]
    applies_to_columns: [FactOnlineSales.CustomerKey, FactOnlineSales.DateKey]
    metrics: ["新客数", "新客销售额", "新客销售额占比"]
    note: >-
      这条在本库的数据上几乎恒为空：18,869 个客户里 18,868 个的首次购买都在 2007 年，
      只有 1 个在 2009 年。任何 2008 年之后的 90 天窗口里新客数是 0 或 1。
      口径本身仍然按原文实现，不改。

  - id: 15
    group: "客户"
    rule: "同店口径：只比较两个对比年份都有销售的门店。"
    applies_to_datasets: [FactSales, DimStore]
    applies_to_columns: [FactSales.StoreKey, FactSales.DateKey]
    metrics: ["同店销售额", "同店销售额增长率"]
    note: >-
      按约定 2，同店走全渠道销售。实测 2008 与 2009 都有销售的门店 301 家（2008 年 301 家、
      2009 年 306 家，全部 306 家）。

# ---------------------------------------------------------------------------
# 同义词：业务说法 → 字段或指标。
# 一条同义词只映到一个落点；落点不唯一的（例如「销售额」在两张事实表上都有）
# 由 default_dataset 指出默认走哪张表，依据写在 why 里。
# ---------------------------------------------------------------------------
synonyms:
  - terms: ["销售额", "营收", "收入", "GMV", "销售金额", "成交额", "营业额"]
    maps_to_metric: "销售额"
    default_dataset: FactOnlineSales
    why: "约定 1：未说明渠道时指线上渠道。点明门店或全渠道时改走 FactSales（约定 2）。"
  - terms: ["净销售额", "净收入", "扣退货后销售额"]
    maps_to_metric: "净销售额"
  - terms: ["销量", "销售数量", "件数", "卖了多少件"]
    maps_to_metric: "销售数量"
  - terms: ["退货金额", "退款金额"]
    maps_to_metric: "退货金额"
  - terms: ["退货量", "退货数量", "退了多少件"]
    maps_to_metric: "退货数量"
  - terms: ["退货率"]
    maps_to_metric: "退货率"
  - terms: ["折扣金额", "优惠金额", "让利"]
    maps_to_metric: "折扣金额"
  - terms: ["折扣率", "折扣力度"]
    maps_to_metric: "折扣率"
  - terms: ["毛利", "毛利额", "利润"]
    maps_to_metric: "毛利"
  - terms: ["毛利率", "利润率"]
    maps_to_metric: "毛利率"
  - terms: ["成本", "销货成本", "总成本"]
    maps_to_metric: "总成本"
  - terms: ["订单数", "单量", "订单量", "下了多少单"]
    maps_to_metric: "订单数"
    default_dataset: FactOnlineSales
    why: "约定 8：订单 = 线上订单号。全渠道销售表没有订单号，问订单只能用线上销售。"
  - terms: ["客单价", "平均订单金额", "平均客单", "AOV"]
    maps_to_metric: "客单价"
  - terms: ["客户数", "买家数", "有多少客户", "购买人数"]
    maps_to_metric: "客户数"
  - terms: ["客均销售额", "人均消费", "每位客户贡献"]
    maps_to_metric: "客均销售额"
  - terms: ["平均单价", "均价", "成交均价"]
    maps_to_metric: "平均单价"
  - terms: ["标价", "吊牌价", "零售价", "产品单价"]
    maps_to_column: DimProduct.UnitPrice
    why: "约定 9：产品利润率、最贵的产品用产品表的标价，不用成交价。"
  - terms: ["产品成本", "单位成本"]
    maps_to_column: DimProduct.UnitCost
  - terms: ["产品利润率"]
    maps_to_metric: "产品利润率"
  - terms: ["日均销售", "日均销售额", "每天平均卖多少"]
    maps_to_metric: "日均销售额"
    why: "约定 4：比较不同类型的日子时用日均销售。"
  - terms: ["销售目标", "目标", "配额", "quota", "目标销售额"]
    maps_to_metric: "目标销售额"
    why: "约定 12：正式目标看预算（Budget）场景。"
  - terms: ["目标销量", "目标数量"]
    maps_to_metric: "目标销量"
  - terms: ["目标达成率", "完成率", "达成情况", "完成了多少目标"]
    maps_to_metric: "目标达成率"
  - terms: ["计划", "战略计划", "预算金额", "计划金额"]
    maps_to_metric: "计划金额"
  - terms: ["在手库存", "库存", "现有库存", "当前库存"]
    maps_to_metric: "当前在手库存数量"
    why: "约定 11：当前库存取每个门店 × 产品最近一次快照。"
  - terms: ["库存金额", "库存价值"]
    maps_to_metric: "当前在手库存金额"
  - terms: ["在订库存", "在途库存", "已下单未到货"]
    maps_to_metric: "当前在订库存数量"
  - terms: ["安全库存"]
    maps_to_metric: "当前安全库存数量"
  - terms: ["缺货", "低于安全库存", "补货预警"]
    maps_to_metric: "低于安全库存的门店产品数"
  - terms: ["同店", "同店销售", "可比门店"]
    maps_to_metric: "同店销售额"
  - terms: ["同比", "同比增长", "去年同期比"]
    maps_to_metric: "销售额同比增长率"
  - terms: ["环比", "环比增长", "上期比"]
    maps_to_metric: "销售额环比增长率"
  - terms: ["占比", "份额", "贡献度"]
    maps_to_metric: "销售额占比"
  - terms: ["活跃客户"]
    maps_to_metric: "活跃客户数"
  - terms: ["流失风险客户", "有流失风险"]
    maps_to_metric: "有流失风险客户数"
  - terms: ["流失客户", "已流失"]
    maps_to_metric: "已流失客户数"
  - terms: ["新客", "新客户", "新增客户"]
    maps_to_metric: "新客数"
  - terms: ["门店", "店", "门店数", "店铺"]
    maps_to_column: DimStore.StoreName
  - terms: ["门店经理", "店长"]
    maps_to_column: DimEmployee.FirstName
    why: >-
      门店经理是 DimStore.EmployeeKey → DimEmployee 的姓名，不是 DimStore.StoreManager
      ——那一列存的是员工号的字符串形式（306 行全部等于 EmployeeKey）。
  - terms: ["营业面积", "门店面积", "卖场面积"]
    maps_to_column: DimStore.SellingAreaSize
  - terms: ["坪效", "单位面积销售额"]
    maps_to_metric: "坪效"
  - terms: ["品类", "大类", "产品类别"]
    maps_to_column: DimProductCategory.ProductCategoryName
  - terms: ["子类", "小类", "子品类"]
    maps_to_column: DimProductSubcategory.ProductSubcategoryName
  - terms: ["品牌"]
    maps_to_column: DimProduct.BrandName
  - terms: ["厂商", "制造商", "供应商"]
    maps_to_column: DimProduct.Manufacturer
  - terms: ["颜色"]
    maps_to_column: DimProduct.ColorName
  - terms: ["渠道"]
    maps_to_column: DimChannel.ChannelName
  - terms: ["促销", "活动", "促销活动"]
    maps_to_column: DimPromotion.PromotionName
  - terms: ["国家", "地区"]
    maps_to_column: DimGeography.RegionCountryName
  - terms: ["大洲", "洲"]
    maps_to_column: DimGeography.ContinentName
  - terms: ["省", "州", "省份"]
    maps_to_column: DimGeography.StateProvinceName
  - terms: ["城市"]
    maps_to_column: DimGeography.CityName
  - terms: ["场景", "实际", "预算", "预测"]
    maps_to_column: DimScenario.ScenarioName
  - terms: ["科目", "会计科目"]
    maps_to_column: DimAccount.AccountName
  - terms: ["停机时长", "宕机时长", "故障时长"]
    maps_to_metric: "停机时长"
  - terms: ["IT 成本", "设备成本", "运维成本"]
    maps_to_metric: "IT 成本"

# ---------------------------------------------------------------------------
# 数据集：25 张表。先事实表（选错表是最常见的错误），再维度表。
# 每张表写明粒度（一行是什么）、何时使用、与相近表的区别。
# ---------------------------------------------------------------------------
datasets:

  # ======================= 事实表 =======================

  - name: FactOnlineSales
    title: "线上销售明细"
    kind: fact
    rows: 12627608
    grain: "一行 = 一个线上订单的一个订单行（SalesOrderNumber × SalesOrderLineNumber 唯一）。"
    description: >-
      线上渠道的订单行级明细，带客户和订单号。这是全库唯一能回答「订单」「客单价」
      「客户」类问题的表，也是未说明渠道时的默认销售表。
      销售行与退货行是**分开的两种行**：销售行 SalesQuantity = 1、ReturnQuantity = 0；
      退货行 SalesQuantity = 0、SalesAmount = 0、ReturnQuantity = 1、ReturnAmount > 0，
      但 TotalCost 仍然大于 0。12,527,442 行销售 + 100,166 行退货。
    when_to_use: >-
      问销售、订单、退货、折扣、营收而没说渠道时（约定 1）；问客户、客单价、客户分层、
      新客时（只有这张表有客户）；问按国家 / 地区 / 大洲的销售时（约定 5 按客户所在地，
      客户只能从这张表进去）。
    differs_from:
      - dataset: FactSales
        how: >-
          FactSales 是全渠道的日 × 门店 × 产品 × 促销汇总，没有订单号也没有客户，
          退货写在销售的同一行上。两张表的线上口径**对不上**：FactSales 里 Online 渠道
          销售额 2,677,599,035.07，这张表合计 2,718,202,629.81（差约 4,060 万，1.5%）；
          退货 32,983,261.29 对 29,244,318.20。不要把两者相加或互相替代。
    date_column: DateKey
    columns:
      - name: OnlineSalesKey
        description: "行的代理键，无业务含义。"
        technical: true
      - name: DateKey
        description: "订单日期。粒度到天，无时间部分。数据范围 2007-01-01 ~ 2009-12-31，1,096 天连续无缺口。"
        role: date
      - name: StoreKey
        description: >-
          承接这笔线上交易的线上店。只有三个取值：199 = 北美线上店、306 = 欧洲线上店、
          307 = 亚洲线上店，都是 DimStore 里 StoreType = Online 的虚拟门店，不是实体店。
          所以这张表不能用来回答「各门店」类问题。
        values:
          - { value: 199, meaning: "Contoso North America Online Store（北美线上店）", rows: 4645792 }
          - { value: 306, meaning: "Contoso Europe Online Store（欧洲线上店）", rows: 3847281 }
          - { value: 307, meaning: "Contoso Asia Online Store（亚洲线上店）", rows: 4134535 }
      - name: ProductKey
        description: >-
          卖出的产品。用到 2,516 个产品键，其中 283 个在 DimProduct 里没有对应行
          （详见 data_quality 的 missing-products 条）：内连接产品表会丢掉 1,715,380 行、
          152,121,858.08 的销售额。
      - name: PromotionKey
        description: "这笔交易所属的促销。1 = 无折扣（约定 10）。这张表里促销键与折扣金额完全一致：PromotionKey = 1 的 3,899,892 行折扣金额全为 0。"
      - name: CurrencyKey
        description: "币种。全表只有 1 = USD，金额无需换算（约定 6）。"
      - name: CustomerKey
        description: "下单客户。18,869 个客户全部在这张表里出现过，没有零购买客户。全渠道销售表没有这一列。"
      - name: SalesOrderNumber
        description: >-
          线上订单号，形如 `200912105CS943`。这就是约定 8 说的「订单」。
          1,674,320 个订单号，平均每单 7.5 行。一个订单号不跨天，但有 2,034 个订单号
          挂在多个客户上，所以订单数不能当作客户数用。
      - name: SalesOrderLineNumber
        description: "订单内的行号，与订单号合起来唯一。最大 4,972。"
      - name: SalesQuantity
        description: "销售数量（件）。只有 0 和 1 两个取值：销售行是 1，退货行是 0。"
        unit: "件"
      - name: SalesAmount
        description: "销售金额（美元），已扣折扣、未扣退货（约定 7）。退货行上这一列是 0。"
        unit: USD
      - name: ReturnQuantity
        description: "退货数量（件）。只有 0 和 1：退货行是 1，销售行是 0。"
        unit: "件"
      - name: ReturnAmount
        description: "退货金额（美元）。只出现在退货行上，合计 29,244,318.20。"
        unit: USD
      - name: DiscountQuantity
        description: "参与折扣的数量（件）。0 或 1，与 PromotionKey != 1 完全一致。"
        unit: "件"
      - name: DiscountAmount
        description: >-
          折扣金额（美元）。已经从 SalesAmount 里扣掉了，所以折前原价 =
          SalesAmount + DiscountAmount。退货行上也可能有折扣金额（合计 2,907,826.10）。
        unit: USD
      - name: TotalCost
        description: >-
          这一行的总成本（美元），用于算毛利（约定 7）。退货行上也大于 0
          （合计 13,703,156.24），所以退货行算出来的毛利是负的。
          全表有 369,350 行销售额低于成本，其中 100,166 行是退货行。
        unit: USD
      - name: UnitCost
        description: "成交时的单位成本（美元）。算产品利润率时不用这一列，用 DimProduct.UnitCost（约定 9）。"
        unit: USD
      - name: UnitPrice
        description: >-
          成交时的单位标价（美元）。销售行满足 SalesAmount = UnitPrice × SalesQuantity
          − DiscountAmount。算「最贵的产品」时不用这一列，用 DimProduct.UnitPrice（约定 9）。
        unit: USD

  - name: FactSales
    title: "全渠道销售汇总"
    kind: fact
    rows: 3406089
    grain: >-
      一行 = 一天 × 一家门店 × 一个产品 × 一个促销的汇总（DateKey × StoreKey ×
      ProductKey × PromotionKey 唯一；channelKey 由门店决定，是冗余列）。没有订单号。
    description: >-
      四个渠道（门店、线上、目录、经销）合在一起的销售汇总，按天、门店、产品、促销预聚合。
      与线上明细相反，**退货写在销售的同一行上**：480,943 行 ReturnQuantity > 0 的行同时
      带着销售额。销售额合计 12,413,657,608.86，是全库的「实际收入」口径
      （与战略计划 Actual/Sale Revenue 和销售目标表 Actual 场景三方相等）。
    when_to_use: >-
      问各门店、门店经理、同店、渠道对比、全渠道时（约定 2）；问目标达成率时的分子
      （约定 12）。
    differs_from:
      - dataset: FactOnlineSales
        how: >-
          没有订单号也没有客户，所以回答不了订单数、客单价、客户数、客户分层、新客，
          也回答不了「按客户所在地」的地理问题。两张表的线上口径对不上，见
          FactOnlineSales 的 differs_from。
    date_column: DateKey
    columns:
      - name: SalesKey
        description: "行的代理键，无业务含义。"
        technical: true
      - name: DateKey
        description: "销售日期，粒度到天。2007-01-01 ~ 2009-12-31，1,096 天连续无缺口。"
        role: date
      - name: channelKey
        description: >-
          销售渠道。注意物理列名首字母是小写的 `channelKey`（数据原样），而 DimChannel
          里的列叫 `ChannelKey`。取值 1 = 门店、2 = 线上、3 = 目录、4 = 经销。
          渠道由门店唯一决定（306 家门店里没有一家跨渠道），所以渠道对比等价于门店类型对比。
        values:
          - { value: 1, meaning: "Store（自营门店），2,173,872 行，销售额 6,942,853,195.14" }
          - { value: 2, meaning: "Online（线上），629,223 行，销售额 2,677,599,035.07" }
          - { value: 3, meaning: "Catalog（目录邮购），194,976 行，销售额 1,078,007,547.23" }
          - { value: 4, meaning: "Reseller（经销），408,018 行，销售额 1,715,197,831.44" }
      - name: StoreKey
        description: >-
          门店。306 家门店全部在这张表里有销售，其中 299 家是实体店（StoreType = Store），
          另外 7 家是渠道用的虚拟门店：3 家线上店、3 家经销店、1 家目录店。
          问「门店」时按需要决定是否排除这 7 家。
      - name: ProductKey
        description: >-
          产品。用到 2,516 个产品键，其中 284 个在 DimProduct 里没有对应行：内连接产品表
          会丢掉 338,898 行、726,129,808.32 的销售额（5.85%）。见 data_quality。
      - name: PromotionKey
        description: >-
          促销。1 = 无折扣（约定 10）。注意这张表里促销键与折扣金额**不完全一致**：
          有 446,677 行挂了季节性促销但 DiscountAmount = 0。按约定 10，筛选依据是促销键。
      - name: CurrencyKey
        description: "币种。全表只有 1 = USD（约定 6）。"
      - name: UnitCost
        description: "汇总行的单位成本（美元）。"
        unit: USD
      - name: UnitPrice
        description: "汇总行的单位标价（美元）。"
        unit: USD
      - name: SalesQuantity
        description: "销售数量（件）。因为是汇总行，最小值是 2，最大 2,880；合计 53,320,454。"
        unit: "件"
      - name: ReturnQuantity
        description: "退货数量（件），0 ~ 5。合计 493,587。与销售在同一行上。"
        unit: "件"
      - name: ReturnAmount
        description: "退货金额（美元），合计 156,839,375.87。与销售在同一行上。"
        unit: USD
      - name: DiscountQuantity
        description: "参与折扣的数量（件），0 ~ 24。"
        unit: "件"
      - name: DiscountAmount
        description: "折扣金额（美元），合计 204,157,104.07。已从 SalesAmount 里扣掉。"
        unit: USD
      - name: TotalCost
        description: "总成本（美元），合计 5,364,896,601.72。毛利 = SalesAmount − TotalCost（约定 7）。这张表没有一行毛利为负。"
        unit: USD
      - name: SalesAmount
        description: >-
          销售金额（美元），已扣折扣、未扣退货（约定 7）。合计 12,413,657,608.86。
          全部 3,406,089 行都满足 SalesAmount = UnitPrice × SalesQuantity − DiscountAmount。
        unit: USD

  - name: FactInventory
    title: "库存快照"
    kind: fact
    rows: 8013099
    grain: "一行 = 一个快照日 × 一家门店 × 一个产品（DateKey × StoreKey × ProductKey 唯一）。"
    description: >-
      门店 × 产品的库存快照。**快照是每周一次、全部落在周六**，156 个快照日，
      2007-01-06 ~ 2009-12-26，相邻间隔都是 7 天（约定 11 写的是「每日快照」，与数据不符，
      见 data_quality 的 inventory-weekly 条）。
      每个快照日覆盖的门店 × 产品组合数差别很大（18,969 ~ 98,552），所以各组合的最后一次
      快照并不在同一天。
    when_to_use: >-
      问库存、缺货、安全库存时。按约定 11，「当前库存」= 每个门店 × 产品最近一次快照，
      不是最后一个快照日的全部行；已经做成 L1.5W 的 `wide_current_inventory` 视图。
    cautions:
      - "快照不可跨日期求和（约定 11）。要算期间平均，先按快照日汇总再对快照日求平均。"
    date_column: DateKey
    columns:
      - name: InventoryKey
        description: "行的代理键，无业务含义。"
        technical: true
      - name: DateKey
        description: "快照日期。156 个值，全是周六，2007-01-06 ~ 2009-12-26。"
        role: date
      - name: StoreKey
        description: "门店。306 家都有库存行。"
      - name: ProductKey
        description: "产品。用到 2,516 个键，其中 283 个在 DimProduct 里没有对应行（丢 533,358 行）。"
      - name: CurrencyKey
        description: "币种。全表只有 1 = USD。"
      - name: OnHandQuantity
        description: "快照时点的在手库存数量（件），0 ~ 5,517。不可跨日期求和。"
        unit: "件"
      - name: OnOrderQuantity
        description: "快照时点已下采购单但未到货的数量（件），0 ~ 2,770。不可跨日期求和。"
        unit: "件"
      - name: SafetyStockQuantity
        description: "该门店 × 产品设定的安全库存水位（件），3 ~ 3,228。在手低于这个数即为缺货预警。"
        unit: "件"
      - name: UnitCost
        description: "快照时点的单位成本（美元）。库存金额 = OnHandQuantity × UnitCost。"
        unit: USD
      - name: DaysInStock
        description: "该门店 × 产品的在库天数，5 ~ 119。"
        unit: "天"
      - name: MinDayInStock
        description: "在库天数的下限参数，5 ~ 59。"
        unit: "天"
      - name: MaxDayInStock
        description: "在库天数的上限参数，60 ~ 119。"
        unit: "天"
      - name: Aging
        description: >-
          库龄分档，1 ~ 7 的整数码，没有配套的说明表，数据里也看不出严格的业务含义
          （各档的平均在手数量不单调）。分布极不均匀：7 档占 5,264,135 行、6 档占 2,357,475 行，
          1 ~ 4 档合计不到 3 万行。不建议作为业务口径使用。
        values:
          - { value: 1, meaning: "库龄档 1，121 行，平均在手 7.3 件" }
          - { value: 2, meaning: "库龄档 2，943 行，平均在手 8.5 件" }
          - { value: 3, meaning: "库龄档 3，18,037 行，平均在手 2.8 件" }
          - { value: 4, meaning: "库龄档 4，9,960 行，平均在手 9.6 件" }
          - { value: 5, meaning: "库龄档 5，362,428 行，平均在手 6.1 件" }
          - { value: 6, meaning: "库龄档 6，2,357,475 行，平均在手 7.8 件，平均在库 62 天" }
          - { value: 7, meaning: "库龄档 7，5,264,135 行，平均在手 21 件，平均在库 44.6 天" }

  - name: FactSalesQuota
    title: "销售目标（配额）"
    kind: fact
    rows: 7465911
    grain: >-
      一行 = 一个月 × 一个渠道 × 一家门店 × 一个产品 × 一个场景
      （DateKey × ChannelKey × StoreKey × ProductKey × ScenarioKey 唯一）。
    description: >-
      分配到门店 × 产品 × 月的销售目标，分实际 / 预算 / 预测三个场景，每个场景
      2,488,637 行。日期全是每月 1 号，36 个月（2007-01 ~ 2009-12）。
      约定 12 说的「销售目标表」就是这张；正式目标看预算（Budget）场景。
      注意 Actual 场景的目标销售额合计 12,413,657,608.89 与全渠道销售额合计完全相等
      ——这个场景记的是实际值，不是目标。
    when_to_use: "问销售目标、目标达成率、预算差异时（约定 12）。"
    cautions:
      - "必须先按场景筛选，否则三个场景的金额会被加在一起（放大三倍）。"
      - "目标是月粒度，不能和日粒度的销售直接按天对比；要先把销售汇总到月。"
    date_column: DateKey
    columns:
      - name: SalesQuotaKey
        description: "行的代理键，无业务含义。"
        technical: true
      - name: ChannelKey
        description: "渠道。1 = 门店、2 = 线上、3 = 目录、4 = 经销。预算场景下各渠道目标：门店 5,965,123,660.92、线上 2,305,357,130.68、经销 1,482,013,781.77、目录 914,970,790.30。"
      - name: StoreKey
        description: "门店。306 家都有目标。"
      - name: ProductKey
        description: "产品。用到 2,516 个键，其中 283 个在 DimProduct 里没有对应行（丢 521,121 行）。"
      - name: DateKey
        description: "目标所属的月份，取值是每月 1 号。36 个月，2007-01-01 ~ 2009-12-01。"
        role: date
      - name: CurrencyKey
        description: "币种。全表只有 1 = USD。"
      - name: ScenarioKey
        description: "场景。1 = Actual（实际）、2 = Budget（预算，正式目标）、3 = Forecast（预测）。三个场景行数相同。"
      - name: SalesQuantityQuota
        description: "目标销量（件）。Actual 53,320,454、Budget 44,300,085、Forecast 53,875,174。"
        unit: "件"
      - name: SalesAmountQuota
        description: >-
          目标销售额（美元）。三个场景合计：Actual 12,413,657,608.89、
          Budget 10,667,465,363.67、Forecast 12,917,294,708.20。按约定 12 用 Budget。
        unit: USD
      - name: GrossMarginQuota
        description: "目标毛利（美元）。有负值（最小 -1,620.95）。"
        unit: USD

  - name: FactStrategyPlan
    title: "战略计划"
    kind: fact
    rows: 2750628
    grain: >-
      一行 = 一个月 × 一个实体 × 一个场景 × 一个会计科目 × 一个产品品类
      （DateKey × EntityKey × ScenarioKey × AccountKey × ProductCategoryKey 唯一）。
    description: >-
      按会计科目记的损益计划，分实际 / 预算 / 预测三个场景，每个场景 916,876 行。
      月粒度，36 个月。实体全部是门店级（EntityType = Store，306 个），与
      DimStore.EntityKey 一一对应，所以「实体」在这个库里等于门店。
      只用到 24 个科目里的 17 个。约定 12 说「收入」对应科目 Sale Revenue（AccountKey = 4）；
      该科目 Actual 场景合计 12,413,657,608.89，与全渠道销售额完全相等。
    when_to_use: "问预算、计划、损益科目（成本、费用、税、利润）时。"
    cautions:
      - "必须先按场景和科目筛选。不筛科目会把收入和各类费用加在一起。"
      - "科目之间有父子关系（DimAccount.ParentAccountKey），把父子科目一起求和会重复计算。"
    date_column: DateKey
    columns:
      - name: StrategyPlanKey
        description: "行的代理键，无业务含义。"
        technical: true
      - name: DateKey
        description: "计划所属月份，每月 1 号。36 个月，2007-01-01 ~ 2009-12-01。"
        role: date
      - name: EntityKey
        description: "计划实体。306 个取值，全部是 DimEntity 里 EntityType = Store 的门店实体，与 DimStore.EntityKey 一一对应。"
      - name: ScenarioKey
        description: "场景。1 = Actual、2 = Budget、3 = Forecast。"
      - name: AccountKey
        description: "会计科目。用到 17 个：4、5、7 ~ 12、15 ~ 23。收入看 4 = Sale Revenue（约定 12）。"
      - name: CurrencyKey
        description: "币种。全表只有 1 = USD。"
      - name: ProductCategoryKey
