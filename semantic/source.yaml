  - name: DimGeography
    title: "地理"
    kind: dimension
    rows: 674
    grain: "一行 = 一个地理位置（GeographyKey 唯一）。"
    description: >-
      扁平化的地理层级表：城市 → 省/州 → 国家/地区 → 大洲四级压在同一行上，
      按 GeographyType 区分这一行代表哪一级。
      517 行是 City（四级都填满）、120 行是 State/Province（城市为空）、
      34 行是 Country/Region（城市和省为空）、3 行是 Continent（只有大洲）。
      客户和门店指向的都是 City 级的行，所以**不需要自连接**就能拿到省、国家、大洲。
    when_to_use: "按城市 / 省州 / 国家 / 大洲分析时。走客户还是走门店由约定 5 决定。"
    columns:
      - name: GeographyKey
        description: "地理键。1 ~ 952，674 行。"
        role: key
      - name: GeographyType
        description: "这一行代表地理层级的哪一级。客户和门店指向的都是 City 级。"
        values:
          - { value: "City", meaning: "城市级，517 行，四级字段都有值" }
          - { value: "State/Province", meaning: "省 / 州级，120 行，CityName 为空" }
          - { value: "Country/Region", meaning: "国家 / 地区级，34 行，CityName 与 StateProvinceName 为空" }
          - { value: "Continent", meaning: "大洲级，3 行，只有 ContinentName，RegionCountryName 是空字符串" }
      - name: ContinentName
