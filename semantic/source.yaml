  - name: DimPromotion
    title: "促销"
    kind: dimension
    rows: 28
    grain: "一行 = 一个促销活动（PromotionKey 唯一）。"
    description: >-
      28 个促销活动，其中 1 个是「无折扣」（PromotionKey = 1），其余 27 个是季节性促销。
      27 个季节性促销只有 9 个不同的名字，每个名字出现 3 次（同一个活动在不同年份各一行），
      所以按促销名分组会把三年合在一起。
    when_to_use: "问折扣、促销效果时。按约定 10，这类问题要排除 PromotionKey = 1。"
    columns:
      - name: PromotionKey
        description: "促销键 1 ~ 28。**1 = 无折扣**（约定 10）。"
        role: key
      - name: PromotionName
        description: >-
          促销名。10 个不同取值：1 个 `No Discount` 加 9 个季节性促销名，
          每个季节性名字对应 3 个促销键（三个年份）。
        values:
          - { value: "No Discount", meaning: "无折扣，仅 PromotionKey = 1 这一行，折扣率 0" }
          - { value: "North America Spring Promotion", meaning: "北美春促，3 个键，折扣率 5%" }
          - { value: "North America Back-to-School Promotion", meaning: "北美返校促，3 个键，折扣率 10%" }
          - { value: "North America Holiday Promotion", meaning: "北美假日促，3 个键，折扣率 20%" }
          - { value: "European Spring Promotion", meaning: "欧洲春促，3 个键，折扣率 7%" }
          - { value: "European Back-to-Scholl Promotion", meaning: "欧洲返校促，3 个键，折扣率 10%。名字里的 Scholl 是数据里的拼写错误（应为 School）" }
          - { value: "European Holiday Promotion", meaning: "欧洲假日促，3 个键，折扣率 20%" }
          - { value: "Asian Spring Promotion", meaning: "亚洲春促，3 个键，折扣率 20%" }
          - { value: "Asian Summer Promotion", meaning: "亚洲夏促，3 个键，折扣率 10%" }
          - { value: "Asian Holiday Promotion", meaning: "亚洲假日促，3 个键，折扣率 15%" }
      - name: DiscountPercent
        description: "名义折扣率，小数（0.05 = 5%）。取值 0、0.05、0.07、0.10、0.15、0.20。这是活动的名义折扣率，不是实际成交的折扣，实际折扣看事实表的 DiscountAmount。"
        values:
          - { value: 0, meaning: "无折扣（只有 PromotionKey = 1）" }
          - { value: 0.05, meaning: "5%，3 个促销" }
          - { value: 0.07, meaning: "7%，3 个" }
          - { value: 0.1, meaning: "10%，9 个" }
          - { value: 0.15, meaning: "15%，3 个" }
          - { value: 0.2, meaning: "20%，9 个" }
      - name: PromotionType
        description: "促销类型。"
        values:
          - { value: "Seasonal Discount", meaning: "季节性折扣，27 个促销" }
          - { value: "No Discount", meaning: "无折扣，1 个（PromotionKey = 1）" }
      - name: PromotionCategory
        description: "促销归类。信息量很低：27 个季节性促销全是 `Store`，无折扣那行是 `No Discount`。等价于 PromotionType。"
        values:
          - { value: "Store", meaning: "门店促销，27 个" }
          - { value: "No Discount", meaning: "无折扣，1 个" }

