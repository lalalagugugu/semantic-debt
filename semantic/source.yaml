  - name: DimAccount
    title: "会计科目"
    kind: dimension
    rows: 24
    grain: "一行 = 一个会计科目（AccountKey 唯一）。"
    description: >-
      战略计划表用的损益科目表，24 个科目，带父子关系（ParentAccountKey 指向同一张表）。
      战略计划表只用到其中 17 个。**父子科目一起求和会重复计算**。
      约定 12 说的「收入」对应 AccountName = Sale Revenue（AccountKey = 4）。
    when_to_use: "查战略计划的某个科目时（约定 12）。"
    cautions:
      - "科目有层级，汇总时要么只取叶子科目，要么只取某一个父科目，不能混。"
    columns:
      - name: AccountKey
        description: "科目键 1 ~ 24。收入是 4（Sale Revenue）。"
        role: key
      - name: ParentAccountKey
        description: >-
          父科目键，指向本表的 AccountKey。7 个取值（1、2、3、6、13、14、24）。
          有层级就意味着父子科目的金额会重叠，求和时不能同时取。
      - name: AccountName
        description: >-
          科目名，24 个全不相同。约定 12 指定的「收入」是 `Sale Revenue`。
