# ---------------------------------------------------------------------------
# 关系。
#
# 建表语句里**没有任何外键声明**，下面每一条都是按列名提出候选、再用数据实测出来的
# （semantic/profiling/out/keys.md）。`orphan_rows` 是实测的孤儿行数：子表里该键非空、
# 父表里却找不到对应行的行数。孤儿行不为 0 的关系要用左连接，否则会静默丢数据。
#
# 同一对表有多条路径时，由 multi_path_defaults 指出默认走哪条。
# ---------------------------------------------------------------------------
relationships:

  # ---- 线上销售 ----
  - from: FactOnlineSales.DateKey
    to: DimDate.DateKey
    cardinality: 多对一
    orphan_rows: 0
    use: "按年 / 季 / 月 / 周 / 星期几 / 节假日 / 季节分析线上销售时走这条。"
  - from: FactOnlineSales.CustomerKey
    to: DimCustomer.CustomerKey
    cardinality: 多对一
    orphan_rows: 0
    use: >-
      按客户属性分析，以及**按客户所在地**分析国家 / 地区 / 大洲时走这条
      （约定 5 的默认分支，再接 DimCustomer.GeographyKey）。
  - from: FactOnlineSales.ProductKey
    to: DimProduct.ProductKey
    cardinality: 多对一
    orphan_rows: 1715380
    use: "按产品、品牌、厂商、颜色、品类分析线上销售时走这条。"
    caution: >-
      有 1,715,380 行（13.6%、152,121,858.08 销售额）的 ProductKey 在 DimProduct 里
      不存在。要保住销售总额就用左连接；用内连接会少算。见 data_quality。
  - from: FactOnlineSales.StoreKey
    to: DimStore.StoreKey
    cardinality: 多对一
    orphan_rows: 0
    use: >-
      只能拿到三家线上虚拟门店（199 北美 / 306 欧洲 / 307 亚洲），用来按大洲区分线上业务。
      **不要用它回答「各门店」类问题**，那要用 FactSales（约定 2）。
  - from: FactOnlineSales.PromotionKey
    to: DimPromotion.PromotionKey
    cardinality: 多对一
    orphan_rows: 0
    use: "按促销活动分析，或按约定 10 排除无折扣交易（PromotionKey = 1）时走这条。"
  - from: FactOnlineSales.CurrencyKey
    to: DimCurrency.CurrencyKey
    cardinality: 多对一
    orphan_rows: 0
    use: "实际用不上：全表只有 USD（约定 6）。"

  # ---- 全渠道销售 ----
  - from: FactSales.DateKey
    to: DimDate.DateKey
    cardinality: 多对一
    orphan_rows: 0
    use: "按时间分析全渠道销售时走这条。"
  - from: FactSales.channelKey
    to: DimChannel.ChannelKey
    cardinality: 多对一
    orphan_rows: 0
    use: >-
      渠道对比时走这条（约定 2）。注意子表列名首字母是小写的 `channelKey`。
      渠道由门店唯一决定，所以这条和「按门店类型分组」等价。
  - from: FactSales.StoreKey
    to: DimStore.StoreKey
    cardinality: 多对一
    orphan_rows: 0
    use: >-
      按门店、门店经理、同店分析时走这条；**按门店所在地**分析地理时也走这条
      （约定 5 的门店分支，再接 DimStore.GeographyKey）。
  - from: FactSales.ProductKey
    to: DimProduct.ProductKey
    cardinality: 多对一
    orphan_rows: 338898
    use: "按产品、品牌、品类分析全渠道销售时走这条。"
    caution: >-
      有 338,898 行（9.95%、726,129,808.32 销售额、占全渠道销售额 5.85%）的 ProductKey
      在 DimProduct 里不存在。用左连接才能保住销售总额。见 data_quality。
  - from: FactSales.PromotionKey
    to: DimPromotion.PromotionKey
    cardinality: 多对一
    orphan_rows: 0
    use: "按促销分析，或按约定 10 排除无折扣交易时走这条。"
  - from: FactSales.CurrencyKey
    to: DimCurrency.CurrencyKey
    cardinality: 多对一
    orphan_rows: 0
    use: "实际用不上：全表只有 USD（约定 6）。"

  # ---- 库存 ----
  - from: FactInventory.DateKey
    to: DimDate.DateKey
    cardinality: 多对一
    orphan_rows: 0
    use: "按快照日期分析库存时走这条。快照只落在周六，156 个日期。"
  - from: FactInventory.StoreKey
    to: DimStore.StoreKey
    cardinality: 多对一
    orphan_rows: 0
    use: "按门店看库存时走这条。"
  - from: FactInventory.ProductKey
    to: DimProduct.ProductKey
    cardinality: 多对一
    orphan_rows: 533358
    use: "按产品、品类看库存时走这条。"
    caution: "有 533,358 行（6.7%）的 ProductKey 在 DimProduct 里不存在，用左连接。"
  - from: FactInventory.CurrencyKey
    to: DimCurrency.CurrencyKey
    cardinality: 多对一
    orphan_rows: 0
    use: "实际用不上：全表只有 USD。"

  # ---- 销售目标 ----
  - from: FactSalesQuota.DateKey
    to: DimDate.DateKey
    cardinality: 多对一
    orphan_rows: 0
    use: "按月看目标时走这条。目标的日期是每月 1 号，不能按天对齐销售。"
  - from: FactSalesQuota.ChannelKey
    to: DimChannel.ChannelKey
    cardinality: 多对一
    orphan_rows: 0
    use: "按渠道看目标时走这条。"
  - from: FactSalesQuota.StoreKey
    to: DimStore.StoreKey
    cardinality: 多对一
    orphan_rows: 0
    use: "按门店看目标、算门店目标达成率时走这条。"
  - from: FactSalesQuota.ProductKey
    to: DimProduct.ProductKey
    cardinality: 多对一
    orphan_rows: 521121
    use: "按产品、品类看目标时走这条。"
    caution: "有 521,121 行（7%）的 ProductKey 在 DimProduct 里不存在，用左连接。"
  - from: FactSalesQuota.ScenarioKey
    to: DimScenario.ScenarioKey
    cardinality: 多对一
    orphan_rows: 0
    use: >-
      **必走**：不按场景筛选就会把实际 / 预算 / 预测三份金额加在一起。
      正式目标取 ScenarioName = Budget（约定 12）。
  - from: FactSalesQuota.CurrencyKey
    to: DimCurrency.CurrencyKey
    cardinality: 多对一
    orphan_rows: 0
    use: "实际用不上：全表只有 USD。"

  # ---- 战略计划 ----
  - from: FactStrategyPlan.DateKey
    to: DimDate.DateKey
    cardinality: 多对一
    orphan_rows: 0
    use: "按月看计划时走这条。计划的日期是每月 1 号。"
  - from: FactStrategyPlan.EntityKey
    to: DimEntity.EntityKey
    cardinality: 多对一
    orphan_rows: 0
    use: >-
      拿计划实体的名字和层级。计划只挂在门店级实体上；要按州或国家看计划，
      用 DimEntity.ParentEntityLabel 分组，或沿 ParentEntityKey 上卷。
  - from: FactStrategyPlan.ScenarioKey
    to: DimScenario.ScenarioKey
    cardinality: 多对一
    orphan_rows: 0
    use: "**必走**：不按场景筛选会把三个场景加在一起。预算取 ScenarioName = Budget。"
  - from: FactStrategyPlan.AccountKey
    to: DimAccount.AccountKey
    cardinality: 多对一
    orphan_rows: 0
    use: >-
      **必走**：不按科目筛选会把收入和各类费用加在一起。
      「收入」取 AccountName = Sale Revenue（约定 12）。注意科目有父子关系，
      父子一起求和会重复计算。
  - from: FactStrategyPlan.ProductCategoryKey
    to: DimProductCategory.ProductCategoryKey
    cardinality: 多对一
    orphan_rows: 0
    use: "按品类看计划时走这条。计划只到品类级，没有产品级。"
  - from: FactStrategyPlan.CurrencyKey
    to: DimCurrency.CurrencyKey
    cardinality: 多对一
    orphan_rows: 0
    use: "实际用不上：全表只有 USD。"

  # ---- 汇率与 IT ----
  - from: FactExchangeRate.CurrencyKey
    to: DimCurrency.CurrencyKey
    cardinality: 多对一
    orphan_rows: 0
    use: "本库用不上（约定 6）。"
  - from: FactExchangeRate.DateKey
    to: DimDate.DateKey
    cardinality: 多对一
    orphan_rows: 0
    use: "本库用不上。"
  - from: FactITMachine.MachineKey
    to: DimMachine.MachineKey
    cardinality: 多对一
    orphan_rows: 0
    use: "按设备型号、厂商、所在门店看 IT 成本时走这条。"
  - from: FactITMachine.DateKey
    to: DimDate.DateKey
    cardinality: 多对一
    orphan_rows: 0
    use: "按年份看 IT 成本时走这条（只有 2007 / 2008 / 2009 三个日期）。"
  - from: FactITSLA.DateKey
    to: DimDate.DateKey
    cardinality: 多对一
    orphan_rows: 0
    use: "按时间看故障与停机时走这条。"
  - from: FactITSLA.StoreKey
    to: DimStore.StoreKey
    cardinality: 多对一
    orphan_rows: 0
    use: "按门店看故障与停机时走这条。"
  - from: FactITSLA.MachineKey
    to: DimMachine.MachineKey
    cardinality: 多对一
    orphan_rows: 0
    use: "按设备看故障时走这条。"
  - from: FactITSLA.OutageKey
    to: DimOutage.OutageKey
    cardinality: 多对一
    orphan_rows: 0
    use: "按故障分类看故障时走这条。注意分类字段比较脏，同一概念有多种写法。"

  # ---- 维度到维度 ----
  - from: DimCustomer.GeographyKey
    to: DimGeography.GeographyKey
    cardinality: 多对一
    orphan_rows: 0
    use: >-
      **按客户所在地**分析城市 / 省州 / 国家 / 大洲时走这条（约定 5 的默认分支）。
      客户指向的都是 City 级的行，四级地理字段在同一行上，不需要自连接。
  - from: DimStore.GeographyKey
    to: DimGeography.GeographyKey
    cardinality: 多对一
    orphan_rows: 0
    use: >-
      **按门店所在地**分析地理时走这条（约定 5 只在问题明说「门店所在地」时才走这条）。
      306 家门店落在 263 个城市上。
  - from: DimStore.EntityKey
    to: DimEntity.EntityKey
    cardinality: 一对一
    orphan_rows: 0
    use: >-
      把门店和战略计划接起来的唯一桥梁：FactStrategyPlan.EntityKey → DimEntity ←
      DimStore.EntityKey。306 对 306 一一对应。
  - from: DimStore.EmployeeKey
    to: DimEmployee.EmployeeKey
    cardinality: 多对一
    orphan_rows: 1
    use: "拿门店经理的姓名和职级（约定 2 提到门店经理）。不要用 DimStore.StoreManager，那是员工号字符串。"
    caution: "StoreKey 227（Contoso Naples Store）的 EmployeeKey = 245 在 DimEmployee 里不存在，内连接会丢掉这家店。"
  - from: DimProduct.ProductSubcategoryKey
    to: DimProductSubcategory.ProductSubcategoryKey
    cardinality: 多对一
    orphan_rows: 0
    use: "产品 → 子类。再接 DimProductSubcategory.ProductCategoryKey 到品类。"
  - from: DimProductSubcategory.ProductCategoryKey
    to: DimProductCategory.ProductCategoryKey
    cardinality: 多对一
    orphan_rows: 0
    use: "子类 → 品类。产品到品类只有这一条路（经子类），没有直连。"
  - from: DimMachine.StoreKey
    to: DimStore.StoreKey
    cardinality: 多对一
    orphan_rows: 0
    use: "设备 → 所在门店。"
  - from: DimSalesTerritory.GeographyKey
    to: DimGeography.GeographyKey
    cardinality: 一对一
    orphan_rows: 0
    use: "辖区 → 城市。本库的销售事实不挂辖区，这条实际用不上。"
  - from: DimSalesTerritory.EmployeeKey
    to: DimEmployee.EmployeeKey
    cardinality: 多对一
    orphan_rows: 0
    use: "辖区 → 负责人。本库用不上。"
  - from: DimAccount.ParentAccountKey
    to: DimAccount.AccountKey
    cardinality: 多对一
    orphan_rows: 0
    use: "科目的父子关系（自连接）。父子科目一起求和会重复计算。"
  - from: DimEmployee.ParentEmployeeKey
    to: DimEmployee.EmployeeKey
    cardinality: 多对一
    orphan_rows: 0
    use: "员工的上下级关系（自连接），四级销售组织。"
  - from: DimEntity.ParentEntityKey
    to: DimEntity.EntityKey
    cardinality: 多对一
    orphan_rows: 0
    use: >-
      实体的父子关系（自连接）：门店 → 州 → 国家/地区 → 集团。
      要按州看计划，用这条上卷，或直接用反范式化的 ParentEntityLabel 分组。

# 同一对表有多条路径时的默认选择
multi_path_defaults:
  - pair: "销售 → DimGeography"
    paths:
      - path: "FactOnlineSales → DimCustomer → DimGeography"
        meaning: "客户所在地"
      - path: "FactOnlineSales / FactSales → DimStore → DimGeography"
        meaning: "门店所在地"
    default: "FactOnlineSales → DimCustomer → DimGeography（客户所在地）"
    why: >-
      约定 5：按国家、地区、大洲分析销售时默认按客户所在地，只有明确说「门店所在地」
      才按门店。而客户键只在线上销售上有，所以地理问题的默认落点是线上销售。
      一旦问题以门店为对象（约定 2），就改走 FactSales → DimStore → DimGeography。
  - pair: "FactSales → 渠道"
    paths:
      - path: "FactSales.channelKey → DimChannel"
        meaning: "渠道维度"
      - path: "FactSales → DimStore.StoreType"
        meaning: "门店类型"
    default: "FactSales.channelKey → DimChannel"
    why: "两者等价（渠道由门店唯一决定），但渠道维度是正式的渠道名，门店类型只是门店属性。"
  - pair: "FactStrategyPlan → DimStore"
    paths:
      - path: "FactStrategyPlan.EntityKey → DimEntity ← DimStore.EntityKey"
        meaning: "经实体表的唯一通路"
    default: "FactStrategyPlan.EntityKey → DimEntity ← DimStore.EntityKey"
    why: "战略计划表没有 StoreKey；要把计划和门店（或门店的销售）对起来，只能经 DimEntity。"
  - pair: "产品 → 品类"
    paths:
      - path: "DimProduct → DimProductSubcategory → DimProductCategory"
        meaning: "经子类的唯一通路"
    default: "DimProduct → DimProductSubcategory → DimProductCategory"
    why: "产品表没有品类键，只有子类键。注意战略计划表反而直接挂品类键。"

# ---------------------------------------------------------------------------
# 指标：文字口径。
#
# 这一节是 L1.5S（汇总层）和 L2（可调用指标）的唯一来源：汇总表只汇总这里定义过的
# 指标，metrics.yaml 只包含这里定义过的指标，不多不少（设计规矩 3）。
#
# 每个指标写清：
#   definition  文字公式
#   numerator / denominator  比率型指标的分子分母（分开写，汇总层要分别存）
#   additivity  可加 / 比率 / 半可加 / 去重
#       可加   ——  在任何维度上直接相加都成立
#       比率   ——  不能相加；要重新用分子合计 ÷ 分母合计算
#       半可加 ——  在某些维度上可加、在时间上不可加（库存快照）
#       去重   ——  去重计数，不能跨行相加
#   default_filters  默认筛选（不写明时就按这个）
#   dataset  默认落在哪张表
# ---------------------------------------------------------------------------
metrics:

  # ========== 销售 ==========
  - name: "销售额"
    aliases: ["营收", "GMV", "销售金额", "收入"]
    definition: "销售金额合计，已扣折扣、未扣退货（约定 7）。"
    expression: "sum(SalesAmount)"
    additivity: 可加
    unit: USD
    dataset: FactOnlineSales
    alternate_dataset: FactSales
    default_filters: ["未说明渠道时用线上销售（约定 1）；以门店为对象时用全渠道销售（约定 2）"]
    conventions: [1, 2, 7]
  - name: "销售数量"
    aliases: ["销量", "件数"]
    definition: "销售数量合计。"
    expression: "sum(SalesQuantity)"
    additivity: 可加
    unit: "件"
    dataset: FactOnlineSales
    alternate_dataset: FactSales
    conventions: [1, 2]
  - name: "总成本"
    aliases: ["销货成本"]
    definition: "销售行的总成本合计。"
    expression: "sum(TotalCost)"
    additivity: 可加
    unit: USD
    dataset: FactOnlineSales
    alternate_dataset: FactSales
    conventions: [7]
  - name: "平均单价"
    aliases: ["成交均价"]
    definition: "销售额 ÷ 销售数量。"
    numerator: "销售额"
    denominator: "销售数量"
    additivity: 比率
    unit: USD
    dataset: FactOnlineSales
    alternate_dataset: FactSales

  # ========== 退货 ==========
  - name: "退货金额"
    definition: "退货金额合计。"
    expression: "sum(ReturnAmount)"
    additivity: 可加
    unit: USD
    dataset: FactOnlineSales
    alternate_dataset: FactSales
    note: >-
      线上销售的退货写在独立的行上（SalesQuantity = 0）；全渠道销售的退货写在销售的
      同一行上。两种形态都只要对这一列求和，但按「退货的行」筛选时写法不同。
  - name: "退货数量"
    definition: "退货数量合计。"
    expression: "sum(ReturnQuantity)"
    additivity: 可加
    unit: "件"
    dataset: FactOnlineSales
    alternate_dataset: FactSales
  - name: "净销售额"
    aliases: ["净收入"]
    definition: "销售金额 − 退货金额（约定 7）。"
    numerator: "销售额 − 退货金额"
    additivity: 可加
    unit: USD
    dataset: FactOnlineSales
    alternate_dataset: FactSales
    conventions: [7]
  - name: "退货率"
    definition: "退货数量 ÷ 销售数量（约定 7）。注意分子分母都是**数量**，不是金额。"
    numerator: "退货数量"
    denominator: "销售数量"
    additivity: 比率
    dataset: FactOnlineSales
    alternate_dataset: FactSales
    conventions: [7]
    note: "全量值：线上 0.7996%，全渠道 0.9257%。"

  # ========== 折扣 ==========
  - name: "折扣金额"
    aliases: ["优惠金额"]
    definition: "折扣金额合计。按约定 10，问折扣金额时不计无折扣交易（PromotionKey = 1）。"
    expression: "sum(DiscountAmount)"
    additivity: 可加
    unit: USD
    dataset: FactOnlineSales
    alternate_dataset: FactSales
    default_filters: ["PromotionKey != 1（约定 10）"]
    conventions: [10]
  - name: "折扣数量"
    definition: "参与折扣的数量合计。"
    expression: "sum(DiscountQuantity)"
    additivity: 可加
    unit: "件"
    dataset: FactOnlineSales
    alternate_dataset: FactSales
    default_filters: ["PromotionKey != 1（约定 10）"]
    conventions: [10]
  - name: "折扣前原价"
    aliases: ["折前金额", "吊牌金额"]
    definition: >-
      销售额 + 折扣金额。因为 SalesAmount 已经扣掉折扣，加回折扣就得到折前金额
      （全渠道销售 3,406,089 行全部满足 SalesAmount = UnitPrice × SalesQuantity
      − DiscountAmount）。
    numerator: "销售额 + 折扣金额"
    additivity: 可加
    unit: USD
    dataset: FactOnlineSales
    alternate_dataset: FactSales
  - name: "折扣率"
    aliases: ["折扣力度"]
    definition: "折扣金额 ÷ 折扣前原价。"
    numerator: "折扣金额"
    denominator: "折扣前原价"
    additivity: 比率
    dataset: FactOnlineSales
    alternate_dataset: FactSales
    default_filters: ["PromotionKey != 1（约定 10）"]
    conventions: [10]
  - name: "打折销售额"
    definition: "促销键不等于 1 的交易的销售额合计（约定 10）。"
    numerator: "销售额，筛 PromotionKey != 1"
    additivity: 可加
    unit: USD
    dataset: FactOnlineSales
    alternate_dataset: FactSales
    conventions: [10]
  - name: "打折销售额占比"
    definition: "打折销售额 ÷ 销售额（分母含无折扣交易）。"
    numerator: "打折销售额"
    denominator: "销售额"
    additivity: 比率
    dataset: FactOnlineSales
    alternate_dataset: FactSales
    conventions: [10]

  # ========== 毛利 ==========
  - name: "毛利"
    aliases: ["毛利额"]
    definition: "销售金额 − 总成本（约定 7）。"
    numerator: "销售额 − 总成本"
    additivity: 可加
    unit: USD
    dataset: FactOnlineSales
    alternate_dataset: FactSales
    conventions: [7]
    note: >-
      线上销售有 369,350 行毛利为负，其中 100,166 行是退货行（销售额 0、成本大于 0）。
      全渠道销售没有一行毛利为负。
  - name: "毛利率"
    aliases: ["利润率"]
    definition: "毛利 ÷ 销售金额（约定 7）。"
    numerator: "毛利"
    denominator: "销售额"
    additivity: 比率
    dataset: FactOnlineSales
    alternate_dataset: FactSales
    conventions: [7]
    note: "全渠道各渠道的毛利率都在 56.5% ~ 56.9% 之间，差别很小。"

  # ========== 订单 ==========
  - name: "订单数"
    aliases: ["单量", "订单量"]
    definition: "去重的线上订单号个数（约定 8）。"
    expression: "uniqExact(SalesOrderNumber)"
    additivity: 去重
    dataset: FactOnlineSales
    only_dataset: true
    conventions: [8]
    note: >-
      **不能跨行相加**：各组的订单数加起来不等于总体订单数。
      只有线上销售有订单号，全渠道销售回答不了订单类问题。全量值 1,674,320。
  - name: "订单行数"
    definition: "线上销售的行数。"
    expression: "count()"
    additivity: 可加
    dataset: FactOnlineSales
    only_dataset: true
  - name: "每单行数"
    definition: "订单行数 ÷ 订单数。"
    numerator: "订单行数"
    denominator: "订单数"
    additivity: 比率
    dataset: FactOnlineSales
    only_dataset: true
    note: "全量值 7.542。"
  - name: "客单价"
    aliases: ["平均订单金额", "AOV"]
    definition: "销售额 ÷ 去重订单数（约定 8）。"
    numerator: "销售额"
    denominator: "订单数"
    additivity: 比率
    unit: USD
    dataset: FactOnlineSales
    only_dataset: true
    conventions: [8]
    note: "全量值 1,623.4666。"

  # ========== 客户 ==========
  - name: "客户数"
    aliases: ["买家数", "购买人数"]
    definition: "去重的客户键个数。"
    expression: "uniqExact(CustomerKey)"
    additivity: 去重
    dataset: FactOnlineSales
    only_dataset: true
    note: "**不能跨行相加**。只有线上销售有客户键；18,869 个客户全部有购买记录。"
  - name: "客均销售额"
    aliases: ["人均消费"]
    definition: "销售额 ÷ 客户数。"
    numerator: "销售额"
    denominator: "客户数"
    additivity: 比率
    unit: USD
    dataset: FactOnlineSales
    only_dataset: true
  - name: "客均订单数"
    definition: "订单数 ÷ 客户数。"
    numerator: "订单数"
    denominator: "客户数"
    additivity: 比率
    dataset: FactOnlineSales
    only_dataset: true
  - name: "客户最近购买月数"
    definition: >-
      从该客户最后一次购买日到 2009-12-31 的整月数（约定 13 的分层依据）。
      按客户算，不是聚合指标。
    expression: "dateDiff('month', max(DateKey), toDate('2009-12-31'))，按 CustomerKey 分组"
    additivity: 比率
    unit: "月"
    dataset: FactOnlineSales
    only_dataset: true
    conventions: [3, 13]
  - name: "活跃客户数"
    definition: "最近购买月数 ≤ 6 的去重客户数（约定 13）。"
    numerator: "客户数，筛 客户最近购买月数 <= 6"
    additivity: 去重
    dataset: FactOnlineSales
    only_dataset: true
    conventions: [13]
    note: "全量值 16,890。不能跨行相加。"
  - name: "有流失风险客户数"
    definition: "最近购买月数在 7 ~ 12 之间的去重客户数（约定 13）。"
    numerator: "客户数，筛 7 <= 客户最近购买月数 <= 12"
    additivity: 去重
    dataset: FactOnlineSales
    only_dataset: true
    conventions: [13]
    note: "全量值 1,841。"
  - name: "已流失客户数"
    definition: "最近购买月数 > 12 的去重客户数（约定 13）。"
    numerator: "客户数，筛 客户最近购买月数 > 12"
    additivity: 去重
    dataset: FactOnlineSales
    only_dataset: true
    conventions: [13]
    note: "全量值 138。"
  - name: "新客数"
    aliases: ["新增客户数"]
    definition: >-
      首次购买日落在截止日前 90 天内的去重客户数；首次购买指该客户有史以来第一次购买；
      截止日由时间窗口决定，按月看就是每个月的最后一天（约定 14）。
    numerator: "客户数，筛 首次购买日 在 [截止日 − 89 天, 截止日] 内"
    additivity: 去重
    dataset: FactOnlineSales
    only_dataset: true
    conventions: [14]
    note: >-
      这个库的数据让这个指标几乎恒为 0：18,869 个客户里 18,868 个首次购买在 2007 年，
      只有 1 个在 2009 年。口径按约定原文实现，不因为结果为空而改。
  - name: "新客销售额"
    definition: "新客（按约定 14 判定）在窗口内的销售额合计。"
    numerator: "销售额，筛 客户属于新客"
    additivity: 可加
    unit: USD
    dataset: FactOnlineSales
    only_dataset: true
    conventions: [14]
  - name: "新客销售额占比"
    definition: "新客销售额 ÷ 销售额。"
    numerator: "新客销售额"
    denominator: "销售额"
    additivity: 比率
    dataset: FactOnlineSales
    only_dataset: true
    conventions: [14]

  # ========== 日均与计数 ==========
  - name: "有销售天数"
    definition: "去重的有销售日期个数。"
    expression: "uniqExact(DateKey)"
    additivity: 去重
    unit: "天"
    dataset: FactSales
    alternate_dataset: FactOnlineSales
  - name: "日均销售额"
    aliases: ["日均销售"]
    definition: >-
      先按天汇总销售额，再对天数求平均（约定 4）。等价于 销售额 ÷ 有销售天数。
      比较节假日与平日、周末与工作日、季节时用这个，不要直接比销售额合计。
    numerator: "销售额"
    denominator: "有销售天数"
    additivity: 比率
    unit: USD
    dataset: FactSales
    alternate_dataset: FactOnlineSales
    conventions: [4]
    note: >-
      2009 年全渠道实测：平日 261 天日均 10,260,907.86，节假日 104 天日均 10,215,251.62。
      两者几乎相同，因为这个库的「节假日」就是周末。
  - name: "日均销售数量"
    definition: "先按天汇总销售数量，再对天数求平均。等价于 销售数量 ÷ 有销售天数。"
    numerator: "销售数量"
    denominator: "有销售天数"
    additivity: 比率
    unit: "件"
    dataset: FactSales
    alternate_dataset: FactOnlineSales
    conventions: [4]
  - name: "门店数"
    definition: "去重的门店个数。"
    expression: "uniqExact(StoreKey)"
    additivity: 去重
    unit: "家"
    dataset: FactSales
    note: "**不能跨行相加**。306 家门店里 299 家是实体店，7 家是渠道用的虚拟门店。"
  - name: "产品数"
    aliases: ["在售产品数", "SKU 数"]
    definition: "去重的产品个数。"
    expression: "uniqExact(ProductKey)"
    additivity: 去重
    unit: "个"
    dataset: FactSales
    alternate_dataset: FactOnlineSales
    note: "**不能跨行相加**。"
  - name: "店均销售额"
    aliases: ["单店销售额"]
    definition: "销售额 ÷ 门店数。"
    numerator: "销售额"
    denominator: "门店数"
    additivity: 比率
    unit: USD
    dataset: FactSales
  - name: "坪效"
    aliases: ["单位面积销售额"]
    definition: "销售额 ÷ 门店营业面积合计（DimStore.SellingAreaSize）。只对实体店有意义。"
    numerator: "销售额"
    denominator: "门店营业面积合计"
    additivity: 比率
    unit: USD
    dataset: FactSales
    note: >-
      营业面积有 2 家门店是 93,800，比其余门店（450 ~ 1,125）大约两个数量级，
      算到这两家头上的坪效会被压得极低。
  - name: "门店人均销售额"
    definition: "销售额 ÷ 门店员工数合计（DimStore.EmployeeCount）。"
    numerator: "销售额"
    denominator: "门店员工数合计"
    additivity: 比率
    unit: USD
    dataset: FactSales

  # ========== 增长与占比 ==========
  - name: "销售额同比增长率"
    aliases: ["同比增长率"]
    definition: "（本期销售额 − 去年同期销售额）÷ 去年同期销售额。以 2009 年为今年、2008 年为去年（约定 3）。"
    numerator: "本期销售额 − 去年同期销售额"
    denominator: "去年同期销售额"
    additivity: 比率
    dataset: FactSales
    alternate_dataset: FactOnlineSales
    conventions: [3]
  - name: "销售额环比增长率"
    aliases: ["环比增长率"]
    definition: "（本期销售额 − 上一期销售额）÷ 上一期销售额。期的长度由问题的粒度决定（月、季）。"
    numerator: "本期销售额 − 上一期销售额"
    denominator: "上一期销售额"
    additivity: 比率
    dataset: FactSales
    alternate_dataset: FactOnlineSales
  - name: "销售额占比"
    aliases: ["份额", "贡献度"]
    definition: "某一组的销售额 ÷ 对应范围内的销售额合计。分母的范围由问题决定（全公司、某渠道、某品类内）。"
    numerator: "该组销售额"
    denominator: "范围内销售额合计"
    additivity: 比率
    dataset: FactSales
    alternate_dataset: FactOnlineSales
  - name: "同店销售额"
    definition: "只统计两个对比年份都有销售的门店的销售额（约定 15）。按约定 2 走全渠道销售。"
    numerator: "销售额，筛 门店在两个对比年份都有销售"
    additivity: 可加
    unit: USD
    dataset: FactSales
    conventions: [2, 15]
    note: "2008 与 2009 都有销售的门店 301 家（全部 306 家）。"
  - name: "同店销售额增长率"
    definition: "（同店本年销售额 − 同店去年销售额）÷ 同店去年销售额（约定 15）。"
    numerator: "同店本年销售额 − 同店去年销售额"
    denominator: "同店去年销售额"
    additivity: 比率
    dataset: FactSales
    conventions: [15]

  # ========== 产品属性类 ==========
  - name: "产品标价"
    definition: "DimProduct.UnitPrice。问「最贵的产品」用这一列，不用成交价（约定 9）。"
    expression: "DimProduct.UnitPrice"
    additivity: 比率
    unit: USD
    dataset: DimProduct
    conventions: [9]
  - name: "产品单位成本"
    definition: "DimProduct.UnitCost（约定 9）。"
    expression: "DimProduct.UnitCost"
    additivity: 比率
    unit: USD
    dataset: DimProduct
    conventions: [9]
  - name: "产品利润率"
    definition: "（产品标价 − 产品单位成本）÷ 产品标价，用产品表的标价和成本，不用成交价推算（约定 9）。"
    numerator: "产品标价 − 产品单位成本"
    denominator: "产品标价"
    additivity: 比率
    dataset: DimProduct
    conventions: [9]

  # ========== 库存 ==========
  - name: "当前在手库存数量"
    aliases: ["在手库存", "当前库存"]
    definition: >-
      每个门店 × 产品最近一次快照的在手数量之和（约定 11）。
      「最近一次」按门店 × 产品各自取最大快照日，不是取全局最后一个快照日。
    expression: "sum(OnHandQuantity)，筛 每个 (StoreKey, ProductKey) 的 DateKey = 该组合的 max(DateKey)"
    additivity: 半可加
    unit: "件"
    dataset: FactInventory
    conventions: [11]
    note: >-
      **在时间维度上不可加**（快照不能跨日期求和）；在门店、产品、品类等维度上可加。
      全量值：600,241 个门店 × 产品组合，在手 11,897,661 件。
  - name: "当前在手库存金额"
    aliases: ["库存金额", "库存价值"]
    definition: "每个门店 × 产品最近一次快照的 在手数量 × 单位成本 之和（约定 11）。"
    expression: "sum(OnHandQuantity * UnitCost)，筛同「当前在手库存数量」"
    additivity: 半可加
    unit: USD
    dataset: FactInventory
    conventions: [11]
    note: "全量值 1,291,296,461.45。在时间维度上不可加。"
  - name: "当前在订库存数量"
    aliases: ["在途库存"]
    definition: "每个门店 × 产品最近一次快照的在订数量之和（已下采购单未到货）。"
    expression: "sum(OnOrderQuantity)，筛同「当前在手库存数量」"
    additivity: 半可加
    unit: "件"
    dataset: FactInventory
    conventions: [11]
    note: "全量值 494,285。在时间维度上不可加。"
  - name: "当前安全库存数量"
    aliases: ["安全库存"]
    definition: "每个门店 × 产品最近一次快照的安全库存水位之和。"
    expression: "sum(SafetyStockQuantity)，筛同「当前在手库存数量」"
    additivity: 半可加
    unit: "件"
    dataset: FactInventory
    conventions: [11]
  - name: "低于安全库存的门店产品数"
    aliases: ["缺货预警数"]
    definition: "最近一次快照里 在手数量 < 安全库存水位 的门店 × 产品组合个数。"
    expression: "countIf(OnHandQuantity < SafetyStockQuantity)，筛同「当前在手库存数量」"
    additivity: 去重
    unit: "个"
    dataset: FactInventory
    conventions: [11]
    note: "全量值 89,591（占 600,241 个组合的 14.9%）。按门店 × 产品计数，不能跨行相加。"
  - name: "快照日在手库存数量"
    definition: >-
      某一个快照日的在手库存数量之和。与「当前在手库存数量」的区别是它固定在一个快照日上，
      用来看库存水位的时间趋势；「当前」那个取的是每个门店 × 产品各自最近的一次。
    expression: "sum(OnHandQuantity)，按 DateKey 分组"
    additivity: 半可加
    unit: "件"
    dataset: FactInventory
    conventions: [11]
    note: "不同快照日之间不可相加（约定 11）。快照只落在周六，156 个日期。"
  - name: "快照日在订库存数量"
    definition: "某一个快照日的在订（已下采购单未到货）数量之和。"
    expression: "sum(OnOrderQuantity)，按 DateKey 分组"
    additivity: 半可加
    unit: "件"
    dataset: FactInventory
    conventions: [11]
    note: "不同快照日之间不可相加。"
  - name: "快照日安全库存数量"
    definition: "某一个快照日的安全库存水位之和。"
    expression: "sum(SafetyStockQuantity)，按 DateKey 分组"
    additivity: 半可加
    unit: "件"
    dataset: FactInventory
    conventions: [11]
    note: "不同快照日之间不可相加。"
  - name: "快照日低于安全库存的门店产品数"
    definition: "某一个快照日里 在手数量 < 安全库存水位 的门店 × 产品组合个数。"
    expression: "countIf(OnHandQuantity < SafetyStockQuantity)，按 DateKey 分组"
    additivity: 去重
    unit: "个"
    dataset: FactInventory
    conventions: [11]
    note: "按门店 × 产品计数，不能跨行相加；也不能跨快照日相加。"
  - name: "门店产品组合数"
    definition: >-
      去重的门店 × 产品组合个数。缺货面的分母（低于安全库存的门店产品数 ÷ 门店产品组合数）。
    expression: "uniqExact((StoreKey, ProductKey))"
    additivity: 去重
    unit: "个"
    dataset: FactInventory
    note: "**不能跨行相加**。全量值 600,241。"
  - name: "快照日在手库存金额"
    definition: >-
      某一个快照日的 在手数量 × 单位成本 之和。与「当前在手库存金额」的区别是它固定在
      一个快照日上，用来看库存的时间趋势。
    expression: "sum(OnHandQuantity * UnitCost)，按 DateKey 分组"
    additivity: 半可加
    unit: USD
    dataset: FactInventory
    conventions: [11]
    note: "不同快照日之间不可相加，只能逐日看或对快照日求平均。"
  - name: "平均在手库存金额"
    definition: "各快照日的在手库存金额的平均（先按快照日汇总，再对快照日求平均）。"
    numerator: "快照日在手库存金额合计"
    denominator: "快照日个数"
    additivity: 比率
    unit: USD
    dataset: FactInventory
    conventions: [11]
  - name: "库存周转率"
    definition: "期间总成本 ÷ 平均在手库存金额。分子取全渠道销售的总成本。"
    numerator: "总成本（全渠道销售）"
    denominator: "平均在手库存金额"
    additivity: 比率
    dataset: FactInventory
    note: "跨表指标：分子在 FactSales 上，分母在 FactInventory 上，两边的时间窗口要一致。"

  # ========== 计划与销售目标 ==========
  - name: "目标销售额"
    aliases: ["销售目标", "配额"]
    definition: "销售目标表的目标销售额合计，默认取预算场景（约定 12）。"
    expression: "sum(SalesAmountQuota)"
    additivity: 可加
    unit: USD
    dataset: FactSalesQuota
    default_filters: ["ScenarioName = Budget（约定 12：正式目标看预算场景）"]
    conventions: [12]
    note: >-
      不筛场景会把三个场景加在一起。预算场景全量值 10,667,465,363.67。
      Actual 场景记的是实际值（12,413,657,608.89，与全渠道销售额相等），不是目标。
  - name: "目标销量"
    definition: "销售目标表的目标销量合计，默认取预算场景（约定 12）。"
    expression: "sum(SalesQuantityQuota)"
    additivity: 可加
    unit: "件"
    dataset: FactSalesQuota
    default_filters: ["ScenarioName = Budget"]
    conventions: [12]
    note: "预算场景全量值 44,300,085。"
  - name: "目标毛利"
    definition: "销售目标表的目标毛利合计，默认取预算场景。"
    expression: "sum(GrossMarginQuota)"
    additivity: 可加
    unit: USD
    dataset: FactSalesQuota
    default_filters: ["ScenarioName = Budget"]
    conventions: [12]
  - name: "目标达成率"
    aliases: ["完成率"]
    definition: "全渠道实际销售额 ÷ 预算场景的目标销售额（约定 12）。"
    numerator: "销售额（全渠道销售）"
    denominator: "目标销售额（预算场景）"
    additivity: 比率
    dataset: FactSales
    denominator_dataset: FactSalesQuota
    default_filters: ["分母筛 ScenarioName = Budget（约定 12）"]
    conventions: [12]
    note: >-
      跨表指标。目标是月粒度，销售是日粒度，比之前要把销售汇总到月。
      2009 年实测：实际 3,740,483,119.18 ÷ 预算目标 3,084,785,562.03 = 121.3%。
  - name: "目标差异"
    aliases: ["预算差异"]
    definition: "全渠道实际销售额 − 预算场景的目标销售额。"
    numerator: "销售额（全渠道销售） − 目标销售额（预算场景）"
    additivity: 可加
    unit: USD
    dataset: FactSales
    denominator_dataset: FactSalesQuota
    conventions: [12]
  - name: "计划金额"
    aliases: ["战略计划金额"]
    definition: >-
      战略计划表的科目金额合计。**必须同时筛场景和科目**，否则会把三个场景、
      以及收入与各类费用加在一起（约定 12）。
    expression: "sum(Amount)"
    additivity: 可加
    unit: USD
    dataset: FactStrategyPlan
    default_filters: ["必须指定 ScenarioName 与 AccountName；科目有父子关系，父子一起求和会重复计算"]
    conventions: [12]
  - name: "计划收入"
    definition: "战略计划表里 AccountName = Sale Revenue 的金额合计（约定 12 的「收入」）。默认取预算场景。"
    numerator: "计划金额，筛 AccountName = Sale Revenue"
    additivity: 可加
    unit: USD
    dataset: FactStrategyPlan
    default_filters: ["AccountName = Sale Revenue；ScenarioName = Budget"]
    conventions: [12]
    note: >-
      三方对账：Actual 场景的计划收入 12,413,657,608.89 = 全渠道销售额合计 =
      销售目标表 Actual 场景的目标销售额。Budget 场景 11,548,720,849.89。

  # ========== IT 运维 ==========
  - name: "IT 成本"
    aliases: ["设备成本", "运维成本"]
    definition: "门店 IT 设备的成本金额合计。"
    expression: "sum(CostAmount)"
    additivity: 可加
    unit: USD
    dataset: FactITMachine
    note: "全量值 240,765,805。只有 2007 / 2008 / 2009 三个日期，按年记一次。"
  - name: "停机时长"
    aliases: ["宕机时长"]
    definition: "IT 故障的停机时长合计。"
    expression: "sum(DownTime)"
    additivity: 可加
    unit: "分钟"
    dataset: FactITSLA
    note: "全量值 396,699 分钟。"
  - name: "故障次数"
    definition: "IT 故障事件的行数。"
    expression: "count()"
    additivity: 可加
    unit: "次"
    dataset: FactITSLA
    note: "全量值 4,925。"

# ---------------------------------------------------------------------------
# 数据质量：会让查询算错、而又不会报错的地方。
# 每条都标出实测数字；影响到约定清单的那几条另外记在
# decisions/open-questions.md 里交用户裁决。
# ---------------------------------------------------------------------------
data_quality:

  - id: missing-products
    severity: 高
    title: "产品维度缺 284 行，四张事实表都引用了缺失的键"
    detail: >-
      DimProduct 的 ProductKey 范围是 1 ~ 2,517（2,517 个位置），但只有 2,233 行，
      缺的 284 个键散落在 416 ~ 2,497 之间。四张事实表都引用了这些键：
      FactSales 338,898 行（9.95%，726,129,808.32 销售额，占全渠道销售额 5.85%）、
      FactOnlineSales 1,715,380 行（13.6%，152,121,858.08 销售额）、
      FactSalesQuota 521,121 行、FactInventory 533,358 行。
      这些行的单价分布正常（0.95 ~ 969，均价 98.12），不是坏行。
    impact: >-
      **内连接产品表会静默少算**：销售总额、品类合计、品牌合计都会偏低，而查询不会报错。
      「按品类看销售额」的各组之和不等于「销售额合计」。
    workaround: "需要保住总额时用左连接；缺行的产品归到一个「未知产品」组。"

  - id: inventory-weekly
    severity: 中
    title: "库存快照是每周一次，不是约定 11 说的每日"
    detail: >-
      FactInventory 只有 156 个快照日，全部落在周六，2007-01-06 ~ 2009-12-26，
      相邻间隔全是 7 天。约定 11 的原文写的是「库存是每日快照」。
    impact: >-
      「不能跨日期求和」这条仍然成立，所以按约定做出来的结果不会错；
      但「每日」的说法会让人以为任意一天都有库存数据，实际只有周六有。
    workaround: "按约定 11 的第二句做（取每个门店 × 产品最近一次快照），已做成 wide_current_inventory 视图。"
    open_question: 10

  - id: holiday-equals-weekend
    severity: 中
    title: "「节假日」在数据里就是周末"
    detail: >-
      DimDate.IsHoliday = Yes 的 731 天恰好是全部 366 个周六加 365 个周日，
      一个工作日都没有标成节假日；IsWorkDay 是同一个划分的另一种写法。
    impact: >-
      约定 4 把「节假日与平日」和「周末与工作日」并列成两种比较，在这个库里是同一个比较，
      会得到同一个结果（2009 年全渠道日均：平日 10,260,907.86、节假日 10,215,251.62）。
    workaround: "没有真正的公共假日字段可用。按哪一组字段算都一样。"
    open_question: 11

  - id: new-customer-degenerate
    severity: 中
    title: "约定 14 的「新客」在这个库里几乎恒为空"
    detail: >-
      18,869 个客户里 18,868 个的首次购买日落在 2007 年，只有 1 个落在 2009 年。
      按约定 14（首次购买日在截止日前 90 天内），2008 年之后任何窗口的新客数都是 0 或 1。
    impact: "新客数、新客销售额、新客销售额占比这三个指标在 2008 年之后的时间窗口上基本都是 0。"
    workaround: "口径按约定原文实现，不因为结果为空而改。"
    open_question: 12

  - id: online-sales-mismatch
    severity: 高
    title: "两张销售表的线上口径对不上"
    detail: >-
      FactSales 里 ChannelName = Online 的销售额 2,677,599,035.07、退货 32,983,261.29；
      FactOnlineSales 合计销售额 2,718,202,629.81、退货 29,244,318.20。
      销售额差 40,603,594.74（1.5%），退货差 3,738,943.09（12.8%）。
    impact: >-
      同一个「线上销售额」问题，用两张表会得到不同的答案。也不能把两张表相加
      （那会把线上算两遍），也不能用一张替代另一张。
    workaround: >-
      按约定 1 和 2 选表：不说渠道就用 FactOnlineSales，以门店 / 渠道为对象就用 FactSales。
      不要试图让两边对平。
    open_question: 13

  - id: promotion-vs-discount-amount
    severity: 中
    title: "全渠道销售里「挂了促销」与「有折扣金额」不一致"
    detail: >-
      FactSales 有 446,677 行 PromotionKey != 1（挂了季节性促销）但 DiscountAmount = 0。
      线上销售没有这种行（两个判定完全一致）。
    impact: "「打折交易」按促销键筛和按折扣金额筛，在全渠道销售上结果不同。"
    workaround: "按约定 10，以**促销键**为准（PromotionKey = 1 才是无折扣）。本语义层的所有折扣类指标都按促销键筛。"

  - id: store-manager-is-id
    severity: 中
    title: "DimStore.StoreManager 存的是员工号，不是姓名"
    detail: >-
      306 行的 StoreManager 全部等于 EmployeeKey 的字符串形式。
      DimSalesTerritory.SalesTerritoryManager 也是同样的做法。
    impact: "问「门店经理是谁」时，直接取 StoreManager 会返回一串数字。"
    workaround: "走 DimStore.EmployeeKey → DimEmployee，取 FirstName + LastName。"

  - id: orphan-store-employee
    severity: 低
    title: "1 家门店的经理在员工表里不存在"
    detail: "StoreKey 227（Contoso Naples Store）的 EmployeeKey = 245 在 DimEmployee 里没有对应行。"
    impact: "门店连员工表用内连接时会丢掉这家店（306 → 305）。"
    workaround: "用左连接。"

  - id: sentinel-close-date
    severity: 低
    title: "DimStore.CloseDate 用 2090-12-31 当「未关店」的哨兵值"
    detail: "294 家在营门店的 CloseDate 是 2090-12-31；12 家已关店的是 2008 ~ 2009 年的真实日期。"
    impact: "按关店日期排序或取最大值会得到 2090-12-31。"
    workaround: "先按 Status = Off 或 CloseDate != '2090-12-31' 筛掉在营门店。"

  - id: mislabeled-stylename
    severity: 低
    title: "DimProduct.StyleName 装的是产品编码，不是款式名"
    detail: >-
      StyleName 的 2,233 个取值形如 `Product0501042`，每个产品都不同，
      与 StyleID 没有对应关系（StyleID = 1 的 1,136 个产品有 1,136 个不同 StyleName）。
    impact: "按「款式」分组会得到每个产品一组。这个库里没有可用的款式字段。"
    workaround: "不要用 StyleName 作为款式。要分档位用 ClassName（Economy / Regular / Deluxe）。"

  - id: dirty-enum-values
    severity: 低
    title: "几个低基数字段里有大小写或拼写不一致的取值"
    detail: >-
      DimProduct.ColorName：`blue`（2 个产品）与 `Blue`（148 个）是同一颜色的两种写法；
      `Silver Grey`（14 个）与 `Silver`、`Grey` 并列。
      DimEmployee.DepartmentName：`'Human Resources Contral`（带前导单引号、拼写错误，1 人）
      与 `Human Resources`（6 人）。
      DimPromotion.PromotionName：`European Back-to-Scholl Promotion`（Scholl 应为 School）。
      DimGeography.RegionCountryName：3 行是空字符串（三个 Continent 级的行）。
    impact: "按这些字段分组会多出本该合并的组；按国家分组会多出一个空名字的组。"
    workaround: "需要干净分组时自己做大小写归一；或按数字码列（ColorID）分组再取名字。"

  - id: outlier-values
    severity: 低
    title: "几个数值字段有量级异常的离群值"
    detail: >-
      DimCustomer.YearlyIncome：10,000,000 这一档有 385 人，是第二高档（170,000）的约 59 倍。
      DimStore.SellingAreaSize：2 家门店是 93,800，其余 450 ~ 1,125。
      DimStore.EmployeeCount：1 家是 325，其余 7 ~ 131。
    impact: "算平均收入、坪效、人均销售额时会被这些值拉偏。"
    workaround: "需要稳健结果时用中位数，或说明里点出离群值。"

  - id: no-fact-on-employee-or-territory
    severity: 低
    title: "员工和销售辖区上没有挂任何事实表"
    detail: >-
      DimEmployee 和 DimSalesTerritory 都没有事实表直接引用。员工只能经
      DimStore.EmployeeKey（门店经理）或 DimSalesTerritory.EmployeeKey 间接参与。
    impact: "「某个销售员卖了多少」没法直接回答，只能理解成「他管的门店卖了多少」。辖区在销售分析里完全用不上。"
    workaround: "按门店经理分组时走 FactSales → DimStore → DimEmployee。"

  - id: date-dim-wider-than-facts
    severity: 低
    title: "日期维度比事实宽 1,460 天"
    detail: "DimDate 覆盖 2005-01-01 ~ 2011-12-31（2,556 天），两张销售表只有 2007-01-01 ~ 2009-12-31（1,096 天，连续无缺口）。"
    impact: "从日期维度出发做左连接会带出 1,460 个没有任何销售的日期；按日期维度算「平均每天」会把这些空天算进分母。"
    workaround: "算日均时分母用有销售的天数（见「有销售天数」指标），或先把日期范围限定到事实的区间。"

  - id: country-name-mismatch
    severity: 低
    title: "两张表的国家名写法不一致"
    detail: >-
      DimGeography.RegionCountryName 写 `United Kingdom`、`China`、`Taiwan`；
      DimSalesTerritory.SalesTerritoryCountry 写 `UK`、`Greater China`。
    impact: "两张表不能按国家名直接连接。"
    workaround: "都经 GeographyKey 连接，不要按名字连。"

# ---------------------------------------------------------------------------
# L1.5W 明细宽表。
#
# 定义在 semantic/widetables.sql，建在独立库 `dwd`（`retail` 库的原始表仍然可见）。
# 重建与核对：uv run python render/build_widetables.py
#
# 只做关联和行级派生，不做聚合，所以除「当前库存」外每个视图的行数都等于对应事实表
# （实测见 reports/validation/widetables.md）。每个派生列的口径都在上面的 metrics
# 或 conventions 里已经定义过——宽表没有引入任何新口径。
#
# 列名用中文（ClickHouse 里要加反引号引用）。重复出现在多个视图里的维度列
# （年 / 月 / 品类 / 门店城市……）含义相同，不逐个视图重复解释。
# ---------------------------------------------------------------------------
widetables:
  database: dwd
  shared_column_meanings:
    - columns: ["年", "月", "月名", "季度", "半年", "周", "星期", "星期序号"]
      description: "来自 DimDate 的时间属性。按月排序用「月」（数字），不要用「月名」（英文月名按字母排序）。「季度」「周」「月名」都不带年份，跨年分析要同时带上「年」。"
    - columns: ["是否工作日", "是否节假日"]
      description: "来自 DimDate.IsWorkDay / IsHoliday。两者是同一个划分的两种写法；本库的「节假日」就是周六周日（约定 4、data_quality / holiday-equals-weekend）。"
    - columns: ["欧洲季节", "北美季节", "亚洲季节"]
      description: "来自 DimDate 的三套销售季节，按大洲分，没有全局季节字段。"
    - columns: ["产品名", "品牌", "厂商", "颜色", "产品档位", "备货档位", "产品状态", "子类", "品类"]
      description: >-
        来自 DimProduct → DimProductSubcategory → DimProductCategory 的产品层级。
        因为产品维度缺 284 行而事实表引用了这些键，这几列在那些行上是 NULL
        （data_quality / missing-products）——这是左连接的结果，行本身没丢。
    - columns: ["产品标价", "产品单位成本"]
      description: "来自 DimProduct.UnitPrice / UnitCost。算产品利润率、问「最贵的产品」用这两列，不用成交价（约定 9）。"
    - columns: ["门店名", "门店类型", "门店状态", "门店城市", "门店省州", "门店国家", "门店大洲"]
      description: >-
        来自 DimStore 与 DimStore → DimGeography 的门店属性和**门店所在地**。
        按约定 5，只有问题明说「门店所在地」时才按这几列分析地理。
        门店类型有 4 个值：299 家 Store 是实体店，另外 7 家（3 Online / 3 Reseller / 1 Catalog）是渠道用的虚拟门店。
    - columns: ["促销名", "名义折扣率", "促销类型"]
      description: >-
        来自 DimPromotion。名义折扣率是活动的折扣率，不是实际成交折扣（看「折扣金额」）。
        同一个促销名对应三个促销键（三个年份），按促销名分组会把三年合在一起。
    - columns: ["场景"]
      description: "来自 DimScenario，取值 Actual / Budget / Forecast。**宽表没有替你筛场景**，不筛会把三份金额加在一起；正式目标 / 预算取 Budget（约定 12）。"
    - columns: ["渠道"]
      description: "来自 DimChannel，取值 Store / Online / Catalog / Reseller。渠道由门店唯一决定。"

  views:
    - name: wide_online_sales
      title: "线上销售明细宽表"
      subject: "线上订单行"
      base: retail.FactOnlineSales
      grain: "一行 = 一个线上订单行（与事实表相同）。"
      rows: 12627608
      row_count_equals_fact: true
      description: >-
        约定 1 的默认销售表加上时间、产品层级、促销、客户与客户地理，并把净销售金额、
        毛利、折扣前原价、是否打折、是否退货行做成列。
        这是唯一带客户和订单号的宽表，所以订单数、客单价、客户分层、新客、
        以及「按客户所在地」的地理问题都落在它上面。
      columns:
        - { name: "订单日期", source: FactOnlineSales.DateKey, description: "订单日期，粒度到天。" }
        - { name: "订单号", source: FactOnlineSales.SalesOrderNumber, description: "线上订单号。约定 8 的「订单」，去重计数得订单数。" }
        - { name: "订单行号", source: FactOnlineSales.SalesOrderLineNumber, description: "订单内行号，与订单号合起来唯一。" }
        - { name: "销售数量", source: FactOnlineSales.SalesQuantity, description: "销售数量（件）。只有 0 和 1：销售行 1，退货行 0。" }
        - { name: "销售金额", source: FactOnlineSales.SalesAmount, description: "销售金额（美元），已扣折扣未扣退货。退货行上是 0。" }
        - { name: "退货数量", source: FactOnlineSales.ReturnQuantity, description: "退货数量（件）。只有 0 和 1。" }
        - { name: "退货金额", source: FactOnlineSales.ReturnAmount, description: "退货金额（美元）。只出现在退货行上。" }
        - { name: "折扣数量", source: FactOnlineSales.DiscountQuantity, description: "参与折扣的数量（件）。" }
        - { name: "折扣金额", source: FactOnlineSales.DiscountAmount, description: "折扣金额（美元），已从销售金额里扣掉。" }
        - { name: "总成本", source: FactOnlineSales.TotalCost, description: "该行总成本（美元）。退货行上也大于 0。" }
        - { name: "成交单价", source: FactOnlineSales.UnitPrice, description: "成交时的单价（美元）。不是产品标价（约定 9）。" }
        - { name: "成交单位成本", source: FactOnlineSales.UnitCost, description: "成交时的单位成本（美元）。" }
        - { name: "净销售金额", derived: "销售金额 − 退货金额", metric: "净销售额", description: "行级净额（约定 7）。可加。" }
        - { name: "毛利", derived: "销售金额 − 总成本", metric: "毛利", description: "行级毛利（约定 7）。可加。线上有 369,350 行为负（含 100,166 行退货行）。" }
        - { name: "折扣前原价", derived: "销售金额 + 折扣金额", metric: "折扣前原价", description: "折前金额。折扣率的分母。" }
        - { name: "是否打折", derived: "PromotionKey != 1", description: "是否为打折交易（约定 10 以促销键为准）。线上这一列与「折扣金额 > 0」完全一致。" }
        - { name: "是否退货行", derived: "SalesQuantity = 0", description: "这一行是退货还是销售。线上销售的退货写在独立的行上，这一列把它标出来。" }
        - { name: "客户名", source: DimCustomer.FirstName, description: "客户名。最常见的取值是占位值 `Not Provided`。" }
        - { name: "客户姓", source: DimCustomer.LastName, description: "客户姓。" }
        - { name: "客户性别", source: DimCustomer.Gender, description: "客户性别，M / F。" }
        - { name: "客户婚姻状况", source: DimCustomer.MaritalStatus, description: "M = 已婚、S = 单身。" }
        - { name: "客户学历", source: DimCustomer.Education, description: "五档学历。" }
        - { name: "客户职业", source: DimCustomer.Occupation, description: "五类职业。" }
        - { name: "客户年收入", source: DimCustomer.YearlyIncome, description: "年收入（美元），17 个档。10,000,000 这一档（385 人）是离群值。" }
        - { name: "客户子女数", source: DimCustomer.TotalChildren, description: "子女总数 0 ~ 5。" }
        - { name: "客户是否有房", source: DimCustomer.HouseOwnerFlag, description: "1 = 有房、0 = 无房。" }
        - { name: "客户出生日期", source: DimCustomer.BirthDate, description: "出生日期（字符串）。算年龄以 2009-12-31 为今天（约定 3）。" }
        - { name: "客户城市", source: DimGeography.CityName, description: "**客户所在**城市（约定 5 的默认分支）。" }
        - { name: "客户省州", source: DimGeography.StateProvinceName, description: "客户所在省 / 州。" }
        - { name: "客户国家", source: DimGeography.RegionCountryName, description: "客户所在国家 / 地区。" }
        - { name: "客户大洲", source: DimGeography.ContinentName, description: "客户所在大洲，三个取值。" }
        - { name: "线上店名", source: DimStore.StoreName, description: "承接交易的线上虚拟店，只有北美 / 欧洲 / 亚洲三家。不是实体门店，不能用来回答「各门店」问题。" }
        - { name: "线上店类型", source: DimStore.StoreType, description: "恒为 `Online`。" }

    - name: wide_all_channel_sales
      title: "全渠道销售宽表"
      subject: "全渠道销售汇总行"
      base: retail.FactSales
      grain: "一行 = 一天 × 一家门店 × 一个产品 × 一个促销（与事实表相同）。"
      rows: 3406089
      row_count_equals_fact: true
      description: >-
        约定 2 的门店 / 渠道分析表，加上渠道、时间、门店与门店地理、门店经理姓名、
        产品层级、促销，并把净销售金额、毛利、折扣前原价、是否打折做成列。
        没有订单号和客户，所以回答不了订单、客单价、客户类问题。
      columns:
        - { name: "销售日期", source: FactSales.DateKey, description: "销售日期，粒度到天。" }
        - { name: "销售数量", source: FactSales.SalesQuantity, description: "销售数量（件）。汇总行，最小值 2。" }
        - { name: "销售金额", source: FactSales.SalesAmount, description: "销售金额（美元），已扣折扣未扣退货。全量合计 12,413,657,608.86。" }
        - { name: "退货数量", source: FactSales.ReturnQuantity, description: "退货数量（件），0 ~ 5。与销售在同一行上。" }
        - { name: "退货金额", source: FactSales.ReturnAmount, description: "退货金额（美元）。与销售在同一行上。" }
        - { name: "折扣数量", source: FactSales.DiscountQuantity, description: "参与折扣的数量（件），0 ~ 24。" }
        - { name: "折扣金额", source: FactSales.DiscountAmount, description: "折扣金额（美元），已从销售金额里扣掉。" }
        - { name: "总成本", source: FactSales.TotalCost, description: "总成本（美元）。" }
        - { name: "成交单价", source: FactSales.UnitPrice, description: "成交单价（美元）。" }
        - { name: "成交单位成本", source: FactSales.UnitCost, description: "成交单位成本（美元）。" }
        - { name: "净销售金额", derived: "销售金额 − 退货金额", metric: "净销售额", description: "行级净额（约定 7）。可加。" }
        - { name: "毛利", derived: "销售金额 − 总成本", metric: "毛利", description: "行级毛利（约定 7）。可加。这张表没有一行为负。" }
        - { name: "折扣前原价", derived: "销售金额 + 折扣金额", metric: "折扣前原价", description: "折前金额。全部 3,406,089 行都满足 销售金额 = 成交单价 × 销售数量 − 折扣金额。" }
        - name: "是否打折"
          derived: "PromotionKey != 1"
          description: >-
            是否为打折交易（约定 10 以促销键为准）。注意这一列与「折扣金额 > 0」**不等价**：
            有 446,677 行是 true 但折扣金额为 0（data_quality / promotion-vs-discount-amount）。
        - { name: "门店开业日", source: DimStore.OpenDate, description: "门店开业日（字符串）。" }
        - { name: "门店营业面积", source: DimStore.SellingAreaSize, description: "营业面积（单位数据里没写）。坪效的分母。2 家门店是 93,800，是离群值。" }
        - { name: "门店员工数", source: DimStore.EmployeeCount, description: "门店员工数。门店人均销售额的分母。1 家是 325，是离群值。" }
        - name: "门店经理"
          derived: "concat(DimEmployee.FirstName, ' ', DimEmployee.LastName)"
          description: >-
            门店经理姓名，经 DimStore.EmployeeKey → DimEmployee 取得。
            **不是** DimStore.StoreManager（那一列存的是员工号字符串）。
            StoreKey 227 的经理在员工表里不存在，这一列在那家店上是空的。
        - { name: "门店经理职级", source: DimEmployee.Title, description: "门店经理的职级，绝大多数是 `Sales Store Manager`。" }

    - name: wide_current_inventory
      title: "当前库存宽表"
      subject: "当前库存"
      base: retail.FactInventory
      grain: "一行 = 一个门店 × 产品组合的**最近一次**快照。"
      rows: 600241
      row_count_equals_fact: false
      row_count_note: >-
        这是唯一行数不等于事实表的视图：按约定 11 做了行筛选，从 8,013,099 行快照里
        取出每个门店 × 产品最近一次的那一行，剩 600,241 行（= 门店 × 产品组合数）。
        筛选条件是「该组合的快照日 = 该组合的最大快照日」，不是「全局最后一个快照日」
        ——各组合的最后一次快照并不在同一天（最多的 2009-12-26 只占 27,425 组）。
        视图本身**不做聚合**，每一行都是原始快照行加两个行级派生列。
      description: >-
        把约定 11 的「当前库存」口径编码进视图，省掉每次都要写一遍「取最近一次快照」。
        由此得到的在手数量合计 11,897,661、在手库存金额 1,291,296,461.45、
        低于安全库存的组合 89,591 个。
      columns:
        - { name: "快照日期", source: FactInventory.DateKey, description: "这一行所属的快照日。各门店 × 产品不一定相同。快照只落在周六。" }
        - { name: "在手数量", source: FactInventory.OnHandQuantity, description: "在手库存数量（件）。已经是「最近一次」，可以直接按门店 / 产品 / 品类求和；**不要再跨快照日求和**。" }
        - { name: "在订数量", source: FactInventory.OnOrderQuantity, description: "已下采购单未到货的数量（件）。" }
        - { name: "安全库存水位", source: FactInventory.SafetyStockQuantity, description: "该门店 × 产品设定的安全库存水位（件）。" }
        - { name: "库存单位成本", source: FactInventory.UnitCost, description: "快照时点的单位成本（美元）。" }
        - { name: "在库天数", source: FactInventory.DaysInStock, description: "在库天数，5 ~ 119。" }
        - { name: "在手库存金额", derived: "在手数量 × 库存单位成本", metric: "当前在手库存金额", description: "行级库存金额（美元）。" }
        - { name: "是否低于安全库存", derived: "在手数量 < 安全库存水位", description: "缺货预警标志。为 true 的组合有 89,591 个（14.9%）。" }

    - name: wide_sales_quota
      title: "销售目标宽表"
      subject: "销售目标"
      base: retail.FactSalesQuota
      grain: "一行 = 一个月 × 渠道 × 门店 × 产品 × 场景（与事实表相同）。"
      rows: 7465911
      row_count_equals_fact: true
      description: >-
        把销售目标接上时间、渠道、门店与门店地理、产品层级、场景名（约定 12）。
        没有做任何行级派生，因为目标表的三个度量本身就是终值。
      cautions:
        - "**三个场景都在表里**，用之前必须按「场景」筛选（正式目标 = Budget），否则金额放大三倍。"
        - "目标是月粒度，要和销售比先把销售汇总到月。"
      columns:
        - { name: "目标月份", source: FactSalesQuota.DateKey, description: "目标所属月份，取值是每月 1 号。36 个月。" }
        - { name: "目标销售额", source: FactSalesQuota.SalesAmountQuota, metric: "目标销售额", description: "目标销售额（美元）。目标达成率的分母（取 Budget 场景）。" }
        - { name: "目标销量", source: FactSalesQuota.SalesQuantityQuota, metric: "目标销量", description: "目标销量（件）。" }
        - { name: "目标毛利", source: FactSalesQuota.GrossMarginQuota, metric: "目标毛利", description: "目标毛利（美元），有负值。" }

    - name: wide_strategy_plan
      title: "战略计划宽表"
      subject: "战略计划"
      base: retail.FactStrategyPlan
      grain: "一行 = 一个月 × 实体 × 场景 × 科目 × 品类（与事实表相同）。"
      rows: 2750628
      row_count_equals_fact: true
      description: >-
        把战略计划接上时间、场景名、科目名与方向、实体、**门店**（经 DimEntity ←
        DimStore.EntityKey，这是计划和门店之间唯一的桥梁）和品类（约定 12）。
      cautions:
        - "**三个场景、17 个科目都在表里**，用之前必须同时筛场景和科目，否则会把三份金额、以及收入与各类费用加在一起。"
        - "科目有父子关系，父子科目一起求和会重复计算（看「科目有父级」列）。"
      columns:
        - { name: "计划月份", source: FactStrategyPlan.DateKey, description: "计划所属月份，每月 1 号。36 个月。" }
        - { name: "计划金额", source: FactStrategyPlan.Amount, metric: "计划金额", description: "科目金额（美元）。含义随科目变：收入类科目是收入，费用类科目是费用，都记为正数。" }
        - { name: "科目", source: DimAccount.AccountName, description: "会计科目名。约定 12 的「收入」= `Sale Revenue`。" }
        - { name: "科目方向", source: DimAccount.AccountType, description: "Income / Expense / Taxation。" }
        - { name: "科目有父级", derived: "DimAccount.ParentAccountKey IS NOT NULL", description: "这个科目在科目树上有没有父级。用来提醒不要把父子科目一起求和。" }
        - { name: "实体名", source: DimEntity.EntityName, description: "计划实体名。计划只挂在门店级实体上，所以这一列等于门店名。" }
        - { name: "实体层级", source: DimEntity.EntityType, description: "恒为 `Store`（计划只挂门店级实体）。" }
        - { name: "实体所属上级", source: DimEntity.ParentEntityLabel, description: "实体的上级名字（反范式化）。门店级实体这里是州名；线上店和目录店的上级是国家。按州看计划可以直接用这一列分组。" }
