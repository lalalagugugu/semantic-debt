      **没有任何事实表挂在员工上**，员工只能通过 DimStore.EmployeeKey（门店经理）
      和 DimSalesTerritory.EmployeeKey（辖区负责人）间接参与分析。
      所以「某个员工卖了多少」这类问题只能理解成「他管的门店卖了多少」。
