    grain: "一行 = 一天（DateKey 唯一）。"
    description: >-
      日期维度，2005-01-01 ~ 2011-12-31。**比事实宽**：两张销售表只覆盖 2007-01-01 ~
      2009-12-31（1,096 天），日期维度另外 1,460 天没有任何销售。从日期维度出发做左连接
      会带出这些空天。
      财年与日历年完全相同（FiscalYear = CalendarYear，季度和半年标签也一样），
      所以本库里没有财年与日历年之分。
    when_to_use: "按年 / 半年 / 季 / 月 / 周 / 星期几分析时；比较节假日与平日、周末与工作日、季节时（约定 4）。"
    cautions:
      - "「节假日」与「周末」在这个库里是同一个划分，见 IsHoliday 的说明。"
      - "季节有三套，按大洲分，没有全局季节字段。"
    columns:
      - name: DateKey
        description: "日期，2005-01-01 ~ 2011-12-31，每天一行共 2,556 天。"
        role: key
      - name: CalendarYear
        description: "日历年，2005 ~ 2011 的整数。"
      - name: CalendarYearLabel
        description: "日历年的文字标签。排序和筛选用 CalendarYear（整数）更方便。"
        values:
          - { value: "Year 2005", meaning: "2005 年，365 天（无销售数据）" }
          - { value: "Year 2006", meaning: "2006 年，365 天（无销售数据）" }
          - { value: "Year 2007", meaning: "2007 年，365 天" }
          - { value: "Year 2008", meaning: "2008 年，366 天（闰年）。约定 3 的「去年」" }
          - { value: "Year 2009", meaning: "2009 年，365 天。约定 3 的「今年」" }
          - { value: "Year 2010", meaning: "2010 年，365 天（无销售数据）" }
          - { value: "Year 2011", meaning: "2011 年，365 天（无销售数据）" }
      - name: CalendarHalfYearLabel
        description: "半年标签。"
        values:
          - { value: "H1", meaning: "上半年，1,268 天" }
          - { value: "H2", meaning: "下半年，1,288 天" }
      - name: CalendarQuarterLabel
        description: "季度标签。注意只有 Q1 ~ Q4，不带年份，跨年分析时必须同时带上年。"
        values:
          - { value: "Q1", meaning: "一季度，631 天" }
          - { value: "Q2", meaning: "二季度，637 天" }
          - { value: "Q3", meaning: "三季度，644 天" }
          - { value: "Q4", meaning: "四季度，644 天（约定 3 说的「上季度」= 2009 年 Q4）" }
      - name: CalendarMonthLabel
