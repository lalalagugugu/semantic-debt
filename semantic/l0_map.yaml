# L0 劣化映射（T09）：「坏交付」版本的语义层。
#
# L0 只作用于原始的 25 张表（retail 库）；明细宽表、汇总层和指标不参与 L0。
# 它只改名字和元数据，不动数据行：chDB 里 L0 是独立库 `l0` 的一组视图，
# 底层仍是 retail 的原表（render/build_l0.py 从本文件生成 render/l0_views.sql）。
#
# L0 档 agent 看到的只有：表名、列名、列类型、下面「保留」的关系、技术字段。
# 没有任何描述、同义词、约定和指标口径（本文件里也就不写这些）。
# relationships.dropped 里的 why 只给人看，渲染器（T10）不得把它渲染进 L0 上下文。
#
# 命名规则：
#   - 表名：fct_ / d_ 前缀 + 缩写。
#   - 键和维度属性：全局一张字典，同一个原列名在所有表里改成同一个缩写
#     （如 DateKey → dk）。所以原来「键名一致」的关系在 L0 里仍然键名一致，
#     原来键名不一致的（FactSales.channelKey 对 DimChannel.ChannelKey、父子自连接）
#     在 L0 里也不一致。改名不额外制造、也不额外抹掉键名线索。
#   - 事实表的代理主键一律 row_id；度量列按表内位置用 amt1 / qty1 / rt1 / d1 这类
#     通用名，同名在不同表里可以指不同的东西（如 fct_sls_qta.amt1 是目标销售额）。
#   - 可逆：在同一张表内，L0 列名与原列名一一对应；L0 表名与原表名一一对应。
#     由（L0 表名, L0 列名）能唯一还原（原表名, 原列名）。tests/test_l0_map.py 校验。
#
# 技术字段：每张事实表 2–3 列，全部是常量或由 DateKey 决定的确定性表达式，
# 追加在原列之后，不替换、不删除任何原列：
#   etl_btch_id  加载批次号（= 业务日期的 yyyymmdd）
#   src_sys_cd   来源系统码（每张表一个常量）
#   load_dttm    加载时间（业务日期次日 02:00 UTC）
# expr 里引用的是 retail 原表的列名。
#
# 关系：source.yaml 的 48 条关系里保留 32 条、删 16 条（三分之一），SQL 和 DAX 用同一份。
# 优先删「非显然」的：键名不一致的（父子自连接、channelKey 大小写、门店 / 辖区的
# 员工键）、维度到维度的二跳（雪花链），再加三条事实表上的非显然连接。

version: 1
source_database: retail
database: l0

tables:
  - source: FactOnlineSales
    l0: fct_ol_sls
    columns:
      OnlineSalesKey:       row_id
      DateKey:              dk
      StoreKey:             stk
      ProductKey:           prk
      PromotionKey:         pmk
      CurrencyKey:          cyk
      CustomerKey:          csk
      SalesOrderNumber:     ord_no
      SalesOrderLineNumber: ln_no
      SalesQuantity:        qty1
      SalesAmount:          amt1
      ReturnQuantity:       qty2
      ReturnAmount:         amt2
      DiscountQuantity:     qty3
      DiscountAmount:       amt3
      TotalCost:            amt4
      UnitCost:             uc
      UnitPrice:            up
    technical_columns:
      - {name: etl_btch_id, expr: "toUInt32(toYYYYMMDD(DateKey))"}
      - {name: src_sys_cd, expr: "'ECOM01'"}
      - {name: load_dttm, expr: "toDateTime(DateKey, 'UTC') + toIntervalHour(26)"}
  - source: FactSales
    l0: fct_sls
    columns:
      SalesKey:         row_id
      DateKey:          dk
      channelKey:       chnk
      StoreKey:         stk
      ProductKey:       prk
      PromotionKey:     pmk
      CurrencyKey:      cyk
      UnitCost:         uc
      UnitPrice:        up
      SalesQuantity:    qty1
      ReturnQuantity:   qty2
      ReturnAmount:     amt2
      DiscountQuantity: qty3
      DiscountAmount:   amt3
      TotalCost:        amt4
      SalesAmount:      amt1
    technical_columns:
      - {name: etl_btch_id, expr: "toUInt32(toYYYYMMDD(DateKey))"}
      - {name: src_sys_cd, expr: "'POS02'"}
      - {name: load_dttm, expr: "toDateTime(DateKey, 'UTC') + toIntervalHour(26)"}
  - source: FactInventory
