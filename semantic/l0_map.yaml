      SalesAmountQuota:   amt1
      GrossMarginQuota:   amt2
    technical_columns:
      - {name: etl_btch_id, expr: "toUInt32(toYYYYMMDD(DateKey))"}
      - {name: src_sys_cd, expr: "'PLN01'"}
      - {name: load_dttm, expr: "toDateTime(DateKey, 'UTC') + toIntervalHour(26)"}
  - source: FactStrategyPlan
    l0: fct_stg_pln
    columns:
      StrategyPlanKey:    row_id
      DateKey:            dk
      EntityKey:          enk
      ScenarioKey:        scnk
      AccountKey:         acct_k
      CurrencyKey:        cyk
