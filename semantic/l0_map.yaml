relationships:
  # 按原表名写；渲染器按上面的映射换成 L0 名。kept + dropped 恰好是 source.yaml 的全部关系。
  kept:
    - {from: FactOnlineSales.DateKey, to: DimDate.DateKey}
    - {from: FactOnlineSales.CustomerKey, to: DimCustomer.CustomerKey}
    - {from: FactOnlineSales.ProductKey, to: DimProduct.ProductKey}
    - {from: FactOnlineSales.StoreKey, to: DimStore.StoreKey}
    - {from: FactOnlineSales.PromotionKey, to: DimPromotion.PromotionKey}
    - {from: FactOnlineSales.CurrencyKey, to: DimCurrency.CurrencyKey}
    - {from: FactSales.DateKey, to: DimDate.DateKey}
    - {from: FactSales.StoreKey, to: DimStore.StoreKey}
    - {from: FactSales.ProductKey, to: DimProduct.ProductKey}
    - {from: FactSales.PromotionKey, to: DimPromotion.PromotionKey}
    - {from: FactSales.CurrencyKey, to: DimCurrency.CurrencyKey}
    - {from: FactInventory.DateKey, to: DimDate.DateKey}
    - {from: FactInventory.StoreKey, to: DimStore.StoreKey}
    - {from: FactInventory.ProductKey, to: DimProduct.ProductKey}
    - {from: FactInventory.CurrencyKey, to: DimCurrency.CurrencyKey}
    - {from: FactSalesQuota.DateKey, to: DimDate.DateKey}
    - {from: FactSalesQuota.StoreKey, to: DimStore.StoreKey}
    - {from: FactSalesQuota.ProductKey, to: DimProduct.ProductKey}
    - {from: FactSalesQuota.ScenarioKey, to: DimScenario.ScenarioKey}
    - {from: FactSalesQuota.CurrencyKey, to: DimCurrency.CurrencyKey}
    - {from: FactStrategyPlan.DateKey, to: DimDate.DateKey}
    - {from: FactStrategyPlan.ScenarioKey, to: DimScenario.ScenarioKey}
    - {from: FactStrategyPlan.AccountKey, to: DimAccount.AccountKey}
    - {from: FactStrategyPlan.CurrencyKey, to: DimCurrency.CurrencyKey}
    - {from: FactExchangeRate.CurrencyKey, to: DimCurrency.CurrencyKey}
    - {from: FactExchangeRate.DateKey, to: DimDate.DateKey}
    - {from: FactITMachine.MachineKey, to: DimMachine.MachineKey}
    - {from: FactITMachine.DateKey, to: DimDate.DateKey}
    - {from: FactITSLA.DateKey, to: DimDate.DateKey}
    - {from: FactITSLA.StoreKey, to: DimStore.StoreKey}
    - {from: FactITSLA.MachineKey, to: DimMachine.MachineKey}
    - {from: FactITSLA.OutageKey, to: DimOutage.OutageKey}

  dropped:
    # 键名不一致
    - {from: FactSales.channelKey, to: DimChannel.ChannelKey, why: "子表列名首字母小写，键名不一致"}
    - {from: DimStore.EmployeeKey, to: DimEmployee.EmployeeKey, why: "门店经理键，类型是 Float64，且门店表另有字符串型的 StoreManager 干扰"}
    - {from: DimSalesTerritory.EmployeeKey, to: DimEmployee.EmployeeKey, why: "辖区负责人键，类型是 Float64"}
    - {from: DimAccount.ParentAccountKey, to: DimAccount.AccountKey, why: "父子自连接，键名不一致"}
    - {from: DimEmployee.ParentEmployeeKey, to: DimEmployee.EmployeeKey, why: "父子自连接，键名不一致"}
    - {from: DimEntity.ParentEntityKey, to: DimEntity.EntityKey, why: "父子自连接，键名不一致"}
    # 维度到维度的二跳（雪花链）
    - {from: DimCustomer.GeographyKey, to: DimGeography.GeographyKey, why: "事实 → 客户 → 地理的第二跳"}
    - {from: DimStore.GeographyKey, to: DimGeography.GeographyKey, why: "事实 → 门店 → 地理的第二跳"}
    - {from: DimStore.EntityKey, to: DimEntity.EntityKey, why: "计划 → 实体 ← 门店的桥，类型是 Float64"}
    - {from: DimProduct.ProductSubcategoryKey, to: DimProductSubcategory.ProductSubcategoryKey, why: "事实 → 产品 → 子类的第二跳，类型是 Float64"}
    - {from: DimProductSubcategory.ProductCategoryKey, to: DimProductCategory.ProductCategoryKey, why: "子类 → 品类，事实 → 品类的第三跳"}
    - {from: DimMachine.StoreKey, to: DimStore.StoreKey, why: "设备 → 门店；故障表另有直连门店的键，两条路径"}
    - {from: DimSalesTerritory.GeographyKey, to: DimGeography.GeographyKey, why: "辖区 → 地理的维度间连接"}
    # 事实表上的非显然连接
    - {from: FactStrategyPlan.EntityKey, to: DimEntity.EntityKey, why: "计划挂在实体而不是门店上，要经实体表才能接到门店"}
    - {from: FactStrategyPlan.ProductCategoryKey, to: DimProductCategory.ProductCategoryKey, why: "计划直挂品类，跳过产品和子类，与销售表的路径不同"}
    - {from: FactSalesQuota.ChannelKey, to: DimChannel.ChannelKey, why: "与门店路径冗余（渠道由门店决定）"}
