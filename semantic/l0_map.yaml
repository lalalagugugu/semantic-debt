      MaxDayInStock:       d3
      Aging:               d4
    technical_columns:
      - {name: etl_btch_id, expr: "toUInt32(toYYYYMMDD(DateKey))"}
      - {name: src_sys_cd, expr: "'WMS01'"}
      - {name: load_dttm, expr: "toDateTime(DateKey, 'UTC') + toIntervalHour(26)"}
  - source: FactSalesQuota
    l0: fct_sls_qta
    columns:
      SalesQuotaKey:      row_id
      ChannelKey:         chk
      StoreKey:           stk
      ProductKey:         prk
      DateKey:            dk
      CurrencyKey:        cyk
