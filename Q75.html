mer_year\n    GROUP BY customer_key, first_name, last_name\n)\nSELECT\n    customer_key AS customer_id,\n    CASE\n        WHEN (first_name IS NULL OR first_name = 'Not Provided')\n             AND (last_name IS NULL OR last_name = 'Not Provided')\n            THEN CAST(customer_key AS TEXT)\n        WHEN first_name IS NULL OR first_name = 'Not Provided'\n            THEN last_name\n        WHEN last_name IS NULL OR last_name = 'Not Provided'\n            THEN first_name\n        ELSE first_name || ' ' || last_name\n    END AS customer_name,\n    sales_2008 AS sales_2008_usd,\n    sales_2009 AS sales_2009_usd,\n    sales_2009 - sales_2008 AS growth_amount_usd,\n    (sales_2009 - sales_2008) / NULLIF(sales_2008, 0) * 100 AS growth_pct\nFROM customer_pivot\nWHERE sales_2008 \u003e 0\n  AND sales_2009 \u003e= sales_2008 * 1.5\nORDER BY growth_pct DESC, customer_id;","refused":false,"rep":1,"rows":[[19121.0,"19121",27319.84999999997,8758594.787000816,8731274.937000817,31959.45415879233],[18928.0,"18928",49400.000000000015,2263563.149999952,2214163.149999952,4482.111639676014],[18932.0,"18932",61466.40000000003,2631877.309999907,2570410.909999907,4181.814633685893],[18931.0,"18931",60099.20000000014,2536645.209999947,2476546.0099999467,4120.763687370116],[19064.0,"19064",287457.59999999905,11690625.242998928,11403167.642998928,3966.9042123078207],[18935.0,"18935",57609.60000000003,2264671.909999934,2207062.309999934,3831.066888157413],[18929.0,"18929",55854.399999999994,2165486.169999972,2109631.769999972,3777.0198408719316],[19120.0,"19120",241349.8499999989,9267611.829000903,9026261.979000904,3739.9078470531244],[18930.0,"18930",59491.19999999997,2265031.139999945,2205539.939999945,3707.3381273195805],[18933.0,"18933",59769.59999999994,2242271.849999885,2182502.249999885,3651.5256083358217],[18934.0,"18934",54920.00000000005,2012835.5899999382,1957915.5899999382,3565.032028404837],[18927.0,"18927",57313.599999999904,2022562.4469999634,1965248.8469999635,3428.9398100973
