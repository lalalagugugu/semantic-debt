":47995,"cache_miss_tokens":134,"completion_tokens":1509,"prompt_tokens":48129,"reasoning_tokens":1504}}],"SQL-L0":[{"assumption":"同店指 2008、2009 两年均有销售记录的门店，销售额取 `l0.fct_sls.amt1`，产品品类取 `l0.d_prd_cat.pc_nm`，降幅按（2008销售额 − 2009销售额）÷ 2008销售额计算。","columns":[{"name":"名次","type":"UInt64"},{"name":"门店","type":"String"},{"name":"门店销售减少额","type":"Float64"},{"name":"门店降幅百分比","type":"Float64"},{"name":"拖累最大的产品品类","type":"Nullable(String)"},{"name":"品类销售减少额","type":"Float64"},{"name":"占门店总减少额百分比","type":"Nullable(Float64)"}],"content_correct":1,"delivery_correct":0,"execution_status":"ok","query":"WITH\nstore_year AS (\n    SELECT\n        s.stk AS stk,\n        sumIf(s.amt1, dt.c_yr = 2008) AS sales_2008,\n        sumIf(s.amt1, dt.c_yr = 2009) AS sales_2009\n    FROM l0.fct_sls s\n    INNER JOIN l0.d_dt dt ON s.dk = dt.dk\n    WHERE dt.c_yr IN (2008, 2009)\n    GROUP BY s.stk\n    HAVING sumIf(s.amt1, dt.c_yr = 2008) \u003e 0\n       AND sumIf(s.amt1, dt.c_yr = 2009) \u003e 0\n       AND sumIf(s.amt1, dt.c_yr = 2009) \u003c sumIf(s.amt1, dt.c_yr = 2008)\n),\nstore_decline AS (\n    SELECT\n        stk AS stk,\n        sales_2008 AS sales_2008,\n        sales_2009 AS sales_2009,\n        sales_2008 - sales_2009 AS store_decrease_amt,\n        (sales_2008 - sales_2009) / sales_2008 * 100 AS store_decline_pct\n    FROM store_year\n),\ntop_stores AS (\n    SELECT\n        stk AS stk,\n        store_decrease_amt AS store_decrease_amt,\n        store_decline_pct AS store_decline_pct,\n        row_number() OVER (ORDER BY store_decline_pct DESC) AS rn\n    FROM store_decline\n    ORDER BY store_decline_pct DESC\n    LIMIT 3\n),\nstore_cat_year AS (\n    SELECT\n        s.stk AS stk,\n        dpc.pck AS cat_pck,\n        dpc.pc_nm AS cat_pc_nm,\n        sumIf(s.amt1, dt.c_yr = 2008) AS cat_sales_2008,\n        sumIf(s.amt1, dt.c_yr = 2009) AS cat_sales_2009\n    FROM l0.fct_sls s\n    INNER JOIN l0.d_dt dt ON s.dk = dt.dk\n    INNER JOIN l0.d_prd p ON s.prk = p.prk\n    LEFT JOIN l0.d_prd_sub ps ON p.psck = ps.psck\n    LEFT JOIN l0.d_prd_cat dpc ON ps.pck = dpc.pck\n    WHERE dt.c_yr IN (2008, 2009)\n      AND s.stk IN (SELECT stk FROM top_stores)\n    GROUP BY s.stk, dpc.pck, dpc.pc_nm\n),\ncat_decrease AS (\n    SELECT\n        stk AS stk,\n        cat_pck AS cat_pck,\n        cat_pc_nm AS cat_pc_nm,\n        cat_sales_2008 - cat_sales_2009 AS category_decrease_amt\n    FROM store_cat_year\n),\ntop_cat AS (\n    SELECT\n        stk AS stk,\n        cat_pck AS cat_pck,\n        cat_pc_nm AS cat_pc_nm,\n        category_decrease_amt AS category_decrease_amt,\n        row_number() OVER (PARTITION BY stk ORDER BY category_decrease_amt DESC) AS cat_rn\n    FROM cat_decrease\n)\nSELECT\n    ts.rn AS `名次`,\n    str.st_nm AS `门店`,\n    ts.store_decrease_amt AS `门店销售减少额`,\n    ts.store_decline_pct AS `门店降幅百分比`,\n    multiIf(tc.cat_pck IS NULL, '未分类',\n            tc.cat_pc_nm IS NULL OR tc.cat_pc_nm = '', toString(tc.cat_pck),\n            tc.cat_pc_nm) AS `拖累最大的产品品类`,\n    tc.category_decrease_amt AS `品类销售减少额`,\n    tc.category_decrease_amt / nullIf(ts.store_decrease_amt, 0) * 100 AS `占门店总减少额百分比`\nFROM top_stores ts\nINNER JOIN l0.d_str str ON ts.stk = str.stk\nINNER JOIN top_cat tc ON ts.stk = tc.stk AND tc.cat_rn = 1\nORDER BY ts.rn\nSETTINGS join_use_nulls = 1","refused":false,"rep":1,"rows":[[1,"Contoso Fond du Lac Store",3004355.642999999,38.46518884040378,"Home Appliances",978662.5745000001,32.574791096394854],[2,"Contoso Russellville Store",2867214.098500002,37.92568269998299,"Computers",803528.9124999997,28.02472661251108],[3,"Contoso Oshkosh Store",2645668.5770000005,35.107733941869526,"Home Appliances",900232.8865,34.02666888536734]],"rules":[],"source_run":"20261018-T13-sql-direct-01","total_rows":3,"usage":{"cache_hit_tokens":11648,"cache_miss_tokens":1370,"completion_tokens":12797,"prompt_tokens":13018,"reasoning_tokens":10802}},{"assumption":"同店指2008和2009两年均有销售额的门店；销售额取 fct_sls.amt1；产品品类优先取 d_prd_cat.pc_nm，缺失时退回子类或产品编码。","columns":[{"name":"store_rank","type":"UInt64"},{"name":"stk","type":"Int32"},{"name":"store_name","type":"String"},{"name":"sales_2008","type":"Float64"},{"name":"sales_2009","type":"Float64"},{"name":"store_decrease_amt","type":"Float64"},{"name":"store_decline_pct","type":"Nullable(Float64)"},{"name":"product_category","type":"String"},{"name":"category_decrease_amt","type":"Float64"},{"name":"category_share_pct","type":"Nullable(Float64)"}],"content_correct":1,"delivery_correct":0,"execution_status":"ok","query":"WITH\nstore_year AS (\n    SELECT\n        s.stk AS stk,\n        d.c_yr AS c_yr,\n        sum(s.amt1) AS sales\n    FROM l0.fct_sls AS s\n    INNER JOIN l0.d_dt AS d ON s.dk = d.dk\n    WHERE d.c_yr IN (2008, 2009)\n    GROUP BY s.stk, d.c_yr\n),\nstore_totals AS (\n    SELECT\n        stk,\n        sumIf(sales, c_yr = 2008) AS sales_2008,\n        sumIf(sales, c_yr = 2009) AS sales_2009\n    FROM store_year\n    GROUP BY stk\n),\nstore_decline AS (\n    SELECT\n        stk,\n        sales_2008,\n        sales_2009,\n        sales_2008 - sales_2009 AS store_decrease_amt,\n        (sales_2008 - sales_2009) / nullIf(sales_2008, 0) AS store_decline_rate\n    FROM store_totals\n    WHERE sales_2008 \u003e 0\n      AND sales_2009 \u003e 0\n      AND sales_2009 \u003c sales_2008\n    ORDER BY store_decline_rate DESC\n    LIMIT 3\n),\ncat_year AS (\n    SELECT\n        s.stk AS stk,\n        d.c_yr AS c_yr,\n        coalesce(\n            nullIf(c.pc_nm, ''),\n            nullIf(p.cls_nm, ''),\n            concat('未分类-', toString(s.prk))\n        ) AS product_category,\n        sum(s.amt1) AS sales\n    FROM l0.fct_sls AS s\n    INNER JOIN l0.d_dt AS d ON s.dk = d.dk\n    LEFT JOIN l0.d_prd AS p ON s.prk = p.prk\n    LEFT JOIN l0.d_prd_sub AS ps ON p.psck = ps.psck\n    LEFT JOIN l0.d_prd_cat AS c ON ps.pck = c.pck\n    WHERE d.c_yr IN (2008, 2009)\n    GROUP BY s.stk, d.c_yr, product_category\n),\ncat_decline AS (\n    SELECT\n        stk,\n        product_category,\n        sumIf(sales, c_yr = 2008) - sumIf(sales, c_yr = 2009) AS category_decrease_amt\n    FROM cat_year\n    GROUP BY stk, product_category\n),\ntop_category AS (\n    SELECT\n        stk,\n        product_category,\n        category_decrease_amt,\n        row_number() OVER (PARTITION BY stk ORDER BY category_decrease_amt DESC) AS rn\n    FROM cat_decline\n    WHERE category_decrease_amt \u003e 0\n),\nfinal AS (\n    SELECT\n        sd.stk AS stk,\n        if(str.st_nm = '', toString(sd.stk), str.st_nm) AS store_name,\n        sd.sales_2008 AS sales_2008,\n        sd.sales_2009 AS sales_2009,\n        sd.store_decrease_amt AS store_decrease_amt,\n        round(sd.store_decline_rate * 100, 2) AS store_decline_pct,\n        tc.product_category AS product_category,\n        tc.category_decrease_amt AS category_decrease_amt,\n        round(tc.category_decrease_amt / nullIf(sd.store_decrease_amt, 0) * 100, 2) AS category_share_pct,\n        row_number() OVER (ORDER BY sd.store_decline_rate DESC) AS store_rank\n    FROM store_decline AS sd\n    INNER JOIN top_category AS tc ON sd.stk = tc.stk AND tc.rn = 1\n    LEFT JOIN l0.d_str AS str ON sd.stk = str.stk\n)\nSELECT\n    store_rank,\n    stk,\n    store_name,\n    sales_2008,\n    sales_2009,\n    store_decrease_amt,\n    store_decline_pct,\n    product_category,\n    category_decrease_amt,\n    category_share_pct\nFROM final\nORDER BY store_rank;","refused":false,"rep":2,"rows":[[1,46,"Contoso Fond du Lac Store",7810583.370499999,4806227.727499999,3004355.643,38.47,"Home Appliances",978662.5744999994,32.57],[2,71,"Contoso Russellville Store",7560085.658000002,4692871.5594999995,2867214.098500002,37.93,"Computers",803528.9125000001,28.02],[3,45,"Contoso Oshkosh Store",7535856.861,4890188.284,2645668.5769999996,35.11,"Home Appliances",900232.8865,34.03]],"rules":[],"source_run":"20261018-T13-sql-direct-01","total_rows":3,"usage":{"cache_hit_tokens":5760,"cache_miss_tokens":248,"completion_tokens":9591,"prompt_tokens":6008,"reasoning_tokens":8619}},{"assumption":"使用日历年2008和2009全年数据，以 l0.fct_sls.amt1 作为销售额，同店限定为两年均有销售的门店，并将 d_prd.cls_nm 视为产品品类（缺失时用产品编码）。","columns":[{"name":"名次","type":"UInt64"},{"name":"门店","type":"String"},{"name":"门店降幅百分比","type":"Float64"},{"name":"品类","type":"String"},{"name":"品类销售减少额","type":"Float64"},{"name":"门店总减少额","type":"Float64"},{"name":"占门店总减少额百分比","type":"Float64"}],"content_correct":0,"delivery_correct":0,"execution_status":"ok","query":"WITH\nstore_year AS (\n    SELECT\n        s.stk,\n        sumIf(s.amt1, dd.c_yr = 2008) AS sales_2008,\n        sumIf(s.amt1, dd.c_yr = 2009) AS sales_2009\n    FROM l0.fct_sls AS s\n    INNER JOIN l0.d_dt AS dd ON s.dk = dd.dk\n    WHERE dd.c_yr IN (2008, 2009)\n    GROUP BY s.stk\n),\nstore_decline AS (\n    SELECT\n        stk,\n        sales_2008,\n        sales_2009,\n        (sales_2008 - sales_2009) / sales_2008 * 100 AS decline_pct,\n        sales_2008 - sales_2009 AS total_reduction\n    FROM store_year\n    WHERE sales_2008 \u003e 0\n      AND sales_2009 \u003e 0\n      AND sales_2009 \u003c sales_2008\n),\ntop_stores AS (\n    SELECT\n        stk,\n        sales_2008,\n        sales_2009,\n        decline_pct,\n        total_reduction,\n        row_number() OVER (ORDER BY decline_pct DESC) AS rn\n    FROM store_decline\n    ORDER BY decline_pct DESC\n    LIMIT 3\n),\nstore_cat AS (\n    SELECT\n        s.stk,\n        ifNull(nullIf(p.cls_nm, ''), toString(s.prk)) AS cat_name,\n        sumIf(s.amt1, dd.c_yr = 2008) AS cat_sales_2008,\n        sumIf(s.amt1, dd.c_yr = 2009) AS cat_sales_2009\n    FROM l0.fct_sls AS s\n    INNER JOIN l0.d_dt AS dd ON s.dk = dd.dk\n    LEFT JOIN l0.d_prd AS p ON s.prk = p.prk\n    WHERE dd.c_yr IN (2008, 2009)\n    GROUP BY s.stk, cat_name\n),\ncat_reduction AS (\n    SELECT\n        stk,\n        cat_name,\n        cat_sales_2008 - cat_sales_2009 AS cat_reduction\n    FROM store_cat\n),\nranked_cat AS (\n    SELECT\n        cr.stk,\n        cr.cat_name,\n        cr.cat_reduction,\n        row_number() OVER (PARTITION BY cr.stk ORDER BY cr.cat_reduction DESC) AS cat_rn\n    FROM cat_reduction AS cr\n    INNER JOIN top_stores AS ts ON cr.stk = ts.stk\n)\nSELECT\n    ts.rn AS `名次`,\n    ifNull(nullIf(st.st_nm, ''), toString(ts.stk)) AS `门店`,\n    round(ts.decline_pct, 2) AS `门店降幅百分比`,\n    rc.cat_name AS `品类`,\n    round(rc.cat_reduction, 2) AS `品类销售减少额`,\n    round(ts.total_reduction, 2) AS `门店总减少额`,\n    round(rc.cat_reduction / ts.total_reduction * 100, 2) AS `占门店总减少额百分比`\nFROM top_stores AS ts\nLEFT JOIN l0.d_str AS st ON ts.stk = st.stk\nINNER JOIN ranked_cat AS rc ON ts.stk = rc.stk AND rc.cat_rn = 1\nORDER BY ts.rn;","refused":false,"rep":3,"rows":[[1,"Contoso Fond du Lac Store",38.47,"Regular",2026181.36,3004355.64,67.44],[2,"Contoso Russellville Store",37.93,"Regular",1991676.51,2867214.1,69.46],[3,"Contoso Oshkosh Store",35.11,"Regular",2032279.65,2645668.58,76.82]],"rules":[],"source_run":"20261018-T13-sql-direct-01","total_rows":3,"usage":{"cache_hit_tokens":5760,"cache_miss_tokens":248,"completion_tokens":10489,"prompt_tokens":6008,"reasoning_tokens":9674}}],"SQL-L0-E":[{"assumption":"同店指 2008 与 2009 两年在 l0.fct_sls 中均有销售的门店；降幅按（2008 年销售额 − 2009 年销售额）÷ 2008 年销售额计算，取降幅最大的 3 家；品类划分采用 d_prd_cat 中的品类名称。","columns":[{"name":"名次","type":"UInt64"},{"name":"门店编码","type":"Int32"},{"name":"门店名称","type":"String"},{"name":"2008年销售额","type":"Float64"},{"name":"2009年销售额","type":"Float64"},{"name":"门店降幅百分比","type":"Float64"},{"name":"门店销售减少额","type":"Float64"},{"name":"拖累最大的产品品类","type":"String"},{"name":"品类销售减少额","type":"Float64"},{"name":"占门店总减少额百分比","type":"Nullable(Float64)"}],"content_correct":1,"delivery_correct":0,"execution_status":"ok","query":"WITH sy AS (\n    SELECT stk, toYear(dk) AS yr, sum(amt1) AS amt\n    FROM l0.fct_sls\n    WHERE dk \u003e= toDate('2008-01-01') AND dk \u003c= toDate('2009-12-31')\n    GROUP BY stk, yr\n),\ncmp AS (\n    SELECT a.stk AS stk,\n           a.amt AS amt_2008,\n           b.amt AS amt_2009,\n           a.amt - b.amt AS store_dec_amt,\n           (a.amt - b.amt) / a.amt * 100 AS store_dec_pct\n    FROM sy AS a\n    INNER JOIN sy AS b ON a.stk = b.stk AND a.yr = 2008 AND b.yr = 2009\n    WHERE a.amt \u003e 0 AND b.amt \u003c a.amt\n),\ntop3 AS (\n    SELECT * FROM cmp ORDER BY store_dec_pct DESC, store_dec_amt DESC LIMIT 3\n),\ncy AS (\n    SELECT s.stk AS stk, toYear(s.dk) AS yr, pc.pc_nm AS pc_nm, sum(s.amt1) AS amt\n    FROM l0.fct_sls AS s\n    INNER JOIN l0.d_prd AS p ON s.prk = p.prk\n    INNER JOIN l0.d_prd_sub AS ps ON p.psck = ps.psck\n    INNER JOIN l0.d_prd_cat AS pc ON ps.pck = pc.pck\n    WHERE s.dk \u003e= toDate('2008-01-01') AND s.dk \u003c= toDate('2009-12-31')\n    GROUP BY s.stk, yr, pc.pc_nm\n),\ncatdec AS (\n    SELECT t.stk AS stk,\n           t.store_dec_amt AS store_dec_amt,\n           t.store_dec_pct AS store_dec_pct,\n           t.amt_2008 AS amt_2008,\n           t.amt_2009 AS amt_2009,\n           c8.pc_nm AS pc_nm,\n           c8.amt - coalesce(c9.amt, 0) AS cat_dec_amt\n    FROM top3 AS t\n    INNER JOIN cy AS c8 ON c8.stk = t.stk AND c8.yr = 2008\n    LEFT JOIN cy AS c9 ON c9.stk = t.stk AND c9.yr = 2009 AND c9.pc_nm = c8.pc_nm\n),\nranked AS (\n    SELECT cd.*, d.st_nm AS st_nm,\n           row_number() OVER (PARTITION BY cd.stk ORDER BY cd.cat_dec_amt DESC, cd.pc_nm) AS rn\n    FROM catdec AS cd\n    INNER JOIN l0.d_str AS d ON cd.stk = d.stk\n)\nSELECT row_number() OVER (ORDER BY store_dec_pct DESC, store_dec_amt DESC) AS `名次`,\n       stk AS `门店编码`,\n       st_nm AS `门店名称`,\n       round(amt_2008, 2) AS `2008年销售额`,\n       round(amt_2009, 2) AS `2009年销售额`,\n       round(store_dec_pct, 2) AS `门店降幅百分比`,\n       round(store_dec_amt, 2) AS `门店销售减少额`,\n       pc_nm AS `拖累最大的产品品类`,\n       round(cat_dec_amt, 2) AS `品类销售减少额`,\n       round(cat_dec_amt / nullIf(store_dec_amt, 0) * 100, 2) AS `占门店总减少额百分比`\nFROM ranked\nWHERE rn = 1\nORDER BY store_dec_pct DESC, store_dec_amt DESC","refused":false,"rep":1,"rows":[[1,46,"Contoso Fond du L  2008 的正数百分比计算，销售额缺失产品归属的品类归入「未知产品」组。","columns":[{"name":"名次","type":"UInt64"},{"name":"门店名称","type":"String"},{"name":"门店降幅%","type":"Nullable(Float64)"},{"name":"拖累最大的产品品类","type":"String"},{"name":"该品类销售减少额","type":"Float64"},{"name":"占门店总减少额%","type":"Nullable(Float64)"}],"content_correct":1,"delivery_correct":0,"execution_status":"ok","query":"WITH\n    fact AS (\n        SELECT\n            f.StoreKey AS StoreKey,\n            f.ProductKey AS ProductKey,\n            f.SalesAmount AS SalesAmount,\n            toYear(f.DateKey) AS yr\n        FROM retail.FactSales AS f\n        WHERE f.DateKey \u003e= toDate('2008-01-01')\n          AND f.DateKey \u003c toDate('2010-01-01')\n    ),\n    store_year AS (\n        SELECT\n            StoreKey,\n            yr,\n            sum(SalesAmount) AS sales\n        FROM fact\n        GROUP BY StoreKey, yr\n    ),\n    store_growth AS (\n        SELECT\n            s8.StoreKey AS StoreKey,\n            st.StoreName AS StoreName,\n            s8.sales AS sales_2008,\n            s9.sales AS sales_2009,\n            s8.sales - s9.sales AS decrease_amount,\n            (s8.sales - s9.sales) / nullIf(s8.sales, 0) * 100 AS decrease_pct\n        FROM store_year AS s8\n        INNER JOIN store_year AS s9\n            ON s8.StoreKey = s9.StoreKey\n           AND s8.yr = 2008\n           AND s9.yr = 2009\n        INNER JOIN retail.DimStore AS st\n            ON st.StoreKey = s8.StoreKey\n        WHERE s9.sales \u003c s8.sales\n    ),\n    top_stores AS (\n        SELECT\n            StoreKey,\n            StoreName,\n            sales_2008,\n            sales_2009,\n            decrease_amount,\n            decrease_pct,\n            row_number() OVER (ORDER BY decrease_pct DESC, StoreKey) AS rn\n        FROM store_growth\n        ORDER BY decrease_pct DESC, StoreKey\n        LIMIT 3\n    ),\n    cat_year AS (\n        SELECT\n            f.StoreKey AS StoreKey,\n            coalesce(pc.ProductCategoryName, '未知产品') AS category_name,\n            sumIf(f.SalesAmount, f.yr = 2008) AS sales_2008,\n            sumIf(f.SalesAmount, f.yr = 2009) AS sales_2009\n        FROM fact AS f\n        LEFT JOIN retail.DimProduct AS p\n            ON f.ProductKey = p.ProductKey\n        LEFT JOIN retail.DimProductSubcategory AS ps\n            ON p.ProductSubcategoryKey = toFloat64(ps.ProductSubcategoryKey)\n        LEFT JOIN retail.DimProductCategory AS pc\n            ON ps.ProductCategoryKey = pc.ProductCategoryKey\n        GROUP BY f.StoreKey, category_name\n    ),\n    cat_decrease AS (\n        SELECT\n            StoreKey,\n            category_name,\n            sales_2008 - sales_2009 AS decrease_amount\n        FROM cat_year\n        WHERE sales_2008 - sales_2009 \u003e 0\n    ),\n    cat_rank AS (\n        SELECT\n            c.StoreKey AS StoreKey,\n            c.category_name AS category_name,\n            c.decrease_amount AS decrease_amount,\n            row_number() OVER (\n                PARTITION BY c.StoreKey\n                ORDER BY c.decrease_amount DESC, c.category_name\n            ) AS cat_rn\n        FROM cat_decrease AS c\n        INNER JOIN top_stores AS t\n            ON c.StoreKey = t.StoreKey\n    )\nSELECT\n    t.rn AS `名次`,\n    t.StoreName AS `门店名称`,\n    round(t.decrease_pct, 2) AS `门店降幅%`,\n    c.category_name AS `拖累最大的产品品类`,\n    round(c.decrease_amount, 2) AS `该品类销售减少额`,\n    round(c.decrease_amount / nullIf(t.decrease_amount, 0) * 100, 2) AS `占门店总减少额%`\nFROM top_stores AS t\nINNER JOIN cat_rank AS c\n    ON t.StoreKey = c.StoreKey\n   AND c.cat_rn = 1\nORDER BY t.rn\nSETTINGS join_use_nulls = 1;","refused":false,"rep":1,"rows":[[1,"Contoso Fond du Lac Store",38.47,"Home Appliances",978662.57,32.57],[2,"Contoso Russellville Store",37.93,"Computers",803528.91,28.02],[3,"Contoso Oshkosh Store",35.11,"Home Appliances",900232.89,34.03]],"rules":[],"source_run":"20261018-T13-sql-direct-01","total_rows":3,"usage":{"cache_hit_tokens":92800,"cache_miss_tokens":1271,"completion_tokens":10057,"prompt_tokens":94071,"reasoning_tokens":8212}},{"assumption":"同店口径只比较 2008 和 2009 都有销售的门店，门店降幅按（2008 销售额 − 2009 销售额）÷ 2008 销售额计算；「拖累最多的品类」取该门店内销售减少额最大的品类，产品品类经产品→子类→品类关联，产品表中缺失的产品归为「未知产品」。","columns":[{"name":"名次","type":"UInt64"},{"name":"门店","type":"String"},{"name":"门店编码","type":"Int32"},{"name":"门店降幅(%)","type":"Float64"},{"name":"拖累最多的产品品类","type":"String"},{"name":"该品类销售减少额","type":"Float64"},{"name":"占门店总减少额百分比(%)","type":"Nullable(Float64)"}],"content_correct":1,"delivery_correct":0,"execution_status":"ok","query":"WITH\n    store_year AS (\n        SELECT\n            StoreKey,\n            sumIf(SalesAmount, toYear(DateKey) = 2008) AS sales_2008,\n            sumIf(SalesAmount, toYear(DateKey) = 2009) AS sales_2009\n        FROM retail.FactSales\n        WHERE toYear(DateKey) IN (2008, 2009)\n        GROUP BY StoreKey\n    ),\n    top3 AS (\n        SELECT\n            StoreKey,\n            sales_2008,\n            sales_2009,\n            (sales_2008 - sales_2009) / sales_2008 AS decline_rate,\n            sales_2008 - sales_2009 AS total_decrease\n        FROM store_year\n        WHERE sales_2008 \u003e 0\n          AND sales_2009 \u003e 0\n          AND sales_2009 \u003c sales_2008\n        ORDER BY decline_rate DESC, StoreKey\n        LIMIT 3\n    ),\n    line AS (\n        SELECT\n            f.StoreKey AS sk,\n            coalesce(nullIf(pc.ProductCategoryName, ''), '未知产品') AS category_name,\n            sumIf(f.SalesAmount, toYear(f.DateKey) = 2008) AS s08,\n            sumIf(f.SalesAmount, toYear(f.DateKey) = 2009) AS s09\n        FROM retail.FactSales AS f\n        INNER JOIN top3 AS t ON f.StoreKey = t.StoreKey\n        LEFT JOIN retail.DimProduct AS p ON f.ProductKey = p.ProductKey\n        LEFT JOIN retail.DimProductSubcategory AS ps ON p.ProductSubcategoryKey = ps.ProductSubcategoryKey\n        LEFT JOIN retail.DimProductCategory AS pc ON ps.ProductCategoryKey = pc.ProductCategoryKey\n        WHERE toYear(f.DateKey) IN (2008, 2009)\n        GROUP BY sk, category_name\n    ),\n    best AS (\n        SELECT\n            sk,\n            argMax(category_name, s08 - s09) AS category_name,\n            max(s08 - s09) AS decrease\n        FROM line\n        GROUP BY sk\n    )\nSELECT\n    row_number() OVER (ORDER BY r.decline_rate DESC, r.StoreKey) AS `名次`,\n    r.StoreName AS `门店`,\n    r.StoreKey AS `门店编码`,\n    round(r.decline_rate * 100, 2) AS `门店降幅(%)`,\n    r.category_name AS `拖累最多的产品品类`,\n    round(r.decrease, 2) AS `该品类销售减少额`,\n    round(r.decrease / nullIf(r.total_decrease, 0) * 100, 2) AS `占门店总减少额百分比(%)`\nFROM (\n    SELECT\n        t.StoreKey AS StoreKey,\n        t.decline_rate AS decline_rate,\n        t.total_decrease AS total_decrease,\n        s.StoreName AS StoreName,\n        b.category_name AS category_name,\n        b.decrease AS decrease\n    FROM top3 AS t\n    INNER JOIN retail.DimStore AS s ON t.StoreKey = s.StoreKey\n    INNER JOIN best AS b ON t.StoreKey = b.sk\n) AS r\nORDER BY r.decline_rate DESC, r.StoreKey","refused":false,"rep":2,"rows":[[1,"Contoso Fond du Lac Store",46,38.47,"Home Appliances",978662.57,32.57],[2,"Contoso Russellville Store",71,37.93,"Computers",803528.91,28.02],[3,"Contoso Oshkosh Store",45,35.11,"Home Appliances",900232.89,34.03]],"rules":[],"source_run":"20261018-T13-sql-direct-01","total_rows":3,"usage":{"cache_hit_tokens":92800,"cache_miss_tokens":1121,"completion_tokens":9599,"prompt_tokens":93921,"reasoning_tokens":7999}},{"assumption":"「降幅最大」按同店销售额的同比下降率（2008→2009）排序；同店指 2008 和 2009 都有销售的门店；缺失产品维度的销售归入「未知品类」。","columns":[{"name":"store_rank","type":"UInt64"},{"name":"store_name","type":"String"},{"name":"store_decline_amount","type":"Float64"},{"name":"store_decline_pct","type":"Nullable(Float64)"},{"name":"top_category","type":"String"},{"name":"category_decrease_amount","type":"Float64"},{"name":"category_share_of_store_decline_pct","type":"Nullable(Float64)"}],"content_correct":1,"delivery_correct":0,"execution_status":"ok","query":"WI egory_decrease_amount\n    FROM store_category\n    WHERE sales_2008 - sales_2009 \u003e 0\n),\ntop_category_per_store AS (\n    SELECT\n        StoreKey,\n        category_name,\n        category_decrease_amount,\n        row_number() OVER (\n            PARTITION BY StoreKey\n            ORDER BY category_decrease_amount DESC, category_name ASC\n        ) AS rn\n    FROM category_decrease\n)\nSELECT\n    row_number() OVER (\n        ORDER BY ts.store_decline_pct DESC, ts.store_decline_amount DESC\n    ) AS store_rank,\n    ds.StoreName AS store_name,\n    ts.store_decline_amount AS store_decline_amount,\n    round(ts.store_decline_pct, 2) AS store_decline_pct,\n    tc.category_name AS top_category,\n    tc.category_decrease_amount AS category_decrease_amount,\n    round(\n        tc.category_decrease_amount / nullIf(ts.store_decline_amount, 0) * 100,\n        2\n    ) AS category_share_of_store_decline_pct\nFROM top_stores AS ts\nINNER JOIN retail.DimStore AS ds ON ts.StoreKey = ds.StoreKey\nINNER JOIN top_category_per_store AS tc\n    ON ts.StoreKey = tc.StoreKey AND tc.rn = 1\nORDER BY ts.store_decline_pct DESC, ts.store_decline_amount DESC","refused":false,"rep":3,"rows":[[1,"Contoso Fond du Lac Store",3004355.643000001,38.47,"Home Appliances",978662.5744999994,32.57],[2,"Contoso Russellville Store",2867214.098500004,37.93,"Computers",803528.9125000001,28.02],[3,"Contoso Oshkosh Store",2645668.5770000024,35.11,"Home Appliances",900232.8864999998,34.03]],"rules":[],"source_run":"20261018-T13-sql-direct-01","total_rows":3,"usage":{"cache_hit_tokens":46336,"cache_miss_tokens":189,"completion_tokens":8318,"prompt_tokens":46525,"reasoning_tokens":7398}}],"SQL-L1-E":[{"assumption":"同店指 2008、2009 两年均有销售的门店；门店降幅按销售减少额 ÷ 2008 年销售额计算，拖累最多按品类销售减少额最大判断，降幅和减少额均用正数表示。","columns":[{"name":"名次","type":"UInt64"},{"name":"门店","type":"String"},{"name":"门店降幅(%)","type":"Float64"},{"name":"拖累最大的产品品类","type":"String"},{"name":"品类销售减少额","type":"Float64"},{"name":"占门店总减少额(%)","type":" \n    WHERE `年` IN (2008, 2009)\n    GROUP BY store_name\n),\ntop_stores AS (\n    SELECT\n        store_name,\n        s2008,\n        s2009,\n        s2008 - s2009 AS store_decrease,\n        (s2008 - s2009) / s2008 AS decline_rate\n    FROM store_year\n    WHERE s2008 \u003e 0 AND s2009 \u003e 0 AND s2009 \u003c s2008\n    ORDER BY decline_rate DESC, store_name\n    LIMIT 3\n),\ncat_sales AS (\n    SELECT\n        `门店名` AS store_name,\n        `品类` AS category,\n        sumIf(`销售额`, `年` = 2008) - sumIf(`销售额`, `年` = 2009) AS category_decrease\n    FROM ads.ads_quota_month_channel_store_category\n    WHERE `年` IN (2008, 2009)\n      AND `门店名` IN (SELECT store_name FROM top_stores)\n    GROUP BY store_name, category\n),\nbest_cat AS (\n    SELECT\n        store_name,\n        category,\n        category_decrease,\n        row_number() OVER (PARTITION BY store_name ORDER BY category_decrease DESC, category) AS rn\n    FROM cat_sales\n)\nSELECT\n    row_number() OVER (ORDER BY t.decline_rate DESC, t.store_name) AS `名次`,\n    t.store_name AS `门店名`,\n    round(t.decline_rate * 100, 2) AS `门店降幅百分比`,\n    b.category AS `拖累最多的品类`,\n    round(b.category_decrease, 2) AS `该品类销售减少额`,\n    round(b.category_decrease / t.store_decrease * 100, 2) AS `占门店总减少额百分比`\nFROM top_stores t\nINNER JOIN best_cat b\n    ON t.store_name = b.store_name AND b.rn = 1\nORDER BY `名次`","refused":false,"rep":1,"rows":[[1,"Contoso Fond du Lac Store",38.47,"Home Appliances",978662.57,32.57],[2,"Contoso Russellville Store",37.93,"Computers",803528.91,28.02],[3,"Contoso Oshkosh Store",35.11,"Home Appliances",900232.89,34.03]],"rules":[],"source_run":"20261019-T13-l15s-v14-01","total_rows":3,"usage":{"cache_hit_tokens":67456,"cache_miss_tokens":923,"completion_tokens":9292,"prompt_tokens":68379,"reasoning_tokens":8151}},{"assumption":"同店口径按语义层约定只要求门店在 2008、2009 两年都有销售，未额外限定门店类型；门店降幅按销售额下降率计算。","columns":[{"name":"名次","type":"UInt64"},{"name":"门店名","type":"String"},{"name":"门店类型","type":"Nullable(String)"} nt,\n            (category_sales_2008 - category_sales_2009) / nullIf(category_sales_2008, 0) * 100 AS category_decline_pct,\n            (category_sales_2008 - category_sales_2009) / nullIf(store_decrease_amount, 0) * 100 AS category_share_of_store_decrease_pct\n        FROM store_category\n    ),\n    category_ranked AS (\n        SELECT\n            *,\n            rank() OVER (PARTITION BY StoreKey ORDER BY category_decrease_amount DESC) AS category_rank,\n            row_number() OVER (\n                PARTITION BY StoreKey\n                ORDER BY category_decrease_amount DESC, ifNull(category_key, -1) ASC, ifNull(category_name, '') ASC\n            ) AS category_rn\n        FROM store_category_metrics\n    )\nSELECT\n    StoreKey AS store_key,\n    StoreName AS store_name,\n    store_sales_2008,\n    store_sales_2009,\n    store_decrease_amount,\n    store_decline_pct,\n    category_key,\n    category_name,\n    category_sales_2008,\n    category_sales_2009,\n    category_decrease_amount,\n    category_decline_pct,\n    category_share_of_store_decrease_pct,\n    store_rank,\n    category_rank\nFROM category_ranked\nWHERE category_rn = 1\nORDER BY store_rank, store_key\nSETTINGS join_use_nulls = 1","refused":false,"rep":1,"rows":[[46,"Contoso Fond du Lac Store",7810583.370500004,4806227.727499999,3004355.643000005,38.46518884040383,8,"Home Appliances",2686016.7744999947,1707354.199999998,978662.5744999966,36.435460261865856,32.57479109639468,1,1],[71,"Contoso Russellville Store",7560085.658000002,4692871.5595,2867214.0985000012,37.925682699982985,3,"Computers",1501603.1125,698074.2000000001,803528.9125,53.51140429925021,28.024726612511095,2,1],[45,"Contoso Oshkosh Store",7535856.8610000005,4890188.284,2645668.5770000005,35.107733941869526,8,"Home Appliances",2571668.979999997,1671436.0934999993,900232.8864999979,35.00578392869206,34.026668885367265,3,1]],"rules":[],"source_run":"20261025-T30-combo-01","total_rows":3,"usage":{"cache_hit_tokens":81024,"cache_m     SUM(CASE WHEN year = 2009 THEN sales_amount ELSE 0 END) AS sales_2009\n  FROM store_year\n  GROUP BY store_key, store_name\n),\ndeclining AS (\n  SELECT\n    store_key,\n    store_name,\n    sales_2008,\n    sales_2009,\n    sales_2008 - sales_2009 AS reduction_amount,\n    CAST(sales_2008 - sales_2009 AS DOUBLE PRECISION) / NULLIF(sales_2008, 0) AS decline_rate\n  FROM store_pivot\n  WHERE sales_2008 \u003e 0\n    AND sales_2009 \u003e 0\n    AND sales_2009 \u003c sales_2008\n),\ntop3 AS (\n  SELECT\n    store_key,\n    store_name,\n    sales_2008,\n    sales_2009,\n    reduction_amount,\n    decline_rate\n  FROM declining\n  ORDER BY decline_rate DESC, store_key\n  LIMIT 3\n),\ncategory_year AS (\n  SELECT\n    sales.StoreKey AS store_key,\n    product_category.ProductCategoryName AS category_name,\n    DATE_TRUNC('year', sales.DateKey) AS year_start,\n    MEASURE(sales.sales_amount) AS sales_amount\n  FROM product_category\n  CROSS JOIN (\n    product_subcategory\n    CROSS JOIN (\n      sales\n      CROSS JOIN product\n    )\n  )\n  WHERE sales.DateKey \u003e= DATE '2008-01-01'\n    AND sales.DateKey \u003c DATE '2010-01-01'\n    AND product_category.ProductCategoryName IS NOT NULL\n  GROUP BY sales.StoreKey, product_category.ProductCategoryName, DATE_TRUNC('year', sales.DateKey)\n),\ncategory_pivot AS (\n  SELECT\n    store_key,\n    category_name,\n    SUM(CASE WHEN EXTRACT(YEAR FROM year_start) = 2008 THEN sales_amount ELSE 0 END) AS sales_2008,\n    SUM(CASE WHEN EXTRACT(YEAR FROM year_start) = 2009 THEN sales_amount ELSE 0 END) AS sales_2009,\n    SUM(CASE WHEN EXTRACT(YEAR FROM year_start) = 2008 THEN sales_amount ELSE 0 END)\n      - SUM(CASE WHEN EXTRACT(YEAR FROM year_start) = 2009 THEN sales_amount ELSE 0 END) AS category_reduction\n  FROM category_year\n  GROUP BY store_key, category_name\n),\nknown_sum AS (\n  SELECT\n    store_key,\n    SUM(category_reduction) AS known_reduction\n  FROM category_pivot\n  GROUP BY store_key\n),\ncandidates AS (\n gory_name,\n        sales_2008 - sales_2009 AS category_decline_amount\n    FROM cat_agg\n),\ncat_rank AS (\n    SELECT\n        StoreKey,\n        category_name,\n        category_decline_amount,\n        row_number() OVER (\n            PARTITION BY StoreKey\n            ORDER BY category_decline_amount DESC, category_name ASC\n        ) AS cat_rn\n    FROM cat_decline\n    WHERE category_decline_amount \u003e 0\n)\nSELECT\n    ts.rn AS rank,\n    ds.StoreName AS store_name,\n    ts.decline_rate * 100 AS store_decline_rate_pct,\n    cr.category_name AS dragged_category,\n    cr.category_decline_amount AS category_decline_amount,\n    cr.category_decline_amount / nullIf(ts.decline_amount, 0) * 100 AS category_decline_share_pct\nFROM selected_stores ts\nLEFT JOIN retail.DimStore ds\n    ON ts.StoreKey = ds.StoreKey\nLEFT JOIN cat_rank cr\n    ON ts.StoreKey = cr.StoreKey\n   AND cr.cat_rn = 1\nORDER BY ts.rn;","refused":false,"rep":1,"rows":[[1,"Contoso Fond du Lac Store",38.465188840403826,"Home Appliances",978662.5745000008,32.574791096394826],[2,"Contoso Russellville Store",37.92568269998299,"Computers",803528.9125000002,28.024726612511095],[3,"Contoso Oshkosh Store",35.10773394186952,"Home Appliances",900232.8865000005,34.02666888536736]],"rules":[],"source_run":"20261025-T22b-l1plus-l3a-03","total_rows":3,"usage":{"cache_hit_tokens":219648,"cache_miss_tokens":245,"completion_tokens":5250,"prompt_tokens":219893,"reasoning_tokens":4389}},{"assumption":"降幅最大按门店销售额同比降幅（(2008 − 2009) ÷ 2008）排序，品类拖累按该门店内品类销售额减少额最大认定，同店按 2008 与 2009 两年都有销售的门店计算。","columns":[{"name":"名次","type":"UInt64"},{"name":"门店编码","type":"Int32"},{"name":"门店名称","type":"Nullable(String)"},{"name":"2008销售额","type":"Float64"},{"name":"2009销售额","type":"Float64"},{"name":"门店销售减少额","type":"Float64"},{"name":"门店降幅(%)","type":"Nullable(Float64)"},{"name":"拖累最大的产品品类","type":"String"},{"name":"该品类销售减少额","type":"Float64"},{"name":"占门店总减少额百分比(%)","type":"Nullable(Float64)"}],"content_correct":1,"delivery_correct":0,"execution_status":"ok","query":"WITH\nstore_year AS (\n    SELECT\n        StoreKey,\n        sumIf(SalesAmount, toYear(DateKey) = 2008) AS sales_2008,\n        sumIf(SalesAmount, toYear(DateKey) = 2009) AS sales_2009\n    FROM retail.FactSales\n    WHERE DateKey \u003e= toDate('2008-01-01') AND DateKey \u003c= toDate('2009-12-31')\n    GROUP BY StoreKey\n),\nsame_store_decline AS (\n    SELECT\n        StoreKey,\n        sales_2008,\n        sales_2009,\n        sales_2008 - sales_2009 AS store_decrease,\n        (sales_2008 - sales_2009) / nullIf(sales_2008, 0) AS store_decline_rate\n    FROM store_year\n    WHERE sales_2008 \u003e 0\n      AND sales_2009 \u003e 0\n      AND sales_2009 \u003c sales_2008\n),\ntop_stores AS (\n    SELECT\n        StoreKey,\n        sales_2008,\n        sales_2009,\n        store_decrease,\n        store_decline_rate,\n        row_number() OVER (\n            ORDER BY store_decline_rate DESC, store_decrease DESC, StoreKey\n        ) AS rn\n    FROM same_store_decline\n    ORDER BY store_decline_rate DESC, store_decrease DESC, StoreKey\n    LIMIT 3\n),\nstore_category_year AS (\n    SELECT\n        f.StoreKey,\n        ifNull(c.ProductCategoryName, '未知') AS category_name,\n        sumIf(f.SalesAmount, toYear(f.DateKey) = 2008) AS cat_sales_2008,\n        sumIf(f.SalesAmount, toYear(f.DateKey) = 2009) AS cat_sales_2009\n    FROM retail.FactSales f\n    LEFT JOIN retail.DimProduct p\n        ON f.ProductKey = p.ProductKey\n    LEFT JOIN retail.DimProductSubcategory s\n        ON p.ProductSubcategoryKey = s.ProductSubcategoryKey\n    LEFT JOIN retail.DimProductCategory c\n        ON s.ProductCategoryKey = c.ProductCategoryKey\n    WHERE f.DateKey \u003e= toDate('2008-01-01') AND f.DateKey \u003c= toDate('2009-12-31')\n    GROUP BY f.StoreKey, ifNull(c.ProductCategoryName, '未知')\n),\ncategory_decrease AS (\n    SELECT\n        t.StoreKey,\n        t.sales_2008,\n        t.sales_2009,\n        t.store_decrease,\n        t.store_dec error","query":"WITH store_year AS (\n  SELECT\n    StoreKey,\n    sumIf(SalesAmount, toYear(DateKey) = 2008) AS sales_2008,\n    sumIf(SalesAmount, toYear(DateKey) = 2009) AS sales_2009,\n    countIf(toYear(DateKey) = 2008) AS rows_2008,\n    countIf(toYear(DateKey) = 2009) AS rows_2009\n  FROM retail.FactSales\n  WHERE toYear(DateKey) IN (2008, 2009)\n  GROUP BY StoreKey\n),\ndeclining AS (\n  SELECT\n    StoreKey,\n    sales_2008,\n    sales_2009,\n    (sales_2008 - sales_2009) / nullIf(sales_2008, 0) AS decline_rate\n  FROM store_year\n  WHERE rows_2008 \u003e 0\n    AND rows_2009 \u003e 0\n    AND sales_2008 \u003e 0\n    AND sales_2009 \u003c sales_2008\n),\ntop3 AS (\n  SELECT StoreKey, sales_2008, sales_2009, decline_rate\n  FROM declining\n  ORDER BY decline_rate DESC, StoreKey ASC\n  LIMIT 3\n),\nstore_cat AS (\n  SELECT\n    f.StoreKey AS StoreKey,\n    if(isNull(dpc.ProductCategoryName), '未知', dpc.ProductCategoryName) AS category_name,\n    sumIf(f.SalesAmount, toYear(f.DateKey) = 2008)\n      - sumIf(f.SalesAmount, toYear(f.DateKey) = 2009) AS decrease_amount\n  FROM retail.FactSales AS f\n  INNER JOIN top3 AS t ON f.StoreKey = t.StoreKey\n  LEFT JOIN retail.DimProduct AS dp ON f.ProductKey = dp.ProductKey\n  LEFT JOIN retail.DimProductSubcategory AS dps ON dp.ProductSubcategoryKey = dps.ProductSubcategoryKey\n  LEFT JOIN retail.DimProductCategory AS dpc ON dps.ProductCategoryKey = dpc.ProductCategoryKey\n  WHERE toYear(f.DateKey) IN (2008, 2009)\n  GROUP BY f.StoreKey, category_name\n),\ncat_pick AS (\n  SELECT\n    StoreKey,\n    argMax(category_name, decrease_amount) AS category_name,\n    max(decrease_amount) AS decrease_amount\n  FROM store_cat\n  WHERE decrease_amount \u003e 0\n  GROUP BY StoreKey\n)\nSELECT\n  row_number() OVER (ORDER BY decline_rate DESC, StoreKey ASC) AS store_rank,\n  StoreKey,\n  StoreName,\n  store_decline_pct,\n  category_name,\n  category_sales_decrease,\n  category_share_of_store_decrease_pct\nFROM (\n  SELECT\n    t.Stor  pc.ProductCategoryKey,\n        pc.ProductCategoryName\n),\nstore_year AS (\n    SELECT\n        StoreKey,\n        toYear(DateKey) AS YearNum,\n        sum(SalesAmount) AS SalesAmount\n    FROM retail.FactSales\n    WHERE toYear(DateKey) IN (2008, 2009)\n    GROUP BY StoreKey, toYear(DateKey)\n),\nstore_compare AS (\n    SELECT\n        s08.StoreKey AS StoreKey,\n        s08.SalesAmount AS SalesAmount2008,\n        s09.SalesAmount AS SalesAmount2009,\n        s08.SalesAmount - s09.SalesAmount AS SalesDecrease,\n        (s08.SalesAmount - s09.SalesAmount) / nullIf(s08.SalesAmount, 0) * 100 AS DecreasePct\n    FROM store_year AS s08\n    INNER JOIN store_year AS s09\n        ON s08.StoreKey = s09.StoreKey\n    WHERE s08.YearNum = 2008\n      AND s09.YearNum = 2009\n      AND s09.SalesAmount \u003c s08.SalesAmount\n),\ntop_stores AS (\n    SELECT\n        StoreKey,\n        SalesAmount2008,\n        SalesAmount2009,\n        SalesDecrease,\n        DecreasePct\n    FROM store_compare\n    ORDER BY DecreasePct DESC\n    LIMIT 3\n),\ncategory_compare AS (\n    SELECT\n        StoreKey,\n        ProductCategoryKey,\n        ProductCategoryName,\n        sumIf(SalesAmount, YearNum = 2008) AS SalesAmount2008,\n        sumIf(SalesAmount, YearNum = 2009) AS SalesAmount2009,\n        sumIf(SalesAmount, YearNum = 2008) - sumIf(SalesAmount, YearNum = 2009) AS CategoryDecrease\n    FROM sales\n    GROUP BY StoreKey, ProductCategoryKey, ProductCategoryName\n),\ntop_category_per_store AS (\n    SELECT\n        StoreKey,\n        ProductCategoryKey,\n        ProductCategoryName,\n        CategoryDecrease,\n        row_number() OVER (PARTITION BY StoreKey ORDER BY CategoryDecrease DESC) AS rn\n    FROM category_compare\n)\nSELECT\n    row_number() OVER (ORDER BY ts.DecreasePct DESC) AS `名次`,\n    ds.StoreName AS `门店名称`,\n    ts.StoreKey AS `门店编码`,\n    round(ts.DecreasePct, 2) AS `门店降幅百分比`,\n    tc.ProductCategoryName AS `品类名称`,\n    tc.ProductCategoryKey AS `品类编码`,\n    tc.CategoryDecrease AS `品类销售减少额`,\n    round(tc.CategoryDecrease / nullIf(ts.SalesDecrease, 0) * 100, 2) AS `品类减少额占门店总减少额百分比`\nFROM top_stores AS ts\nINNER JOIN top_category_per_store AS tc\n    ON ts.StoreKey = tc.StoreKey AND tc.rn = 1\nINNER JOIN retail.DimStore AS ds\n    ON ts.StoreKey = ds.StoreKey\nORDER BY ts.DecreasePct DESC","refused":false,"rep":1,"rows":[[1,"Contoso Fond du Lac Store",46,38.47,"Home Appliances",8,978662.5745000001,32.57],[2,"Contoso Russellville Store",71,37.93,"Computers",3,803528.9125000001,28.02],[3,"Contoso Oshkosh Store",45,35.11,"Home Appliances",8,900232.8864999991,34.03]],"rules":[],"source_run":"20261018-T13-sql-direct-01","total_rows":3,"usage":{"cache_hit_tokens":8832,"cache_miss_tokens":1250,"completion_tokens":8776,"prompt_tokens":10082,"reasoning_tokens":6965}},{"assumption":"同店指2008和2009两年均有销售记录的门店；销售额按 FactSales.SalesAmount 汇总，降幅以正数百分比表示。","columns":[{"name":"名次","type":"UInt64"},{"name":"门店名称","type":"String"},{"name":"门店降幅百分比","type":"Float64"},{"name":"门店2008销售额","type":"Float64"},{"name":"门店2009销售额","type":"Float64"},{"name":"门店总减少额","type":"Float64"},{"name":"拖累最多的产品品类","type":"String"},{"name":"品类销售减少额","type":"Float64"},{"name":"占门店总减少额百分比","type":"Nullable(Float64)"}],"content_correct":1,"delivery_correct":0,"execution_status":"ok","query":"WITH\nstore_sales AS (\n    SELECT\n        f.StoreKey AS StoreKey,\n        s.StoreName AS StoreName,\n        d.CalendarYear AS yr,\n        f.SalesAmount AS SalesAmount\n    FROM retail.FactSales AS f\n    INNER JOIN retail.DimDate AS d ON f.DateKey = d.DateKey\n    INNER JOIN retail.DimStore AS s ON f.StoreKey = s.StoreKey\n    WHERE d.CalendarYear IN (2008, 2009)\n),\nstore_year AS (\n    SELECT\n        StoreKey,\n        StoreName,\n        sumIf(SalesAmount, yr = 2008) AS sales_2008,\n        sumIf(SalesAmount, yr = 2009) AS sales_2009,\n        countIf(yr = 2008) AS cnt_2008,\n        countIf(yr = 2009) AS cnt_2009\n    FROM store_sales\n    GROUP BY StoreKey, StoreName\n),\nstore_rate AS (\n    SELECT\n        *,\n        (sales_2008 - sales_2009) / sales_2008 AS decline_rate,\n        sales_2008 - sales_2009 AS decrease_total\n    FROM store_year\n    WHERE sales_2008 \u003e 0\n      AND sales_2009 \u003c sales_2008\n      AND cnt_2008 \u003e 0\n      AND cnt_2009 \u003e 0\n),\nranked_stores AS (\n    SELECT\n        *,\n        row_number() OVER (ORDER BY decline_rate DESC, StoreKey) AS rn\n    FROM store_rate\n),\ntop_stores AS (\n    SELECT * FROM ranked_stores WHERE rn \u003c= 3\n),\ncategory_year AS (\n    SELECT\n        f.StoreKey AS StoreKey,\n        s.StoreName AS StoreName,\n        pc.ProductCategoryName AS CategoryName,\n        sumIf(f.SalesAmount, d.CalendarYear = 2008) AS cat_2008,\n        sumIf(f.SalesAmount, d.CalendarYear = 2009) AS cat_2009\n    FROM retail.FactSales AS f\n    INNER JOIN retail.DimDate AS d ON f.DateKey = d.DateKey\n    INNER JOIN retail.DimStore AS s ON f.StoreKey = s.StoreKey\n    INNER JOIN retail.DimProduct AS p ON f.ProductKey = p.ProductKey\n    INNER JOIN retail.DimProductSubcategory AS ps\n        ON p.ProductSubcategoryKey = ps.ProductSubcategoryKey\n    INNER JOIN retail.DimProductCategory AS pc\n        ON ps.ProductCategoryKey = pc.ProductCategoryKey\n    WHERE d.CalendarYear IN (2008, 2009)\n    GROUP BY f.StoreKey, s.StoreName, pc.ProductCategoryName\n),\ncategory_decrease AS (\n    SELECT\n        *,\n        cat_2008 - cat_2009 AS cat_decrease\n    FROM category_year\n),\ncategory_ranked AS (\n    SELECT\n        c.*,\n        row_number() OVER (PARTITION BY c.StoreKey ORDER BY c.cat_decrease DESC, c.CategoryName) AS cat_rn\n    FROM category_decrease AS c\n    INNER JOIN top_stores AS t ON c.StoreKey = t.StoreKey\n)\nSELECT\n    t.rn AS `名次`,\n    t.StoreName AS `门店名称`,\n    round(t.decline_rate * 100, 2) AS `门店降幅百分比`,\n    t.sales_2008 AS `门店2008销售额`,\n    t.sales_2009 AS `门店2009销售额`,\n    t.decrease_total AS `门店总减少额`,\n    c.CategoryName AS `拖累最多的产品品类`,\n    c.cat_decrease AS `品类销售
