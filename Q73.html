"reasoning_tokens":2230}}],"SQL-L1":[{"assumption":"差额 = 当前在手库存数量 − 当前安全库存数量，按产品跨门店汇总，差额降序取前 10；产品在 DimProduct 中缺失时以产品编码标识。","columns":[{"name":"名次","type":"UInt64"},{"name":"产品","type":"String"},{"name":"当前在手库存数量","type":"Int64"},{"name":"当前安全库存数量","type":"Int64"},{"name":"库存与安全库存差额","type":"Int64"}],"content_correct":1,"delivery_correct":1,"execution_status":"ok","query":"WITH cur AS (\n  SELECT\n    StoreKey,\n    ProductKey,\n    argMax(OnHandQuantity, DateKey) AS OnHandQuantity,\n    argMax(SafetyStockQuantity, DateKey) AS SafetyStockQuantity\n  FROM retail.FactInventory\n  GROUP BY StoreKey, ProductKey\n)\nSELECT\n  row_number() OVER (ORDER BY `库存与安全库存差额` DESC) AS `名次`,\n  `产品`,\n  `当前在手库存数量`,\n  `当前安全库存数量`,\n  `库存与安全库存差额`\nFROM (\n  SELECT\n    if(p.ProductName IS NULL OR p.ProductName = '', toString(f.ProductKey), p.ProductName) AS `产品`,\n    sum(f.OnHandQuantity) AS `当前在手库存数量`,\n    sum(f.SafetyStockQuantity) AS `当前安全库存数量`,\n    sum(f.OnHandQuantity) - sum(f.SafetyStockQuantity) AS `库存与安全库存差额`\n  FROM cur AS f\n  LEFT JOIN retail.DimProduct AS p ON f.ProductKey = p.ProductKey\n  GROUP BY f.ProductKey, p.ProductName\n  ORDER BY `库存与安全库存差额` DESC\n  LIMIT 10\n)\nORDER BY `名次`","refused":false,"rep":1,"rows":[[1,"Contoso In-Line Coupler E180 Silver",71417,35751,35666],[2,"Contoso Rubberized Skin BlackBerry E100 Black",70381,35202,35179],[3,"Contoso Touch Stylus Pen E150 White",73940,39087,34853],[4,"Contoso Rubberized Snap-On Cover Hard Case Cell Phone Protector E160 White",75323,40719,34604],[5,"Contoso Touch Stylus Pen E150 Red",72241,38217,34024],[6,"Cigarette Lighter Adapter for Contoso Phones E110 White",76617,42609,34008],[7,"Contoso Original K1m Li-Ion Standard Battery E170 Black",67477,33627,33850],[8,"Contoso Rubberized Snap-On Cover Hard Case Cell Phone Protector E160 Pink",70702,37104,33598],[9,"Reusable Phone Screen Protector E120",76381,43401,32980],[10,"Contoso Rubberized Skin BlackBerry E100 White",76414,44685,31729]],"rules":[],"source_run":"20261018-T13-sql-direct-01","total_rows":10,"usage":{"cache_hit_tokens":46336,"cache_miss_tokens":159,"completion_tokens":1909,"prompt_tokens":46495,"reasoning_tokens":1604}},{"assumption":"产品层面的库存与安全库存按「每个门店 × 产品最近一次快照」在门店间求和后比较；差额 = 在手数量 − 安全库存数量，取差额最大的 10 款（不含 DimProduct 缺失的产品，用产品编码标识）。","columns":[{"name":"名次","type":"UInt64"},{"name":"产品","type":"String"},{"name":"产品编码","type":"Int32"},{"name":"当前在手库存数量","type":"Int64"},{"name":"安全库存数量","type":"Int64"},{"name":"差额","type":"Int64"}],"content_correct":1,"delivery_correct":1,"execution_status":"ok","query":"WITH last_snap AS (\n    SELECT StoreKey, ProductKey, max(DateKey) AS MaxDate\n    FROM retail.FactInventory\n    GROUP BY StoreKey, ProductKey\n),\ncur AS (\n    SELECT\n        f.ProductKey AS ProductKey,\n        sum(f.OnHandQuantity) AS OnHandQty,\n        sum(f.SafetyStockQuantity) AS SafetyStockQty\n    FROM retail.FactInventory AS f\n    INNER JOIN last_snap AS l\n        ON f.StoreKey = l.StoreKey\n       AND f.ProductKey = l.ProductKey\n       AND f.DateKey = l.MaxDate\n    GROUP BY f.ProductKey\n)\nSELECT\n    row_number() OVER (ORDER BY c.OnHandQty - c.SafetyStockQty DESC) AS `名次`,\n    if(p.ProductName = '' OR p.ProductName IS NULL,\n       concat('未知产品 ', toString(c.ProductKey)),\n       p.ProductName) AS `产品`,\n    c.ProductKey AS `产品编码`,\n    c.OnHandQty AS `当前在手库存数量`,\n    c.SafetyStockQty AS `安全库存数量`,\n    c.OnHandQty - c.SafetyStockQty AS `差额`\nFROM cur AS c\nLEFT JOIN retail.DimProduct AS p\n    ON c.ProductKey = p.ProductKey\nORDER BY `差额` DESC\nLIMIT 10","refused":false,"rep":2,"rows":[[1,"Contoso In-Line Coupler E180 Silver",2517,71417,35751,35666],[2,"Contoso Rubberized Skin BlackBerry E100 Black",2488,70381,35202,35179],[3,"Contoso Touch Stylus Pen E150 White",2504,73940,39087,34853],[4,"Contoso Rubberized Snap-On Cover Hard Case Cell Phone Protector E160 White",2507,75323,40719,34604],[5,"Contoso Touch Stylus Pen E150 Red",2505,72241,38217,34024],[6,"Cigarette Lighter Adapter for Contoso P
