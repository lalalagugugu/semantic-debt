1.order_cnt * pc2.order_cnt) AS lift_raw\n  FROM pairs\n  INNER JOIN pc pc1 ON pc1.prk = pairs.prk1\n  INNER JOIN pc pc2 ON pc2.prk = pairs.prk2\n  INNER JOIN l0.d_prd p1 ON p1.prk = pairs.prk1\n  INNER JOIN l0.d_prd p2 ON p2.prk = pairs.prk2\n  CROSS JOIN tot\n),\ntop10 AS (\n  SELECT product_1, product_2, co_orders, lift_raw\n  FROM calc\n  ORDER BY co_orders DESC, lift_raw DESC, product_1, product_2\n  LIMIT 10\n)\nSELECT\n  row_number() OVER (ORDER BY co_orders DESC, lift_raw DESC, product_1, product_2) AS ranking,\n  product_1,\n  product_2,\n  co_orders,\n  round(lift_raw, 4) AS lift\nFROM top10\nORDER BY ranking","refused":false,"rep":1,"rows":[[1,"Contoso Connectivity Starter Kit Smart Buy M680 Black","Contoso ADSL Modem Splitter/Filter X 1 E100 Black",17,900.9237],[2,"Contoso Expandable 4-Handset Cordless Phone System M206 Black","Contoso Pen Touch Screen Phones M320 Black",16,860.4723],[3,"Contoso Pen Touch Screen Phones M320 Black","Contoso In-Line Coupler E180 Silver",16,636.7495],[4,"Contoso SLR Camera X143 Silver","Contoso Cyber Shot Digital Cameras Adapter E306 Black",15,750.8341],[5,"Contoso Coffee Maker Super-Auto 12C X1250 Silver","Contoso Coffee Maker Auto 5C E0900 Grey",15,732.6938],[6,"Contoso Screen 100in E010 Silver","Contoso Screen 80in E080 Silver",14,848.234],[7,"Contoso Microwave 1.0CuFt E0110 Grey","Contoso Water Heater 4.3GPM M1250 Blue",14,726.0604],[8,"Contoso Rechargeable Battery Pack E310 White","Contoso Lens Cap Keeper E314 White",13,829.5207],[9,"Contoso Phone System Accessory Handset with Charger M308 Black","Contoso Touch Stylus Pen E150 Red",13,777.9218],[10,"Contoso KSU-less key system M38 Black","Contoso Expandable1-Handset Cordless Phone System M207 Black",13,746.9468]],"rules":[],"source_run":"20261019-T15-explorer-01","total_rows":10,"usage":{"cache_hit_tokens":55296,"cache_miss_tokens":1966,"completion_tokens":6832,"prompt_tokens":57262,"reasoning_tokens":4471}},{"assumption":"把同一订单中出现的两个不同 Contoso 产品视为一对（不计顺序，每单每对只计一次）；提升
