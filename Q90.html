y_id,\n        if(p.cls_nm IS NULL OR p.cls_nm = '', ifNull(toString(p.cls_id), '未知品类'), p.cls_nm) AS category_name,\n        d.c_yr AS yr,\n        sum(s.amt1) AS revenue,\n        sum(s.qty1 * s.uc) AS cost,\n        (sum(s.amt1) - sum(s.qty1 * s.uc)) / nullIf(sum(s.amt1), 0) * 100 AS gross_margin_pct\n    FROM l0.fct_sls AS s\n    INNER JOIN l0.d_dt AS d ON s.dk = d.dk\n    INNER JOIN l0.d_prd AS p ON s.prk = p.prk\n    WHERE d.c_yr IN (2007, 2008, 2009)\n    GROUP BY\n        p.cls_id,\n        if(p.cls_nm IS NULL OR p.cls_nm = '', ifNull(toString(p.cls_id), '未知品类'), p.cls_nm),\n        d.c_yr\n)\nSELECT\n    m.category_id,\n    m.category_name AS `产品品类`,\n    m.yr AS `年份`,\n    m.revenue AS `销售收入`,\n    round(m.gross_margin_pct, 2) AS `毛利率(%)`,\n    round(m.gross_margin_pct - prev.gross_margin_pct, 2) AS `毛利率较上年变化(百分点)`\nFROM margins AS m\nLEFT JOIN margins AS prev\n    ON m.category_id = prev.category_id\n   AND prev.yr = m.yr - 1\nORDER BY m.category_name, m.yr\nSETTINGS join_use_nulls = 1","refused":false,"rep":2,"rows":[[3,"Deluxe",2007,1180272467.3846023,65.63,null],[3,"Deluxe",2008,984174100.5194929,65.76,0.12],[3,"Deluxe",2009,885255962.1016886,65.72,-0.03],[1,"Economy",2007,390606384.75426483,48.5,null],[1,"Economy",2008,494232202.2963833,49.3,0.81],[1,"Economy",2009,725169804.86889,49.68,0.37],[2,"Regular",2007,2705980273.3097744,54.29,null],[2,"Regular",2008,2392399157.168279,54.46,0.16],[2,"Regular",2009,1929437448.1607423,54.69,0.23]],"rules":[],"source_run":"20261018-T13-sql-direct-01","total_rows":9,"usage":{"cache_hit_tokens":5760,"cache_miss_tokens":231,"completion_tokens":5980,"prompt_tokens":5991,"reasoning_tokens":5543}},{"assumption":"毛利率按 fct_sls.amt1 作为销售收入、qty1 * uc 作为销售成本计算，产品品类取 d_prd_cat.pc_nm。","columns":[{"name":"产品品类","type":"String"},{"name":"年份","type":"Int32"},{"name":"销售额","type":"Float64"},{"name":"毛利额","type":"Float64"},{"name":"毛利率(%)","type":"Nullable(Float64)"},{"name":"毛利率逐年变化(百分点)","type":"Nullable(Float64)"}],"content_co
