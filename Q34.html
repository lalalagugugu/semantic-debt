ty, 0) AS sales_qty,\n    coalesce(a.avg_inv_qty, 0) AS avg_inventory_qty,\n    round(coalesce(s.sls_qty, 0) / nullIf(a.avg_inv_qty, 0), 4) AS inventory_turnover\nFROM l0.d_prd AS p\nINNER JOIN prod_keys AS k\n    ON p.prk = k.prk\nLEFT JOIN sales AS s\n    ON p.prk = s.prk\nLEFT JOIN inv_avg AS a\n    ON p.prk = a.prk\nORDER BY p.pr_nm","refused":false,"rep":2,"rows":[["A. Datum Advanced Digital Camera M300 Azure",1037,3846,204.21153846153845,18.8334],["A. Datum Advanced Digital Camera M300 Black",953,4032,220.48076923076923,18.2873],["A. Datum Advanced Digital Camera M300 Green",1023,4958,263.7692307692308,18.7967],["A. Datum Advanced Digital Camera M300 Grey",967,3729,206.15384615384616,18.0884],["A. Datum Advanced Digital Camera M300 Orange",1009,4354,233.42307692307693,18.6528],["A. Datum Advanced Digital Camera M300 Pink",981,4507,226.28846153846155,19.9171],["A. Datum Advanced Digital Camera M300 Silver",995,3833,209.1346153846154,18.3279],["A. Datum All in One Digital Camera M200 Azure",1032,4765,218.45098039215685,21.8127],["A. Datum All in One Digital Camera M200 Black",948,4514,216.75,20.8258],["A. Datum All in One Digital Camera M200 Green",1018,4368,213.25,20.483],["A. Datum All in One Digital Camera M200 Grey",962,4101,220.57692307692307,18.5922],["A. Datum All in One Digital Camera M200 Orange",1004,4265,232.09615384615384,18.376],["A. Datum All in One Digital Camera M200 Pink",976,4811,246.30769230769232,19.5325],["A. Datum All in One Digital Camera M200 Silver",990,3886,213.1346153846154,18.2326],["A. Datum Bridge Digital Camera M300 Azure",1038,3932,217.82692307692307,18.051],["A. Datum Bridge Digital Camera M300 Black",954,4422,229.8653846153846,19.2373],["A. Datum Bridge Digital Camera M300 Green",1024,4088,238.23076923076923,17.1598],["A. Datum Bridge Digital Camera M300 Grey",968,4379,218.84615384615384,20.0095],["A. Datum Bridge Digital Camera M300 Orange",1010,4292,226.3846153846154,18.9589],["A. Datum Bridge Digital Camera M300 Pink",982,407 ey AS `产品编码`,\n  product_name AS `产品名称`,\n  round(total_cost, 2) AS `销售总成本`,\n  round(avg_inv_value, 2) AS `平均在手库存金额`,\n  round(turnover, 4) AS `库存周转率`\nFROM base\nORDER BY turnover DESC","refused":false,"rep":1,"rows":[[1,1803,"1803",184759.68,2276.64,81.1546],[2,1786,"1786",273824.64,3487.43,78.5176],[3,1777,"1777",280225.28,3691.06,75.92],[4,1817,"1817",196796.46,2614.26,75.2781],[5,1808,"1808",187956.44,2514.07,74.7618],[6,1735,"1735",195293.28,2623.44,74.4417],[7,1738,"1738",163306.08,2201.02,74.1955],[8,1772,"1772",223591.66,3034.83,73.6752],[9,1757,"1757",356934,4902,72.814],[10,1764,"1764",316049.56,4351.96,72.6223],[11,1742,"1742",175644,2429.28,72.3029],[12,1710,"1710",190371.75,2635.09,72.2448],[13,1727,"1727",334853,4639.64,72.1723],[14,1713,"1713",214430.25,3010.22,71.2342],[15,1813,"1813",222859.84,3150.16,70.7456],[16,1800,"1800",197872.92,2816.77,70.2481],[17,1741,"1741",182526.96,2601.69,70.157],[18,1744,"1744",176300.88,2515.28,70.092],[19,1737,"1737",163991.52,2340.46,70.068],[20,1799,"1799",173652.96,2478.58,70.0615]],"rules":[],"source_run":"20261018-T13-sql-direct-01","total_rows":2508,"usage":{"cache_hit_tokens":92800,"cache_miss_tokens":845,"completion_tokens":3168,"prompt_tokens":93645,"reasoning_tokens":2080}},{"assumption":"库存周转率按语义层定义＝2009 年全渠道销售的总成本 ÷ 2009 年各快照日「在手数量×单位成本」的均值（每个产品对其自身有快照的周六求平均）；产品维度缺行的产品用产品键标识，2009 年无销售或无库存快照的产品按 0 计入。","columns":[{"name":"product_key","type":"Int32"},{"name":"product_name","type":"String"},{"name":"total_cost","type":"Float64"},{"name":"avg_inventory_amount","type":"Float64"},{"name":"snapshot_days","type":"UInt64"},{"name":"inventory_turnover","type":"Nullable(Float64)"}],"content_correct":1,"delivery_correct":1,"execution_status":"ok","query":"WITH\n    sales AS (\n        SELECT\n            ProductKey,\n            sum(TotalCost) AS cogs\n        FROM retail.FactSales\n        WHERE DateKey \u003e= toDate('2009-01-01')\n          AND DateKey \u003c= toDate('2009-12-31')\n        GROUP BY ProductKey\ les\n        WHERE DateKey \u003e= toDate('2009-01-01')\n          AND DateKey \u003c  toDate('2010-01-01')\n        GROUP BY ProductKey\n    ),\n    inv_daily AS (\n        SELECT\n            ProductKey,\n            DateKey,\n            sum(OnHandQuantity * UnitCost) AS inv_value\n        FROM retail.FactInventory\n        WHERE DateKey \u003e= toDate('2009-01-01')\n          AND DateKey \u003c  toDate('2010-01-01')\n        GROUP BY ProductKey, DateKey\n    ),\n    inv AS (\n        SELECT\n            ProductKey,\n            avg(inv_value) AS avg_inventory_value,\n            count()        AS snapshot_days\n        FROM inv_daily\n        GROUP BY ProductKey\n    ),\n    base AS (\n        SELECT\n            coalesce(s.ProductKey, i.ProductKey)   AS ProductKey,\n            ifNull(s.total_cost, 0)                AS total_cost,\n            ifNull(i.avg_inventory_value, 0)       AS avg_inventory_value,\n            ifNull(i.snapshot_days, 0)             AS snapshot_days\n        FROM sales AS s\n        FULL OUTER JOIN inv AS i ON s.ProductKey = i.ProductKey\n    )\nSELECT\n    b.ProductKey                                                              AS ProductKey,\n    if(p.ProductName IS NULL, toString(b.ProductKey), p.ProductName)          AS ProductName,\n    b.total_cost                                                              AS total_cost,\n    b.avg_inventory_value                                                     AS avg_inventory_value,\n    b.snapshot_days                                                           AS snapshot_days,\n    round(b.total_cost / nullIf(b.avg_inventory_value, 0), 4)                 AS inventory_turnover,\n    rank() OVER (ORDER BY isNull(b.total_cost / nullIf(b.avg_inventory_value, 0)),\n                          b.total_cost / nullIf(b.avg_inventory_value, 0) DESC) AS turnover_rank\nFROM base AS b\nLEFT JOIN retail.DimProduct AS p ON b.ProductKey = p.ProductKey\nORDER BY turnover_rank, ProductKey\nSETTINGS join_use
