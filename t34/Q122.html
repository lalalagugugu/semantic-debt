2,\n        count() AS co_orders\n    FROM contoso_orders a\n    INNER JOIN contoso_orders b\n        ON a.order_no = b.order_no\n       AND a.pk \u003c b.pk\n    GROUP BY pk1, pk2\n),\nprod_cnt AS (\n    SELECT pk, count() AS cnt\n    FROM contoso_orders\n    GROUP BY pk\n),\ntot AS (\n    SELECT uniqExact(SalesOrderNumber) AS n\n    FROM retail.FactOnlineSales\n    WHERE DateKey \u003e= toDate('2009-01-01')\n      AND DateKey \u003c= toDate('2009-12-31')\n)\nSELECT\n    p1.ProductName AS product_1,\n    p2.ProductName AS product_2,\n    pc.co_orders   AS common_orders,\n    round(pc.co_orders * t.n / (c1.cnt * c2.cnt), 4) AS lift\nFROM pair_cnt pc\nINNER JOIN prod_cnt c1 ON c1.pk = pc.pk1\nINNER JOIN prod_cnt c2 ON c2.pk = pc.pk2\nINNER JOIN retail.DimProduct p1 ON p1.ProductKey = pc.pk1\nINNER JOIN retail.DimProduct p2 ON p2.ProductKey = pc.pk2\nCROSS JOIN tot t\nORDER BY common_orders DESC, product_1, product_2\nLIMIT 10","refused":false,"rep":1,"rows":[["Contoso Connectivity Starter Kit Smart Buy M680 Black","Contoso ADSL Modem Splitter/Filter X 1 E100 Black",17,900.9237],["Contoso Expandable 4-Handset Cordless Phone System M206 Black","Contoso Pen Touch Screen Phones M320 Black",16,860.4723],["Contoso Pen Touch Screen Phones M320 Black","Contoso In-Line Coupler E180 Silver",16,636.7495],["Contoso Coffee Maker Super-Auto 12C X1250 Silver","Contoso Coffee Maker Auto 5C E0900 Grey",15,732.6938],["Contoso SLR Camera X143 Silver","Contoso Cyber Shot Digital Cameras Adapter E306 Black",15,750.8341],["Contoso Microwave 1.0CuFt E0110 Grey","Contoso Water Heater 4.3GPM M1250 Blue",14,726.0604],["Contoso Screen 100in E010 Silver","Contoso Screen 80in E080 Silver",14,848.234],["Contoso 2G MP3 Player E200 Silver","Contoso 4GB Portable MP3 Player M450 Black",13,414.5504],["Contoso Dual Handset Cordless Phone System  E20 Black","Contoso Expandable1-Handset Cordless Phone System M207 Black",13,679.0426],["Contoso Electronic Private Automatic Branch Exchange M90 White","Conto 64"},{"name":"total_orders","type":"UInt64"}],"content_correct":false,"delivery_correct":0,"execution_status":"ok","query":"WITH\n    contoso_order_products AS (\n        SELECT DISTINCT\n            f.SalesOrderNumber AS order_id,\n            p.ProductName AS product_name\n        FROM retail.FactOnlineSales AS f\n        INNER JOIN retail.DimProduct AS p\n            ON f.ProductKey = p.ProductKey\n        WHERE f.DateKey \u003e= toDate('2009-01-01')\n          AND f.DateKey \u003c toDate('2010-01-01')\n          AND f.SalesQuantity \u003e 0\n          AND p.BrandName = 'Contoso'\n    ),\n    product_order_counts AS (\n        SELECT\n            product_name,\n            uniqExact(order_id) AS order_count\n        FROM contoso_order_products\n        GROUP BY product_name\n    ),\n    pair_counts AS (\n        SELECT\n            a.product_name AS product_a,\n            b.product_name AS product_b,\n            count() AS common_orders\n        FROM contoso_order_products AS a\n        INNER JOIN contoso_order_products AS b\n            ON a.order_id = b.order_id\n           AND a.product_name \u003c b.product_name\n        GROUP BY product_a, product_b\n    ),\n    total_orders AS (\n        SELECT uniqExact(SalesOrderNumber) AS total_order_count\n        FROM retail.FactOnlineSales\n        WHERE DateKey \u003e= toDate('2009-01-01')\n          AND DateKey \u003c toDate('2010-01-01')\n          AND SalesQuantity \u003e 0\n    )\nSELECT\n    row_number() OVER (ORDER BY common_orders DESC, lift DESC) AS ranking,\n    product_a,\n    product_b,\n    common_orders,\n    round(expected_common_orders, 4) AS expected_common_orders,\n    round(lift, 4) AS lift,\n    orders_with_product_a,\n    orders_with_product_b,\n    total_orders\nFROM (\n    SELECT\n        pc.product_a AS product_a,\n        pc.product_b AS product_b,\n        pc.common_orders AS common_orders,\n        ca.order_count AS orders_with_product_a,\n        cb.order_count AS orders_with_product_b,\n
