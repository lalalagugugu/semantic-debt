 SELECT\n            StoreKey,\n            sum(SalesAmountQuota) AS ytd_target_sales\n        FROM retail.FactSalesQuota\n        WHERE DateKey \u003e= toDate('2009-01-01')\n          AND DateKey \u003c= toDate('2009-09-01')\n          AND ScenarioKey = 2\n        GROUP BY StoreKey\n    ),\n    annual_target AS (\n        SELECT\n            StoreKey,\n            sum(SalesAmountQuota) AS annual_target_sales\n        FROM retail.FactSalesQuota\n        WHERE DateKey \u003e= toDate('2009-01-01')\n          AND DateKey \u003c= toDate('2009-12-01')\n          AND ScenarioKey = 2\n        GROUP BY StoreKey\n    )\nSELECT\n    s.StoreKey,\n    s.StoreName,\n    a.actual_sales AS `实际销售额`,\n    y.ytd_target_sales AS `同期目标销售额`,\n    f.annual_target_sales AS `全年目标销售额`,\n    round(a.actual_sales / nullIf(y.ytd_target_sales, 0) * 100, 2) AS `同期销售目标达成率(%)`,\n    round(a.actual_sales / nullIf(f.annual_target_sales, 0) * 100, 2) AS `全年销售目标完成率(%)`\nFROM retail.DimStore AS s\nLEFT JOIN ytd_actual AS a ON s.StoreKey = a.StoreKey\nLEFT JOIN ytd_target AS y ON s.StoreKey = y.StoreKey\nLEFT JOIN annual_target AS f ON s.StoreKey = f.StoreKey\nORDER BY s.StoreKey;","refused":false,"rep":1,"rows":[[1,"Contoso Seattle No.1 Store",4218832.054,3462886.0591999996,4838387.1581999995,121.83,87.2],[2,"Contoso Seattle No.2 Store",4127846.5915,3388203.709899999,4785128.291599999,121.83,86.26],[3,"Contoso Kennewick Store",4021358.8525,3300796.8381,4467783.455499999,121.83,90.01],[4,"Contoso Bellevue Store",3737148.7724999995,3067512.5757999998,4287200.1904,121.83,87.17],[5,"Contoso Redmond Store",4082338.5035000006,3350849.9291000003,4670513.537,121.83,87.41],[6,"Contoso Yakima Store",4209687.437999999,3455380.0092000007,4644577.632700001,121.83,90.64],[7,"Contoso Granger Store",4015527.9905,3296010.7706999998,4487012.979499999,121.83,89.49],[8,"Contoso Sunnyside Store",3852718.9919999996,3162374.4941000002,4443895.880500001,121.83,86.7],[9,"Contoso Toppenish Store",4041157.0329999994,3317047.5091
