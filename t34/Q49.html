tSales AS f\n    INNER JOIN retail.DimStore AS s ON f.StoreKey = s.StoreKey\n    GROUP BY toInt32(s.EntityKey)\n),\ntree AS (\n    SELECT d0.EntityKey AS e0,\n           toInt32(d1.EntityKey) AS e1,\n           toInt32(d2.EntityKey) AS e2,\n           toInt32(d3.EntityKey) AS e3\n    FROM retail.DimEntity AS d0\n    LEFT JOIN retail.DimEntity AS d1 ON toInt32(d0.ParentEntityKey) = d1.EntityKey\n    LEFT JOIN retail.DimEntity AS d2 ON toInt32(d1.ParentEntityKey) = d2.EntityKey\n    LEFT JOIN retail.DimEntity AS d3 ON toInt32(d2.ParentEntityKey) = d3.EntityKey\n    WHERE d0.EntityType = 'Store'\n)\nSELECT 'Store' AS `组织层级`,\n       uniqExact(r.store_entity) AS `实体数`,\n       sum(r.revenue) AS `销售收入`\nFROM store_rev AS r\nUNION ALL\nSELECT 'State',\n       uniqExact(t.e1),\n       sum(r.revenue)\nFROM tree AS t\nINNER JOIN store_rev AS r ON t.e0 = r.store_entity\nWHERE t.e1 \u003e 0\nUNION ALL\nSELECT 'Country/Region',\n       uniqExact(t.e2),\n       sum(r.revenue)\nFROM tree AS t\nINNER JOIN store_rev AS r ON t.e0 = r.store_entity\nWHERE t.e2 \u003e 0\nUNION ALL\nSELECT 'Group',\n       uniqExact(t.e3),\n       sum(r.revenue)\nFROM tree AS t\nINNER JOIN store_rev AS r ON t.e0 = r.store_entity\nWHERE t.e3 \u003e 0","refused":false,"rep":3,"rows":[["Store",306,12413657608.887573],["State",82,12413657608.887562],["Country/Region",36,12413657608.887556],["Group",3,12413657608.887566]],"rules":[],"source_run":"20261104-T34-ontology-full-01","total_rows":4,"usage":{"cache_hit_tokens":46336,"cache_miss_tokens":149,"completion_tokens":9995,"prompt_tokens":46485,"reasoning_tokens":9487}}],"SQL-L1-onto":[{"assumption":"「组织层级」指计划实体树（门店 → 州/省 → 国家/地区 → 集团）的层级，每个层级的金额是沿父链上卷后的合计；「销售收入」指全渠道实际销售额（实际口径，非预算/计划口径），并沿 DimStore.EntityKey → DimEntity 上卷到各级。","columns":[{"name":"组织层级","type":"Nullable(String)"},{"name":"实体数","type":"UInt64"},{"name":"销售收入","type":"Float64"}],"content_correct":false,"delivery_correct":0,"execution_status":"ok","query":"WITH rev AS (\n    SELECT toInt32(s.En
