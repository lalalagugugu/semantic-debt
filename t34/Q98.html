teKey\n    INNER JOIN retail.DimProduct AS p\n        ON f.ProductKey = p.ProductKey\n    INNER JOIN retail.DimProductSubcategory AS s\n        ON p.ProductSubcategoryKey = s.ProductSubcategoryKey\n    INNER JOIN retail.DimProductCategory AS c\n        ON s.ProductCategoryKey = c.ProductCategoryKey\n    WHERE d.CalendarYear = 2009\n    GROUP BY cat, q\n),\ncat_year AS (\n    SELECT cat, sum(amt) AS year_amt\n    FROM cat_q\n    GROUP BY cat\n),\ncat_qs AS (\n    SELECT\n        q.cat AS cat,\n        q.q AS q,\n        q.amt AS amt,\n        y.year_amt AS year_amt,\n        q.amt / nullIf(y.year_amt, 0) AS share\n    FROM cat_q AS q\n    INNER JOIN cat_year AS y ON q.cat = y.cat\n),\nranked AS (\n    SELECT\n        cat,\n        argMax(q, share) AS top_quarter,\n        max(share) AS top_share,\n        argMax(amt, share) AS top_amt,\n        max(year_amt) AS year_amt\n    FROM cat_qs\n    GROUP BY cat\n)\nSELECT\n    row_number() OVER (ORDER BY top_share DESC) AS `名次`,\n    cat AS `品类`,\n    concat('2009 ', top_quarter) AS `最高单季`,\n    round(top_share * 100, 2) AS `最高单季占比百分比`,\n    round(top_amt, 2) AS `最高单季销售额`,\n    round(year_amt, 2) AS `全年销售额`\nFROM ranked\nORDER BY top_share DESC","refused":false,"rep":1,"rows":[[1,"Games and Toys","2009 Q3",30.31,623579.18,2057197.88],[2,"TV and Video","2009 Q3",28.27,30679646.38,108528145.8],[3,"Audio","2009 Q3",28.21,4540255.06,16095707.25],[4,"Cell phones","2009 Q3",27.99,17423558.84,62248458.69],[5,"Computers","2009 Q2",27.65,49498400.42,179034949.16],[6,"Home Appliances","2009 Q3",27.35,77195914.42,282211447.64],[7,"Cameras and camcorders","2009 Q3",27.32,40824950.51,149428309.16],[8,"Music, Movies and Audio Books","2009 Q2",26.74,2369005.28,8857910.87]],"rules":[],"source_run":"20261104-T34-ontology-full-01","total_rows":8,"usage":{"cache_hit_tokens":125056,"cache_miss_tokens":865,"completion_tokens":3013,"prompt_tokens":125921,"reasoning_tokens":1949}},{"assumption":"未说明渠道时按约定 1 使用线上销售；将 2007–2009 合并视为一个全年周期比较季度结构；只统计 ame, '未知') AS CategoryName,\n        d.CalendarQuarterLabel AS QuarterLabel,\n        sum(f.SalesAmount) AS QuarterSales\n    FROM retail.FactOnlineSales AS f\n    INNER JOIN retail.DimDate AS d\n        ON f.DateKey = d.DateKey\n    LEFT JOIN retail.DimProduct AS p\n        ON f.ProductKey = p.ProductKey\n    LEFT JOIN retail.DimProductSubcategory AS s\n        ON p.ProductSubcategoryKey = s.ProductSubcategoryKey\n    LEFT JOIN retail.DimProductCategory AS c\n        ON s.ProductCategoryKey = c.ProductCategoryKey\n    GROUP BY CategoryKey, CategoryName, QuarterLabel\n),\ncategory_total AS (\n    SELECT\n        CategoryKey,\n        CategoryName,\n        sum(QuarterSales) AS TotalSales,\n        max(QuarterSales) AS MaxQuarterSales,\n        argMax(QuarterLabel, QuarterSales) AS PeakQuarter,\n        max(QuarterSales) / nullIf(sum(QuarterSales), 0) AS Dependency\n    FROM category_quarter\n    GROUP BY CategoryKey, CategoryName\n)\nSELECT\n    row_number() OVER (\n        ORDER BY Dependency DESC, CategoryName ASC, CategoryKey ASC\n    ) AS `名次`,\n    CategoryName AS `产品品类`,\n    CategoryKey AS `品类编码`,\n    PeakQuarter AS `依赖季度`,\n    round(Dependency * 100, 2) AS `单季依赖度百分比`,\n    TotalSales AS `销售额合计`\nFROM category_total\nORDER BY Dependency DESC, CategoryName ASC, CategoryKey ASC\nSETTINGS join_use_nulls = 1;","refused":false,"rep":2,"rows":[[1,"Audio",1,"Q3",27.86,36856719.46169979],[2,"Home Appliances",8,"Q3",27.71,833911778.5432079],[3,"Cell phones",5,"Q3",27.58,165713211.99564087],[4,"未知",-1,"Q2",27.55,152121858.07850504],[5,"Games and Toys",7,"Q3",27.42,6047306.743500033],[6,"Computers",3,"Q2",27.23,482566800.1800019],[7,"TV and Video",2,"Q2",26.92,412304199.81952477],[8,"Cameras and camcorders",4,"Q2",26.91,598334988.6827012],[9,"Music, Movies and Audio Books",6,"Q3",26.59,30345766.30339986]],"rules":[],"source_run":"20261104-T34-ontology-full-01","total_rows":9,"usage":{"cache_hit_tokens":150144,"cache_miss_tokens":916,"completion_tokens":7636,"prompt_to
