venue) OVER () AS total_revenue\n    FROM product_revenue\n),\nclassified AS (\n    SELECT\n        ProductKey,\n        multiIf(\n            cumulative_revenue \u003c= total_revenue * 0.80, 'A 类',\n            cumulative_revenue \u003c= total_revenue * 0.95, 'B 类',\n            'C 类'\n        ) AS abc_class\n    FROM ranked\n)\nSELECT\n    abc_class AS `ABC分类`,\n    count() AS `产品数量`\nFROM classified\nGROUP BY abc_class\nORDER BY abc_class;","refused":false,"rep":1,"rows":[["A 类",1131],["B 类",666],["C 类",707]],"rules":[],"source_run":"20261104-T34-ontology-full-01","total_rows":3,"usage":{"cache_hit_tokens":46336,"cache_miss_tokens":186,"completion_tokens":2580,"prompt_tokens":46522,"reasoning_tokens":2243}},{"assumption":"问题未说明渠道，按约定 1 用线上销售明细（FactOnlineSales）计算 2009 年营收；ABC 分类以产品键为单位（含产品维度中缺失的产品键，各自单列），按营收降序累计、以「累计到上一名为止的营收占比」划分 80% / 95% 两个边界。","columns":[{"name":"abc_class","type":"String"},{"name":"product_count","type":"UInt64"}],"content_correct":true,"delivery_correct":0,"execution_status":"ok","query":"WITH prod AS (\n    SELECT\n        f.ProductKey AS ProductKey,\n        sum(f.SalesAmount) AS amt\n    FROM retail.FactOnlineSales AS f\n    INNER JOIN retail.DimDate AS d ON f.DateKey = d.DateKey\n    WHERE d.CalendarYear = 2009\n    GROUP BY f.ProductKey\n),\nranked AS (\n    SELECT\n        ProductKey,\n        amt,\n        sum(amt) OVER () AS total_amt,\n        sum(amt) OVER (ORDER BY amt DESC, ProductKey\n                       ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) - amt AS cum_before\n    FROM prod\n)\nSELECT\n    multiIf(cum_before \u003c 0.80 * total_amt, 'A类',\n            cum_before \u003c 0.95 * total_amt, 'B类',\n            'C类') AS abc_class,\n    count() AS product_count\nFROM ranked\nGROUP BY abc_class\nORDER BY abc_class","refused":false,"rep":2,"rows":[["A类",1132],["B类",666],["C类",706]],"rules":[],"source_run":"20261104-T34-ontology-full-01","total_rows":3,"usage":{"cache_hit_tokens":46336,"cache_miss_tokens":186,"completion_  revenue\n    FROM retail.FactOnlineSales\n    WHERE DateKey \u003e= toDate('2009-01-01')\n      AND DateKey \u003c= toDate('2009-12-31')\n    GROUP BY ProductKey\n),\nranked AS (\n    SELECT\n        ProductKey,\n        revenue,\n        sum(revenue) OVER (\n            ORDER BY revenue DESC\n            RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW\n        ) AS cumulative_revenue,\n        sum(revenue) OVER () AS total_revenue\n    FROM product_revenue\n),\nclassified AS (\n    SELECT\n        ProductKey,\n        multiIf(\n            cumulative_revenue / nullIf(total_revenue, 0) \u003c= 0.80, 'A',\n            cumulative_revenue / nullIf(total_revenue, 0) \u003c= 0.95, 'B',\n            'C'\n        ) AS abc_class\n    FROM ranked\n)\nSELECT\n    abc_class,\n    count() AS product_count\nFROM classified\nGROUP BY abc_class\nORDER BY abc_class","refused":false,"rep":2,"rows":[["A",1131],["B",666],["C",707]],"rules":[],"source_run":"20261104-T34-ontology-full-01","total_rows":3,"usage":{"cache_hit_tokens":75136,"cache_miss_tokens":148,"completion_tokens":2904,"prompt_tokens":75284,"reasoning_tokens":2599}},{"assumption":"未说明渠道，按约定 1 使用线上销售 FactOnlineSales；ABC 对象为 2009 年有线上销售的产品，未登记产品按 ProductKey 单独计。","columns":[{"name":"abc_class","type":"String"},{"name":"product_count","type":"UInt64"}],"content_correct":true,"delivery_correct":1,"execution_status":"ok","query":"WITH product_sales AS (\n    SELECT\n        ProductKey,\n        sum(SalesAmount) AS amt\n    FROM retail.FactOnlineSales\n    WHERE DateKey \u003e= toDate('2009-01-01')\n      AND DateKey \u003c= toDate('2009-12-31')\n    GROUP BY ProductKey\n),\ntotal AS (\n    SELECT sum(amt) AS total_amt\n    FROM product_sales\n),\nproduct_cum AS (\n    SELECT\n        ps.ProductKey,\n        ps.amt,\n        sum(ps.amt) OVER (\n            ORDER BY ps.amt DESC\n            RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW\n        ) / t.total_amt AS cum_share\n    FROM product_sales ps\n    CROSS JOIN total
