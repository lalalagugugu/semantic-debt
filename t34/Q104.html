y = p.ProductKey\n    LEFT JOIN retail.DimProductSubcategory AS sc\n        ON p.ProductSubcategoryKey = sc.ProductSubcategoryKey\n    LEFT JOIN retail.DimProductCategory AS pc\n        ON sc.ProductCategoryKey = pc.ProductCategoryKey\n    WHERE toYear(f.DateKey) IN (2008, 2009)\n    GROUP BY year_num, category_name\n),\ncategory_summary AS (\n    SELECT\n        category_name,\n        sumIf(revenue, year_num = 2008) AS revenue_2008,\n        sumIf(revenue, year_num = 2009) AS revenue_2009,\n        sumIf(gross_profit, year_num = 2008) AS gross_profit_2008,\n        sumIf(gross_profit, year_num = 2009) AS gross_profit_2009\n    FROM category_year\n    GROUP BY category_name\n)\nSELECT\n    category_name AS `产品品类`,\n    revenue_2008 AS `2008年营收`,\n    revenue_2009 AS `2009年营收`,\n    revenue_2009 - revenue_2008 AS `营收变化额`,\n    (revenue_2009 - revenue_2008) / nullIf(revenue_2008, 0) AS `营收变化率`,\n    gross_profit_2008 AS `2008年毛利`,\n    gross_profit_2009 AS `2009年毛利`,\n    gross_profit_2009 - gross_profit_2008 AS `毛利变化额`,\n    (gross_profit_2009 - gross_profit_2008) / nullIf(gross_profit_2008, 0) AS `毛利变化率`\nFROM category_summary\nWHERE revenue_2009 - revenue_2008 \u003e 0\n  AND gross_profit_2009 - gross_profit_2008 \u003c 0\nORDER BY `营收变化额` DESC;","refused":false,"rep":1,"rows":[["Games and Toys",1996970.1310000373,2057197.8850000128,60227.75399997551,0.030159566768189375,1046982.1009999978,1007305.2349999934,-39676.86600000446,-0.03789641290152729]],"rules":[],"source_run":"20261104-T34-ontology-full-01","total_rows":1,"usage":{"cache_hit_tokens":46336,"cache_miss_tokens":165,"completion_tokens":5267,"prompt_tokens":46501,"reasoning_tokens":4738}},{"assumption":"问题未指定渠道，按约定默认使用线上销售 FactOnlineSales；产品品类经 DimProduct→DimProductSubcategory→DimProductCategory 归属，无法归属品类的缺失产品不参与品类对比。","columns":[{"name":"category_name","type":"String"},{"name":"revenue_change","type":"Float64"},{"name":"revenue_change_pct","type":"Nullable(Float64)"},{"name":"gross_profit_change","type": _status":"ok","query":"WITH category_profit AS (\n    SELECT\n        c.ProductCategoryName AS category_name,\n        sumIf(f.SalesAmount, toYear(f.DateKey) = 2008) AS revenue_2008,\n        sumIf(f.SalesAmount, toYear(f.DateKey) = 2009) AS revenue_2009,\n        sumIf(f.SalesAmount - f.TotalCost, toYear(f.DateKey) = 2008) AS gross_profit_2008,\n        sumIf(f.SalesAmount - f.TotalCost, toYear(f.DateKey) = 2009) AS gross_profit_2009\n    FROM retail.FactOnlineSales AS f\n    INNER JOIN retail.DimProduct AS p\n        ON f.ProductKey = p.ProductKey\n    INNER JOIN retail.DimProductSubcategory AS sc\n        ON p.ProductSubcategoryKey = sc.ProductSubcategoryKey\n    INNER JOIN retail.DimProductCategory AS c\n        ON sc.ProductCategoryKey = c.ProductCategoryKey\n    WHERE toYear(f.DateKey) IN (2008, 2009)\n    GROUP BY c.ProductCategoryName\n)\nSELECT\n    category_name AS `产品品类`,\n    revenue_2008 AS `2008营收`,\n    revenue_2009 AS `2009营收`,\n    revenue_2009 - revenue_2008 AS `营收增加额`,\n    round((revenue_2009 - revenue_2008) / nullIf(revenue_2008, 0) * 100, 2) AS `营收增长率(%)`,\n    gross_profit_2008 AS `2008毛利`,\n    gross_profit_2009 AS `2009毛利`,\n    gross_profit_2008 - gross_profit_2009 AS `毛利减少额`,\n    round((gross_profit_2009 - gross_profit_2008) / nullIf(gross_profit_2008, 0) * 100, 2) AS `毛利变化率(%)`\nFROM category_profit\nWHERE revenue_2009 \u003e revenue_2008\n  AND gross_profit_2009 \u003c gross_profit_2008\nORDER BY category_name","refused":false,"rep":3,"rows":[["Games and Toys",1996970.1310000236,2057197.8850000142,60227.753999990644,3.02,1046982.1009999798,1007305.2350000263,39676.86599995347,-3.79]],"rules":["R6"],"source_run":"20261104-T34-ontology-full-01","total_rows":1,"usage":{"cache_hit_tokens":62464,"cache_miss_tokens":171,"completion_tokens":5927,"prompt_tokens":62635,"reasoning_tokens":5430}}],"SQL-L1plus":[{"assumption":"问题未指明渠道，按约定用线上销售 `FactOnlineSales`；变化额按 2009−2008 计算，变化率按（2009−2008）÷2008 计算。","columns":[{"name":"品类","type":"String"},{"n
