ustomer AS d ON d.CustomerKey = cs.CustomerKey\n    INNER JOIN retail.DimGeography AS g ON g.GeographyKey = d.GeographyKey\n),\nranked AS (\n    SELECT country,\n           CustomerKey,\n           FirstName,\n           LastName,\n           spend,\n           row_number() OVER (PARTITION BY country ORDER BY spend DESC, CustomerKey ASC) AS rn\n    FROM detail\n)\nSELECT country AS `国家`,\n       rn AS `名次`,\n       CustomerKey AS `客户编码`,\n       if(FirstName = 'Not Provided' OR LastName = 'Not Provided',\n          concat('CustomerKey ', toString(CustomerKey)),\n          concat(FirstName, ' ', LastName)) AS `客户名称`,\n       round(spend, 2) AS `累计消费额`\nFROM ranked\nWHERE rn \u003c= 5\nORDER BY `国家` ASC, `名次` ASC","refused":false,"rep":1,"rows":[["Armenia",1,19144,"CustomerKey 19144",7481458.27],["Australia",1,19088,"CustomerKey 19088",14901636.07],["Australia",2,19087,"CustomerKey 19087",14663536.71],["Australia",3,19086,"CustomerKey 19086",14391701.94],["Australia",4,19085,"CustomerKey 19085",13966925.15],["Australia",5,19106,"CustomerKey 19106",13586963.36],["Bhutan",1,19141,"CustomerKey 19141",8522927.5],["Canada",1,18790,"CustomerKey 18790",3156664.5],["Canada",2,18817,"CustomerKey 18817",3151250.67],["Canada",3,18866,"CustomerKey 18866",3074497.07],["Canada",4,18820,"CustomerKey 18820",3034748.94],["Canada",5,18874,"CustomerKey 18874",2601131.11],["China",1,19137,"CustomerKey 19137",11113033.27],["China",2,19120,"CustomerKey 19120",9510723.96],["China",3,19126,"CustomerKey 19126",8954249.65],["China",4,19125,"CustomerKey 19125",8857397.7],["China",5,19143,"CustomerKey 19143",8540702.19],["France",1,19050,"CustomerKey 19050",17957139.5],["France",2,19059,"CustomerKey 19059",14924784.65],["France",3,19047,"CustomerKey 19047",14029609.68]],"rules":[],"source_run":"20261104-T34-ontology-full-01","total_rows":65,"usage":{"cache_hit_tokens":46336,"cache_miss_tokens":160,"completion_tokens":1834,"prompt_tokens":46496,"reasoning_tokens":1477}},{"assumption":"未指明渠道，按约定 1 alesAmount) AS Spend\n    FROM retail.FactOnlineSales AS f\n    INNER JOIN retail.DimCustomer AS c ON f.CustomerKey = c.CustomerKey\n    INNER JOIN retail.DimGeography AS g ON c.GeographyKey = g.GeographyKey\n    GROUP BY CustomerKey, Country\n),\nranked AS (\n    SELECT\n        CustomerKey,\n        Country,\n        Spend,\n        row_number() OVER (PARTITION BY Country ORDER BY Spend DESC, CustomerKey) AS rk\n    FROM cust_spend\n)\nSELECT\n    r.Country AS `国家`,\n    r.rk AS `名次`,\n    multiIf(c.FirstName = 'Not Provided' OR c.LastName = 'Not Provided', toString(r.CustomerKey),\n            concat(c.FirstName, ' ', c.LastName)) AS `客户`,\n    r.CustomerKey AS `客户编码`,\n    r.Spend AS `累计消费额`\nFROM ranked AS r\nINNER JOIN retail.DimCustomer AS c ON c.CustomerKey = r.CustomerKey\nWHERE r.rk \u003c= 5\nORDER BY r.Country ASC, r.rk ASC","refused":false,"rep":2,"rows":[["Armenia",1,"19144",19144,7481458.273999723],["Australia",1,"19088",19088,14901636.074501967],["Australia",2,"19087",19087,14663536.710501688],["Australia",3,"19086",19086,14391701.943000698],["Australia",4,"19085",19085,13966925.147001477],["Australia",5,"19106",19106,13586963.356003],["Bhutan",1,"19141",19141,8522927.499999622],["Canada",1,"18790",18790,3156664.497999922],["Canada",2,"18817",18817,3151250.672000111],["Canada",3,"18866",18866,3074497.068999936],["Canada",4,"18820",18820,3034748.943000123],["Canada",5,"18874",18874,2601131.109499968],["China",1,"19137",19137,11113033.272002153],["China",2,"19120",19120,9510723.960500604],["China",3,"19126",19126,8954249.653499944],["China",4,"19125",19125,8857397.704002531],["China",5,"19143",19143,8540702.187498478],["France",1,"19050",19050,17957139.49759953],["France",2,"19059",19059,14924784.64890093],["France",3,"19047",19047,14029609.677300643]],"rules":[],"source_run":"20261104-T34-ontology-full-01","total_rows":65,"usage":{"cache_hit_tokens":125056,"cache_miss_tokens":669,"completion_tokens":1592,"prompt_tokens":125725,"reasoning_tokens":886}}
