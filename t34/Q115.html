\n            CustomerKey,\n            multiIf(\n                dateDiff('month', last_purchase_2008, toDate('2008-12-31')) \u003c= 6, '活跃',\n                dateDiff('month', last_purchase_2008, toDate('2008-12-31')) \u003c= 12, '有流失风险',\n                '已流失'\n            ) AS status_2008,\n            multiIf(\n                dateDiff('month', last_purchase_all, toDate('2009-12-31')) \u003c= 6, '活跃',\n                dateDiff('month', last_purchase_all, toDate('2009-12-31')) \u003c= 12, '有流失风险',\n                '已流失'\n            ) AS status_2009\n        FROM customer_purchase\n    ),\n    counts AS (\n        SELECT\n            status_2008,\n            status_2009,\n            count() AS customer_count\n        FROM customer_status\n        GROUP BY status_2008, status_2009\n    )\nSELECT\n    s1.status_name AS `期初状态`,\n    s2.status_name AS `期末状态`,\n    coalesce(c.customer_count, 0) AS `人数`\nFROM status_labels AS s1\nCROSS JOIN status_labels AS s2\nLEFT JOIN counts AS c\n    ON c.status_2008 = s1.status_name\n   AND c.status_2009 = s2.status_name\nORDER BY s1.sort_order, s2.sort_order","refused":false,"rep":1,"rows":[["活跃","活跃",16751],["活跃","有流失风险",1841],["活跃","已流失",88],["有流失风险","活跃",0],["有流失风险","有流失风险",0],["有流失风险","已流失",45],["已流失","活跃",138],["已流失","有流失风险",0],["已流失","已流失",5]],"rules":[],"source_run":"20261104-T34-ontology-full-01","total_rows":9,"usage":{"cache_hit_tokens":46336,"cache_miss_tokens":203,"completion_tokens":5161,"prompt_tokens":46539,"reasoning_tokens":4655}},{"assumption":"按约定13，以线上销售表中任意一行（含退货行）作为购买记录；“2008年末已经购买过商品的客户”指截至2008-12-31有过购买记录的客户，状态按最近一次购买日距截止日的整月数划分。","columns":[{"name":"期初状态","type":"String"},{"name":"期末状态","type":"String"},{"name":"人数","type":"UInt64"}],"content_correct":true,"delivery_correct":1,"execution_status":"ok","query":"WITH\n  customer_last AS (\n    SELECT\n      CustomerKey,\n      maxIf(DateKey, DateKey \u003c= toDate('2008-12-31')) AS last_2008,\n      max(DateKey) AS last_2009,\n      countIf(DateKey \u003c= toDate('2008-12-31')) AS cnt_2008\n    FROM retail.FactOnlineSales\n    GROUP BY CustomerKey\n  ),\n  statuses AS (\n    SELECT 1 AS ord, '活跃' AS status\n    UNION ALL SELECT 2, '有流失风险'\n    UNION ALL SELECT 3, '已流失'\n  ),\n  transitions AS (\n    SELECT\n      CustomerKey,\n      if(dateDiff('month', last_2008, toDate('2008-12-31')) \u003c= 6, '活跃',\n         if(dateDiff('month', last_2008, toDate('2008-12-31')) \u003c= 12, '有流失风险', '已流失')) AS init_status,\n      if(dateDiff('month', last_2009, toDate('2009-12-31')) \u003c= 6, '活跃',\n         if(dateDiff('month', last_2009, toDate('2009-12-31')) \u003c= 12, '有流失风险', '已流失')) AS end_status\n    FROM customer_last\n    WHERE cnt_2008 \u003e 0\n  )\nSELECT\n  si.status AS `期初状态`,\n  se.status AS `期末状态`,\n  countIf(t.CustomerKey \u003e 0) AS `人数`\nFROM statuses AS si\nCROSS JOIN statuses AS se\nLEFT JOIN transitions AS t\n  ON t.init_status = si.status AND t.end_status = se.status\nGROUP BY si.ord, si.status, se.ord, se.status\nORDER BY si.ord, se.ord;","refused":false,"rep":2,"rows":[["活跃","活跃",16751],["活跃","有流失风险",1841],["活跃","已流失",88],["有流失风险","活跃",0],["有流失风险","有流失风险",0],["有流失风险","已流失",45],["已流失","活跃",138],["已流失","有流失风险",0],["已流失","已流失",5]],"rules":[],"source_run":"20261104-T34-ontology-full-01","total_rows":9,"usage":{"cache_hit_tokens":46336,"cache_miss_tokens":203,"completion_tokens":4514,"prompt_tokens":46539,"reasoning_tokens":4061}},{"assumption":"客户范围按截至 2008-12-31 在线上销售表中有任何记录（含仅有退货记录的行）理解；期初、期末状态分别以 2008-12-31、2009-12-31 为截止日，按该客户最近一次购买距截止日的整月数划分，未发生的迁移组合也列出并记为 0 人。","columns":[{"name":"期初状态","type":"String"},{"name":"期末状态","type":"String"},{"name":"人数","type":"UInt64"}],"content_correct":true,"delivery_correct":1,"execution_status":"ok","query":"WITH cust AS (\n    SELECT\n        CustomerKey,\n        maxIf(DateKey, DateKey \u003c= toDate('2008-12-31')) AS last_2008,\n        max(DateKey) AS last_2009\n    FROM retail.FactOnlineSales\n    GROUP BY CustomerKey\n    HAVING min(DateKey) \u003c= toDate('2008-12-31')\n),\ncust_state AS (\n    SELECT\n        CustomerKey,\n        multiIf(\n            dateDiff('month', last_2008, toDate('2008-12-31')) \u003c= 6, '活跃',\n            dateDiff('month', last_2008, toDate('2008-12-31')) \u003c= 12, '有流失风险',\n            '已流失'\n        ) AS state_2008,\n        multiIf(\n            dateDiff('month', last_2009, toDate('2009-12-31')) \u003c= 6, '活跃',\n            dateDiff('month', last_2009, toDate('2009-12-31')) \u003c= 12, '有流失风险',\n            '已流失'\n        ) AS state_2009\n    FROM cust\n),\ntrans AS (\n    SELECT\n        state_2008 AS from_state,\n        state_2009 AS to_state,\n        count() AS cnt\n    FROM cust_state\n    GROUP BY state_2008, state_2009\n),\nstates AS (\n    SELECT arrayJoin(['活跃', '有流失风险', '已流失']) AS state\n)\nSELECT\n    s1.state AS `期初状态`,\n    s2.state AS `期末状态`,\n    coalesce(t.cnt, 0) AS `人数`\nFROM states AS s1\nCROSS JOIN states AS s2\nLEFT JOIN trans AS t\n    ON t.from_state = s1.state AND t.to_state = s2.state\nORDER BY\n    indexOf(['活跃', '有流失风险', '已流失'], s1.state),\n    indexOf(['活跃', '有流失风险', '已流失'], s2.state)","refused":false,"rep":3,"rows":[["活跃","活跃",16751],["活跃","有流失风险",1841],["活跃","已流失",88],["有流失风险","活跃",0],["有流失风险","有流失风险",0],["有流失风险","已流失",45],["已流失","活跃",138],["已流失","有流失风险",0],["已流失","已流失",5]],"rules":[],"source_run":"20261104-T34-ontology-full-01","total_rows":9,"usage":{"cache_hit_tokens":92800,"cache_miss_tokens":902,"completion_tokens":4623,"prompt_tokens":93702,"reasoning_tokens":3600}}],"SQL-L1-onto":[{"assumption":"状态按线上销售表中截至各年末的最近一次购买记录计算，且购买包含只有退货的行。","columns":[{"name":"期初状态","type":"String"},{"name":"期末状态","type":"String"},{"name":"客户数","type":"UInt64"}],"content_correct":true,"delivery_correct":1,"execution_status":"ok","query":"WITH\n    toDate('2008-12-31') AS d2008,\n    toDate('2009-12-31') AS d2009,\n    states AS (\n        SELECT arrayJoin(['活跃', '有流失风险', '已流失']) AS status\n    ),\n    cust AS (\n        SELECT\n            CustomerKey,\n            maxIf(DateKey, DateKey \u003c= d2008) AS max_2008,\n            maxIf(DateKey, DateKey \u003c= d2009) AS max_2009,\n            countIf(DateKey \u003c= d2008) AS cnt_2008\n        FROM retail.FactOnlineSales\n        GROUP BY CustomerKey\n        HAVING cnt_2008 \u003e 0\n    ),\n    trans AS (\n        SELECT\n            initial_status,\n            final_status,\n            count() AS cnt\n        FROM (\n            SELECT\n                CustomerKey,\n                multiIf(\n                    dateDiff('month', max_2008, d2008) \u003c= 6, '活跃',\n                    dateDiff('month', max_2008, d2008) \u003c= 12, '有流失风险',\n                    '已流失'\n                ) AS initial_status,\n                multiIf(\n                    dateDiff('month', max_2009, d2009) \u003c= 6, '活跃',\n                    dateDiff('month', max_2009, d2009) \u003c= 12, '有流失风险',\n                    '已流失'\n                ) AS final_status\n            FROM cust\n        )\n        GROUP BY initial_status, final_status\n    )\nSELECT\n    s1.status AS `期初状态`,\n    s2.status AS `期末状态`,\n    coalesce(t.cnt, 0) AS `客户数`\nFROM states AS s1\nCROSS JOIN states AS s2\nLEFT JOIN trans AS t\n    ON t.initial_status = s1.status AND t.final_status = s2.status\nORDER BY\n    multiIf(s1.status = '活跃', 1, s1.status = '有流失风险', 2, 3),\n    multiIf(s2.status = '活跃', 1, s2.status = '有流失风险', 2, 3)","refused":false,"rep":1,"rows":[["活跃","活跃",16751],["活跃","有流失风险",1841],["活跃","已流失",88],["有流失风险","活跃",0],["有流失风险","有流失风险",0],["有流失风险","已流失",45],["已流失","活跃",138],["已流失","有流失风险",0],["已流失","已流失",5]],"rules":[],"source_run":"20261104-T34-ontology-full-01","total_rows":9,"usage":{"cache_hit_tokens":62464,"cache_miss_tokens":209,"completion_tokens":4253,"prompt_tokens":62673,"reasoning_tokens":3767}},{"assumption":"期初状态按截至 2008-12-31 的最近购买月数分层，期末状态按截至 2009-12-31 的最近购买月数分层，并沿用约定 13 的 6 个月/12 个月阈值；购买含只有退货的行。","columns":[{"name":"期初状态","type":"String"},{"name":"期末状态","type":"String"},{"name":"客户数","type":"UInt64"}],"conte
