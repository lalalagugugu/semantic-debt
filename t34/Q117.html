,\ndeclining_stores AS (\n    SELECT\n        StoreKey,\n        sales_2008,\n        sales_2009,\n        sales_2008 - sales_2009 AS store_reduction,\n        (sales_2008 - sales_2009) / sales_2008 AS store_reduction_rate,\n        row_number() OVER (\n            ORDER BY (sales_2008 - sales_2009) / sales_2008 DESC\n        ) AS rn\n    FROM store_sales\n    WHERE sales_2008 \u003e 0\n      AND sales_2009 \u003e 0\n      AND sales_2009 \u003c sales_2008\n),\ntop_stores AS (\n    SELECT *\n    FROM declining_stores\n    WHERE rn \u003c= 3\n),\ncategory_sales AS (\n    SELECT\n        fs.StoreKey,\n        if(pc.ProductCategoryName = '', '未知产品', pc.ProductCategoryName) AS category_name,\n        sumIf(fs.SalesAmount, toYear(fs.DateKey) = 2008) AS cat_sales_2008,\n        sumIf(fs.SalesAmount, toYear(fs.DateKey) = 2009) AS cat_sales_2009\n    FROM retail.FactSales fs\n    LEFT JOIN retail.DimProduct p\n        ON fs.ProductKey = p.ProductKey\n    LEFT JOIN retail.DimProductSubcategory ps\n        ON p.ProductSubcategoryKey = ps.ProductSubcategoryKey\n    LEFT JOIN retail.DimProductCategory pc\n        ON ps.ProductCategoryKey = pc.ProductCategoryKey\n    WHERE toYear(fs.DateKey) IN (2008, 2009)\n      AND fs.StoreKey IN (SELECT StoreKey FROM top_stores)\n    GROUP BY\n        fs.StoreKey,\n        if(pc.ProductCategoryName = '', '未知产品', pc.ProductCategoryName)\n),\ncategory_rank AS (\n    SELECT\n        StoreKey,\n        category_name,\n        cat_sales_2008 - cat_sales_2009 AS category_reduction,\n        row_number() OVER (\n            PARTITION BY StoreKey\n            ORDER BY (cat_sales_2008 - cat_sales_2009) DESC\n        ) AS cat_rn\n    FROM category_sales\n),\ntop_category AS (\n    SELECT *\n    FROM category_rank\n    WHERE cat_rn = 1\n)\nSELECT\n    t.rn AS `名次`,\n    t.StoreKey AS `门店编码`,\n    s.StoreName AS `门店名称`,\n    round(t.sales_2008, 2) AS `2008年销售额`,\n    round(t.sales_2009, 2) AS `2009年销售额`,\n    round(t.store_reduction, 2) AS `门店销售额减少额`,\n
