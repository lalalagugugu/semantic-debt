\n        count() OVER () AS total_customers\n    FROM customer_metrics\n)\nSELECT\n    r.CustomerKey AS `客户编码`,\n    if(\n        coalesce(c.FirstName, '') IN ('', 'Not Provided')\n        OR coalesce(c.LastName, '') IN ('', 'Not Provided'),\n        concat('Customer ', toString(r.CustomerKey)),\n        concat(coalesce(c.FirstName, ''), ' ', coalesce(c.LastName, ''))\n    ) AS `客户名称`,\n    r.order_cnt AS `订单数`,\n    r.aov AS `客单价`\nFROM ranked r\nLEFT JOIN retail.DimCustomer c ON r.CustomerKey = c.CustomerKey\nWHERE r.order_rank \u003c= ceil(r.total_customers * 0.1)\n  AND r.aov_rank \u003c= ceil(r.total_customers * 0.1)\nORDER BY r.order_cnt DESC, r.aov DESC, r.CustomerKey","refused":false,"rep":1,"rows":[[18800,"Customer 18800",4687,1273.55359184981],[19036,"Customer 19036",842,6049.159287410994],[19037,"Customer 19037",443,36743.26214627932],[19038,"Customer 19038",364,45414.87902143346],[19040,"Customer 19040",360,51664.92547362116],[19042,"Customer 19042",356,50861.01019776023],[19041,"Customer 19041",355,51796.798105081136],[19039,"Customer 19039",355,49789.198214936274],[19044,"Customer 19044",354,44696.406905930264],[19046,"Customer 19046",354,41339.63663841787],[19043,"Customer 19043",343,53049.337508750476],[19045,"Customer 19045",343,47375.583092712295],[19080,"Customer 19080",341,32524.305071847142],[19081,"Customer 19081",336,32866.7476994032],[19079,"Customer 19079",325,37258.694018455506],[19047,"Customer 19047",320,43842.53024156487],[19088,"Customer 19088",307,48539.53118730541],[19087,"Customer 19087",305,48077.16954263239],[19082,"Customer 19082",304,40900.37687829146],[19060,"Customer 19060",294,47307.25634557882]],"rules":[],"source_run":"20261104-T34-ontology-full-01","total_rows":108,"usage":{"cache_hit_tokens":46336,"cache_miss_tokens":168,"completion_tokens":3979,"prompt_tokens":46504,"reasoning_tokens":3586}},{"assumption":"「前 10%」指在有线上购买记录的全部客户中，分别按客户订单数和客户客单价取第 90 百分位及以上；客单价 = 该客户销售额 ÷ 该客户去重线上订单数，并列值全部保留。","columns":[{"name":"名次","type"
