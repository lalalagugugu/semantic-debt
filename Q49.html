nchain AS (\n  SELECT\n    b.rev,\n    multiIf(e3.ent_tp = 'Group', e3.enk, e2.ent_tp = 'Group', e2.enk, e1.ent_tp = 'Group', e1.enk, NULL) AS grp_k,\n    multiIf(e1.ent_tp = 'Country/Region', e1.enk, e2.ent_tp = 'Country/Region', e2.enk, e3.ent_tp = 'Country/Region', e3.enk, NULL) AS ctry_k,\n    multiIf(e1.ent_tp = 'State', e1.enk, e2.ent_tp = 'State', e2.enk, e3.ent_tp = 'State', e3.enk, NULL) AS state_k\n  FROM base AS b\n  INNER JOIN l0.d_ent AS e0 ON b.enk = e0.enk AND e0.ent_tp = 'Store'\n  LEFT JOIN l0.d_ent AS e1 ON e0.p_ent = e1.enk AND e0.p_ent \u003c\u003e e0.enk\n  LEFT JOIN l0.d_ent AS e2 ON e1.p_ent = e2.enk AND e1.p_ent \u003c\u003e e1.enk\n  LEFT JOIN l0.d_ent AS e3 ON e2.p_ent = e3.enk AND e2.p_ent \u003c\u003e e2.enk\n),\nlabeled AS (\n  SELECT c.rev, g.ent_nm AS grp_nm, ct.ent_nm AS ctry_nm, st.ent_nm AS state_nm\n  FROM chain AS c\n  LEFT JOIN l0.d_ent AS g ON c.grp_k = g.enk\n  LEFT JOIN l0.d_ent AS ct ON c.ctry_k = ct.enk\n  LEFT JOIN l0.d_ent AS st ON c.state_k = st.enk\n),\nagg AS (\n  SELECT 1 AS lvl_ord, 'Group' AS lvl, grp_nm AS nm,\n         CAST(NULL AS Nullable(String)) AS parent_nm, sum(rev) AS rev\n  FROM labeled\n  WHERE grp_nm IS NOT NULL\n  GROUP BY grp_nm\n  UNION ALL\n  SELECT 2, 'Country/Region', ctry_nm, grp_nm, sum(rev)\n  FROM labeled\n  WHERE ctry_nm IS NOT NULL\n  GROUP BY ctry_nm, grp_nm\n  UNION ALL\n  SELECT 3, 'State', state_nm, ctry_nm, sum(rev)\n  FROM labeled\n  WHERE state_nm IS NOT NULL\n  GROUP BY state_nm, ctry_nm\n)\nSELECT lvl_ord, lvl, nm, parent_nm, rev,\n       row_number() OVER (PARTITION BY lvl ORDER BY rev DESC) AS rnk\nFROM agg\nORDER BY lvl_ord, rev DESC","refused":false,"rep":1,"rows":[[1,"Group","Contoso North America",null,7309491105.0898695,1],[1,"Group","Contoso Asia",null,2700203986.152995,2],[1,"Group","Contoso Europe",null,2403962517.644693,3],[2,"Country/Region","Contoso United States","Contoso North America",7081080470.554869,1],[2,"Country/Region","Contoso China","Contoso Asia",1660605327.27 DimEntity AS e1 ON r.StoreEntityKey = e1.EntityKey\n    INNER JOIN retail.DimEntity AS e2 ON toInt32(e1.ParentEntityKey) = e2.EntityKey\n    UNION ALL\n    SELECT e3.EntityKey, e3.EntityName, e3.EntityType, r.rev\n    FROM store_rev AS r\n    INNER JOIN retail.DimEntity AS e1 ON r.StoreEntityKey = e1.EntityKey\n    INNER JOIN retail.DimEntity AS e2 ON toInt32(e1.ParentEntityKey) = e2.EntityKey\n    INNER JOIN retail.DimEntity AS e3 ON toInt32(e2.ParentEntityKey) = e3.EntityKey\n    UNION ALL\n    SELECT e4.EntityKey, e4.EntityName, e4.EntityType, r.rev\n    FROM store_rev AS r\n    INNER JOIN retail.DimEntity AS e1 ON r.StoreEntityKey = e1.EntityKey\n    INNER JOIN retail.DimEntity AS e2 ON toInt32(e1.ParentEntityKey) = e2.EntityKey\n    INNER JOIN retail.DimEntity AS e3 ON toInt32(e2.ParentEntityKey) = e3.EntityKey\n    INNER JOIN retail.DimEntity AS e4 ON toInt32(e3.ParentEntityKey) = e4.EntityKey\n)\nSELECT\n    multiIf(EntityType = 'Group', 1, EntityType = 'Country/Region', 2, EntityType = 'State', 3, 4) AS LevelOrder,\n    EntityType AS EntityLevel,\n    NodeKey AS EntityKey,\n    NodeName AS EntityName,\n    sum(rev) AS SalesRevenue\nFROM lvl\nGROUP BY NodeKey, NodeName, EntityType\nORDER BY LevelOrder ASC, SalesRevenue DESC\nSETTINGS join_use_nulls = 1","refused":false,"rep":1,"rows":[[1,"Group",1,"Contoso North America",9999916765.093298],[1,"Group",3,"Contoso Asia",4151194340.2764997],[1,"Group",2,"Contoso Europe",3733350917.2613993],[2,"Country/Region",4,"Contoso United States",7081080470.554899],[2,"Country/Region",23,"Contoso China",1660605327.2705002],[2,"Country/Region",8,"Contoso Germany",1017318431.4228],[2,"Country/Region",6,"Contoso France",658922522.1687],[2,"Country/Region",5,"Contoso UK",291869567.7865],[2,"Country/Region",30,"Contoso Japan",236424498.10600004],[2,"Country/Region",15,"Contoso Canada",228410634.53500003],[2,"Country/Region",52,"Contoso Australia",149830268.75599998],[2,"Country/Region",21,"Contoso India",111919078.7865],[2,"Count ') = 'Group', toInt64(l1.EntityKey),\n                    ifNull(l2.EntityType, '') = 'Group', toInt64(l2.EntityKey),\n                    ifNull(l3.EntityType, '') = 'Group', toInt64(l3.EntityKey), 0) AS group_key\n        FROM retail.DimEntity AS st\n        LEFT JOIN retail.DimEntity AS l1 ON st.ParentEntityKey = l1.EntityKey\n        LEFT JOIN retail.DimEntity AS l2 ON l1.ParentEntityKey = l2.EntityKey\n        LEFT JOIN retail.DimEntity AS l3 ON l2.ParentEntityKey = l3.EntityKey\n        WHERE st.EntityType = 'Store'\n    ),\n    anc AS (\n        SELECT 'Store' AS entity_level, c.store_entity AS entity_key, r.amount AS amount\n        FROM chain AS c\n        INNER JOIN store_rev AS r ON r.entity_key = c.store_entity\n        UNION ALL\n        SELECT 'State' AS entity_level, c.state_key AS entity_key, r.amount AS amount\n        FROM chain AS c\n        INNER JOIN store_rev AS r ON r.entity_key = c.store_entity\n        WHERE c.state_key != 0\n        UNION ALL\n        SELECT 'Country/Region' AS entity_level, c.country_key AS entity_key, r.amount AS amount\n        FROM chain AS c\n        INNER JOIN store_rev AS r ON r.entity_key = c.store_entity\n        WHERE c.country_key != 0\n        UNION ALL\n        SELECT 'Group' AS entity_level, c.group_key AS entity_key, r.amount AS amount\n        FROM chain AS c\n        INNER JOIN store_rev AS r ON r.entity_key = c.store_entity\n        WHERE c.group_key != 0\n    )\nSELECT\n    a.entity_level,\n    e.EntityName AS entity_name,\n    sum(a.amount) AS sales_amount\nFROM anc AS a\nINNER JOIN retail.DimEntity AS e ON e.EntityKey = a.entity_key\nGROUP BY a.entity_level, a.entity_key, e.EntityName\nORDER BY multiIf(a.entity_level = 'Group', 1, a.entity_level = 'Country/Region', 2, a.entity_level = 'State', 3, 4) ASC,\n         sales_amount DESC","refused":false,"rep":2,"rows":[["Group","Contoso North America",7309491105.08988],["Group","Contoso Asia",2700203986.152996],["Group","Contoso Europe",2403962517.644686],["
