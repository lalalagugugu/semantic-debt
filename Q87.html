ineSales\n    WHERE DateKey \u003e= toDate('2009-10-03') AND DateKey \u003c= toDate('2009-12-31')\n    GROUP BY ProductKey\n),\ncalc AS (\n    SELECT s.ProductKey AS ProductKey,\n           coalesce(i.oh, 0) AS oh,\n           s.qty AS qty,\n           s.days AS days,\n           s.qty / nullIf(s.days, 0) AS avg_daily,\n           coalesce(i.oh, 0) / nullIf(s.qty / nullIf(s.days, 0), 0) AS dos\n    FROM sales90 AS s\n    LEFT JOIN cur_inv AS i ON s.ProductKey = i.ProductKey\n    WHERE s.qty \u003e 0\n)\nSELECT c.ProductKey AS `产品键`,\n       coalesce(p.ProductName, toString(c.ProductKey)) AS `产品`,\n       c.oh AS `当前在手库存数量`,\n       c.qty AS `近90天销售数量`,\n       c.days AS `有销售天数`,\n       round(c.avg_daily, 4) AS `日均销量`,\n       round(c.dos, 2) AS `可售天数`\nFROM calc AS c\nLEFT JOIN retail.DimProduct AS p ON c.ProductKey = p.ProductKey\nWHERE c.dos IS NOT NULL\nORDER BY c.dos ASC, `产品` ASC, c.ProductKey ASC\nLIMIT 20\nSETTINGS join_use_nulls = 1","refused":false,"rep":2,"rows":[[1738,"1738",433,1196,16,74.75,5.79],[1724,"1724",413,916,13,70.4615,5.86],[1710,"1710",211,770,22,35,6.03],[1799,"1799",433,1242,18,69,6.28],[1809,"1809",321,808,16,50.5,6.36],[1807,"1807",385,900,15,60,6.42],[1757,"1757",472,806,11,73.2727,6.44],[1803,"1803",322,746,15,49.7333,6.47],[1813,"1813",553,768,9,85.3333,6.48],[1753,"1753",156,283,12,23.5833,6.61],[1811,"1811",294,820,19,43.1579,6.81],[1726,"1726",427,1000,16,62.5,6.83],[1758,"1758",301,612,14,43.7143,6.89],[1779,"1779",392,564,10,56.4,6.95],[1766,"1766",192,458,17,26.9412,7.13],[1744,"1744",423,882,15,58.8,7.19],[1774,"1774",431,1406,24,58.5833,7.36],[1821,"1821",455,1412,23,61.3913,7.41],[1715,"1715",283,457,12,38.0833,7.43],[1797,"1797",345,880,19,46.3158,7.45]],"rules":[],"source_run":"20261025-T22b-l1plus-l3a-03","total_rows":20,"usage":{"cache_hit_tokens":75136,"cache_miss_tokens":140,"completion_tokens":4160,"prompt_tokens":75276,"reasoning_tokens":3634}},{"assumption":"问题未说明渠道，按约定用线上销量（FactOnlineSales）计算日均销量；只对 90 天内有线上销量、且日均销量
