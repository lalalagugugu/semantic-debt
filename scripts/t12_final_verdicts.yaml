# T12 final rescore: hand verdicts on top of scripts/t12_final_rescore.py.
#
# Keys are "<model> <cell> <qid> <rep>". Only question ids, categories and short
# evidence; no question text, no rows. Read by scripts/t12_final_report.py.
#
# presentation: answers that are still wrong after the generic relaxations but whose
#   content was checked by hand and found right; they count correct under 「最终」
#   (old system prompt; names-required-by-system-prompt §2.3 / §3, ux-conventions §1.4).
#   kind: 季度写法 / 标签改写 / 宽表 / 约定列（变化量只给了一种）
