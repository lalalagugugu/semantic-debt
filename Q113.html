       toInt64(toMonth(mon)) - toInt64(row_number() OVER (PARTITION BY stk ORDER BY mon)) AS grp\n        FROM monthly\n        WHERE below_flag = 1\n    )\nSELECT\n    st_nm AS store_name,\n    stk AS store_code,\n    argMin(mon_lb, mon) AS start_month,\n    argMax(mon_lb, mon) AS end_month,\n    count() AS consecutive_months\nFROM below\nGROUP BY stk, st_nm, grp\nHAVING count() \u003e= 3\nORDER BY st_nm, min(mon)","refused":false,"rep":1,"rows":[],"rules":[],"source_run":"20261018-T13-sql-direct-01","total_rows":0,"usage":{"cache_hit_tokens":5760,"cache_miss_tokens":246,"completion_tokens":7559,"prompt_tokens":6006,"reasoning_tokens":6915}},{"assumption":"以 d_scn.scn_nm 以「正式」开头的场景作为正式销售目标，目标金额取 fct_sls_qta.amt1、实际销售金额取 fct_sls.amt1，且无销售记录的月份按 0 处理。","columns":[{"name":"门店","type":"String"},{"name":"门店编码","type":"Int32"},{"name":"起始月份","type":"String"},{"name":"结束月份","type":"String"},{"name":"连续月数","type":"UInt64"}],"content_correct":0,"delivery_correct":0,"execution_status":"ok","query":"WITH months AS (\n    SELECT toStartOfMonth(dk) AS mo,\n           any(c_mo_lb) AS mo_lb\n    FROM l0.d_dt\n    WHERE c_yr = 2009\n    GROUP BY mo\n),\ntargets AS (\n    SELECT q.stk AS stk,\n           s.st_nm AS st_nm,\n           sum(q.amt1) / 12.0 AS monthly_target\n    FROM l0.fct_sls_qta AS q\n    INNER JOIN l0.d_dt AS d ON q.dk = d.dk\n    INNER JOIN l0.d_scn AS sc ON q.scnk = sc.scnk\n    INNER JOIN l0.d_str AS s ON q.stk = s.stk\n    WHERE d.c_yr = 2009\n      AND sc.scn_nm LIKE '正式%'\n    GROUP BY q.stk, s.st_nm\n),\nactual AS (\n    SELECT f.stk AS stk,\n           toStartOfMonth(f.dk) AS mo,\n           sum(f.amt1) AS actual_amt\n    FROM l0.fct_sls AS f\n    INNER JOIN l0.d_dt AS d ON f.dk = d.dk\n    WHERE d.c_yr = 2009\n    GROUP BY f.stk, mo\n),\ngrid AS (\n    SELECT t.stk AS stk,\n           t.st_nm AS st_nm,\n           m.mo AS mo,\n           m.mo_lb AS mo_lb,\n           t.monthly_target AS monthly_target,\n           coalesce(a.actual_amt, 0) AS actual_amt,\n           if(coalesce(a.actual_amt, 0) \u003c t.monthly_target, 1, 0) AS missed\n    FROM targets AS t\n    CROSS JOIN months AS m\n    LEFT JOIN actual AS a ON a.stk = t.stk AND a.mo = m.mo\n),\nwindowed AS (\n    SELECT stk, st_nm, mo, mo_lb,\n           row_number() OVER (PARTITION BY stk ORDER BY mo) AS rn,\n           sum(missed) OVER (PARTITION BY stk ORDER BY mo ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS cum_missed,\n           missed\n    FROM grid\n),\nmissed_periods AS (\n    SELECT stk, st_nm, mo, mo_lb, rn - cum_missed AS miss_grp\n    FROM windowed\n    WHERE missed = 1\n)\nSELECT st_nm AS `门店`,\n       stk AS `门店编码`,\n       argMin(mo_lb, mo) AS `起始月份`,\n       argMax(mo_lb, mo) AS `结束月份`,\n       count() AS `连续月数`\nFROM missed_periods\nGROUP BY stk, st_nm, miss_grp\nHAVING count() \u003e= 3\nORDER BY stk, min(mo)","refused":false,"rep":2,"rows":[],"rules":[],"source_run":"20261018-T13-sql-direct-01","total_rows":0,"usage":{"cache_hit_tokens":11648,"cache_miss_tokens":1088,"completion_tokens":8209,"prompt_tokens":12736,"reasoning_tokens":6844}},{"assumption":"fct_sls_qta 中 scn_nm='正式' 为正式销售目标场景、目标额取 amt1，实际销售额取 fct_sls.amt1，且无销售记录的月份按 0 计。","columns":[{"name":"门店编码","type":"Int32"},{"name":"门店","type":"String"},{"name":"起始月份","type":"String"},{"name":"结束月份","type":"String"},{"name":"连续月数","type":"UInt64"}],"content_correct":0,"delivery_correct":0,"execution_status":"ok","query":"WITH\nformal_target AS (\n    SELECT\n        q.stk AS stk,\n        sum(q.amt1) AS annual_target\n    FROM l0.fct_sls_qta AS q\n    INNER JOIN l0.d_scn AS sc ON q.scnk = sc.scnk\n    WHERE sc.scn_nm = '正式'\n      AND toYear(q.dk) = 2009\n    GROUP BY q.stk\n),\nmonths AS (\n    SELECT DISTINCT toStartOfMonth(dk) AS mo\n    FROM l0.d_dt\n    WHERE c_yr = 2009\n),\ntarget_months AS (\n    SELECT\n        t.stk AS stk,\n        m.mo AS mo,\n        t.annual_target / 12.0 AS monthly_target\n    FROM formal_target AS t\n    CROSS JOIN months AS m\n),\nactual AS (\n    SELECT\n        f.stk AS stk,\n        toStartOfMonth(f.dk) AS mo,\n        sum(f.amt1) AS actual_amt\n    FROM l0.fct_sls AS f\n    WHERE toYear(f.dk) = 2009\n    GROUP BY f.stk, toStartOfMonth(f.dk)\n),\nstatus AS (\n    SELECT\n        tm.stk AS stk,\n        tm.mo AS mo,\n        tm.monthly_target AS monthly_target,\n        coalesce(a.actual_amt, 0) AS actual_amt,\n        if(coalesce(a.actual_amt, 0) \u003c tm.monthly_target, 1, 0) AS missed\n    FROM target_months AS tm\n    LEFT JOIN actual AS a\n        ON tm.stk = a.stk AND tm.mo = a.mo\n),\nruns AS (\n    SELECT\n        stk,\n        mo,\n        missed,\n        rn - rn_missed AS grp\n    FROM (\n        SELECT\n            stk,\n            mo,\n            missed,\n            row_number() OVER (PARTITION BY stk ORDER BY mo) AS rn,\n            row_number() OVER (PARTITION BY stk, missed ORDER BY mo) AS rn_missed\n        FROM status\n    )\n),\nmissed_runs AS (\n    SELECT\n        stk,\n        min(mo) AS run_start,\n        max(mo) AS run_end,\n        count() AS run_len\n    FROM runs\n    WHERE missed = 1\n    GROUP BY stk, grp\n    HAVING count() \u003e= 3\n)\nSELECT\n    mr.stk AS `门店编码`,\n    coalesce(nullIf(d.st_nm, ''), toString(d.stk)) AS `门店`,\n    formatDateTime(mr.run_start, '%Y-%m') AS `起始月份`,\n    formatDateTime(mr.run_end, '%Y-%m') AS `结束月份`,\n    mr.run_len AS `连续月数`\nFROM missed_runs AS mr\nINNER JOIN l0.d_str AS d ON mr.stk = d.stk\nORDER BY `门店`, mr.run_start;","refused":false,"rep":3,"rows":[],"rules":[],"source_run":"20261018-T13-sql-direct-01","total_rows":0,"usage":{"cache_hit_tokens":5760,"cache_miss_tokens":246,"completion_tokens":8132,"prompt_tokens":6006,"reasoning_tokens":7425}}],"SQL-L0-E":[{"assumption":"2009 年全年正式销售目标取预算场景（scnk=2）下「Sale Revenue」（acct_k=4）按门店法人实体（enk，经 d_str 关联到门店）汇总的金额；月度实际达成取 fct_sls 各门店当月 amt1 合计，销售额与预算金额视为同一币种，某月无销售记录时按 0 计。","columns":[{"name":"门店","type":"String"},{"name":"门店编码","type":"Int32"},{"name":"起始月份","type":"Date"},{"name":"结束月份","type":"Da
