ontent_correct":1,"delivery_correct":1,"execution_status":"ok","query":"WITH\n    period_actual AS (\n        SELECT\n            s.cyk,\n            sum(s.amt1) AS actual_amt\n        FROM l0.fct_sls AS s\n        INNER JOIN l0.d_dt AS d ON s.dk = d.dk\n        WHERE d.c_yr = 2009\n          AND toQuarter(d.dk) = 4\n        GROUP BY s.cyk\n    ),\n    period_forecast AS (\n        SELECT\n            p.cyk,\n            sum(p.amt1) AS forecast_amt\n        FROM l0.fct_stg_pln AS p\n        INNER JOIN l0.d_dt AS d ON p.dk = d.dk\n        INNER JOIN l0.d_scn AS sc ON p.scnk = sc.scnk\n        INNER JOIN l0.d_acct AS ac ON p.acct_k = ac.acct_k\n        WHERE d.c_yr = 2009\n          AND toQuarter(d.dk) = 4\n          AND (lower(sc.scn_nm) LIKE '%forecast%' OR sc.scn_nm LIKE '%预测%')\n          AND (\n              lower(ac.acct_nm) LIKE '%sales%'\n              OR lower(ac.acct_nm) LIKE '%revenue%'\n              OR lower(ac.acct_tp) = 'revenue'\n          )\n        GROUP BY p.cyk\n    ),\n    keys AS (\n        SELECT cyk FROM period_forecast\n        UNION DISTINCT\n        SELECT cyk FROM period_actual\n    )\nSELECT\n    c.cy_nm AS currency,\n    round(coalesce(f.forecast_amt, 0), 2) AS forecast_amt,\n    round(coalesce(a.actual_amt, 0), 2) AS actual_amt,\n    round(coalesce(a.actual_amt, 0) - coalesce(f.forecast_amt, 0), 2) AS variance_amt,\n    round(\n        100 * (\n            1 - abs(coalesce(f.forecast_amt, 0) - coalesce(a.actual_amt, 0))\n                / nullIf(coalesce(a.actual_amt, 0), 0)\n        ),\n        2\n    ) AS forecast_accuracy_pct\nFROM keys AS k\nINNER JOIN l0.d_ccy AS c ON k.cyk = c.cyk\nLEFT JOIN period_forecast AS f ON k.cyk = f.cyk\nLEFT JOIN period_actual AS a ON k.cyk = a.cyk\nORDER BY currency\nSETTINGS join_use_nulls = 1","refused":false,"rep":3,"rows":[["USD",986142631.21,979737005.16,-6405626.05,99.35]],"rules":[],"source_run":"20261018-T13-sql-direct-01","total_rows":1,"usage":{"cache_hit_tokens":11648,"cache_miss_tokens":1038,
