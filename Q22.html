.67729978]],"rules":[],"source_run":"20261018-T13-sql-direct-01","total_rows":65,"usage":{"cache_hit_tokens":5760,"cache_miss_tokens":219,"completion_tokens":2618,"prompt_tokens":5979,"reasoning_tokens":2334}},{"assumption":"问题理解为在每个国家内部按客户累计消费额（订单行金额 amt1 求和，不区分币种）各自取前 5 名客户；客户所属国家取客户档案 d_cst 上的地理键 gk 对应 d_geo.ctry_nm。","columns":[{"name":"ctry_nm","type":"Nullable(String)"},{"name":"rnk","type":"UInt64"},{"name":"cust_nm","type":"String"},{"name":"csk","type":"Int32"},{"name":"amt","type":"Float64"}],"content_correct":1,"delivery_correct":1,"execution_status":"ok","query":"WITH cust_sls AS (\n    SELECT\n        c.csk                        AS csk,\n        concat(c.fnm, ' ', c.lnm)    AS cust_nm,\n        g.ctry_nm                    AS ctry_nm,\n        sum(s.amt1)                  AS amt\n    FROM l0.fct_ol_sls AS s\n    INNER JOIN l0.d_cst AS c ON s.csk = c.csk\n    LEFT JOIN l0.d_geo AS g ON c.gk = g.gk\n    GROUP BY c.csk, cust_nm, g.ctry_nm\n),\nranked AS (\n    SELECT\n        ctry_nm,\n        cust_nm,\n        csk,\n        amt,\n        rank() OVER (PARTITION BY ctry_nm ORDER BY amt DESC) AS rnk\n    FROM cust_sls\n)\nSELECT\n    ctry_nm,\n    rnk,\n    cust_nm,\n    csk,\n    amt\nFROM ranked\nWHERE rnk \u003c= 5\nORDER BY ctry_nm, rnk, csk\nSETTINGS join_use_nulls = 1","refused":false,"rep":3,"rows":[["Armenia",1,"Not Provided Not Provided",19144,7481458.2740000915],["Australia",1,"Not Provided Not Provided",19088,14901636.074502664],["Australia",2,"Not Provided Not Provided",19087,14663536.710500864],["Australia",3,"Not Provided Not Provided",19086,14391701.943002302],["Australia",4,"Not Provided Not Provided",19085,13966925.147000583],["Australia",5,"Not Provided Not Provided",19106,13586963.356002182],["Bhutan",1,"Not Provided Not Provided",19141,8522927.499999613],["Canada",1,"Not Provided Not Provided",18790,3156664.4979999224],["Canada",2,"Not Provided Not Provided",18817,3151250.672000111],["Canada",3,"Not Provided Not Provided",18866,3074497.0 ERE rnk \u003c= 5\nORDER BY ctry_nm, rnk","refused":false,"rep":1,"rows":[],"rules":[],"source_run":"20261019-T15-explorer-01","total_rows":0,"usage":{"cache_hit_tokens":40448,"cache_miss_tokens":2878,"completion_tokens":2033,"prompt_tokens":43326,"reasoning_tokens":826}},{"assumption":"客户归属国家取客户主数据 l0.d_cst.gk 关联 l0.d_geo 的 ctry_nm；消费额取下单事实表 l0.fct_ol_sls 的 amt1 累计，客户姓名为「Not Provided」占位值时只以客户编码标识；名次用 rank（并列时跳号），每个国家各取前 5 名。","columns":[{"name":"country","type":"String"},{"name":"rank_in_country","type":"UInt64"},{"name":"customer","type":"String"},{"name":"customer_cd","type":"Int32"},{"name":"cum_amount","type":"Float64"}],"content_correct":1,"delivery_correct":0,"execution_status":"ok","query":"WITH cust AS (\n  SELECT c.csk AS csk,\n         if(c.fnm = 'Not Provided' AND c.lnm = 'Not Provided', '', concat(c.fnm, ' ', c.lnm)) AS nm,\n         g.ctry_nm AS ctry,\n         sum(s.amt1) AS amt\n  FROM l0.fct_ol_sls s\n  INNER JOIN l0.d_cst c ON s.csk = c.csk\n  INNER JOIN l0.d_geo g ON c.gk = g.gk\n  WHERE g.ctry_nm != ''\n  GROUP BY c.csk, nm, ctry\n),\nranked AS (\n  SELECT ctry,\n         if(nm = '', toString(csk), nm) AS cust_nm,\n         csk AS cust_cd,\n         amt,\n         rank() OVER (PARTITION BY ctry ORDER BY amt DESC) AS rnk\n  FROM cust\n)\nSELECT ctry AS country,\n       rnk AS rank_in_country,\n       cust_nm AS customer,\n       cust_cd AS customer_cd,\n       amt AS cum_amount\nFROM ranked\nWHERE rnk \u003c= 5\nORDER BY country, rank_in_country","refused":false,"rep":2,"rows":[["Armenia",1,"19144",19144,7481458.273998977],["Australia",1,"19088",19088,14901636.074503424],["Australia",2,"19087",19087,14663536.710503358],["Australia",3,"19086",19086,14391701.943003435],["Australia",4,"19085",19085,13966925.147002842],["Australia",5,"19106",19106,13586963.356003093],["Bhutan",1,"19141",19141,8522927.499997735],["Canada",1,"18790",18790,3156664.4980000043],["Canada",2,"18817",18817,3151250.6719999383],["Canada",3,"18866",18866,3074497.0690002088],["Ca
